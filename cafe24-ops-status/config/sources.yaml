  - { channel: naver,  account_id: "" }
  - { channel: kakao,  account_id: "" }

competitors:             # 핵심 경쟁사 — name 은 네이버 트렌드/쇼핑 검색어로 사용됨
                         # TODO(연결): 메종YS 실제 경쟁 브랜드로 교체(컨템포러리 여성복). 아래는 예시.
  - { name: 논로컬,   url: "https://nonlocal.co.kr/" }
