# 수집 대상 정의 — 쇼핑몰 / 광고계정 / 경쟁사
# 실제 값은 운영하며 채워 넣는다. (비밀값은 secrets.env)

shop:
  platform: cafe24
  mall_id: maisonys        # TODO(연결): 실제 카페24 mall_id 로 교체. maisonys.com 은 커스텀 도메인이라
                           #   내부 mall_id 가 다를 수 있음(카페24 어드민 > 쇼핑몰설정에서 확인).
                           #   이 값은 참고/표시용 — 실제 수집은 GitHub Secret CAFE24_MALL_ID 사용.
  brand: 메종YS            # MAISON YS — (주)와이에스콜렉션 (샤틴·에스블랑·헌치 공식 온라인 스토어)

ads:
