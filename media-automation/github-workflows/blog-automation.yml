name: blog-automation

# 네이버 블로그 초안을 하루 2회 자동 생성한다 (시장조사 → 기획 → 포스팅 원고).
# 발행은 직접: 생성된 .md 를 네이버 글쓰기에 붙여넣으면 된다.
#
# 설치 위치: 대상 저장소 루트의 .github/workflows/blog-automation.yml
# 필요한 Secret: ANTHROPIC_API_KEY (필수)
#                NAVER_CLIENT_ID / NAVER_CLIENT_SECRET (선택: 실검 트렌드 보강)
# ⚠️ schedule 은 '기본 브랜치'에 있을 때만 동작한다.

on:
  schedule:
    - cron: '0 22 * * *' # 07:00 KST
    - cron: '0 4 * * *'  # 13:00 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r media-automation/requirements.txt
      - name: Generate posts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BLOG_MODEL: claude-sonnet-4-6
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          POSTS_PER_RUN: '1' # 회당 1편 × 하루 2회 = 2편
        run: |
          cd media-automation
          python scripts/blog_generate.py output/blog
      - name: Commit drafts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add media-automation/output/blog
          git commit -m "chore(blog): 자동 초안 생성 $(date +%F\ %H:%M)" || echo "변경 없음"
          for i in 1 2 3; do git push && break || sleep $((2**i)); done
      - name: Upload drafts
        uses: actions/upload-artifact@v4
        with:
          name: blog-drafts
          path: media-automation/output/blog/**
          retention-days: 30
