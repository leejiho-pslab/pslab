name: ops daily collect (all channels)

# 매일 1회 전 채널 실데이터 수집 — GitHub 러너는 외부 API egress 가 열려 있어
# 웹 샌드박스에서 막히는 cafe24/Meta/Naver/Kakao 호출이 여기선 동작한다.
#
# 영속화: DATABASE_URL(무료 Postgres: Supabase/Neon/Railway) 를 Secret 으로 넣을 것.
#   없으면 러너 SQLite 에 수집되지만 잡 종료와 함께 사라진다(특히 cafe24 토큰 회전이
#   보존되지 않아 무인 수집이 깨짐). → 운영에선 DATABASE_URL 필수.
#
# 필요한 Secrets (있는 채널만 채우면 됨):
#   공통:    DATABASE_URL
#   cafe24:  CAFE24_MALL_ID, CAFE24_CLIENT_ID, CAFE24_CLIENT_SECRET,
#            CAFE24_ACCESS_TOKEN, CAFE24_REFRESH_TOKEN  (최초 1회용; 이후 DB가 회전 토큰 보존)
#   Meta:    META_ACCESS_TOKEN, META_AD_ACCOUNT_ID
#   Google:  GOOGLE_ADS_DEVELOPER_TOKEN, GOOGLE_ADS_ACCESS_TOKEN, GOOGLE_ADS_CUSTOMER_ID,
#            GOOGLE_ADS_LOGIN_CUSTOMER_ID
#   NaverSA: NAVER_SA_API_KEY, NAVER_SA_SECRET_KEY, NAVER_SA_CUSTOMER_ID
#   Kakao:   KAKAO_ACCESS_TOKEN, KAKAO_AD_ACCOUNT_ID
#   Naver:   NAVER_CLIENT_ID, NAVER_CLIENT_SECRET   (경쟁사 트렌드/검색)
#   알림:    SLACK_WEBHOOK_URL (선택)
#
# 주의: schedule 은 기본 브랜치(main)에서만 동작 → 이 워크플로를 main 에 머지할 것.

on:
  schedule:
    - cron: "0 22 * * *" # 07:00 KST (UTC+9)
  workflow_dispatch:
    inputs:
      days:
        description: "최근 N일 백필 (빈값 = 스케줄과 동일: 3일 자가치유 수집 + 어제 경쟁사)"
        required: false
        default: ""
      skip:
        description: "제외할 수집기 (콤마). 과거 재수집 시 competitor 권장 — 경쟁사는 현재 스냅샷이라 과거 날짜에 덮으면 이력이 오염됨"
        required: false
        default: "competitor"

jobs:
  collect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cafe24-ops-status
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run daily pipeline (live)
        env:
          CAFE24_OPS_MODE: live
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # cafe24
          CAFE24_MALL_ID: ${{ secrets.CAFE24_MALL_ID }}
          CAFE24_CLIENT_ID: ${{ secrets.CAFE24_CLIENT_ID }}
          CAFE24_CLIENT_SECRET: ${{ secrets.CAFE24_CLIENT_SECRET }}
          CAFE24_ACCESS_TOKEN: ${{ secrets.CAFE24_ACCESS_TOKEN }}
          CAFE24_REFRESH_TOKEN: ${{ secrets.CAFE24_REFRESH_TOKEN }}
          # Meta (APP_ID/SECRET 있으면 매 실행 장기토큰 자동 갱신 → DB 영속)
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          # Google Ads
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_ACCESS_TOKEN: ${{ secrets.GOOGLE_ADS_ACCESS_TOKEN }}
          GOOGLE_ADS_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
          # Naver SearchAd
          NAVER_SA_API_KEY: ${{ secrets.NAVER_SA_API_KEY }}
          NAVER_SA_SECRET_KEY: ${{ secrets.NAVER_SA_SECRET_KEY }}
          NAVER_SA_CUSTOMER_ID: ${{ secrets.NAVER_SA_CUSTOMER_ID }}
          # Kakao Moment
          KAKAO_ACCESS_TOKEN: ${{ secrets.KAKAO_ACCESS_TOKEN }}
          KAKAO_AD_ACCOUNT_ID: ${{ secrets.KAKAO_AD_ACCOUNT_ID }}
          # Naver DataLab/Search (경쟁사)
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          # GA4 방문자수(설정 시 방문자/구매전환율 자동 채움)
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        run: |
          # 07:00 KST 무인 실행 보호 — 일시적 실패(네트워크/외부 API 순단)면 재시도.
          # 파이프라인은 소스 단위 멱등(성공 소스만 delete+reinsert)이라 재실행이 안전하다.
          #
          # 스케줄 실행은 최근 3일 재수집(dbrick 과 동일 패턴):
          #  - 하루 실행이 빠져도(러너 장애 등) 다음날 자동으로 메움(자가치유)
          #  - GA4 전환·Meta 광고비의 24~48h 늦은 보정을 매일 최근 이틀치에 반영
          #  - 단, 경쟁사는 '현재 스냅샷' 소스라 과거 날짜에 쓰면 이력이 오염됨 → 3일
          #    재수집에서 제외하고 어제 하루만 별도 수집
          # 수동 실행(days 입력)은 그대로 N일 백필하되, skip 입력으로 제외 수집기를 지정한다
          # (기본 competitor — 과거 날짜 재수집 시 경쟁사 스냅샷이 이력을 덮는 것 방지).
          collect() {
            if [ -n "${{ github.event.inputs.days }}" ]; then
              python scripts/run_all.py --mode live --days "${{ github.event.inputs.days }}" \
                --skip "${{ github.event.inputs.skip }}"
            else
              python scripts/run_all.py --mode live --days 3 --skip competitor \
                && python scripts/run_all.py --mode live --days 1 --skip cafe24,ads,creative,keyword
            fi
          }
          for attempt in 1 2 3; do
            if collect; then
              exit 0
            fi
            echo "::warning::데일리 수집 실패 (시도 $attempt/3) — 90초 후 재시도"
            sleep 90
          done
          echo "::error::데일리 수집 3회 모두 실패 — 토큰/외부 API 상태 점검 필요"
          exit 1

      - name: Alerts (optional Slack)
        if: ${{ always() }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/notify.py || true
