name: cafe24 token reset (회전용)

# 보안 토큰 재발급 시 DB(app_kv)의 옛 토큰을 비운다.
#  - Meta 토큰만: keys = meta_access_token
#  - cafe24 까지: keys = meta_access_token,cafe24_access_token,cafe24_refresh_token (기본)
# 실행 후: cafe24 는 token-bootstrap 으로 새 토큰을 넣고, Meta 는 다음 일일수집이
#          새 Secret 으로 자동 재발급한다.

on:
  workflow_dispatch:
    inputs:
      keys:
        description: "삭제할 토큰 키(콤마)"
        required: false
        default: "meta_access_token,cafe24_access_token,cafe24_refresh_token"

jobs:
  reset:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cafe24-ops-status
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install minimal deps
        run: pip install "psycopg[binary]>=3.1" PyYAML
      - name: Reset DB tokens
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/reset_tokens.py --keys "${{ github.event.inputs.keys || 'meta_access_token,cafe24_access_token,cafe24_refresh_token' }}"
