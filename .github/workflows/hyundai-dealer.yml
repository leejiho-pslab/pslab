name: hyundai-dealer build

# 러너에서 홈페이지를 빌드(현대 공식 이미지 + 유튜브 RSS 자동 수집)하고,
# 결과를 기본 브랜치의 docs/home 으로 발행한다.
# 그 push 가 pages-deploy.yml 을 트리거해 GitHub Pages(Actions)로 게시된다.
#   - 홈페이지: https://leejiho-pslab.github.io/pslab/home/

on:
  push:
    branches: [claude/hyundai-dealer-homepage-oukndu]
    paths:
      - 'hyundai-dealer/**'
      - '.github/workflows/hyundai-dealer.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 21 * * *' # 매일 06:00 KST — 유튜브/이미지 갱신

permissions:
  contents: write
  actions: write

concurrency:
  group: hyundai-dealer-build
  cancel-in-progress: true

env:
  DEFAULT_BRANCH: claude/eager-lamport-mX0eT

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: hyundai-dealer/package-lock.json

      - name: Install
        working-directory: hyundai-dealer
        run: npm ci

      - name: Test
        working-directory: hyundai-dealer
        run: npm test

      - name: Fetch content (유튜브 RSS) + images (현대 공식)
        working-directory: hyundai-dealer
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          YT_CHANNEL_ID: ${{ secrets.YT_CHANNEL_ID }}
          YT_CHANNEL_URL: https://www.youtube.com/@hyundai_moomoo
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          npm run fetch:content
          npm run fetch:images

      - name: Build homepage
        working-directory: hyundai-dealer
        env:
          SITE_URL: https://leejiho-pslab.github.io
          SITE_BASE: /pslab/home/
        run: npm run build

      - name: Publish into default branch (docs/home)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          cp -r hyundai-dealer/dist "$RUNNER_TEMP/home"
          git clone --depth=1 --branch "$DEFAULT_BRANCH" "$REMOTE" "$RUNNER_TEMP/repo"
          cd "$RUNNER_TEMP/repo"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -rf docs/home && mkdir -p docs/home
          cp -r "$RUNNER_TEMP/home/." docs/home/
          git add -f docs/home
          if git diff --cached --quiet; then
            echo "변경 없음 — 게시 생략"; exit 0
          fi
          git commit -m "chore(pages): 홈페이지 갱신 — 유튜브/이미지 (docs/home)"
          for i in 1 2 3 4 5; do
            if git push "$REMOTE" HEAD:"$DEFAULT_BRANCH"; then echo "발행 완료"; exit 0; fi
            echo "push 충돌 — rebase 후 재시도 $i"
            git pull --rebase "$REMOTE" "$DEFAULT_BRANCH" || true
            sleep 3
          done
          echo "::error::docs/home 발행 실패"; exit 1

      - name: Trigger Pages deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GITHUB_TOKEN 으로 푸시한 변경은 다른 워크플로를 자동 트리거하지 않으므로
          # pages-deploy 를 명시적으로 디스패치한다.
          curl -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/pages-deploy.yml/dispatches" \
            -d "{\"ref\":\"${DEFAULT_BRANCH}\"}" && echo "pages-deploy 디스패치 완료"
