name: keek api smoke (live onrender)

# 라이브 대시보드가 부르는 모든 엔드포인트를 실제 onrender 에 호출해 상태코드/본문 앞부분을
# 출력한다. 프론트가 ErrorState 로 빠지는(=사용자가 "오류"로 보는) 500 엔드포인트를 특정하기 위함.
# (에이전트 샌드박스는 onrender egress 가 막혀 여기서만 확인 가능)

on:
  workflow_dispatch:
    inputs:
      base:
        description: "기준일 YYYY-MM-DD"
        required: false
        default: "2026-06-30"
      from:
        description: "from YYYY-MM-DD"
        required: false
        default: "2026-06-16"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Hit every dashboard endpoint
        run: |
          HOST=https://keek-ops-dashboard.onrender.com
          B="${{ github.event.inputs.base || '2026-06-30' }}"
          F="${{ github.event.inputs.from || '2026-06-16' }}"
          fail=0
          check () {
            local path="$1"
            local code
            code=$(curl -s -o /tmp/body.txt -w "%{http_code}" --max-time 90 "$HOST$path" || echo "000")
            local size; size=$(wc -c < /tmp/body.txt)
            if [ "$code" = "200" ]; then
              echo "OK   $code ($size B)  $path"
            else
              echo "FAIL $code ($size B)  $path"
              echo "  ↳ $(head -c 300 /tmp/body.txt | tr '\n' ' ')"
              fail=1
            fi
          }
          check "/health"
          check "/api/config/metrics"
          check "/api/dates"
          check "/api/digest?date=$B"
          check "/api/summary?date=$B"
          check "/api/period-comparison?date=$B"
          check "/api/daily?from=$F&to=$B"
          check "/api/daily-detail?date=$B"
          check "/api/trend?from=$F&to=$B"
          check "/api/visitor-trend?from=$F&to=$B"
          check "/api/ads/summary?date=$B"
          check "/api/ads/channels?date=$B"
          check "/api/ads/trend?from=$F&to=$B"
          check "/api/ads/overview?from=$F&to=$B&cmp_from=$F&cmp_to=$B&sort=roas"
          check "/api/ads/channel-trend?from=$F&to=$B"
          check "/api/creatives/overview?from=$F&to=$B&sort=roas"
          check "/api/creatives/fatigue?date=$B"
          check "/api/ads/keywords?from=$F&to=$B&channel=naver_powerlink&sort=ad_cost"
          check "/api/competitors?date=$B"
          check "/api/competitors/trend?from=$F&to=$B"
          check "/api/competitors/best-changes?date=$B"
          check "/api/ga4/site?from=$F&to=$B"
          check "/api/ga4/channels?from=$F&to=$B"
          check "/api/ga4/pages?from=$F&to=$B&limit=10"
          check "/api/ga4/journey?from=$F&to=$B"
          check "/api/report/monthly"
          check "/api/report/monthly.docx"
          check "/"
          echo "----- GA4 실제 적재 범위 확인(백필이 어디까지 채워졌는지) -----"
          curl -s --max-time 90 "$HOST/api/ga4/site?from=$F&to=$B" -o /tmp/ga4.json || true
          python3 - <<'PY' || echo "(GA4 응답 파싱 실패)"
          import json
          d = json.load(open("/tmp/ga4.json"))
          rows = [r for r in d.get("trend", []) if (r.get("sessions") or 0) > 0]
          if not rows:
              print("GA4 적재된 날짜 없음")
          else:
              print(f"GA4 데이터 있는 날: {len(rows)}일  ({rows[0]['date']} ~ {rows[-1]['date']})")
              print(f"  첫날 세션 {rows[0]['sessions']:.0f} / 마지막날 세션 {rows[-1]['sessions']:.0f}")
          PY
          echo "----- 배포된 프론트 번들 확인(index.html 이 참조하는 assets 해시) -----"
          curl -s --max-time 60 "$HOST/" | grep -o 'assets/index-[A-Za-z0-9_-]*\.\(js\|css\)' || echo "(assets 참조를 찾지 못함)"
          echo "-----"
          if [ "$fail" = "1" ]; then
            echo "::error::하나 이상의 엔드포인트가 200 이 아님 — 위 FAIL 라인 참고"
            exit 1
          fi
          echo "모든 엔드포인트 200 OK"
