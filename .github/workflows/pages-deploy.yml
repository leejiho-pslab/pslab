name: pages deploy (docs)

# docs/ 폴더(대시보드 + /home 홈페이지)를 GitHub Pages 로 배포한다.
# Pages 소스가 "GitHub Actions" 인 경우 이 워크플로가 게시한다.
# (소스가 "Deploy from a branch /docs" 이면 GitHub 기본 빌드가 자동 게시하므로 이 잡은 실패해도 무방)
#   - 대시보드: https://leejiho-pslab.github.io/pslab/
#   - 홈페이지: https://leejiho-pslab.github.io/pslab/home/

on:
  push:
    branches: [main, claude/eager-lamport-mX0eT]
    paths:
      - 'docs/**'
      - '.github/workflows/pages-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 마지막 방어선 — 어떤 워크플로/세션이 깨진 docs 를 커밋했더라도 배포는 막는다.
      # (2026-08-05 guidance-sync 충돌 트리 배포 사고의 재발 방지. 다른 배포 워크플로에는
      #  같은 가드가 이미 있는데, docs push 를 무조건 배포하는 이 경로만 비어 있었다)
      - name: 배포 전 충돌 표시 검사
        run: |
          if grep -rlE '^(<<<<<<< |>>>>>>> |=======$)' docs --include='*.html' --include='*.json'; then
            echo "::error::위 파일에 병합 충돌 표시가 남아 있습니다 — Pages 배포를 중단합니다."
            exit 1
          fi
          echo "충돌 표시 없음 — 배포 진행"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
