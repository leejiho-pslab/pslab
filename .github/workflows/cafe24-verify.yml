name: ops verify (data accuracy)

# 데이터 정확도 검수.
#  - 매일 자동(schedule): mode=db 로 커버리지·내부정합성 점검 → Actions 로그에 리포트.
#    DB만 읽어 토큰을 안 써서 백필/수집과 동시 실행해도 안전(경합 없음).
#    → GitHub 연동 토큰 만료와 무관하게 검수가 계속 돌고 결과가 쌓인다(인력 0).
#  - 수동(Run workflow): mode=api 로 카페24 원천대조도 가능(토큰 회전 → 백필중 금지).

on:
  schedule:
    - cron: "30 23 * * *" # 매일 1회 db 검수 자동 실행
  workflow_dispatch:
    inputs:
      mode:
        description: "검수 모드 (db=안전 / api=원천대조, 백필중 금지)"
        required: false
        default: "db"
      start_date:
        description: "검수 시작일"
        required: false
        default: "2025-01-01"
      samples:
        description: "api 모드 표본 날짜 수"
        required: false
        default: "8"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cafe24-ops-status
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Verify
        env:
          CAFE24_OPS_MODE: live
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CAFE24_MALL_ID: ${{ secrets.CAFE24_MALL_ID }}
          CAFE24_CLIENT_ID: ${{ secrets.CAFE24_CLIENT_ID }}
          CAFE24_CLIENT_SECRET: ${{ secrets.CAFE24_CLIENT_SECRET }}
          CAFE24_ACCESS_TOKEN: ${{ secrets.CAFE24_ACCESS_TOKEN }}
          CAFE24_REFRESH_TOKEN: ${{ secrets.CAFE24_REFRESH_TOKEN }}
        run: |
          python scripts/verify.py \
            --mode "${{ github.event.inputs.mode || 'db' }}" \
            --start "${{ github.event.inputs.start_date || '2025-01-01' }}" \
            --samples "${{ github.event.inputs.samples || '8' }}"
