name: guidance sync (지침 자동 반영)

# 대시보드 '지침' 탭에서 등록한 이슈([브랜드노트·…], [가이드·…])를
# 데이터 파일에 반영하고 → 대시보드 재생성 → 커밋 → 이슈를 닫는다.
# 반영된 지침은 다음 콘텐츠 생성 사이클부터 프롬프트·소재 선정에 적용된다.
on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: guidance-sync
  cancel-in-progress: false

jobs:
  # 수정요청 접수 안내 — [수정요청·채널] 이슈가 열리면 즉시:
  #  1) 이슈에 "접수됨 + 발행 보류" 코멘트 (publish-plan --due 게이트와 한 세트)
  #  2) 텔레그램 푸시 (시크릿 없으면 생략)
  # 수정 반영은 담당 세션이 하고, 반영 후 이슈를 닫으면 다음 사이클에 자동 발행된다.
  revision-note:
    if: github.event.action == 'opened' && startsWith(github.event.issue.title, '[수정요청·')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
      ISSUE_URL: ${{ github.event.issue.html_url }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: 접수 코멘트 + 텔레그램 알림
        run: |
          api="https://api.github.com/repos/${{ github.repository }}/issues/${ISSUE_NUMBER}"
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" "$api/comments" \
            --data @- <<'JSON' >/dev/null
          {"body":"🚦 수정요청이 접수되었습니다.\n\n- 이 요청이 **처리완료(이슈 닫힘)** 되기 전까지 대상 콘텐츠의 **자동 발행이 보류**됩니다.\n- 수정사항이 반영되면 이 이슈가 닫히고, 다음 발행 사이클에 자동 발행됩니다.\n- 처리 상태는 대시보드 수정요청 게시판에서 확인할 수 있습니다."}
          JSON
          if [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ]; then
            text="🛠 수정요청 접수
          ${ISSUE_TITLE}
          대상 콘텐츠 발행 보류 — 반영 후 이슈를 닫으면 자동 발행 재개
          ${ISSUE_URL}"
            curl -sS "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TG_CHAT}" \
              --data-urlencode "text=${text}" >/dev/null || true
          fi
          echo "revision request #${ISSUE_NUMBER} noted"
  sync:
    if: startsWith(github.event.issue.title, '[브랜드노트·') || startsWith(github.event.issue.title, '[가이드·') || startsWith(github.event.issue.title, '[디자인피드백]') || startsWith(github.event.issue.title, '[레퍼런스·') || startsWith(github.event.issue.title, '[레퍼런스삭제·') || startsWith(github.event.issue.title, '[발행완료·')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TZ: Asia/Seoul
      ISSUE_TITLE: ${{ github.event.issue.title }}
      ISSUE_BODY: ${{ github.event.issue.body }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: 빌드
        run: |
          npm ci
          npm run build
      - name: 지침 반영
        id: apply
        run: |
          out=$(node scripts/sync-guidance.mjs)
          echo "$out"
          if echo "$out" | grep -q "SYNCED"; then echo "synced=true" >> "$GITHUB_OUTPUT"; fi
      - name: 대시보드 재생성 + 커밋
        if: steps.apply.outputs.synced == 'true'
        run: |
          node dist/cli.js dashboard --client pslab --out docs/index.html
          node dist/cli.js dashboard --client vittz --out docs/vittz/index.html
          node dist/cli.js dashboard --client dongsung --out docs/dongsung/index.html
          node dist/cli.js dashboard --client dbrick --out docs/dbrick/index.html
          git config user.name pslab-bot
          git config user.email actions@users.noreply.github.com
          git add -f data/clients docs/index.html docs/vittz/index.html docs/dongsung/index.html docs/dbrick/index.html
          git commit -m "chore(guidance): 운영자 지침 반영 — ${ISSUE_TITLE}" || { echo "변경 없음"; exit 0; }
          # ⚠️ 충돌한 작업트리를 절대 그대로 두지 않는다.
          #   rebase 가 충돌하면 docs/index.html 에 <<<<<<< 표시가 남는데, 예전 루프는
          #   그 상태로 다음 재시도를 돌고 마지막 sleep 의 종료코드 0 때문에 **단계가 성공**으로
          #   끝났다. 그 뒤 이슈 닫기와 Pages 배포가 실행돼, 충돌 표시가 박힌 대시보드가
          #   배포되고(화면 전체가 SyntaxError) 등록된 레퍼런스는 push 실패로 사라졌다.
          #   → 충돌하면 rebase 를 되돌려 트리를 깨끗이 만들고, 끝내 실패하면 **작업을 실패시킨다**.
          pushed=false
          for i in 1 2 3 4 5; do
            if git pull --rebase origin ${{ github.ref_name }}; then
              if git push; then pushed=true; break; fi
            else
              git rebase --abort || true
            fi
            echo "retry $i (동시 push 충돌)"; sleep $((i * 3))
          done
          if [ "$pushed" != true ]; then
            echo "::error::push 실패 — 지침이 저장소에 반영되지 않았습니다. 이슈를 닫지 않고 배포도 건너뜁니다."
            exit 1
          fi
      - name: 이슈 닫기 (반영 완료 코멘트)
        if: steps.apply.outputs.synced == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          api="https://api.github.com/repos/${{ github.repository }}/issues/${ISSUE_NUMBER}"
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" "$api/comments" \
            --data @- <<JSON >/dev/null
          {"body":"$( if [[ "$ISSUE_TITLE" == "[레퍼런스·"* ]]; then
            echo '📥 레퍼런스 링크가 접수되었습니다.\n\n- 아직 **학습 전**입니다 — 링크 저장까지만 자동으로 처리됐습니다.\n- Claude 세션이 링크를 직접 열람·학습한 뒤 디자인·기획 기준에 반영합니다(보통 다음 기획 세션).\n- 학습 결과는 대시보드 지침 탭의 **학습 현황**에서 확인할 수 있습니다.'
          elif [[ "$ISSUE_TITLE" == "[레퍼런스삭제·"* ]]; then
            echo '🗑 레퍼런스가 삭제되었습니다.\n\n- 이후 디자인·기획 학습에서 이 링크를 참고하지 않습니다.\n- 이 링크에서 학습한 내용이 있었다면 다음 기획 세션에서 해당 채널 기준을 재정리합니다.\n- 같은 링크를 다시 등록하면 학습 대기로 복구됩니다.'
          elif [[ "$ISSUE_TITLE" == "[발행완료·"* ]]; then
            echo '✅ 발행 완료로 기록되었습니다.\n\n- 이 콘텐츠는 대시보드의 **발행된 콘텐츠** 섹션으로 이동했습니다.\n- 발행 주소를 남기셨다면 카드의 **열기 ↗** 링크로 연결됩니다.\n- 발행 원장에도 기록되어 중복 발행이 방지됩니다.'
          else
            echo '✅ 지침이 시스템에 반영되었습니다. 다음 콘텐츠 생성부터 자동 적용됩니다. (대시보드 지침 탭에서 현재 값을 확인하세요)'
          fi )"}
          JSON
          curl -sS -X PATCH -H "Authorization: Bearer $GH_TOKEN" "$api" \
            -d '{"state":"closed","state_reason":"completed"}' >/dev/null
          echo "issue #${ISSUE_NUMBER} closed"
      # 마지막 방어선 — 어떤 경로로든 충돌 표시가 남았다면 배포하지 않는다.
      # 깨진 대시보드를 올리는 것보다 이전 버전이 그대로 있는 편이 낫다.
      - name: 배포 전 충돌 표시 검사
        if: steps.apply.outputs.synced == 'true'
        run: |
          if grep -rlE '^(<<<<<<< |>>>>>>> |=======$)' docs --include='*.html' --include='*.json'; then
            echo "::error::위 파일에 병합 충돌 표시가 남아 있습니다 — Pages 배포를 중단합니다."
            exit 1
          fi
          echo "충돌 표시 없음 — 배포 진행"

      - name: Pages 설정
        if: steps.apply.outputs.synced == 'true'
        uses: actions/configure-pages@v5
      - name: Pages 아티팩트 업로드
        if: steps.apply.outputs.synced == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Pages 배포
        id: deploy
        if: steps.apply.outputs.synced == 'true'
        uses: actions/deploy-pages@v4
