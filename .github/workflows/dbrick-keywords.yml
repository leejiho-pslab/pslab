name: dbrick keyword volumes (키워드 도구 실측 수집)

# 네이버 검색광고 API(keywordstool)로 광고주센터 "키워드 도구"와 동일한
# 월간검색수(PC/모바일)·경쟁정도·연관키워드를 수집해 디브릭 대시보드 리서치 탭에 반영한다.
# 필요한 Secrets: NAVER_AD_API_KEY / NAVER_AD_SECRET / NAVER_AD_CUSTOMER_ID (스킬 표준 — vittz와 공유)
# (키워드 도구 데이터는 광고계정과 무관한 공용 조회라 계정 하나로 전 업체 수집 가능)
#
# 주의: plan-week(차주 기획 생성)는 넣지 않는다 — 디브릭은 운영플랜 검수 대기 상태(콘텐츠 기획 금지).
#       기획 사이클을 켤 때 vittz-keywords.yml 을 참고해 추가할 것.

on:
  workflow_dispatch:
  schedule:
    - cron: '20 1 1 * *' # 매월 1일 10:20 KST — 월간검색수 갱신 (vittz와 20분 시차)

permissions:
  contents: write

concurrency:
  group: dbrick-keywords
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Seoul
      PSLAB_REPO: ${{ github.repository }}
      NAVER_AD_API_KEY: ${{ secrets.NAVER_AD_API_KEY }}
      NAVER_AD_SECRET: ${{ secrets.NAVER_AD_SECRET }}
      NAVER_AD_CUSTOMER_ID: ${{ secrets.NAVER_AD_CUSTOMER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: 키워드 실측 수집 (배치표 40개 + 연관 발굴)
        run: node scripts/fetch-keyword-volumes.mjs --client dbrick

      - name: 키워드 3시트 수집 (핵심·연관·시의성)
        continue-on-error: true
        run: node scripts/fetch-keywords.mjs --client dbrick

      - name: 리서치 탭 병합 (실측 → research-brief)
        run: node scripts/merge-keyword-research.mjs --client dbrick

      - name: 대시보드 재생성
        run: node dist/cli.js dashboard --client dbrick --out docs/dbrick/index.html

      - name: 커밋·푸시
        run: |
          git config user.name "pslab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/clients/dbrick/keyword-volumes.json data/clients/dbrick/keyword-trends.json data/clients/dbrick/research-brief.json docs/dbrick/index.html
          git commit -m "chore(dbrick): 키워드 도구 실측 월간검색수 갱신" || { echo "변경 없음"; exit 0; }
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && { echo "push 성공"; exit 0; }
            echo "재시도 $i"; sleep 4
          done
          exit 1
