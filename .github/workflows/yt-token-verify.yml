name: yt 토큰 검증 (일회용)

# 유튜브 refresh token 재발급 후 GitHub 시크릿이 제대로 들어갔는지만 확인한다.
# 비밀값은 출력하지 않는다 — 성공/실패와 scope 만 찍는다.
# 확인 끝나면 이 파일은 삭제한다.
on:
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: refresh token 교환 시도
        env:
          CID: ${{ secrets.PSLAB_YOUTUBE_CLIENT_ID }}
          CSECRET: ${{ secrets.PSLAB_YOUTUBE_CLIENT_SECRET }}
          RTOKEN: ${{ secrets.PSLAB_YOUTUBE_REFRESH_TOKEN }}
          CHANNEL: ${{ secrets.PSLAB_YOUTUBE_CHANNEL_ID }}
        run: |
          # 어떤 시크릿이 비었는지부터 (값은 찍지 않고 길이만)
          echo "CLIENT_ID    길이: ${#CID}"
          echo "CLIENT_SECRET 길이: ${#CSECRET}"
          echo "REFRESH_TOKEN 길이: ${#RTOKEN}"
          echo "CHANNEL_ID    길이: ${#CHANNEL}"
          echo "---"

          RES=$(curl -s -X POST https://oauth2.googleapis.com/token \
            -d client_id="$CID" \
            -d client_secret="$CSECRET" \
            -d refresh_token="$RTOKEN" \
            -d grant_type=refresh_token)

          if echo "$RES" | grep -q '"access_token"'; then
            echo "✅ 토큰 교환 성공"
            echo "$RES" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);console.log("scope     :",j.scope);console.log("expires_in:",j.expires_in)})'
          else
            echo "❌ 토큰 교환 실패"
            # 에러 코드만 — 토큰 값은 응답에 없으므로 안전
            echo "$RES" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);console.log("error:",j.error,"|",j.error_description)})'
            exit 1
          fi

      - name: 실제 유튜브 API 호출 확인 (내 채널 조회)
        env:
          CID: ${{ secrets.PSLAB_YOUTUBE_CLIENT_ID }}
          CSECRET: ${{ secrets.PSLAB_YOUTUBE_CLIENT_SECRET }}
          RTOKEN: ${{ secrets.PSLAB_YOUTUBE_REFRESH_TOKEN }}
        run: |
          AT=$(curl -s -X POST https://oauth2.googleapis.com/token \
            -d client_id="$CID" -d client_secret="$CSECRET" \
            -d refresh_token="$RTOKEN" -d grant_type=refresh_token \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).access_token||""))')
          if [ -z "$AT" ]; then echo "access token 없음"; exit 1; fi
          # scope 가 youtube.upload 뿐이면 channels.list 는 403 이 정상이다.
          # (업로드 전용 scope — 조회 권한이 없다. 발행 코드는 업로드만 하므로 문제 없음)
          curl -s -H "Authorization: Bearer $AT" \
            "https://www.googleapis.com/youtube/v3/channels?part=snippet&mine=true" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(j.error){if(j.error.code===403){console.log("ℹ️ channels.list 403 — youtube.upload 전용 scope 라 조회 불가 (정상, 업로드에는 지장 없음)");return}console.log("❌ API 오류:",j.error.code,j.error.message);process.exit(1)}const c=(j.items||[])[0];if(!c){console.log("❌ 이 계정에 연결된 유튜브 채널이 없습니다");process.exit(1)}console.log("✅ 채널:",c.snippet.title,"| id:",c.id)})'
