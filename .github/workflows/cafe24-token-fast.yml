name: cafe24 토큰 즉시교환 (1분 제한 대응)

# 카페24 인가코드는 발급 후 **약 1분**이면 만료된다. 기존 bootstrap 워크플로는
# checkout + setup-python + pip install 로 준비에만 30초 이상 써서 1분 안에
# 교환을 못 끝내고 "Code time expired" 로 반복 실패했다.
#
# 이 워크플로는 **교환을 가장 먼저, 준비 없이** 한다:
#   - checkout 안 함 (스크립트를 인라인)
#   - setup-python 안 함 (러너에 python3 가 이미 있음)
#   - pip install 안 함 (표준 라이브러리 urllib 로 POST)
# → 잡 시작 후 수초 안에 교환 완료. DB 저장은 교환 뒤에 느긋하게 한다
#   (refresh_token 은 2주 유효하므로 이후 단계가 느려도 무관).
on:
  workflow_dispatch:
    inputs:
      code:
        description: "카페24 인가코드 (주소창 code= 뒤부터 & 앞까지)"
        required: true
      redirect_uri:
        description: "앱에 등록된 Redirect URI"
        required: true
        default: "https://keek-ops-dashboard.onrender.com"

jobs:
  exchange:
    runs-on: ubuntu-latest
    steps:
      # ── 1) 최우선: 인가코드 → 토큰 교환 (준비 작업 없음) ──────────
      - name: 인가코드 즉시 교환
        env:
          MALL_ID: ${{ secrets.CAFE24_MALL_ID }}
          CLIENT_ID: ${{ secrets.CAFE24_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CAFE24_CLIENT_SECRET }}
          CODE: ${{ github.event.inputs.code }}
          REDIRECT_URI: ${{ github.event.inputs.redirect_uri }}
        run: |
          python3 - <<'PY'
          import base64, json, os, sys, urllib.error, urllib.parse, urllib.request

          mall, cid, csec = os.environ["MALL_ID"], os.environ["CLIENT_ID"], os.environ["CLIENT_SECRET"]
          code, redirect = os.environ["CODE"].strip(), os.environ["REDIRECT_URI"].strip()
          basic = base64.b64encode(f"{cid}:{csec}".encode()).decode()
          body = urllib.parse.urlencode({
              "grant_type": "authorization_code",
              "code": code,
              "redirect_uri": redirect,
          }).encode()
          req = urllib.request.Request(
              f"https://{mall}.cafe24api.com/api/v2/oauth/token",
              data=body,
              headers={"Authorization": f"Basic {basic}",
                       "Content-Type": "application/x-www-form-urlencoded"},
          )
          try:
              with urllib.request.urlopen(req, timeout=20) as r:
                  tok = json.load(r)
          except urllib.error.HTTPError as e:
              # 실패 사유를 그대로 보여준다(만료/불일치 구분이 중요)
              print("✗ 토큰 교환 실패:", e.code, e.read().decode()[:400])
              print("  Code time expired  → 승인부터 다시(코드는 1분 만료)")
              print("  Invalid code       → 이미 사용된 코드(한 번만 쓸 수 있음)")
              print("  redirect_uri 관련  → 개발자센터 등록값과 글자까지 같아야 함")
              sys.exit(3)
          if not tok.get("access_token"):
              print("✗ 응답에 access_token 이 없습니다:", list(tok)); sys.exit(3)
          # 토큰 자체는 절대 출력하지 않는다. 길이만 찍어 성공을 확인.
          print(f"✅ 교환 성공 (access {len(tok['access_token'])}자, "
                f"refresh {len(tok.get('refresh_token') or '')}자)")
          # 부여된 권한(scope)은 비밀이 아니고, **좁으면 지표가 조용히 결측**되므로
          # 반드시 눈에 보이게 찍고 필수 권한 누락을 경고한다.
          scopes = tok.get("scopes") or tok.get("scope") or []
          if isinstance(scopes, str):
              scopes = [x.strip() for x in scopes.split(",") if x.strip()]
          print(f"부여된 권한 {len(scopes)}개: {', '.join(sorted(scopes)) or '(응답에 없음)'}")
          NEEDED = {
              "mall.read_order": "매출·주문",
              "mall.read_customer": "고객",
              "mall.read_community": "후기(게시판)",
              "mall.read_product": "상품·품절",
              "mall.read_category": "카테고리",
              "mall.read_analytics": "접속통계(유입검색어 등)",
          }
          missing = [f"{k}({v})" for k, v in NEEDED.items() if scopes and k not in scopes]
          if missing:
              print("⚠ 권한 누락 — 아래 지표가 결측됩니다:")
              for m in missing:
                  print(f"   - {m}")
              print("  → 승인 URL 의 scope 에 누락 권한을 넣어 다시 승인하세요.")
          with open("/tmp/tok.json", "w") as f:
              json.dump({"access_token": tok["access_token"],
                         "refresh_token": tok.get("refresh_token"),
                         "scopes": scopes}, f)
          PY

      # ── 2) 교환 성공 후: DB(app_kv)에 영속화 ─────────────────────
      - name: DB에 저장
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          pip install --quiet "psycopg[binary]>=3.1"
          python3 - <<'PY'
          import json, os, psycopg

          tok = json.load(open("/tmp/tok.json"))
          rows = [("cafe24_access_token", tok["access_token"])]
          if tok.get("refresh_token"):
              rows.append(("cafe24_refresh_token", tok["refresh_token"]))
          # 권한 목록도 남긴다 — 나중에 "왜 이 지표가 비지?" 를 바로 판별할 수 있게.
          if tok.get("scopes"):
              rows.append(("cafe24_token_scopes", ",".join(tok["scopes"])))
          with psycopg.connect(os.environ["DATABASE_URL"]) as conn:
              with conn.cursor() as cur:
                  cur.execute("CREATE TABLE IF NOT EXISTS app_kv ("
                              "key TEXT PRIMARY KEY, value TEXT NOT NULL)")
                  for k, v in rows:
                      cur.execute(
                          "INSERT INTO app_kv(key, value) VALUES (%s,%s) "
                          "ON CONFLICT(key) DO UPDATE SET value=excluded.value", (k, v))
              conn.commit()
          print(f"✅ DB 저장 완료 ({', '.join(k for k, _ in rows)})")
          print("이제 일일 수집이 이 토큰을 읽어 쓰고, 갱신되면 자동으로 되씁니다.")
          PY
