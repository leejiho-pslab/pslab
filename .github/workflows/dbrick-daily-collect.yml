name: dbrick ads daily collect

# 디브릭(인테리어 디자인) 광고 성과 매일 1회 수집 — 자사몰 없음(광고 채널만 대상).
#
# 영속화: DATABASE_URL(무료 Postgres: Neon) 를 Secret 으로 넣을 것.
#   없으면 러너 SQLite 에 수집되지만 잡 종료와 함께 사라진다.
#
# 필요한 Secrets (있는 채널만 채우면 됨):
#   공통:    DATABASE_URL
#   Meta:    META_ACCESS_TOKEN, META_AD_ACCOUNT_ID (+ META_APP_ID/META_APP_SECRET 로 장기토큰 자동 갱신)
#   NaverSA: NAVER_SA_API_KEY, NAVER_SA_SECRET_KEY, NAVER_SA_CUSTOMER_ID
#   Naver:   NAVER_CLIENT_ID, NAVER_CLIENT_SECRET   (경쟁사 트렌드/검색)
#   Google:  GOOGLE_ADS_DEVELOPER_TOKEN, GOOGLE_ADS_ACCESS_TOKEN, GOOGLE_ADS_CUSTOMER_ID, GOOGLE_ADS_LOGIN_CUSTOMER_ID (후순위)
#   Kakao:   KAKAO_ACCESS_TOKEN, KAKAO_AD_ACCOUNT_ID (후순위)
#   알림:    SLACK_WEBHOOK_URL (선택)
#
# 주의: schedule 은 기본 브랜치(main)에서만 동작 → 이 워크플로를 main 에 머지할 것.

on:
  schedule:
    - cron: "0 23 * * *" # 08:00 KST (UTC+9)
  workflow_dispatch:
    inputs:
      days:
        description: "최근 N일 백필 (기본 1)"
        required: false
        default: "1"

jobs:
  collect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dbrick-ads-status
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run daily pipeline (live)
        env:
          CAFE24_OPS_MODE: live
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Meta (APP_ID/SECRET 있으면 매 실행 장기토큰 자동 갱신 → DB 영속)
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          # Google Ads
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_ACCESS_TOKEN: ${{ secrets.GOOGLE_ADS_ACCESS_TOKEN }}
          GOOGLE_ADS_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
          # Naver SearchAd
          NAVER_SA_API_KEY: ${{ secrets.NAVER_SA_API_KEY }}
          NAVER_SA_SECRET_KEY: ${{ secrets.NAVER_SA_SECRET_KEY }}
          NAVER_SA_CUSTOMER_ID: ${{ secrets.NAVER_SA_CUSTOMER_ID }}
          # Kakao Moment
          KAKAO_ACCESS_TOKEN: ${{ secrets.KAKAO_ACCESS_TOKEN }}
          KAKAO_AD_ACCOUNT_ID: ${{ secrets.KAKAO_AD_ACCOUNT_ID }}
          # Naver DataLab/Search (경쟁사)
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: |
          python scripts/run_all.py --mode live --days "${{ github.event.inputs.days || '1' }}"

      - name: Alerts (optional Slack)
        if: ${{ always() }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/notify.py || true
