name: ops backfill (history)

# 이어받기 + 시간예산 백필 — 인력 0, 타임아웃 불가.
#  - 한 번 실행에 최대 40분만 수집하고 진행 위치(cursor)를 DB에 저장
#  - 2시간마다 스케줄이 자동으로 이어받아 끝까지 채움 (다 채우면 즉시 무동작)
#  - 매일 수집이 빠진 날짜가 생겨도 자동으로 메움(자가 치유)
#
# 시작일을 바꾸거나 즉시 한 단계 진행하려면 수동 실행(Run workflow).

on:
  schedule:
    # 과거 이력은 이미 다 채움 → 매일 1회 안전망으로만 실행(빠진 날 자가치유).
    # 일일수집(23:00 UTC) 직후 23:40 UTC(=08:40 KST)에 점검 → 토큰경합/불필요실행 최소화.
    - cron: "40 23 * * *"
  workflow_dispatch:
    inputs:
      start_date:
        description: "백필 시작일 (커서 없을 때만 적용)"
        required: false
        default: "2025-01-01"
      budget_min:
        description: "이번 실행 최대 작업시간(분)"
        required: false
        default: "40"
      reset:
        description: "커서 초기화(신규 지표를 과거에 다시 채움) true/false"
        required: false
        default: "false"

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        working-directory: cafe24-ops-status
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Backfill step (resumable)
        env:
          CAFE24_OPS_MODE: live
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CAFE24_MALL_ID: ${{ secrets.CAFE24_MALL_ID }}
          CAFE24_CLIENT_ID: ${{ secrets.CAFE24_CLIENT_ID }}
          CAFE24_CLIENT_SECRET: ${{ secrets.CAFE24_CLIENT_SECRET }}
          CAFE24_ACCESS_TOKEN: ${{ secrets.CAFE24_ACCESS_TOKEN }}
          CAFE24_REFRESH_TOKEN: ${{ secrets.CAFE24_REFRESH_TOKEN }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          NAVER_SA_API_KEY: ${{ secrets.NAVER_SA_API_KEY }}
          NAVER_SA_SECRET_KEY: ${{ secrets.NAVER_SA_SECRET_KEY }}
          NAVER_SA_CUSTOMER_ID: ${{ secrets.NAVER_SA_CUSTOMER_ID }}
        run: |
          python scripts/backfill.py \
            --start "${{ github.event.inputs.start_date || '2025-01-01' }}" \
            --budget-min "${{ github.event.inputs.budget_min || '40' }}" \
            ${{ github.event.inputs.reset == 'true' && '--reset' || '' }}
