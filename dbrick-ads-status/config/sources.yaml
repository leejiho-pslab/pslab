# 경쟁사 모니터링 — 인스타 포스팅 / 메타·구글 광고 소재를 대표님이 관리하는 구글 시트로 노출.
# 시트 한 행 = 한 게시물/소재. 권장 헤더(순서 무관, 한글/영문 모두 인식):
