# 수집 대상 정의 — 광고계정 / 경쟁사 (디브릭: 인테리어 디자인 브랜드, 자사몰 없음 → 광고만)
# 실제 값은 운영하며 채워 넣는다. (비밀값은 secrets.env / GitHub Secrets)

shop:
  platform: none      # 디브릭은 자사몰(카페24 등) 없음 — 카페24 수집기는 자동 스킵됨
  mall_id: ""
  brand: dbrick

ads:
  - { channel: meta,   account_id: "1800216167435143" }   # D.Brick_official — 인스타그램/페이스북
  - { channel: naver,  account_id: "3465901" }   # 네이버 검색광고 계정(파워링크+플레이스 캠페인 모두 포함) — "OO동 인테리어" 검색 수요
                                                  # 대시보드에서는 campaignTp 기준으로 naver_powerlink/naver_place 로 자동 분리 표시됨
  - { channel: google, account_id: "" }   # 후순위
  - { channel: kakao,  account_id: "" }   # 후순위

competitors:             # 실제 비교 대상 확정 (name 은 네이버 트렌드/쇼핑 검색어로 사용됨 — 정확도 위해 상호명 확인 필요시 조정)
  # url=홈페이지, insta=인스타 핸들, domain=구글 광고투명성 조회 도메인, fb_query=페북 광고라이브러리 검색어
  - { name: 인테리어티쳐,        url: "https://interiorteacher.com/",            insta: interiorteacher,      domain: interiorteacher.com,          fb_query: interiorteacher }
  - { name: 한건축,             url: "https://hanarchitecture.co.kr/company",    insta: han.architecture_,    domain: hanarchitecture.co.kr,        fb_query: hanarchitecture }
  - { name: DDB인테리어스튜디오,  url: "https://ddb-interior-studio.imweb.me/process", insta: ddb_interior_studio, domain: ddb-interior-studio.imweb.me, fb_query: "ddb interior studio" }
  - { name: 뮤지엄오브모던키친,   url: "https://museumofmodernkitchen.com/",       insta: museumofmodernkitchen, domain: museumofmodernkitchen.com,   fb_query: museumofmodernkitchen }

# 대시보드 하단 "온라인 인입 지역 현황" 표 — 대표님이 직접 관리하는 구글 시트를 그대로 노출.
