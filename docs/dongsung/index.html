n2. 파일은 “인쇄용(재단선 포함, 글꼴 깨짐 없음)”으로. 이게 제일 자주 걸립니다.\n3. 수량이 적을수록 빨라요. 급하면 소량 급행이 답.\n\n급하실 때 전화 한 통이면 바로 확인해드립니다.\n\n#급행인쇄 #명함급행 #동성인쇄소","variant":"A","status":"planned"},{"id":"nv-namecard-guide","topic":"명함인쇄","format":"블로그","channels":["naver-blog"],"scheduledFor":"2026-07-17T09:00:00.000Z","kicker":"","headline":"명함 제작 A to Z — 처음 맡기는 분을 위한 완벽 가이드","sub":"용지·수량·후가공·납기까지, 처음이어도 헷갈리지 않게 정리했습니다.","dayLabel":"","captionNote":"용지·수량·후가공·납기까지, 처음이어도 헷갈리지 않게 정리했습니다.","captionBody":"# 명함 제작, 처음이라 막막하신가요?\n\n명함은 사업의 첫인상입니다. 처음 맡기실 때 알아두면 좋은 것들을 순서대로 정리했습니다.\n\n## 1. 용지 고르기\n일반 명함지(스노우/아트)부터 고급 수입지까지 다양합니다. 무난하게는 300g 스노우지, 고급감을 원하면 두꺼운 수입지나 펄지를 추천합니다.\n\n## 2. 수량 정하기\n인쇄는 준비 비용이 커서 수량이 많을수록 한 장당 값이 내려갑니다. 자주 쓰면 500장 이상, 정보가 자주 바뀌면 소량으로 자주 찍는 편이 좋습니다.\n\n## 3. 후가공으로 차별화\n코팅(유광·무광), 금박·은박, 형압을 더하면 인상이 확 달라집니다. 예산에 맞춰 하나만 더해도 충분합니다.\n\n## 4. 납기\n일반적으로 2~3일, 급하면 당일·익일 급행도 가능합니다. 오전에 인쇄용 파일을 주시면 더 빠릅니다.\n\n## 동성인쇄소에 맡기면\n용지 추천부터 데이터 점검, 후가공 조합까지 상담해드립니다. 처음이셔도 편하게 문의주세요.\n\n#명함인쇄 #명함제작 #명함디자인 #동성인쇄소","variant":"A","status":"planned"},{"id":"ig-flyer-paper","topic":"전단지","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-07-18T09:00:00.000Z","kicker":"Paper Guide","headline":"전단지 종이,\u003cbr>*3가지* 느낌 비교","sub":"같은 디자인도 종이가 바꾼다 — 스노우·아트·모조 한눈에.","dayLabel":"","captionNote":"같은 디자인도 종이가 바꾼다 — 스노우·아트·모조 한눈에.","captionBody":"전단지, 디자인만 신경 쓰기 쉽지만 “종이”가 첫인상을 바꿉니다.\n\n· 스노우지 — 매끈하고 광이 살짝. 사진·음식 컬러가 쨍하게 삽니다.\n· 아트지 — 광이 가장 강해 고급·선명. 화장품·행사 홍보에 잘 맞아요.\n· 모조지 — 무광에 필기 가능. 정보 전달·쿠폰형에 적합합니다.\n\n같은 디자인이라도 종이 하나로 “싸 보임 ↔ 고급”이 갈립니다.\n용도를 말씀해주시면 딱 맞는 종이를 추천해드려요.\n\n#전단지 #전단지제작 #리플렛 #동성인쇄소","variant":"B","status":"planned"},{"id":"th-domuson","topic":"스티커","format":"텍스트","channels":["threads"],"scheduledFor":"2026-07-19T09:00:00.000Z","kicker":"","headline":"","sub":"","dayLabel":"","captionNote":"","captionBody":"스티커 맞출 때 나오는 “도무송”, 어려운 말 아닙니다.\n\n= 원하는 모양대로 칼선을 넣어 떼기 쉽게 재단하는 것.\n원형·라운드 사각·캐릭터 외곽선까지 모양대로 뗄 수 있어요.\n\n제품 라벨, 포장 봉인, 판촉 스티커에 딱입니다.\n모양만 정해주시면 칼선은 저희가 잡아드려요.\n\n#스티커제작 #도무송스티커 #동성인쇄소","variant":"A","status":"planned"},{"id":"nv-flyer-guide","topic":"전단지","format":"블로그","channels":["naver-blog"],"scheduledFor":"2026-07-20T09:00:00.000Z","kicker":"","headline":"전단지 홍보 효과 높이는 법 — 종이·디자인·배포 팁","sub":"뿌리는 만큼 효과 나려면? 종이 선택부터 배포 타이밍까지.","dayLabel":"","captionNote":"뿌리는 만큼 효과 나려면? 종이 선택부터 배포 타이밍까지.","captionBody":"# 전단지, 아직도 효과 있습니다 — 제대로 하면\n\n온라인 광고가 넘치는 시대에도 전단지는 “지역·매장 홍보”에 여전히 강력합니다. 효과를 높이는 방법을 정리했습니다.\n\n## 1. 종이가 첫인상\n스노우지(사진 잘 삼), 아트지(고급·선명), 모조지(정보·쿠폰형). 용도에 맞춰 고르면 “싸 보임”을 피할 수 있습니다.\n\n## 2. 한눈에 들어오는 디자인\n정보를 다 넣으려다 아무것도 안 읽힙니다. “가장 중요한 한 가지”를 크게. 혜택·기간·연락처는 명확하게.\n\n## 3. 배포 타이밍과 장소\n타깃이 지나는 시간·동선을 노리세요. 쿠폰·QR을 넣으면 효과 측정도 됩니다.\n\n## 4. 사이즈와 접지\nA5 낱장, A4 3단 접지 등 용도별로 다양합니다. 정보량이 많으면 접지형이 유리합니다.\n\n## 동성인쇄소에 맡기면\n용지·사이즈·접지 추천부터 소량 급행까지 도와드립니다.\n\n#전단지 #전단지제작 #리플렛 #홍보물 #동성인쇄소","variant":"A","status":"planned"},{"id":"ig-finishing","topic":"인쇄후가공","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-07-21T09:00:00.000Z","kicker":"Finishing","headline":"후가공 한 장으로\u003cbr>보는 *차이*","sub":"코팅·박·형압 — 이름은 어려워도 효과는 확실합니다.","dayLabel":"","captionNote":"코팅·박·형압 — 이름은 어려워도 효과는 확실합니다.","captionBody":"“후가공”이라는 말, 어렵게 들리지만 결과물은 확 다릅니다.\n\n· 코팅 — 표면을 보호하고 색을 더 진하게. 유광/무광 선택 가능.\n· 박(금박·은박) — 금속 광택을 얹어 고급감. 로고·상호에 포인트.\n· 형압 — 눌러서 요철을 만들어 만졌을 때 “고급” 느낌.\n\n명함·청첩장·브랜드 패키지에 하나만 더해도 인상이 달라집니다.\n예산과 용도에 맞게 조합을 추천해드릴게요.\n\n#인쇄후가공 #금박명함 #형압 #동성인쇄소","variant":"C","status":"planned"},{"id":"th-data-mistakes","topic":"인쇄후가공","format":"텍스트","channels":["threads"],"scheduledFor":"2026-07-22T09:00:00.000Z","kicker":"","headline":"","sub":"","dayLabel":"","captionNote":"","captionBody":"인쇄 데이터 넘길 때 자주 나는 실수 3가지\n\n1. 재단 여백 없음 — 가장자리 글자가 잘립니다. 사방 여백 필수.\n2. 글꼴 안 깨짐 처리 안 함 — 남의 컴퓨터에서 폰트가 바뀝니다. 윤곽선(아웃라인)으로.\n3. 저해상도 이미지 — 화면은 괜찮아도 인쇄하면 흐려요. 300dpi 권장.\n\n헷갈리면 파일만 보내주세요. 저희가 점검해서 알려드립니다.\n\n#인쇄데이터 #인쇄팁 #동성인쇄소","variant":"A","status":"planned"},{"id":"nv-banner-guide","topic":"현수막","format":"블로그","channels":["naver-blog"],"scheduledFor":"2026-07-23T09:00:00.000Z","kicker":"","headline":"현수막 주문 전 체크리스트 — 규격·소재·설치까지","sub":"실외 장기용은 소재가 다릅니다. 주문 전 꼭 확인하세요.","dayLabel":"","captionNote":"실외 장기용은 소재가 다릅니다. 주문 전 꼭 확인하세요.","captionBody":"# 현수막 주문 전, 이것만 확인하세요\n\n현수막은 “어디에, 얼마나 오래”에 따라 소재와 마감이 완전히 달라집니다. 주문 전 체크리스트입니다.\n\n## 1. 설치 장소 (실내/실외)\n실외라면 비·햇빛에 견디는 방수 원단이 필요합니다. 실내·단기 행사면 일반 원단으로 충분합니다.\n\n## 2. 거는 기간\n하루 행사와 몇 달 게시는 소재가 다릅니다. 장기는 색바램·찢김을 견디는 원단으로.\n\n## 3. 마감 방식\n끈으로 묶을지, 아일렛(구멍) 마감을 할지, 각목 마감을 할지 설치 방법에 맞춰 정합니다.\n\n## 4. 규격과 글자 크기\n멀리서 읽혀야 하므로 핵심 문구는 크게. 사이즈에 맞춰 여백도 고려합니다.\n\n## 5. 게시 허가\n지정 게시대·전용 구역 등 지역 규정을 확인하세요.\n\n## 동성인쇄소에 맡기면\n장소·기간만 알려주시면 소재·마감·규격을 딱 맞게 잡아드립니다.\n\n#현수막 #현수막제작 #배너 #실사출력 #동성인쇄소","variant":"A","status":"planned"},{"id":"ig-banner","topic":"현수막","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-07-24T09:00:00.000Z","kicker":"Outdoor","headline":"현수막, 실외용은\u003cbr>*무엇이* 다를까","sub":"비·햇빛 견디는 소재와 마감 — 오래 걸 거라면 필독.","dayLabel":"","captionNote":"비·햇빛 견디는 소재와 마감 — 오래 걸 거라면 필독.","captionBody":"현수막은 “어디에 얼마나 오래 거는지”로 소재가 갈립니다.\n\n· 실내·단기 — 일반 원단이면 충분, 값도 저렴합니다.\n· 실외·장기 — 비·햇빛에 견디는 방수 원단 + 튼튼한 마감(아일렛)이 필요해요.\n\n실외에 오래 걸 건데 실내용으로 뽑으면 금방 색이 바래거나 찢어집니다. 반대로 하루 행사용을 비싼 원단으로 할 필요도 없고요.\n\n거는 장소와 기간만 알려주시면 딱 맞게 잡아드립니다.\n\n#현수막 #현수막제작 #배너 #동성인쇄소","variant":"A","status":"planned"},{"id":"th-small-qty","topic":"소량인쇄","format":"텍스트","channels":["threads"],"scheduledFor":"2026-07-25T09:00:00.000Z","kicker":"","headline":"","sub":"","dayLabel":"","captionNote":"","captionBody":"“몇 장부터 맡길 수 있어요?” — 소량도 됩니다.\n\n요즘은 디지털 인쇄라 10장, 50장도 가능해요.\n· 시제품·샘플 확인 → 소량으로 먼저\n· 자주 바뀌는 정보(이벤트·행사) → 소량으로 자주\n· 대량은 단가가 낮아지니 “확정된 것”만\n\n버리는 인쇄를 줄이는 게 결국 절약입니다.\n\n#소량인쇄 #디지털인쇄 #동성인쇄소","variant":"A","status":"planned"},{"id":"nv-sticker-guide","topic":"스티커","format":"블로그","channels":["naver-blog"],"scheduledFor":"2026-07-26T09:00:00.000Z","kicker":"","headline":"스티커 종류별 활용법 — 제품 라벨·판촉·포장까지","sub":"재질·도무송·방수 여부, 용도에 맞게 고르는 법.","dayLabel":"","captionNote":"재질·도무송·방수 여부, 용도에 맞게 고르는 법.","captionBody":"# 스티커, 용도에 맞게 골라야 값을 합니다\n\n스티커는 재질과 재단(도무송)에 따라 쓰임이 크게 갈립니다. 용도별로 정리했습니다.\n\n## 1. 제품 라벨\n식품·화장품은 방수·내수 재질(유포지 등)이 필요합니다. 냉장·물기 있는 환경이면 특히 중요합니다.\n\n## 2. 판촉·홍보 스티커\n아트지·모조지로 저렴하게. 배포용은 떼기 쉬운 재단(도무송)이 편합니다.\n\n## 3. 포장 봉인\n한 번 떼면 표시가 남는 봉인 스티커, 로고 원형 스티커 등으로 마감 품질을 높입니다.\n\n## 4. 도무송(모양 재단)\n원형·라운드 사각·캐릭터 외곽선까지 원하는 모양대로 칼선을 넣습니다. 모양만 정하시면 칼선은 저희가 잡습니다.\n\n## 동성인쇄소에 맡기면\n재질·방수·모양 재단까지 용도에 맞게 추천해드립니다. 소량도 가능합니다.\n\n#스티커제작 #도무송스티커 #라벨스티커 #동성인쇄소","variant":"A","status":"planned"}],"channels":[{"key":"instagram","label":"인스타그램","icon":"📸","active":true,"published":[],"pending":[{"id":"ig-namecard-qty","topic":"명함인쇄","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-07-15T09:00:00.000Z","kicker":"Print Guide","headline":"명함 300장 vs 500장,\u003cbr>실제 *단가 차이*는?","sub":"장수만 늘려도 한 장당 값이 뚝 — 인쇄의 원리부터 쉽게.","dayLabel":"","captionNote":"장수만 늘려도 한 장당 값이 뚝 — 인쇄의 원리부터 쉽게.","captionBody":"“명함 몇 장 뽑는 게 이득이에요?” 가장 많이 듣는 질문입니다.\n\n인쇄는 “판을 거는 준비”에 값이 많이 들어요. 그래서 300장이든 500장이든 준비 비용은 비슷하고, 장수가 늘수록 한 장당 값은 뚝 떨어집니다.\n\n소량이 급하면 300장, 자주 돌리는 명함이면 500장 이상이 보통 이득이에요. 애매하면 “한 달에 몇 장 쓰는지”로 정하면 됩니다.\n\n동성인쇄소는 소량·급행도 됩니다. 편하게 문의주세요.\n\n#명함인쇄 #명함제작 #소량인쇄 #동성인쇄소","variant":"A","status":"planned"},{"id":"ig-flyer-paper","topic":"전단지","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-07-18T09:00:00.000Z","kicker":"Paper Guide","headline":"전단지 종이,\u003cbr>*3가지* 느낌 비교","sub":"같은 디자인도 종이가 바꾼다 — 스노우·아트·모조 한눈에.","dayLabel":"","captionNote":"같은 디자인도 종이가 바꾼다 — 스노우·아트·모조 한눈에.","captionBody":"전단지, 디자인만 신경 쓰기 쉽지만 “종이”가 첫인상을 바꿉니다.\n\n· 스노우지 — 매끈하고 광이 살짝. 사진·음식 컬러가 쨍하게 삽니다.\n· 아트지 — 광이 가장 강해 고급·선명. 화장품·행사 홍보에 잘 맞아요.\n· 모조지 — 무광에 필기 가능. 정보 전달·쿠폰형에 적합합니다.\n\n같은 디자인이라도 종이 하나로 “싸 보임 ↔ 고급”이 갈립니다.\n용도를 말씀해주시면 딱 맞는 종이를 추천해드려요.\n\n#전단지 #전단지제작 #리플렛 #동성인쇄소","variant":"B","status":"planned"},{"id":"ig-finishing","topic":"인쇄후가공","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-07-21T09:00:00.000Z","kicker":"Finishing","headline":"후가공 한 장으로\u003cbr>보는 *차이*","sub":"코팅·박·형압 — 이름은 어려워도 효과는 확실합니다.","dayLabel":"","captionNote":"코팅·박·형압 — 이름은 어려워도 효과는 확실합니다.","captionBody":"“후가공”이라는 말, 어렵게 들리지만 결과물은 확 다릅니다.\n\n· 코팅 — 표면을 보호하고 색을 더 진하게. 유광/무광 선택 가능.\n· 박(금박·은박) — 금속 광택을 얹어 고급감. 로고·상호에 포인트.\n· 형압 — 눌러서 요철을 만들어 만졌을 때 “고급” 느낌.\n\n명함·청첩장·브랜드 패키지에 하나만 더해도 인상이 달라집니다.\n예산과 용도에 맞게 조합을 추천해드릴게요.\n\n#인쇄후가공 #금박명함 #형압 #동성인쇄소","variant":"C","status":"planned"},{"id":"ig-banner","topic":"현수막","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-07-24T09:00:00.000Z","kicker":"Outdoor","headline":"현수막, 실외용은\u003cbr>*무엇이* 다를까","sub":"비·햇빛 견디는 소재와 마감 — 오래 걸 거라면 필독.","dayLabel":"","captionNote":"비·햇빛 견디는 소재와 마감 — 오래 걸 거라면 필독.","captionBody":"현수막은 “어디에 얼마나 오래 거는지”로 소재가 갈립니다.\n\n· 실내·단기 — 일반 원단이면 충분, 값도 저렴합니다.\n· 실외·장기 — 비·햇빛에 견디는 방수 원단 + 튼튼한 마감(아일렛)이 필요해요.\n\n실외에 오래 걸 건데 실내용으로 뽑으면 금방 색이 바래거나 찢어집니다. 반대로 하루 행사용을 비싼 원단으로 할 필요도 없고요.\n\n거는 장소와 기간만 알려주시면 딱 맞게 잡아드립니다.\n\n#현수막 #현수막제작 #배너 #동성인쇄소","variant":"A","status":"planned"}],"stats":{"publishedCount":0,"pendingCount":4,"avgEngagement":0,"trend":"n/a","totalViews":0,"totalLikes":0},"series":[]},{"key":"threads","label":"스레드","icon":"🧵","active":true,"published":[],"pending":[{"id":"th-express","topic":"급행인쇄","format":"텍스트","channels":["threads"],"scheduledFor":"2026-07-16T09:00:00.000Z","kicker":"","headline":"","sub":"","dayLabel":"","captionNote":"","captionBody":"“내일 당장 명함이 필요해요” — 가능합니다.\n\n급행 주문 팁 3가지\n1. 오전에 데이터를 넘기면 당일 작업 확률이 올라갑니다.\n2. 파일은 “인쇄용(재단선 포함, 글꼴 깨짐 없음)”으로. 이게 제일 자주 걸립니다.\n3. 수량이 적을수록 빨라요. 급하면 소량 급행이 답.\n\n급하실 때 전화 한 통이면 바로 확인해드립니다.\n\n#급행인쇄 #명함급행 #동성인쇄소","variant":"A","status":"planned"},{"id":"th-domuson","topic":"스티커","format":"텍스트","channels":["threads"],"scheduledFor":"2026-07-19T09:00:00.000Z","kicker":"","headline":"","sub":"","dayLabel":"","captionNote":"","captionBody":"스티커 맞출 때 나오는 “도무송”, 어려운 말 아닙니다.\n\n= 원하는 모양대로 칼선을 넣어 떼기 쉽게 재단하는 것.\n원형·라운드 사각·캐릭터 외곽선까지 모양대로 뗄 수 있어요.\n\n제품 라벨, 포장 봉인, 판촉 스티커에 딱입니다.\n모양만 정해주시면 칼선은 저희가 잡아드려요.\n\n#스티커제작 #도무송스티커 #동성인쇄소","variant":"A","status":"planned"},{"id":"th-data-mistakes","topic":"인쇄후가공","format":"텍스트","channels":["threads"],"scheduledFor":"2026-07-22T09:00:00.000Z","kicker":"","headline":"","sub":"","dayLabel":"","captionNote":"","captionBody":"인쇄 데이터 넘길 때 자주 나는 실수 3가지\n\n1. 재단 여백 없음 — 가장자리 글자가 잘립니다. 사방 여백 필수.\n2. 글꼴 안 깨짐 처리 안 함 — 남의 컴퓨터에서 폰트가 바뀝니다. 윤곽선(아웃라인)으로.\n3. 저해상도 이미지 — 화면은 괜찮아도 인쇄하면 흐려요. 300dpi 권장.\n\n헷갈리면 파일만 보내주세요. 저희가 점검해서 알려드립니다.\n\n#인쇄데이터 #인쇄팁 #동성인쇄소","variant":"A","status":"planned"},{"id":"th-small-qty","topic":"소량인쇄","format":"텍스트","channels":["threads"],"scheduledFor":"2026-07-25T09:00:00.000Z","kicker":"","headline":"","sub":"","dayLabel":"","captionNote":"","captionBody":"“몇 장부터 맡길 수 있어요?” — 소량도 됩니다.\n\n요즘은 디지털 인쇄라 10장, 50장도 가능해요.\n· 시제품·샘플 확인 → 소량으로 먼저\n· 자주 바뀌는 정보(이벤트·행사) → 소량으로 자주\n· 대량은 단가가 낮아지니 “확정된 것”만\n\n버리는 인쇄를 줄이는 게 결국 절약입니다.\n\n#소량인쇄 #디지털인쇄 #동성인쇄소","variant":"A","status":"planned"}],"stats":{"publishedCount":0,"pendingCount":4,"avgEngagement":0,"trend":"n/a","totalViews":0,"totalLikes":0},"series":[]},{"key":"naver-blog","label":"네이버 블로그","icon":"📝","active":true,"published":[],"pending":[{"id":"nv-namecard-guide","topic":"명함인쇄","format":"블로그","channels":["naver-blog"],"scheduledFor":"2026-07-17T09:00:00.000Z","kicker":"","headline":"명함 제작 A to Z — 처음 맡기는 분을 위한 완벽 가이드","sub":"용지·수량·후가공·납기까지, 처음이어도 헷갈리지 않게 정리했습니다.","dayLabel":"","captionNote":"용지·수량·후가공·납기까지, 처음이어도 헷갈리지 않게 정리했습니다.","captionBody":"# 명함 제작, 처음이라 막막하신가요?\n\n명함은 사업의 첫인상입니다. 처음 맡기실 때 알아두면 좋은 것들을 순서대로 정리했습니다.\n\n## 1. 용지 고르기\n일반 명함지(스노우/아트)부터 고급 수입지까지 다양합니다. 무난하게는 300g 스노우지, 고급감을 원하면 두꺼운 수입지나 펄지를 추천합니다.\n\n## 2. 수량 정하기\n인쇄는 준비 비용이 커서 수량이 많을수록 한 장당 값이 내려갑니다. 자주 쓰면 500장 이상, 정보가 자주 바뀌면 소량으로 자주 찍는 편이 좋습니다.\n\n## 3. 후가공으로 차별화\n코팅(유광·무광), 금박·은박, 형압을 더하면 인상이 확 달라집니다. 예산에 맞춰 하나만 더해도 충분합니다.\n\n## 4. 납기\n일반적으로 2~3일, 급하면 당일·익일 급행도 가능합니다. 오전에 인쇄용 파일을 주시면 더 빠릅니다.\n\n## 동성인쇄소에 맡기면\n용지 추천부터 데이터 점검, 후가공 조합까지 상담해드립니다. 처음이셔도 편하게 문의주세요.\n\n#명함인쇄 #명함제작 #명함디자인 #동성인쇄소","variant":"A","status":"planned"},{"id":"nv-flyer-guide","topic":"전단지","format":"블로그","channels":["naver-blog"],"scheduledFor":"2026-07-20T09:00:00.000Z","kicker":"","headline":"전단지 홍보 효과 높이는 법 — 종이·디자인·배포 팁","sub":"뿌리는 만큼 효과 나려면? 종이 선택부터 배포 타이밍까지.","dayLabel":"","captionNote":"뿌리는 만큼 효과 나려면? 종이 선택부터 배포 타이밍까지.","captionBody":"# 전단지, 아직도 효과 있습니다 — 제대로 하면\n\n온라인 광고가 넘치는 시대에도 전단지는 “지역·매장 홍보”에 여전히 강력합니다. 효과를 높이는 방법을 정리했습니다.\n\n## 1. 종이가 첫인상\n스노우지(사진 잘 삼), 아트지(고급·선명), 모조지(정보·쿠폰형). 용도에 맞춰 고르면 “싸 보임”을 피할 수 있습니다.\n\n## 2. 한눈에 들어오는 디자인\n정보를 다 넣으려다 아무것도 안 읽힙니다. “가장 중요한 한 가지”를 크게. 혜택·기간·연락처는 명확하게.\n\n## 3. 배포 타이밍과 장소\n타깃이 지나는 시간·동선을 노리세요. 쿠폰·QR을 넣으면 효과 측정도 됩니다.\n\n## 4. 사이즈와 접지\nA5 낱장, A4 3단 접지 등 용도별로 다양합니다. 정보량이 많으면 접지형이 유리합니다.\n\n## 동성인쇄소에 맡기면\n용지·사이즈·접지 추천부터 소량 급행까지 도와드립니다.\n\n#전단지 #전단지제작 #리플렛 #홍보물 #동성인쇄소","variant":"A","status":"planned"},{"id":"nv-banner-guide","topic":"현수막","format":"블로그","channels":["naver-blog"],"scheduledFor":"2026-07-23T09:00:00.000Z","kicker":"","headline":"현수막 주문 전 체크리스트 — 규격·소재·설치까지","sub":"실외 장기용은 소재가 다릅니다. 주문 전 꼭 확인하세요.","dayLabel":"","captionNote":"실외 장기용은 소재가 다릅니다. 주문 전 꼭 확인하세요.","captionBody":"# 현수막 주문 전, 이것만 확인하세요\n\n현수막은 “어디에, 얼마나 오래”에 따라 소재와 마감이 완전히 달라집니다. 주문 전 체크리스트입니다.\n\n## 1. 설치 장소 (실내/실외)\n실외라면 비·햇빛에 견디는 방수 원단이 필요합니다. 실내·단기 행사면 일반 원단으로 충분합니다.\n\n## 2. 거는 기간\n하루 행사와 몇 달 게시는 소재가 다릅니다. 장기는 색바램·찢김을 견디는 원단으로.\n\n## 3. 마감 방식\n끈으로 묶을지, 아일렛(구멍) 마감을 할지, 각목 마감을 할지 설치 방법에 맞춰 정합니다.\n\n## 4. 규격과 글자 크기\n멀리서 읽혀야 하므로 핵심 문구는 크게. 사이즈에 맞춰 여백도 고려합니다.\n\n## 5. 게시 허가\n지정 게시대·전용 구역 등 지역 규정을 확인하세요.\n\n## 동성인쇄소에 맡기면\n장소·기간만 알려주시면 소재·마감·규격을 딱 맞게 잡아드립니다.\n\n#현수막 #현수막제작 #배너 #실사출력 #동성인쇄소","variant":"A","status":"planned"},{"id":"nv-sticker-guide","topic":"스티커","format":"블로그","channels":["naver-blog"],"scheduledFor":"2026-07-26T09:00:00.000Z","kicker":"","headline":"스티커 종류별 활용법 — 제품 라벨·판촉·포장까지","sub":"재질·도무송·방수 여부, 용도에 맞게 고르는 법.","dayLabel":"","captionNote":"재질·도무송·방수 여부, 용도에 맞게 고르는 법.","captionBody":"# 스티커, 용도에 맞게 골라야 값을 합니다\n\n스티커는 재질과 재단(도무송)에 따라 쓰임이 크게 갈립니다. 용도별로 정리했습니다.\n\n## 1. 제품 라벨\n식품·화장품은 방수·내수 재질(유포지 등)이 필요합니다. 냉장·물기 있는 환경이면 특히 중요합니다.\n\n## 2. 판촉·홍보 스티커\n아트지·모조지로 저렴하게. 배포용은 떼기 쉬운 재단(도무송)이 편합니다.\n\n## 3. 포장 봉인\n한 번 떼면 표시가 남는 봉인 스티커, 로고 원형 스티커 등으로 마감 품질을 높입니다.\n\n## 4. 도무송(모양 재단)\n원형·라운드 사각·캐릭터 외곽선까지 원하는 모양대로 칼선을 넣습니다. 모양만 정하시면 칼선은 저희가 잡습니다.\n\n## 동성인쇄소에 맡기면\n재질·방수·모양 재단까지 용도에 맞게 추천해드립니다. 소량도 가능합니다.\n\n#스티커제작 #도무송스티커 #라벨스티커 #동성인쇄소","variant":"A","status":"planned"}],"stats":{"publishedCount":0,"pendingCount":4,"avgEngagement":0,"trend":"n/a","totalViews":0,"totalLikes":0},"series":[]},{"key":"blogger","label":"구글 블로그","icon":"🅱️","active":true,"published":[],"pending":[],"stats":{"publishedCount":0,"pendingCount":0,"avgEngagement":0,"trend":"n/a","totalViews":0,"totalLikes":0},"series":[]},{"key":"youtube","label":"유튜브","icon":"▶️","active":false,"published":[],"pending":[],"stats":{"publishedCount":0,"pendingCount":0,"avgEngagement":0,"trend":"n/a","totalViews":0,"totalLikes":0},"series":[]}],"channelLinks":[{"key":"instagram","label":"인스타그램","icon":"📸","url":"https://www.instagram.com/dongsung_print","sub":"@dongsung_print"},{"key":"threads","label":"스레드","icon":"🧵","url":"https://www.threads.net/@dongsung_print","sub":"@dongsung_print"},{"key":"naver-blog","label":"네이버 블로그","icon":"📝","url":"https://admin.blog.naver.com/","sub":"관리 열기"},{"key":"blogger","label":"구글 블로그","icon":"🅱️","url":"https://www.blogger.com/","sub":"관리 열기"},{"key":"youtube","label":"유튜브","icon":"▶️","url":"https://studio.youtube.com/","sub":"관리 열기"}],"blog":{"measured":false,"grade":"측정 전","score":0,"posts":[],"keywords":[{"kw":"명함인쇄","pc":null,"mobile":null,"total":null,"competition":null},{"kw":"전단지","pc":null,"mobile":null,"total":null,"competition":null},{"kw":"현수막","pc":null,"mobile":null,"total":null,"competition":null},{"kw":"스티커","pc":null,"mobile":null,"total":null,"competition":null},{"kw":"소량인쇄","pc":null,"mobile":null,"total":null,"competition":null},{"kw":"급행인쇄","pc":null,"mobile":null,"total":null,"competition":null},{"kw":"인쇄후가공","pc":null,"mobile":null,"total":null,"competition":null},{"kw":"종이추천","pc":null,"mobile":null,"total":null,"competition":null},{"kw":"카탈로그","pc":null,"mobile":null,"total":null,"competition":null},{"kw":"봉투인쇄","pc":null,"mobile":null,"total":null,"competition":null}],"kwSource":null},"learning":null,"tokenHealth":null,"weeklyReport":null,"brandBrief":{},"channelGuides":{},"research":null,"weekPlan":null,"referenceLinks":null}]};
const REPO = DATA.repo;
let ci = 0, ch = 'all';
// ── 운영 기간 선택 (전역 상태) ──
let period = { key:'all', from:null, to:null };
function periodRange(){
  if(period.key==='all') return null;
  const now=new Date(); let from,to;
  if(period.key==='7d'){ to=now; from=new Date(now.getTime()-6*864e5); }
  else if(period.key==='14d'){ to=now; from=new Date(now.getTime()-13*864e5); }
  else if(period.key==='30d'){ to=now; from=new Date(now.getTime()-29*864e5); }
  else if(period.key==='month'){ from=new Date(now.getFullYear(),now.getMonth(),1); to=now; }
  else if(period.key==='prev'){ from=new Date(now.getFullYear(),now.getMonth()-1,1); to=new Date(now.getFullYear(),now.getMonth(),0); }
  else if(period.key==='custom'){
    if(!period.from&&!period.to) return null;
    from=period.from?new Date(period.from):new Date(0);
    to=period.to?new Date(period.to):now;
  } else return null;
  const f=new Date(from); f.setHours(0,0,0,0);
  const t=new Date(to); t.setHours(23,59,59,999);
  return [f.getTime(), t.getTime()];
}
function inPeriod(s){ const r=periodRange(); if(!r) return true; if(!s) return false; const t=new Date(s).getTime(); return t>=r[0]&&t<=r[1]; }
function periodLabel(){
  const names={all:'전체 기간','7d':'최근 7일','14d':'최근 14일','30d':'최근 30일',month:'이번 달',prev:'지난 달',custom:'직접 선택'};
  const r=periodRange();
  const d=x=>new Date(x).toISOString().slice(0,10);
  return names[period.key]+(r?' ('+d(r[0])+' ~ '+d(r[1])+')':'');
}
function periodBar(){
  const b=(k,l)=>'<button class="pbtn'+(period.key===k?' on':'')+'" onclick="setPeriod(\''+k+'\')">'+l+'</button>';
  return '<div class="panel pbar"><span class="pbar-t">📆 운영 기간</span>'+
    b('all','전체')+b('7d','최근 7일')+b('14d','최근 14일')+b('30d','최근 30일')+b('month','이번 달')+b('prev','지난 달')+
    '<span class="pbar-c">직접 선택 <input type="date" id="pfrom" value="'+(period.from||'')+'" onchange="setCustom()"/> ~ <input type="date" id="pto" value="'+(period.to||'')+'" onchange="setCustom()"/></span>'+
    '<span class="muted" style="margin-left:auto">'+periodLabel()+'</span></div>';
}
function setPeriod(k){ period.key=k; renderView(); }
function setCustom(){
  period.key='custom';
  period.from=(document.getElementById('pfrom')||{}).value||null;
  period.to=(document.getElementById('pto')||{}).value||null;
  renderView();
}

// 버튼을 누른 브라우저는 localStorage 로 즉시, 다른 브라우저는 이슈 직독(loadIssues)으로 몇 초 내 반영.
// 데이터(plan.json)가 따라잡으면 localStorage 항목은 자동 청소된다 — 상태의 최종 출처는 항상 데이터다.
function lsSet(k){ try{ return new Set(JSON.parse(localStorage.getItem(k)||'[]')); }catch(e){ return new Set(); } }
function lsAdd(k,v){ try{ const s=lsSet(k); s.add(v); localStorage.setItem(k,JSON.stringify(Array.from(s))); }catch(e){} }
function lsDel(k,v){ try{ const s=lsSet(k); if(s.delete(v)) localStorage.setItem(k,JSON.stringify(Array.from(s))); }catch(e){} }
const refKey=(ch,u)=>ch+'|'+String(u).replace(/\/+$/,'');
// 발행 완료로 봐야 하는가 — 데이터 확정(published) 또는 신고 접수(이슈·로컬)
function isDoneLive(it){ return it.status==='published'||DONE_IDS.has(it.id)||lsSet('psDone').has(it.id); }
function refDeleted(ch,u){ const k=refKey(ch,u); return DELREF.has(k)||lsSet('psRefDel').has(k); }
// 아직 데이터에 반영 안 됐을 수 있는 지침 이슈: 열려 있거나, 이 대시보드 생성 이후 등록된 것

function myIssue(x){ return !x.clientId||x.clientId===DATA.clients[ci].id; } // 업체 스코프 (없으면 전 업체)
function channelIssues(key){ return (ISSUES||[]).filter(x=>x.chKey===key&&myIssue(x)); }
// 발행 게이트 — 이 콘텐츠에 걸린 미처리(열림) 수정요청. 특정 id 지정 요청은 그 콘텐츠만,
// '채널 공통' 요청은 그 채널의 발행 전 콘텐츠 전체를 보류시킨다 (publish-plan --due와 동일 규칙).
function openHolds(it){
  return (ISSUES||[]).filter(x=>x.state!=='closed'&&myIssue(x)&&(x.planId?x.planId===it.id:(it.channels||[]).includes(x.chKey)));
}
function loadIssues(){
  fetch('https://api.github.com/repos/'+REPO+'/issues?state=all&per_page=100&sort=created&direction=desc')
    .then(r=>r.ok?r.json():[])
    .then(arr=>{
      const list=(Array.isArray(arr)?arr:[]).filter(x=>!x.pull_request);
      ISSUES=list.map(x=>{
        const m=REQ_RE.exec(x.title||''); if(!m) return null;
        // 본문 '대상 콘텐츠: … (id: xxx)' → 특정 콘텐츠 수정요청. id 없으면 채널 공통.
        // '업체: xxx' → 여러 업체가 한 저장소를 쓸 때의 업체 스코프 (없으면 전 업체 적용 — 과거 이슈 호환)
        const idm=/\(id:\s*([\w.-]+)\)/.exec(String(x.body||''));
        const cm=/업체:\s*([\w-]+)/.exec(String(x.body||''));
        return { chKey:m[1], planId:idm?idm[1]:null, clientId:cm?cm[1]:null, titleClean:m[2]||x.title, state:x.state, html_url:x.html_url, created_at:x.created_at, closed_at:x.closed_at };
      }).filter(Boolean);
      // 레퍼런스 이슈 본문에서 링크를 즉시 수집 — 시스템 반영(커밋·배포) 전에도 '접수됨'으로 표시
      REF_ISSUES=[];
      for(const x of list){
        const m=REF_RE.exec(x.title||''); if(!m) continue;
        for(const line of String(x.body||'').split('\n')){
          const t=line.replace(/^[-*·•\s]+/,'').trim();
          const um=t.match(/^(https?:\/\/\S+)\s*(?:[—–-]\s*)?(.*)$/);
          if(um) REF_ISSUES.push({channel:m[1], url:um[1], note:(um[2]||'').trim(), issueUrl:x.html_url, at:x.created_at});
        }
      }
      // 지침 이슈(브랜드노트·디자인피드백·가이드)도 즉시 수집 — 지침 탭에 실시간 표시
      G_ISSUES=[];
      for(const x of list){
        const g=GUID_RE.exec(x.title||''); if(!g) continue;
        G_ISSUES.push({kind:g[1].indexOf('브랜드노트')===0?'brand':(g[1]==='디자인피드백'?'design':'guide'),
          field:g[2]||null, chKey:g[3]||null, body:String(x.body||''), state:x.state,
          html_url:x.html_url, created_at:x.created_at});
      }
      // 발행완료·레퍼런스삭제 이슈 직독 — 커밋·배포를 기다리지 않고 화면이 먼저 움직인다
      DONE_IDS=new Set(); DELREF=new Set();
      const myId=(DATA.clients[ci]||{}).id;
      for(const x of list){
        if(DONE_RE.test(x.title||'')){
          const im=/\(id:\s*([\w.-]+)\)/.exec(String(x.body||''));
          const cm=/업체:\s*([\w-]+)/.exec(String(x.body||''));
          if(im&&(!cm||cm[1]===myId)) DONE_IDS.add(im[1]);
        }
        const dm=DELREF_RE.exec(x.title||'');
        if(dm){
          for(const line of String(x.body||'').split('\n')){
            const um=line.trim().match(/^(https?:\/\/\S+)/);
            if(um) DELREF.add(refKey(dm[1],um[1]));
          }
        }
      }
      // 데이터가 따라잡은 항목은 로컬 낙관 표시를 청소 — localStorage 가 낡은 진실이 되지 않게
      for(const p of ((DATA.clients[ci]||{}).planCards||[])) if(p.status==='published') lsDel('psDone',p.id);
      renderTabs(); renderView();
    })
    .catch(()=>{ ISSUES=[]; });
}
// 커밋된 링크 + 아직 반영 전인 이슈 링크(접수됨)를 채널 기준으로 병합.
// 삭제된 링크(removed 상태 또는 삭제 이슈·로컬 접수)는 목록에서 완전히 제외한다.
function refLinksFor(client, key){
  const saved=(((client.referenceLinks||{}).links)||[])
    .filter(l=>(!key||l.channel===key)&&l.status!=='removed'&&!refDeleted(l.channel,l.url));
  const have=new Set(saved.map(l=>refKey(l.channel,l.url)));
  const incoming=REF_ISSUES.filter(r=>(!key||r.channel===key)&&!have.has(refKey(r.channel,r.url))&&!refDeleted(r.channel,r.url))
    .map(r=>({url:r.url, channel:r.channel, note:r.note||undefined, status:'received', addedAt:r.at, issueUrl:r.issueUrl}));
  return saved.concat(incoming);
}
function reqStatus(x){ return x.state==='closed' ? '<span class="badge b-ok">✅ 처리완료</span>' : '<span class="badge b-wait">🛠 처리중</span>'; }
// 수정요청의 대상 표시 — 특정 콘텐츠(id)면 그 헤드라인, 아니면 채널 공통
function reqTarget(client,x){
  if(!x.planId) return '채널 공통';
  const p=(client.planCards||[]).find(t=>t.id===x.planId);
  return esc(p?plainHead(p).slice(0,22):x.planId);
}
// 수정 항목 분류 — 이슈 제목 [항목] 태그 + 본문 '수정 항목:' 줄로 들어간다
const REQ_TYPES=['텍스트(문구·카피)','이미지(사진·카드)','영상(릴스·쇼츠)','디자인(색·레이아웃)','해시태그·키워드','발행 일정','기타'];
function requestsPanel(client, key, chLabel){
  const list=channelIssues(key);
  const open=list.filter(x=>x.state!=='closed').length;
  let h='<div class="panel" style="border-color:#d9c2ee;background:#fcfaff"><div class="sect-h" style="margin:0 0 10px"><h3>✏️ 수정요청 게시판 · '+esc(chLabel)+'</h3><span class="muted">'+(ISSUES===null?'불러오는 중…':('🛠 처리중 '+open+'건 · 총 '+list.length+'건'))+'</span></div>'+
    '<div class="muted" style="margin:0 0 10px">🚦 <b>발행 전 검수 게이트</b> — 접수된 수정요청이 <b>처리완료</b>되기 전에는 대상 콘텐츠의 자동 발행이 보류됩니다. 수정사항이 반영되고 요청이 처리완료로 바뀌면 다음 사이클에 자동 발행됩니다. (대상을 지정하지 않은 "채널 공통" 요청은 이 채널의 발행 대기 콘텐츠 전체를 보류)</div>';
  if(list.length){
    h+='<table><tr><th style="width:92px">상태</th><th style="width:150px">대상</th><th>요청 내용</th><th style="width:100px">등록일</th><th style="width:52px"></th></tr>'+
      list.map(x=>'<tr><td>'+reqStatus(x)+'</td><td class="muted" style="font-size:12px">'+reqTarget(client,x)+'</td><td>'+esc(x.titleClean)+'</td><td class="muted">'+String(x.created_at||'').slice(0,10)+'</td><td><a href="'+esc(x.html_url)+'" target="_blank">보기↗</a></td></tr>').join('')+'</table>';
  } else if(ISSUES!==null){
    h+='<div class="empty" style="padding:8px">아직 등록된 수정요청이 없습니다. 아래에 바로 작성해 보세요.</div>';
  }
  // 대상 콘텐츠 선택 — 이 채널의 기획 콘텐츠(발행일순). 어떤 날짜 콘텐츠의 수정인지 특정한다
  const plans=(client.planCards||[]).filter(p=>(p.channels||[]).includes(key));
  const planOpt=plans.map(p=>{
    const d=String(p.scheduledFor||'').slice(5,10).replace('-','/');
    const st=p.status==='published'?' · 발행됨':'';
    return '<option value="'+esc(p.id)+'">'+esc((d?d+' · ':'')+plainHead(p).slice(0,34)+st)+'</option>';
  }).join('');
  h+='<div style="margin-top:12px">'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">'+
    '<label class="muted" style="display:flex;align-items:center;gap:6px;font-size:12.5px">📅 대상 콘텐츠 '+
    '<select id="reqplan-'+esc(key)+'" class="reqta" style="width:auto;padding:6px 8px;font-size:12.5px"><option value="">채널 공통 (특정 콘텐츠 아님)</option>'+planOpt+'</select></label>'+
    '<label class="muted" style="display:flex;align-items:center;gap:6px;font-size:12.5px">🏷 수정 항목 '+
    '<select id="reqtype-'+esc(key)+'" class="reqta" style="width:auto;padding:6px 8px;font-size:12.5px">'+REQ_TYPES.map(t=>'<option>'+esc(t)+'</option>').join('')+'</select></label></div>'+
    '<textarea id="reqtext-'+esc(key)+'" class="reqta" rows="3" placeholder="수정하고 싶은 내용을 적어주세요. 예) 3번 카드 문구를 더 짧게 / 커버 이미지 톤을 밝게 / 해시태그에 #청담맛집 추가"></textarea>'+
    '<div style="display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap"><button class="btn fb" onclick="submitReq(\''+esc(key)+'\',\''+esc(chLabel)+'\')">✏️ 수정요청 등록</button>'+
    '<span class="muted">등록을 누르면 깃허브 창이 열립니다 — 초록색 “Submit new issue” 버튼만 누르면 접수 완료. 처리 상태는 이 게시판에 자동 표시됩니다.</span></div></div></div>';
  return h;
}

function guideNote(){
  return '<div class="muted" style="margin:2px 0 14px">여기 적은 내용은 자동으로 반영됩니다 — 등록 → 깃허브 창에서 제출 → 몇 분 내 시스템에 저장되어 <b>다음 콘텐츠 생성부터 프롬프트·소재 선정에 적용</b>됩니다. (이슈가 자동으로 닫히면 반영 완료)</div>';

function submitGuidance(title, bodyPrefix, taId){
  const ta=document.getElementById(taId);
  const txt=(ta&&ta.value.trim())||'';
  if(!txt){ alert('내용을 먼저 적어주세요.'); return; }
  window.open(issue(title, bodyPrefix+txt), '_blank');
  if(ta) ta.value='';
}

      '<td>'+(it.publishedUrl?'<a href="'+esc(it.publishedUrl)+'" target="_blank">열기↗</a>':'')+'</td></tr>';
  }).concat(pubF.map(p=>'<tr><td><b>'+esc(p.topic)+'</b><div class="muted">'+ftime(p.time)+'</div></td>'+

const VER = (((DATA.clients[0]||{}).planUpdatedAt)||DATA.generatedAt||'').replace(/\D/g,'').slice(0,14);
const imgv = s => !s ? s : (s + (s.indexOf('?')<0?'?':'&') + 'v=' + VER);
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const ftime = s => !s?'-':String(s).replace('T',' ').slice(0,16);

function issue(title, body){
  return 'https://github.com/'+REPO+'/issues/new?labels=feedback&title='+encodeURIComponent(title)+'&body='+encodeURIComponent(body);
}
function sparkline(arr){
  if(!arr||arr.length<2) return '';
  const w=160,h=34,mx=Math.max(...arr,1),mn=Math.min(...arr,0);
  const dx=w/(arr.length-1);
  const pts=arr.map((v,i)=>[i*dx,h-((v-mn)/(mx-mn||1))*(h-6)-3]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  return '<svg class="spark" width="'+w+'" height="'+h+'"><path d="'+d+'" fill="none" stroke="#2b6fff" stroke-width="2"/></svg>';
}

// 네이버 붙여넣기용 평문(마크다운 기호 제거, 이미지 위치는 마커로)
// 제목(# 줄)은 뺀다 — 네이버 제목칸에 따로 넣으므로 본문에 또 들어가면 중복이다.
function plainPostText(it){
  let n=0;
  return String(it.captionBody||'').split('\n').map(line=>{
    const t=line.trim();
    const img=t.match(/^!\[([^\]]*)\]\(([^)]+)\)$/);
    if(img){ n++; return '\n[📷 이미지'+n+' 삽입]\n'; }
    if(t.startsWith('## ')) return '\n■ '+t.slice(3);
    if(t.startsWith('# ')) return '';
    if(t==='>'||t.startsWith('> ')) return t.replace(/^>\s?/,'');
    return line.replace(/\*\*([^*]+)\*\*/g,'$1');
  }).join('\n').replace(/\n{3,}/g,'\n\n').trim();
}
/* ── 네이버 스마트에디터 붙여넣기용 서식 HTML ──────────────────────────────
   문제: 평문만 복사하면 붙여넣은 글이 커서 위치의 서식을 물려받고, 대시보드 화면을
   드래그해 복사하면 대시보드 CSS(회색 13px)가 딸려 들어가 색·크기가 뒤죽박죽이 된다.
   해결: 모든 요소에 color/font-size/font-family/line-height 를 **인라인으로 못 박는다**.
   상속될 여지를 남기지 않으면 붙여넣기 경로가 무엇이든 결과가 같다.

   ⚠️ **드래그 복사가 주 경로다.** 버튼 복사(ClipboardItem)는 브라우저·앱에 따라 막히지만
   드래그는 어디서나 된다. 그래서 이 HTML 은 "붙여넣기용 데이터"이자 동시에 **화면에 그려
   운영자가 직접 끌 대상**이다. 둘을 같은 함수로 만들어야 보이는 것과 붙는 것이 어긋나지 않는다.

   맥락 구분은 크게 준다 — 소제목 29px/900, 본문 18px, 소제목 앞 여백 64px.
   본문에서 눈으로 훑을 때도, 네이버에 붙였을 때도 목차 경계가 바로 보여야 한다. */
var NV_FONT="'나눔고딕',NanumGothic,'맑은 고딕','Malgun Gothic',AppleSDGothicNeo-Regular,sans-serif";
/* 레퍼런스(sively_s2)는 본문을 **중앙 정렬**하고 **한 문장 = 한 줄**로 끊는다.
   모바일에서 읽기 리듬이 생기고, 네이버 본문 폭에서 줄이 어색하게 넘어가지 않는다.
   그래서 문단을 마침표 기준으로 쪼개 각 문장을 제 줄에 올린다. */
function nvSentences(line){
  // 마침표·물음표·느낌표 뒤에서 끊되, 숫자 소수점(16.5)·말줄임(…)은 건드리지 않는다.
  return String(line).split(/(?<=[.?!])\s+(?=[^\s])/).filter(x=>x.trim());
}
function nvP(inner){ return '<p style="margin:0 0 14px;padding:0;font-family:'+NV_FONT+';font-size:18px;line-height:1.85;color:#1f1f1f;letter-spacing:-0.01em;text-align:center">'+inner+'</p>'; }
function nvInline(x){
  return esc(x).replace(/\*\*([^*]+)\*\*/g,'<strong style="font-weight:700;color:#1657c8">$1</strong>');
}
/* forScreen: 화면에 그릴 때만 이미지 자리에 실제 사진을 **배경으로** 깐다.
   배경 이미지는 선택 영역에 포함되지 않아 붙여넣기에는 안 따라간다 —
   운영자는 어떤 사진이 어디 들어가는지 보면서 끌 수 있고, 네이버에는 자리 표시 문구만 간다.
   (네이버는 외부 이미지를 붙여넣기로 안 받으므로 <img> 를 넣어봐야 사라진다.) */
function naverBodyHtml(it,forScreen){
  let n=0;
  const out=String(it.captionBody||'').split('\n').map(line=>{
    const t=line.trim();
    const img=t.match(/^!\[([^\]]*)\]\(([^)]+)\)$/);
    if(img){ n++;
      const bg=forScreen
        ? 'background-image:url('+esc(imgv(img[2]))+');background-size:cover;background-position:center;min-height:190px;'
        : '';
      return '<p style="margin:30px 0;padding:16px 12px;border:2px dashed #b9c6da;border-radius:10px;background-color:#f4f7fc;'+bg+
        'font-family:'+NV_FONT+';font-size:16px;line-height:1.6;color:#3b5b8c;text-align:center;'+
        'display:flex;align-items:flex-end;justify-content:center">'+
        '<span style="background:rgba(255,255,255,.92);padding:6px 12px;border-radius:20px;font-weight:700">'+
        '📷 이미지'+n+' 자리 — 이 줄을 지우고 이미지'+n+'을 삽입하세요</span></p>';
    }
    // 소제목: 앞 여백을 크게 벌려 앞 단락과 확실히 끊고, 크기·굵기로 한 번 더 구분한다.
    if(t.startsWith('## ')) return '<p style="margin:64px 0 22px;padding:20px 0 0;border-top:3px solid #1657c8;'+
      'font-family:'+NV_FONT+';font-size:29px;line-height:1.4;font-weight:900;color:#0f0f0f;letter-spacing:-0.03em">'+nvInline(t.slice(3))+'</p>';
    if(t.startsWith('# ')) return '';
    if(t==='>'||t.startsWith('> ')) return '<p style="margin:0 0 36px;padding:20px 22px;background:#f2f6fd;border-left:6px solid #1657c8;border-radius:4px;'+
      'font-family:'+NV_FONT+';font-size:18px;line-height:1.8;color:#22314a;font-weight:600">'+nvInline(t.replace(/^>\s?/,''))+'</p>';
    if(t==='---') return '<p style="margin:40px 0;padding:0;border-top:1px solid #dfe4ec;height:0;font-size:0;line-height:0">&nbsp;</p>';
    if(t.indexOf('#')===0&&t.indexOf(' #')>0) return '<p style="margin:32px 0 0;padding:0;font-family:'+NV_FONT+';font-size:15px;line-height:1.8;color:#7b8598">'+esc(t)+'</p>';
    if(t==='') return '';
    return nvSentences(line).map(x=>nvP(nvInline(x))).join('');
  }).filter(Boolean).join('');
  // 바깥 래퍼도 색·크기를 못 박는다 (에디터가 래퍼 스타일만 살리는 경우 대비)
  return '<div style="font-family:'+NV_FONT+';font-size:18px;line-height:1.9;color:#1f1f1f;background:#ffffff">'+out+'</div>';
}
/* 네이버 본문 = 드래그 대상. 미리보기와 드래그 영역을 따로 두지 않는다 —
   따로 두면 어느 쪽을 끌어야 하는지 헷갈리고, 잘못 끌면 대시보드 서식이 딸려간다. */
function naverDragBox(it){
  return '<div class="capbox" style="border-color:#b9c6da;background:#fbfcfe">'+
    '<div class="caphd">📝 블로그 본문 — 이 영역을 드래그해 복사하세요</div>'+
    '<div class="muted" style="font-size:12px;margin:-2px 0 10px">'+
    '아래 글이 <b>네이버에 들어갈 실제 서식</b>입니다. 드래그해 Ctrl+C 하면 소제목 크기·색이 그대로 따라옵니다. '+
    '(사진은 배경으로만 보여주는 것이라 붙여넣기에는 안 따라갑니다 — 자리 표시 문구만 갑니다.)</div>'+
    '<div style="margin-bottom:10px"><button class="btn fb" id="dragbtn-'+esc(it.id)+'" onclick="selectDrag(\''+esc(it.id)+'\',this.id)">🖱 전체 선택 (드래그 대신)</button></div>'+
    '<div id="nvdrag-'+esc(it.id)+'" style="background:#ffffff;border:1px solid #e4e8f0;border-radius:10px;padding:26px 24px">'+
    naverBodyHtml(it,true)+'</div></div>';
}
function flash(id,msg){ const b=document.getElementById(id); if(b){const o=b.textContent;b.textContent=msg;setTimeout(()=>b.textContent=o,1500);} }
function copyPost(id){
  const it=(DATA.clients[ci].planCards||[]).find(x=>x.id===id); if(!it) return;
  const plain=plainPostText(it);
  const isNaver=(it.channels||[]).indexOf('naver-blog')>=0||String(id).indexOf('naver')===0;
  // 서식 채널은 text/html 과 text/plain 을 **함께** 넣는다. 에디터는 html 을,
  // 메모장 등은 plain 을 받는다. ClipboardItem 미지원 브라우저면 평문으로 떨어진다.
  if(isNaver&&window.ClipboardItem&&navigator.clipboard&&navigator.clipboard.write){
    const html=naverBodyHtml(it,false);
    navigator.clipboard.write([new ClipboardItem({
      'text/html':new Blob([html],{type:'text/html'}),
      'text/plain':new Blob([plain],{type:'text/plain'})
    })]).then(()=>flash('copybtn-'+id,'✅ 서식까지 복사됨!'))
      .catch(()=>navigator.clipboard.writeText(plain).then(()=>flash('copybtn-'+id,'✅ 평문으로 복사됨'))
      .catch(()=>alert('복사 실패 — 아래 “드래그용 본문”을 드래그해 Ctrl+C 하세요.')));
    return;
  }
  navigator.clipboard.writeText(plain).then(()=>flash('copybtn-'+id,'✅ 복사됨!')).catch(()=>alert('복사 실패 — 본문을 길게 눌러 직접 복사하세요.'));
}
// 드래그 복사 대안 — 패널 전체를 선택 상태로 만들어 준다(Ctrl+C 만 누르면 됨).
function selectDrag(id,btnId){
  const el=document.getElementById('nvdrag-'+id); if(!el) return;
  const r=document.createRange(); r.selectNodeContents(el);
  const s=window.getSelection(); s.removeAllRanges(); s.addRange(r);
  try{ document.execCommand('copy'); flash(btnId,'✅ 선택+복사됨!'); }
  catch(e){ flash(btnId,'👆 이제 Ctrl+C'); }
}
function copyTitle(id){
  const it=(DATA.clients[ci].planCards||[]).find(x=>x.id===id); if(!it) return;
  navigator.clipboard.writeText(plainHead(it)).then(()=>flash('titlebtn-'+id,'✅ 복사됨!')).catch(()=>{});
}
function copyField(id,field,btnId){
  const it=(DATA.clients[ci].planCards||[]).find(x=>x.id===id); if(!it||!it[field]) return;
  navigator.clipboard.writeText(it[field]).then(()=>flash(btnId,'✅ 복사됨!')).catch(()=>alert('복사 실패 — 직접 복사하세요.'));
}
function copyTags(id,btnId){
  const it=(DATA.clients[ci].planCards||[]).find(x=>x.id===id); if(!it||!it.ytTags) return;
  navigator.clipboard.writeText(it.ytTags.join(', ')).then(()=>flash(btnId,'✅ 복사됨!')).catch(()=>{});
}
// 블로그/대본 등 본문의 가벼운 마크다운(## 소제목, [HOOK] 등)을 보기 좋게
function mdInline(x){ return esc(x).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>'); }
function fmtCaption(s){
  return String(s||'').split('\n').map(line=>{
    const t=line.trim();
    const img=t.match(/^!\[([^\]]*)\]\(([^)]+)\)$/);
    if(img) return '<img class="md-img" src="'+esc(img[2])+'" alt="'+esc(img[1])+'" loading="lazy"/>';
    if(t.startsWith('## ')) return '<h4 class="md-h">'+mdInline(t.slice(3))+'</h4>';
    if(t.startsWith('# ')) return '<h3 class="md-h1">'+mdInline(t.slice(2))+'</h3>';

      const iss=channelIssues(c.key); const openN=iss.filter(x=>x.state!=='closed').length;
      const reqCell=iss.length?(openN?'<span class="badge b-wait">🛠 처리중 '+openN+'</span>':'<span class="badge b-ok">✅ 완료 '+iss.length+'</span>'):'<span class="muted">-</span>';
      return '<tr><td>'+lab.icon+' '+lab.label+'</td><td>'+(c.active?'<span class="badge b-ok">연결</span>':'<span class="badge b-hold">미연결</span>')+'</td><td>'+c.stats.publishedCount+'</td><td>'+c.stats.pendingCount+'</td><td>'+pct(c.stats.avgEngagement)+' '+tIcon(c.stats.trend)+'</td><td>'+reqCell+'</td></tr>';}).join('')+'</table></div>';
  // 발행 전 콘텐츠 기획안 — 메인에는 발행 전(예정·수동대기)만 보여준다
  const plan=client.planCards||[];
  const pre=plan.filter(p=>!isDoneLive(p));
  const fbTitle='['+client.name+'] 기획안 전체 피드백';
  const fbBody='이번 달 기획안에 대한 의견/수정사항을 적어주세요.\n\n';
  const mon=new Date(DATA.generatedAt).getMonth()+1;
  h+='<div class="sect-h"><h2>🕓 '+mon+'월 발행 전 콘텐츠 ('+pre.length+')</h2><a class="btn fb" href="'+issue(fbTitle,fbBody)+'" target="_blank">✏️ 기획안 피드백</a></div>';
  if(!pre.length){ h+='<div class="empty">발행 전 콘텐츠가 없습니다. 다음 사이클에 자동 생성됩니다.</div>'; }
  else {
    for(const chDef of DATA.channels){
      const items=pre.filter(p=>(p.channels||[]).includes(chDef.key));
      if(!items.length) continue;
      const lab=chDef.icon+' '+chDef.label;
      h+='<div class="chgrp"><div class="chgrp-h">'+lab+' <span class="muted">'+items.length+'건 · '+esc((items[0].format)||'')+'</span></div>'+
         '<div class="cards">'+items.map(p=>planCard(client,chDef.label,p)).join('')+'</div></div>';
    }
  }
  // 선택한 기간의 발행 게시물 (기획 발행분 + 사이클 발행분)
  const planPub=plan.filter(p=>p.status==='published'&&inPeriod(p.publishedAt||p.scheduledFor))
    .sort((a,b)=>String(b.publishedAt||'').localeCompare(String(a.publishedAt||'')));
  const recent=[].concat(...client.channels.map(c=>c.published)).filter(p=>inPeriod(p.time))
    .sort((a,b)=>(b.time||'').localeCompare(a.time||'')).slice(0,12);
  h+='<div class="sect-h"><h2>✅ 발행된 게시물 · '+periodLabel()+' ('+(planPub.length+recent.length)+')</h2></div>';
  const pubCards=planPub.map(p=>{
    const chDef=DATA.channels.find(x=>x.key===((p.channels||[])[0]))||{label:''};
    return planCard(client,chDef.label,p);
  }).concat(recent.map(p=>publishedCard(p,'<span class="badge b-ok">발행</span>')));
  h+= pubCards.length?'<div class="cards">'+pubCards.join('')+'</div>':'<div class="empty">이 기간에 발행된 게시물이 없습니다.</div>';
  // 경쟁사
  h+='<div class="panel" style="margin-top:16px"><h3>벤치마킹 경쟁사</h3><div>'+(client.competitors.length?client.competitors.map(x=>'<span class="tag">@'+esc(x)+'</span>').join(''):'<span class="muted">미설정</span>')+'</div></div>';
  // 저중요 패널은 최하단 — 연결 상황 압축 칩 + 오픈 준비 체크리스트 (docs/06-대시보드 레이아웃 원칙)
  h+=connChips(client);
  h+=setupPanel();
  return h;
}
function kpi(v,l,accent){return '<div class="kpi"><div class="v'+(accent?' accent':'')+'">'+v+'</div><div class="l">'+l+'</div></div>';}
// ── 리서치 탭 — research-brief.json이 있으면 항목별 시각화(통계·막대·표·타임라인·링크) ──
function researchView(client){
  const r=client.research;
  if(!r||!r.sections||!r.sections.length) return '<div class="empty">리서치 데이터가 없습니다.</div>';
  let h='<div class="sect-h"><h2>📊 '+esc(r.title||'브랜드 리서치')+'</h2><span class="muted">'+(r.updatedAt?('업데이트 '+String(r.updatedAt).slice(0,10)):'')+'</span></div>';
  if(r.note) h+='<div class="muted" style="margin:0 0 14px;line-height:1.6">'+esc(r.note)+'</div>';
  for(const s of r.sections){
    h+='<div class="panel"><h3>'+esc((s.icon?s.icon+' ':'')+s.title)+'</h3>';
    if(s.desc) h+='<div class="muted" style="margin:-4px 0 10px;font-size:12.5px;line-height:1.65">'+esc(s.desc)+'</div>';
    if(s.stats&&s.stats.length) h+='<div class="kpis">'+s.stats.map(x=>kpi(esc(x.v),esc(x.l),x.accent)).join('')+'</div>';
    if(s.bars&&s.bars.items&&s.bars.items.length){
      const mx=s.bars.max||Math.max.apply(null,s.bars.items.map(x=>x.value))||1;
      if(s.bars.title) h+='<div style="font-weight:700;font-size:12.5px;margin:4px 0 6px">'+esc(s.bars.title)+'</div>';
      h+=s.bars.items.map(x=>'<div class="rbarrow"><div class="rl" title="'+esc(x.label)+'">'+esc(x.label)+'</div><div class="rtrack"><div class="rfill" style="width:'+Math.max(2,Math.round(x.value/mx*100))+'%'+(x.color?';background:'+esc(x.color):'')+'"></div></div><div class="rv">'+esc(String(x.value))+(s.bars.unit?esc(s.bars.unit):'')+(x.note?' · '+esc(x.note):'')+'</div></div>').join('');
    }
    if(s.table&&s.table.head) h+='<div style="overflow-x:auto;margin-top:8px"><table><tr>'+s.table.head.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr>'+(s.table.rows||[]).map(row=>'<tr>'+row.map(cd=>'<td>'+esc(cd)+'</td>').join('')+'</tr>').join('')+'</table></div>';
    if(s.list&&s.list.length) h+='<ul style="margin:8px 0 2px;padding-left:18px;font-size:13px;line-height:1.75">'+s.list.map(x=>'<li><b>'+esc(x.t)+'</b>'+(x.d?' — <span style="color:#4a5266">'+esc(x.d)+'</span>':'')+'</li>').join('')+'</ul>';
    if(s.timeline&&s.timeline.length) h+='<div class="rtl" style="margin-top:10px">'+s.timeline.map(x=>'<div class="ri"><span class="rd">'+esc(x.date)+'</span> · '+esc(x.text)+(x.url?' <a href="'+esc(x.url)+'" target="_blank">확인↗</a>':'')+'</div>').join('')+'</div>';
    if(s.tags&&s.tags.length) h+='<div style="margin-top:8px">'+s.tags.map(x=>'<span class="tag">'+esc(x)+'</span>').join('')+'</div>';
    if(s.links&&s.links.length) h+='<div style="margin-top:10px">'+s.links.map(x=>'<a class="rlink" href="'+esc(x.url)+'" target="_blank">🔗 '+esc(x.label)+' ↗</a>'+(x.note?'<span class="muted" style="font-size:11.5px;margin-right:8px">'+esc(x.note)+'</span>':'')).join('')+'</div>';
    h+='</div>';
  }
  return h;
}
function renderClients(){
  // 헤더 로고는 제품명 "ALWAYS ON 콘텐츠 관제실" 고정 — 업체 식별은 클라이언트 칩으로 (docs/06-대시보드)
  document.getElementById('clients').innerHTML = DATA.clients.map((c,i)=>'<button class="cbtn'+(i===ci?' on':'')+'" onclick="setClient('+i+')">'+esc(c.name)+'</button>').join('');
  const c=DATA.clients[ci];
  if(c){
    document.getElementById('dashsub').textContent=(c.industry?c.industry+' · ':'')+'채널별 현황 · 발행/대기 · 반응도 · 기획안 피드백 · 5분 자동 새로고침';
    document.documentElement.style.setProperty('--brand', c.themeColor||'#2b6fff');
  }
}
function renderTabs(){
  const c=DATA.clients[ci];
  const tabs=[{key:'all',label:'전체',icon:'🏠',active:true}]
    .concat(DATA.channels.map(ch=>{const cc=c.channels.find(x=>x.key===ch.key);return {key:ch.key,label:ch.label,icon:ch.icon,active:cc&&cc.active};}))
    .concat(c.research?[{key:'research',label:'리서치',icon:'📊',active:true,noDot:true}]:[])
    .concat([{key:'guide',label:'지침',icon:'🧭',active:true,noDot:true}]);
  document.getElementById('tabs').innerHTML = tabs.map(t=>{
    // 수정요청 진행상황 아이콘 — 🛠 처리중 n건 / ✅ 전부 처리완료
    let req='';
    if(t.key!=='all'){
      const iss=channelIssues(t.key);
      const openN=iss.filter(x=>x.state!=='closed').length;
      req = openN ? '<span class="treq open" title="수정요청 처리중 '+openN+'건">🛠'+openN+'</span>'
          : (iss.length ? '<span class="treq done" title="수정요청 전부 처리완료">✅</span>' : '');
    }
    return '<button class="tab'+(t.key===ch?' on':'')+'" onclick="setCh(\''+t.key+'\')">'+t.icon+' '+t.label+(t.key!=='all'&&!t.noDot?'<span class="dot '+(t.active?'live':'off')+'"></span>':'')+req+'</button>';
  }).join('');
}
function renderView(){
  const c=DATA.clients[ci];
  document.getElementById('view').innerHTML = ch==='all'?overview(c):(ch==='guide'?guideView(c):(ch==='research'?researchView(c):channelDetail(c,c.channels.find(x=>x.key===ch))));
  document.getElementById('gen').textContent = ftime(DATA.generatedAt)+' (UTC)';
}
function setClient(i){ci=i;ch='all';renderClients();renderTabs();renderView();window.scrollTo(0,0);}
function setCh(k){ch=k;renderTabs();renderView();window.scrollTo(0,0);}
try {
  renderClients(); renderTabs(); renderView(); loadIssues();
} catch (e) {
  var v = document.getElementById('view');
  if (v) v.innerHTML = '<div style="padding:24px;line-height:1.7;color:#b91c1c">표시 중 오류: '
    + ((e && e.message) || e)
    + '<br><br><button onclick="location.reload(true)" style="padding:10px 16px;border-radius:8px;border:0;background:#2b6fff;color:#fff;font-size:15px">새로고침</button></div>';
}
</script>
</body>
</html>
