 순간 3가지\n1. 에어컨 냉기를 방 전체로 '섞어' 설정온도 2~3도를 아껴줄 때\n2. 겨울엔 역회전으로 천장의 따뜻한 공기를 내려보낼 때 (사계절 가전!)\n3. 방등 자리에 그대로 — 조명+팬 결합형 '실링팬 방등'이라면 타공 걱정도 없을 때\n\n라인업 셋 중 우리 집 정답은?\n· 에이븐 360 실링팬 방등 — 89,000원 (방등 자리 그대로)\n· 에어리프 LED 실링팬 — 180,000원 (조명 포함)\n· 글로윈 날개없는 실링팬 — 221,000원 (아이 방 안심)\n\n설치가 걱정이라면 비츠 딜리버리(배달+설치 한 번에)로 해결하세요.\n여름 실링팬 기획전은 프로필 링크에서 👉 @vittz_official\n\n#실링팬 #실링팬방등 #천장선풍기 #여름인테리어 #냉방비절약 #비츠조명 #조명맛집 #인테리어조명 #집꾸미기 #신혼집인테리어","slideImages":["cards/vittz/test-ig-ceilingfan-1.png","cards/vittz/test-ig-ceilingfan-2.png","cards/vittz/test-ig-ceilingfan-3.png","cards/vittz/test-ig-ceilingfan-4.png","cards/vittz/test-ig-ceilingfan-5.png","cards/vittz/test-ig-ceilingfan-6.png"],"status":"planned"},{"id":"test-ig-standard60","topic":"LED 방등","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-08-04T09:00:00.000Z","kicker":"비츠 · 제품 노트","headline":"여러분 방등,\u003cbr>몇 년째 *그대로*인가요?","sub":"5년 넘었다면 오늘 카드를 저장해 두세요 — 1만원대로 끝나는 이야기입니다.","dayLabel":"제품 노트 · 디테일","cardImage":"cards/vittz/test-ig-standard60-1.png","captionNote":"제품 개별 디테일 화법(스탠다드 60W). 첫 장 연차 질문 인터랙션 + 저장 유도.","captionBody":"여러분 방등, 몇 년째 그대로인가요? 🙋\n\n'예전보다 어두워진 것 같다' 싶으면 LED 수명이 다해가는 신호예요.\n댓글로 우리 집 방등 연차를 알려주세요 — 5년 이상이면 오늘 글을 저장!\n\n비츠 스탠다드 LED 방등 60W를 디테일하게 뜯어봤습니다\n· 가격 13,200원 — 스탠다드 라인이라 부담이 없어요\n· 오스람 정품 LED 모듈 — 가격은 낮춰도 부품은 정품\n· 플리커프리 — 미세 깜빡임 없이 눈이 편한 빛 (아이 방도 안심)\n· 방 3~4평 기준 50~60W가 표준 밝기입니다\n\n셀프 교체하실 땐 꼭 차단기를 내리고 작업하세요.\n번거로우면 비츠 딜리버리(배달+설치)로 한 번에 끝낼 수 있어요.\n\n제품 보러 가기 👉 프로필 링크 @vittz_official\n\n#방등 #LED방등 #방등교체 #조명교체 #플리커프리 #비츠조명 #자취방꾸미기 #신혼집인테리어 #집꾸미기 #조명추천","slideImages":["cards/vittz/test-ig-standard60-1.png","cards/vittz/test-ig-standard60-2.png","cards/vittz/test-ig-standard60-3.png","cards/vittz/test-ig-standard60-4.png","cards/vittz/test-ig-standard60-5.png"],"status":"planned"},{"id":"test-blog-livingroom","topic":"거실등","format":"블로그","channels":["naver-blog"],"scheduledFor":"2026-08-05T09:00:00.000Z","kicker":"카테고리 가이드","headline":"거실등 교체 비용, 얼마면 될까? 고르는 법까지 총정리 (2026)","dayLabel":"테스트 · 카테고리","cardImage":"cards/vittz/test-blog-livingroom-1.png","captionNote":"카테고리(거실등) 화법. 가을 교체 성수기(검색 2.3배) 선점 SEO. 도입부 공감 질문 인터랙션.","captionBody":"# 거실등 교체 비용, 얼마면 될까? 고르는 법까지 총정리 (2026)\n\n어느 날 문득 '우리 거실, 예전보다 어두워진 것 같은데?' 하고 느낀 적 있으세요? 소파도 그대로, 벽지도 그대로인데 집이 칙칙해 보인다면 — 범인은 대부분 천장의 거실등입니다. LED도 소모품이라 5~7년이 지나면 밝기가 눈에 띄게 떨어지거든요. 오늘은 거실등을 바꾸려는 분들이 가장 많이 묻는 두 가지, '얼마가 드는지'와 '뭘 골라야 하는지'를 한 번에 정리했습니다.\n\n## 1. 우리 거실엔 몇 W가 필요할까\n\n| 거실 크기 | 권장 밝기 | 비고 |\n|---|---|---|\n| 20평대 아파트 거실 | 120~150W | 가장 흔한 선택 구간 |\n| 30평대 아파트 거실 | 150~180W | 간접조명 병행 시 하한도 OK |\n| 40평대 이상·거실 확장형 | 180W~ | 2등 분리형도 고려 |\n\n![](blog/test-blog-livingroom/fig-1.png)\n\n와트는 '전기를 쓰는 양'이지만 LED에서는 사실상 밝기의 기준으로 통해요. 지금 등이 어둡게 느껴진다면 한 단계 위 와트로 가는 것이 후회가 없습니다.\n\n## 2. 요즘 거실등, 세 갈래에서 고르면 됩니다\n\n**① 엣지·면조명형** — 두께가 얇아 천장이 높아 보이고, 빛이 면 전체에서 고르게 퍼집니다. 미니멀·모던 인테리어와 잘 맞아요.\n**② 디자인 거실등** — 우드·라탄·미드센추리 스타일로 거실의 인상 자체를 바꾸고 싶을 때. 조명이 곧 인테리어 소품이 됩니다.\n**③ 실링팬 결합형** — 여름 냉방 보조와 조명을 하나로. 에어컨 설정온도를 2~3도 아껴주는 실속형입니다.\n\n체크리스트 세 가지만 확인하세요: 플리커프리(눈 피로), 색온도 변환(주광·주백·전구색), KC 인증 여부.\n\n![](blog/test-blog-livingroom/fig-2.png)\n\n## 3. 우리 거실에 바로 거는 비츠 거실등 3\n**① 비츠 스탠다드 LED 거실등 180W — 93,500원** (30평대 표준)\n![](products/vittz/living180.jpg)\n오스람 정품 모듈에 플리커프리. 30평대 거실의 기준값입니다. → https://smartstore.naver.com/main/products/6161180398\n\n**② 비츠 스탠다드 LED 거실등 120W (B타입) — 56,100원** (20평대·서브 공간)\n![](products/vittz/living120.jpg)\n20평대 거실이나 넓은 안방까지. 가격 대비 밝기가 정확합니다. → https://smartstore.naver.com/main/products/6182158024\n\n**③ LED 에이븐 360 실링팬 방등 45W — 89,000원** (여름 실속형)\n![](products/vittz/aven360.jpg)\n조명+실링팬 결합형. 에어컨 설정온도 2~3도를 아껴주는 여름 거실의 정답. → https://www.vittz.co.kr/index.html?branduid=1100005865\n\n## 4. 비용, 솔직하게 말씀드리면\n\n제품값은 스탠다드 라인 기준 2만~5만 원대, 디자인·대형 라인은 10만~18만 원대가 중심입니다. 여기에 설치를 맡기면 설치비가 별도로 붙는데, 비츠는 배달과 설치를 한 번에 해결하는 '비츠 딜리버리'를 운영하고 있어 따로 기사님을 수소문할 필요가 없습니다. 주문 다음날 설치가 필요하면 제트 딜리버리도 있어요. 온라인 최저가 보상제가 있으니 가격 비교 부담도 덜 수 있습니다.\n\n## 오늘의 요약\n\n1. 거실등은 20평대 120~150W, 30평대 150~180W가 기준\n2. 엣지형·디자인형·실링팬 결합형 세 갈래에서 우리 집 우선순위로 선택\n3. 제품 2만~18만 원대 + 설치는 딜리버리로 한 번에\n\n⚠️ 셀프 교체를 하신다면 반드시 차단기를 내리고 작업하세요. 감전과 낙상 사고가 가장 많은 작업이 천장 조명입니다.\n\n거실등 전체 라인업은 비츠조명 공식몰에서 확인해 보세요 → https://www.vittz.co.kr/","slideImages":["cards/vittz/test-blog-livingroom-1.png"],"status":"planned"},{"id":"test-blog-midcentury","topic":"미드센추리 조명","format":"블로그","channels":["naver-blog"],"scheduledFor":"2026-08-06T09:00:00.000Z","kicker":"테마 큐레이션","headline":"카페 같은 거실 만들기 — 미드센추리 조명 스타일링 5가지","dayLabel":"테스트 · 테마·컨셉","cardImage":"cards/vittz/test-blog-midcentury-1.png","captionNote":"테마·컨셉(미드센추리·카페 무드) 큐레이션 화법. OV 라인 연결. 도입부 공감 질문.","captionBody":"# 카페 같은 거실 만들기 — 미드센추리 조명 스타일링 5가지\n\n주말에 다녀온 카페는 그렇게 아늑했는데, 우리 집 거실은 왜 사무실 같을까요? 답부터 말씀드리면 — 가구가 아니라 빛의 차이입니다. 카페는 천장 형광등 대신 낮게 내려온 펜던트와 전구색 포인트 조명으로 공간을 만들거든요. 오늘은 1950~60년대 감성의 미드센추리 조명으로 '카페 같은 거실'을 만드는 다섯 가지 방법을 정리했습니다.\n\n## ① 식탁 위엔 펜던트를 낮게\n\n미드센추리 무드의 절반은 펜던트가 만듭니다. 식탁 위 60~80cm까지 과감하게 내려보세요.\n\n**OV-PL006 머큐리 펜던트 — 170,000원 (비츠 오리지널)**\n![](products/vittz/mercury.jpg)\n금속 셰이드의 곡선이 살아있는 비츠 OV 라인의 대표작. 조명 하나가 오브제가 됩니다. → https://www.vittz.co.kr/index.html?branduid=1100005342\n\n## ② 천장등은 어둡게, 포인트는 밝게\n\n카페 무드의 공식은 '전체는 은은하게, 필요한 곳만 밝게'입니다. 거실등은 한 단계 어두운 톤이나 조도 조절형으로 두고, 소파 옆 테이블 조명·플로어 스탠드로 빛의 웅덩이를 만들어 주세요.\n\n## ③ 색온도는 전구색(3000K)으로 통일\n\n공간이 카페처럼 느껴지지 않는 가장 흔한 이유가 색온도 혼용입니다. 거실 전체를 전구색 계열로 통일하면 그 순간부터 사진 톤이 달라져요. 삼색변환 제품이면 낮에는 주백색, 저녁엔 전구색으로 바꿔 쓸 수 있습니다.\n\n**입문이라면 — 글로렌 유리갓 펜던트 50,000원 · 에디스 펜던트 49,000원**\n![](products/vittz/gloren.jpg)\n![](products/vittz/edis.jpg)\n5만원대로 카페 무드를 시작할 수 있는 빈티지 유리갓 라인. → https://smartstore.naver.com/main/products/11606206850\n\n## ④ 벽등으로 빛의 레이어 만들기\n\n벽면에 하나만 달아도 공간의 입체감이 살아납니다. 패브릭 셰이드나 골드 컬러 벽등이면 미드센추리 감성과 특히 잘 어울려요.\n\n## ⑤ 테이블 조명은 '켜두는 소품'\n\n머큐리 테이블 조명 같은 미드센추리 디자인 테이블 램프는 꺼져 있을 때도 오브제, 켜지면 무드메이커입니다. TV 옆·콘솔 위 한 곳이면 충분해요.\n\n![](blog/test-blog-midcentury/fig-1.png)\n\n## 마무리\n\n다섯 가지 중 하나만 바꿔도 거실의 공기가 달라집니다. 순서를 추천하면 ③색온도 통일 → ①펜던트 → ⑤테이블 조명이 가성비가 가장 좋아요. 비츠 OV 라인은 어디서도 보지 못한 비츠만의 오리지널 디자인 시리즈로, 공식몰에서 전 라인을 볼 수 있습니다 → https://www.vittz.co.kr/\n\n![](blog/test-blog-midcentury/fig-2.png)\n\n⚠️ 펜던트·벽등 설치 시에는 차단기를 내리고 작업하시고, 위치 이동이 필요한 시공은 비츠 딜리버리로 안전하게 진행하세요.","slideImages":["cards/vittz/test-blog-midcentury-1.png"],"status":"planned"}],"channels":[{"key":"instagram","label":"인스타그램","icon":"📸","active":true,"published":[],"pending":[{"id":"test-ig-ceilingfan","topic":"실링팬","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-08-03T09:00:00.000Z","kicker":"비츠 · 여름 시선","headline":"에어컨만으론 부족한 밤,\u003cbr>*실링팬*이 답일까요?","sub":"우리 집은 어느 쪽인가요 — 댓글로 알려주세요. 실링팬파 🙋 서큘레이터파 🙌","dayLabel":"여름 시선 · 시의성","cardImage":"cards/vittz/test-ig-ceilingfan-1.png","captionNote":"시의성(여름 피크 7~8월, 데이터랩 실링팬 지수 100) 큐레이션. 첫 장 투표형 인터랙션.","captionBody":"열대야에 에어컨 설정온도만 계속 내리고 계신가요? 🌙\n\n오늘은 투표 하나로 시작할게요 — 우리 집 여름 공기 담당,\n실링팬파 🙋 vs 서큘레이터파 🙌 댓글로 알려주세요!\n\n실링팬이 답이 되는 순간 3가지\n1. 에어컨 냉기를 방 전체로 '섞어' 설정온도 2~3도를 아껴줄 때\n2. 겨울엔 역회전으로 천장의 따뜻한 공기를 내려보낼 때 (사계절 가전!)\n3. 방등 자리에 그대로 — 조명+팬 결합형 '실링팬 방등'이라면 타공 걱정도 없을 때\n\n라인업 셋 중 우리 집 정답은?\n· 에이븐 360 실링팬 방등 — 89,000원 (방등 자리 그대로)\n· 에어리프 LED 실링팬 — 180,000원 (조명 포함)\n· 글로윈 날개없는 실링팬 — 221,000원 (아이 방 안심)\n\n설치가 걱정이라면 비츠 딜리버리(배달+설치 한 번에)로 해결하세요.\n여름 실링팬 기획전은 프로필 링크에서 👉 @vittz_official\n\n#실링팬 #실링팬방등 #천장선풍기 #여름인테리어 #냉방비절약 #비츠조명 #조명맛집 #인테리어조명 #집꾸미기 #신혼집인테리어","slideImages":["cards/vittz/test-ig-ceilingfan-1.png","cards/vittz/test-ig-ceilingfan-2.png","cards/vittz/test-ig-ceilingfan-3.png","cards/vittz/test-ig-ceilingfan-4.png","cards/vittz/test-ig-ceilingfan-5.png","cards/vittz/test-ig-ceilingfan-6.png"],"status":"planned"},{"id":"test-ig-standard60","topic":"LED 방등","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-08-04T09:00:00.000Z","kicker":"비츠 · 제품 노트","headline":"여러분 방등,\u003cbr>몇 년째 *그대로*인가요?","sub":"5년 넘었다면 오늘 카드를 저장해 두세요 — 1만원대로 끝나는 이야기입니다.","dayLabel":"제품 노트 · 디테일","cardImage":"cards/vittz/test-ig-standard60-1.png","captionNote":"제품 개별 디테일 화법(스탠다드 60W). 첫 장 연차 질문 인터랙션 + 저장 유도.","captionBody":"여러분 방등, 몇 년째 그대로인가요? 🙋\n\n'예전보다 어두워진 것 같다' 싶으면 LED 수명이 다해가는 신호예요.\n댓글로 우리 집 방등 연차를 알려주세요 — 5년 이상이면 오늘 글을 저장!\n\n비츠 스탠다드 LED 방등 60W를 디테일하게 뜯어봤습니다\n· 가격 13,200원 — 스탠다드 라인이라 부담이 없어요\n· 오스람 정품 LED 모듈 — 가격은 낮춰도 부품은 정품\n· 플리커프리 — 미세 깜빡임 없이 눈이 편한 빛 (아이 방도 안심)\n· 방 3~4평 기준 50~60W가 표준 밝기입니다\n\n셀프 교체하실 땐 꼭 차단기를 내리고 작업하세요.\n번거로우면 비츠 딜리버리(배달+설치)로 한 번에 끝낼 수 있어요.\n\n제품 보러 가기 👉 프로필 링크 @vittz_official\n\n#방등 #LED방등 #방등교체 #조명교체 #플리커프리 #비츠조명 #자취방꾸미기 #신혼집인테리어 #집꾸미기 #조명추천","slideImages":["cards/vittz/test-ig-standard60-1.png","cards/vittz/test-ig-standard60-2.png","cards/vittz/test-ig-standard60-3.png","cards/vittz/test-ig-standard60-4.png","cards/vittz/test-ig-standard60-5.png"],"status":"planned"}],"stats":{"publishedCount":0,"pendingCount":2,"avgEngagement":0,"trend":"n/a","totalViews":0,"totalLikes":0},"series":[]},{"key":"threads","label":"스레드","icon":"🧵","active":true,"published":[],"pending":[],"stats":{"publishedCount":0,"pendingCount":0,"avgEngagement":0,"trend":"n/a","totalViews":0,"totalLikes":0},"series":[]},{"key":"naver-blog","label":"네이버 블로그","icon":"📝","active":true,"published":[],"pending":[{"id":"test-blog-livingroom","topic":"거실등","format":"블로그","channels":["naver-blog"],"scheduledFor":"2026-08-05T09:00:00.000Z","kicker":"카테고리 가이드","headline":"거실등 교체 비용, 얼마면 될까? 고르는 법까지 총정리 (2026)","dayLabel":"테스트 · 카테고리","cardImage":"cards/vittz/test-blog-livingroom-1.png","captionNote":"카테고리(거실등) 화법. 가을 교체 성수기(검색 2.3배) 선점 SEO. 도입부 공감 질문 인터랙션.","captionBody":"# 거실등 교체 비용, 얼마면 될까? 고르는 법까지 총정리 (2026)\n\n어느 날 문득 '우리 거실, 예전보다 어두워진 것 같은데?' 하고 느낀 적 있으세요? 소파도 그대로, 벽지도 그대로인데 집이 칙칙해 보인다면 — 범인은 대부분 천장의 거실등입니다. LED도 소모품이라 5~7년이 지나면 밝기가 눈에 띄게 떨어지거든요. 오늘은 거실등을 바꾸려는 분들이 가장 많이 묻는 두 가지, '얼마가 드는지'와 '뭘 골라야 하는지'를 한 번에 정리했습니다.\n\n## 1. 우리 거실엔 몇 W가 필요할까\n\n| 거실 크기 | 권장 밝기 | 비고 |\n|---|---|---|\n| 20평대 아파트 거실 | 120~150W | 가장 흔한 선택 구간 |\n| 30평대 아파트 거실 | 150~180W | 간접조명 병행 시 하한도 OK |\n| 40평대 이상·거실 확장형 | 180W~ | 2등 분리형도 고려 |\n\n![](blog/test-blog-livingroom/fig-1.png)\n\n와트는 '전기를 쓰는 양'이지만 LED에서는 사실상 밝기의 기준으로 통해요. 지금 등이 어둡게 느껴진다면 한 단계 위 와트로 가는 것이 후회가 없습니다.\n\n## 2. 요즘 거실등, 세 갈래에서 고르면 됩니다\n\n**① 엣지·면조명형** — 두께가 얇아 천장이 높아 보이고, 빛이 면 전체에서 고르게 퍼집니다. 미니멀·모던 인테리어와 잘 맞아요.\n**② 디자인 거실등** — 우드·라탄·미드센추리 스타일로 거실의 인상 자체를 바꾸고 싶을 때. 조명이 곧 인테리어 소품이 됩니다.\n**③ 실링팬 결합형** — 여름 냉방 보조와 조명을 하나로. 에어컨 설정온도를 2~3도 아껴주는 실속형입니다.\n\n체크리스트 세 가지만 확인하세요: 플리커프리(눈 피로), 색온도 변환(주광·주백·전구색), KC 인증 여부.\n\n![](blog/test-blog-livingroom/fig-2.png)\n\n## 3. 우리 거실에 바로 거는 비츠 거실등 3\n**① 비츠 스탠다드 LED 거실등 180W — 93,500원** (30평대 표준)\n![](products/vittz/living180.jpg)\n오스람 정품 모듈에 플리커프리. 30평대 거실의 기준값입니다. → https://smartstore.naver.com/main/products/6161180398\n\n**② 비츠 스탠다드 LED 거실등 120W (B타입) — 56,100원** (20평대·서브 공간)\n![](products/vittz/living120.jpg)\n20평대 거실이나 넓은 안방까지. 가격 대비 밝기가 정확합니다. → https://smartstore.naver.com/main/products/6182158024\n\n**③ LED 에이븐 360 실링팬 방등 45W — 89,000원** (여름 실속형)\n![](products/vittz/aven360.jpg)\n조명+실링팬 결합형. 에어컨 설정온도 2~3도를 아껴주는 여름 거실의 정답. → https://www.vittz.co.kr/index.html?branduid=1100005865\n\n## 4. 비용, 솔직하게 말씀드리면\n\n제품값은 스탠다드 라인 기준 2만~5만 원대, 디자인·대형 라인은 10만~18만 원대가 중심입니다. 여기에 설치를 맡기면 설치비가 별도로 붙는데, 비츠는 배달과 설치를 한 번에 해결하는 '비츠 딜리버리'를 운영하고 있어 따로 기사님을 수소문할 필요가 없습니다. 주문 다음날 설치가 필요하면 제트 딜리버리도 있어요. 온라인 최저가 보상제가 있으니 가격 비교 부담도 덜 수 있습니다.\n\n## 오늘의 요약\n\n1. 거실등은 20평대 120~150W, 30평대 150~180W가 기준\n2. 엣지형·디자인형·실링팬 결합형 세 갈래에서 우리 집 우선순위로 선택\n3. 제품 2만~18만 원대 + 설치는 딜리버리로 한 번에\n\n⚠️ 셀프 교체를 하신다면 반드시 차단기를 내리고 작업하세요. 감전과 낙상 사고가 가장 많은 작업이 천장 조명입니다.\n\n거실등 전체 라인업은 비츠조명 공식몰에서 확인해 보세요 → https://www.vittz.co.kr/","slideImages":["cards/vittz/test-blog-livingroom-1.png"],"status":"planned"},{"id":"test-blog-midcentury","topic":"미드센추리 조명","format":"블로그","channels":["naver-blog"],"scheduledFor":"2026-08-06T09:00:00.000Z","kicker":"테마 큐레이션","headline":"카페 같은 거실 만들기 — 미드센추리 조명 스타일링 5가지","dayLabel":"테스트 · 테마·컨셉","cardImage":"cards/vittz/test-blog-midcentury-1.png","captionNote":"테마·컨셉(미드센추리·카페 무드) 큐레이션 화법. OV 라인 연결. 도입부 공감 질문.","captionBody":"# 카페 같은 거실 만들기 — 미드센추리 조명 스타일링 5가지\n\n주말에 다녀온 카페는 그렇게 아늑했는데, 우리 집 거실은 왜 사무실 같을까요? 답부터 말씀드리면 — 가구가 아니라 빛의 차이입니다. 카페는 천장 형광등 대신 낮게 내려온 펜던트와 전구색 포인트 조명으로 공간을 만들거든요. 오늘은 1950~60년대 감성의 미드센추리 조명으로 '카페 같은 거실'을 만드는 다섯 가지 방법을 정리했습니다.\n\n## ① 식탁 위엔 펜던트를 낮게\n\n미드센추리 무드의 절반은 펜던트가 만듭니다. 식탁 위 60~80cm까지 과감하게 내려보세요.\n\n**OV-PL006 머큐리 펜던트 — 170,000원 (비츠 오리지널)**\n![](products/vittz/mercury.jpg)\n금속 셰이드의 곡선이 살아있는 비츠 OV 라인의 대표작. 조명 하나가 오브제가 됩니다. → https://www.vittz.co.kr/index.html?branduid=1100005342\n\n## ② 천장등은 어둡게, 포인트는 밝게\n\n카페 무드의 공식은 '전체는 은은하게, 필요한 곳만 밝게'입니다. 거실등은 한 단계 어두운 톤이나 조도 조절형으로 두고, 소파 옆 테이블 조명·플로어 스탠드로 빛의 웅덩이를 만들어 주세요.\n\n## ③ 색온도는 전구색(3000K)으로 통일\n\n공간이 카페처럼 느껴지지 않는 가장 흔한 이유가 색온도 혼용입니다. 거실 전체를 전구색 계열로 통일하면 그 순간부터 사진 톤이 달라져요. 삼색변환 제품이면 낮에는 주백색, 저녁엔 전구색으로 바꿔 쓸 수 있습니다.\n\n**입문이라면 — 글로렌 유리갓 펜던트 50,000원 · 에디스 펜던트 49,000원**\n![](products/vittz/gloren.jpg)\n![](products/vittz/edis.jpg)\n5만원대로 카페 무드를 시작할 수 있는 빈티지 유리갓 라인. → https://smartstore.naver.com/main/products/11606206850\n\n## ④ 벽등으로 빛의 레이어 만들기\n\n벽면에 하나만 달아도 공간의 입체감이 살아납니다. 패브릭 셰이드나 골드 컬러 벽등이면 미드센추리 감성과 특히 잘 어울려요.\n\n## ⑤ 테이블 조명은 '켜두는 소품'\n\n머큐리 테이블 조명 같은 미드센추리 디자인 테이블 램프는 꺼져 있을 때도 오브제, 켜지면 무드메이커입니다. TV 옆·콘솔 위 한 곳이면 충분해요.\n\n![](blog/test-blog-midcentury/fig-1.png)\n\n## 마무리\n\n다섯 가지 중 하나만 바꿔도 거실의 공기가 달라집니다. 순서를 추천하면 ③색온도 통일 → ①펜던트 → ⑤테이블 조명이 가성비가 가장 좋아요. 비츠 OV 라인은 어디서도 보지 못한 비츠만의 오리지널 디자인 시리즈로, 공식몰에서 전 라인을 볼 수 있습니다 → https://www.vittz.co.kr/\n\n![](blog/test-blog-midcentury/fig-2.png)\n\n⚠️ 펜던트·벽등 설치 시에는 차단기를 내리고 작업하시고, 위치 이동이 필요한 시공은 비츠 딜리버리로 안전하게 진행하세요.","slideImages":["cards/vittz/test-blog-midcentury-1.png"],"status":"planned"}],"stats":{"publishedCount":0,"pendingCount":2,"avgEngagement":0,"trend":"n/a","totalViews":0,"totalLikes":0},"series":[]},{"key":"blogger","label":"구글 블로그","icon":"🅱️","active":true,"published":[],"pending":[],"stats":{"publishedCount":0,"pendingCount":0,"avgEngagement":0,"trend":"n/a","totalViews":0,"totalLikes":0},"series":[]},{"key":"youtube","label":"유튜브","icon":"▶️","active":true,"published":[],"pending":[],"stats":{"publishedCount":0,"pendingCount":0,"avgEngagement":0,"trend":"n/a","totalViews":0,"totalLikes":0},"series":[]}],"channelLinks":[{"k // ── 운영 기간 선택 (전역 상태) ──
let period = { key:'all', from:null, to:null };
function periodRange(){
  if(period.key==='all') return null;
  const now=new Date(); let from,to;
  if(period.key==='7d'){ to=now; from=new Date(now.getTime()-6*864e5); }
  else if(period.key==='14d'){ to=now; from=new Date(now.getTime()-13*864e5); }
  else if(period.key==='30d'){ to=now; from=new Date(now.getTime()-29*864e5); }
  else if(period.key==='month'){ from=new Date(now.getFullYear(),now.getMonth(),1); to=now; }
  else if(period.key==='prev'){ from=new Date(now.getFullYear(),now.getMonth()-1,1); to=new Date(now.getFullYear(),now.getMonth(),0); }
  else if(period.key==='custom'){
    if(!period.from&&!period.to) return null;
    from=period.from?new Date(period.from):new Date(0);
    to=period.to?new Date(period.to):now;
  } else return null;
  const f=new Date(from); f.setHours(0,0,0,0);
  const t=new Date(to); t.setHours(23,59,59,999);
  return [f.getTime(), t.getTime()];
}
function inPeriod(s){ const r=periodRange(); if(!r) return true; if(!s) return false; const t=new Date(s).getTime(); return t>=r[0]&&t<=r[1]; }
function periodLabel(){
  const names={all:'전체 기간','7d':'최근 7일','14d':'최근 14일','30d':'최근 30일',month:'이번 달',prev:'지난 달',custom:'직접 선택'};
  const r=periodRange();
  const d=x=>new Date(x).toISOString().slice(0,10);
  return names[period.key]+(r?' ('+d(r[0])+' ~ '+d(r[1])+')':'');
}

function sparkline(arr){
  if(!arr||arr.length<2) return '';
  const w=160,h=34,mx=Math.max(...arr,1),mn=Math.min(...arr,0);
  const dx=w/(arr.length-1);
  const pts=arr.map((v,i)=>[i*dx,h-((v-mn)/(mx-mn||1))*(h-6)-3]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  return '<svg class="spark" width="'+w+'" height="'+h+'"><path d="'+d+'" fill="none" stroke="#2b6fff" stroke-width="2"/></svg>';
}

// 네이버 붙여넣기용 평문(마크다운 기호 제거, 이미지 위치는 마커로)
function plainPostText(it){
  let n=0;
  return String(it.captionBody||'').split('\n').map(line=>{
    const t=line.trim();
    const img=t.match(/^!\[([^\]]*)\]\(([^)]+)\)$/);
    if(img){ n++; return '\n[📷 이미지'+n+' 삽입]\n'; }
    if(t.startsWith('## ')) return '\n■ '+t.slice(3);
    if(t.startsWith('# ')) return t.slice(2);
    if(t==='>'||t.startsWith('> ')) return t.replace(/^>\s?/,'');
    return line.replace(/\*\*([^*]+)\*\*/g,'$1');
  }).join('\n').replace(/\n{3,}/g,'\n\n').trim();
}
function flash(id,msg){ const b=document.getElementById(id); if(b){const o=b.textContent;b.textContent=msg;setTimeout(()=>b.textContent=o,1500);} }

function mdInline(x){ return esc(x).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>'); }
function fmtCaption(s){
  return String(s||'').split('\n').map(line=>{
    const t=line.trim();
    const img=t.match(/^!\[([^\]]*)\]\(([^)]+)\)$/);
    if(img) return '<img class="md-img" src="'+esc(img[2])+'" alt="'+esc(img[1])+'" loading="lazy"/>';
    if(t.startsWith('## ')) return '<h4 class="md-h">'+mdInline(t.slice(3))+'</h4>';
    if(t.startsWith('# ')) return '<h3 class="md-h1">'+mdInline(t.slice(2))+'</h3>';
    if(t==='>'||t.startsWith('> ')) return '<div class="md-quote">'+mdInline(t.replace(/^>\s?/,''))+'</div>';
    if(t.indexOf('🔖')===0) return '<div class="md-tags">'+esc(t)+'</div>';
    if(/^\[.+\]$/.test(t)) return '<div class="md-tag">'+esc(t)+'</div>';
    if(t==='---'||t==='') return '<div class="md-sp"></div>';
    return '<div>'+mdInline(line)+'</div>';
  }).join('');
}

          : (iss.length ? '<span class="treq done" title="수정요청 전부 처리완료">✅</span>' : '');
    }
    return '<button class="tab'+(t.key===ch?' on':'')+'" onclick="setCh(\''+t.key+'\')">'+t.icon+' '+t.label+(t.key!=='all'&&!t.noDot?'<span class="dot '+(t.active?'live':'off')+'"></span>':'')+req+'</button>';
  }).join('');
}
function renderView(){
  const c=DATA.clients[ci];
  document.getElementById('view').innerHTML = ch==='all'?overview(c):(ch==='guide'?guideView(c):(ch==='research'?researchView(c):channelDetail(c,c.channels.find(x=>x.key===ch))));
  document.getElementById('gen').textContent = ftime(DATA.generatedAt)+' (UTC)';
}
function setClient(i){ci=i;ch='all';renderClients();renderTabs();renderView();window.scrollTo(0,0);}
function setCh(k){ch=k;renderTabs();renderView();window.scrollTo(0,0);}
try {
  renderClients(); renderTabs(); renderView(); loadIssues();
} catch (e) {
  var v = document.getElementById('view');
  if (v) v.innerHTML = '<div style="padding:24px;line-height:1.7;color:#b91c1c">표시 중 오류: '
    + ((e && e.message) || e)
    + '<br><br><button onclick="location.reload(true)" style="padding:10px 16px;border-radius:8px;border:0;background:#2b6fff;color:#fff;font-size:15px">새로고침</button></div>';
}
</script>
</body>
</html>
