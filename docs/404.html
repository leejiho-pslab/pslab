<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>P.S.LAB — 페이지 이동</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- 없는 경로(옛 북마크·삭제된 페이지)로 들어와도 404 대신 관제실로 안내한다.
     예: /pslab/home/ (2026-06 제거된 잔여 경로) -->
<style>
  body{font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:#f6f8fb;color:#1c2333;
       display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;text-align:center}
  .box{padding:36px;line-height:1.8}
  a{color:#2b6fff;font-weight:700;text-decoration:none}
</style>
<script>
  // 3초 후 관제실로 자동 이동 (즉시 이동하면 주소를 확인할 틈이 없다)
  setTimeout(function(){ location.replace('/pslab/'); }, 3000);
</script>
</head>
<body>
<div class="box">
  <div style="font-size:44px">🛰️</div>
  <h1 style="font-size:22px;margin:10px 0 6px">이 주소에는 페이지가 없습니다</h1>
  <p style="color:#6a7284;margin:0 0 14px">주소가 바뀌었거나 삭제된 페이지예요.<br>3초 뒤 <b>ALWAYS ON 콘텐츠 관제실</b>로 자동 이동합니다.</p>
  <p><a href="/pslab/">지금 바로 이동 →</a></p>
</div>
</body>
</html>
