klyReport":null,"brandBrief":{"analysis":"비츠(VITTZ)는 '인테리어의 모든 것'을 표방하는 조명 기반 토탈 인테리어 플랫폼. 가성비 '비츠 스탠다드'부터 자체 디자인 OV 라인(미드센추리), 수입 하이엔드까지 풀 가격대 조명 포트폴리오를 갖추고 실링팬·커튼/블라인드·타일/바스·침구로 확장 중. 배달+설치 '비츠 딜리버리', 익일 설치 '제트 딜리버리', 무료 견적, 조명 이사 서비스, 3D AR 미리보기가 핵심 차별화. 오스람/삼성 정품 LED·플리커프리·KC인증·국내제작이 일관된 품질 소구. 소비자만족지수 1위 이력 보유, 브랜드 검색량은 국내 조명몰 최상위권으로 연중 안정적. 핵심 고객은 집을 소유/관리하는 30~50대 남녀(균형형).","direction":"①9~10월 조명교체 성수기(검색량 최대 2.3배) 직전인 8월에 발행 리듬을 확립하고 가을 시즌 검색 수요를 블로그 SEO로 선점한다. ②자사 유튜브에서 검증된 '30초 셀프 설치 하우투' 쇼츠(9.2만 조회)를 주력 포맷으로 확대한다. ③여름엔 실링팬(7월 피크), 겨울엔 무드등·간접조명, 신학기엔 학습 스탠드 등 데이터랩 계절성에 소재를 정렬한다. ④조명 구매 고객에게 커튼·타일·침구 등 확장 카테고리를 교차 노출한다. ⑤딜리버리 설치 경험담과 무료 견적 등 서비스 차별화를 스토리로 반복 노출한다.","sensibility":"페르소나는 '우리 집 조명을 잘 아는 친절한 전문가 이웃'. 존댓말·짧은 문장·실행형 마무리(~해보세요). 웜 미니멀 비주얼 — 저녁 시간대 따뜻한 전구빛 무드, 과채도 금지, 기존 인스타 피드 무드와 연속성 유지. 제목에는 가격(1만원대)·시간(5분)·스펙(60W, 삼색변환) 등 구체적 숫자를 쓴다. 셀프 시공 콘텐츠에는 '차단기를 내리고 작업하세요' 안전 고지 1줄 필수. 효능 과장·경쟁사 비방·확정되지 않은 AS/보증 표현 금지.","updatedAt":"2026-07-17T13:00:00+09:00","log":[{"at":"2026-07-17T13:00:00+09:00","field":"analysis","excerpt":"사전 조사(research/01~05 문서) 기반 초기 시드 — 감도조율 단계에서 담당자 확인 후 갱신 예정"}]},"channelGuides":{"instagram":{"topics":["거실 조명 비포애프터","주방 식탁등 스타일링","침실 무드 조명 연출","주광색 vs 전구색 비교","플리커프리가 중요한 이유","비츠 딜리버리 설치 후기","OV 라인 디자인 스토리","실링팬 방등 여름 활용","가을 조명 교체 체크리스트","3D AR로 조명 미리 배치하기"],"guide":"캐러셀 6장 표준: ①공간 무드컷+헤드라인(텍스트 30% 이하) ②문제 공감 ③해결 제품 ④연출 팁 ⑤스펙 요약(색온도·와트) ⑥고정 CTA. 제품컷 나열 금지 — 공간과 변화를 보여줄 것. 웜 미니멀(전구빛 3000K 무드), 기존 피드와 톤 연속성 유지. 요일 시리즈: 월 공간별 / 수 지식카드 / 금 비츠라서 / 일 시즌. 해시태그 8~12개(대형 3+중형 5+브랜드 2). 저장을 부르는 '보관용 정보' 구성 우선. 셀프 시공 언급 시 안전 고지 1줄 필수.","updatedAt":"2026-07-17T15:00:00+09:00"},"threads":{"topics":["조명 한 줄 꿀팁","하얀 불 vs 노란 불 취향 질문","설치 기사님 에피소드","전구색이 잠에 좋은 이유","이사 전 조명 체크 3가지"],"guide":"'조명 가게 사장님의 혼잣말' 톤 — 완성형 광고 문구 금지, 사람처럼 말하기. 포맷 3종 로테이션: ①한 줄 팁+2줄 설명 ②질문 유도(댓글 목적) ③비하인드(딜리버리/매장 일상). 3~5줄 이내, 이미지 1장. 인스타 캐러셀 소재의 텍스트 재가공으로 제작.","updatedAt":"2026-07-17T15:00:00+09:00"},"naver-blog":{"topics":["거실등 교체 비용과 방법","방등 셀프 교체 가이드","주방등 밝기 와트 계산  첫 자동발행 (준비물은 아래 오픈 가이드 참고)","채널별 콘텐츠 가이드·우선 주제는 **🧭 지침 탭**에 시드해 두었습니다 — 언제든 수정하면 다음 생성 사이클부터 자동 반영됩니다"],"links":[{"label":"오픈 가이드 (담당자용 계정 연결 준비물)","url":"https://github.com/leejiho-pslab/pslab/blob/main/data/clients/vittz/오픈-가이드.md"}]}],"sources":[{"label":"📁 전체 조사 문서 (research/01~08)","url":"https://github.com/leejiho-pslab/pslab/tree/main/data/clients/vittz/research"},{"label":"비츠 공식몰","url":"https://www.vittz.co.kr/"},{"label":"인스타그램","url":"https://www.instagram.com/vittz_official"},{"label":"네이버 블로그","url":"https://blog.naver.com/vittzlighting"},{"label":"유튜브","url":"https://www.youtube.com/channel/UCqfOTULeIeIurfRY-DXEoyw"},{"label":"네이버 키워드 도구","url":"https://ads.naver.com/manage/ad-accounts/2006250/sa/tool/keyword-planner"},{"label":"네이버 데이터랩","url":"https://datalab.naver.com/keyword/trendSearch.naver"}]},"keywordVolumes":null}]};
const REPO = DATA.repo;
let ci = 0, ch = 'all';
// ── 운영 기간 선택 (전역 상태) ──
let period = { key:'all', from:null, to:null };
function periodRange(){
  if(period.key==='all') return null;
  const now=new Date(); let from,to;
  if(period.key==='7d'){ to=now; from=new Date(now.getTime()-6*864e5); }
  else if(period.key==='14d'){ to=now; from=new Date(now.getTime()-13*864e5); }
  else if(period.key==='30d'){ to=now; from=new Date(now.getTime()-29*864e5); }
  else if(period.key==='month'){ from=new Date(now.getFullYear(),now.getMonth(),1); to=now; }
  else if(period.key==='prev'){ from=new Date(now.getFullYear(),now.getMonth()-1,1); to=new Date(now.getFullYear(),now.getMonth(),0); }
  else if(period.key==='custom'){
    if(!period.from&&!period.to) return null;
    from=period.from?new Date(period.from):new Date(0);
    to=period.to?new Date(period.to):now;
  } else return null;
  const f=new Date(from); f.setHours(0,0,0,0);
  const t=new Date(to); t.setHours(23,59,59,999);
  return [f.getTime(), t.getTime()];
}
function inPeriod(s){ const r=periodRange(); if(!r) return true; if(!s) return false; const t=new Date(s).getTime(); return t>=r[0]&&t<=r[1]; }
function periodLabel(){
  const names={all:'전체 기간','7d':'최근 7일','14d':'최근 14일','30d':'최근 30일',month:'이번 달',prev:'지난 달',custom:'직접 선택'};
  const r=periodRange();
  const d=x=>new Date(x).toISOString().slice(0,10);
  return names[period.key]+(r?' ('+d(r[0])+' ~ '+d(r[1])+')':'');
}
function periodBar(){
  const b=(k,l)=>'<button class="pbtn'+(period.key===k?' on':'')+'" onclick="setPeriod(\''+k+'\')">'+l+'</button>';
  return '<div class="panel pbar"><span class="pbar-t">📆 운영 기간</span>'+
    b('all','전체')+b('7d','최근 7일')+b('14d','최근 14일')+b('30d','최근 30일')+b('month','이번 달')+b('prev','지난 달')+
    '<span class="pbar-c">직접 선택 <input type="date" id="pfrom" value="'+(period.from||'')+'" onchange="setCustom()"/> ~ <input type="date" id="pto" value="'+(period.to||'')+'" onchange="setCustom()"/></span>'+
    '<span class="muted" style="margin-left:auto">'+periodLabel()+'</span></div>';
}
function setPeriod(k){ period.key=k; renderView(); }
function setCustom(){
  period.key='custom';
  period.from=(document.getElementById('pfrom')||{}).value||null;
  period.to=(document.getElementById('pto')||{}).value||null;
  renderView();
}
// ── 수정요청 (깃허브 이슈 연동: [수정요청·채널키] 제목 규약) ──
let ISSUES=null; // null=로딩중, []=없음/실패
const REQ_RE=/^\[수정요청·([a-z-]+)\]\s*(.*)$/;
function channelIssues(key){ return (ISSUES||[]).filter(x=>x.chKey===key); }
function loadIssues(){
  fetch('https://api.github.com/repos/'+REPO+'/issues?state=all&per_page=100&sort=created&direction=desc')
    .then(r=>r.ok?r.json():[])
    .then(arr=>{
      ISSUES=(Array.isArray(arr)?arr:[]).filter(x=>!x.pull_request).map(x=>{
        const m=REQ_RE.exec(x.title||''); if(!m) return null;
        return { chKey:m[1], titleClean:m[2]||x.title, state:x.state, html_url:x.html_url, created_at:x.created_at, closed_at:x.closed_at };
      }).filter(Boolean);
      renderTabs(); renderView();
    })
    .catch(()=>{ ISSUES=[]; });
}
function reqStatus(x){ return x.state==='closed' ? '<span class="badge b-ok">✅ 처리완료</span>' : '<span class="badge b-wait">🛠 처리중</span>'; }
function requestsPanel(key, chLabel){
  const list=channelIssues(key);
  const open=list.filter(x=>x.state!=='closed').length;
  let h='<div class="panel" style="border-color:#d9c2ee;background:#fcfaff"><div class="sect-h" style="margin:0 0 10px"><h3>✏️ 수정요청 게시판 · '+esc(chLabel)+'</h3><span class="muted">'+(ISSUES===null?'불러오는 중…':('🛠 처리중 '+open+'건 · 총 '+list.length+'건'))+'</span></div>';
  if(list.length){
    h+='<table><tr><th style="width:92px">상태</th><th>요청 내용</th><th style="width:100px">등록일</th><th style="width:52px"></th></tr>'+
      list.map(x=>'<tr><td>'+reqStatus(x)+'</td><td>'+esc(x.titleClean)+'</td><td class="muted">'+String(x.created_at||'').slice(0,10)+'</td><td><a href="'+esc(x.html_url)+'" target="_blank">보기↗</a></td></tr>').join('')+'</table>';
  } else if(ISSUES!==null){
    h+='<div class="empty" style="padding:8px">아직 등록된 수정요청이 없습니다. 아래에 바로 작성해 보세요.</div>';
  }
  h+='<div style="margin-top:12px"><textarea id="reqtext-'+esc(key)+'" class="reqta" rows="3" placeholder="수정하고 싶은 내용을 적어주세요. 예) 3번 카드 문구를 더 짧게 / 커버 이미지 톤을 밝게 / 해시태그에 #청담맛집 추가"></textarea>'+
    '<div style="display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap"><button class="btn fb" onclick="submitReq(\''+esc(key)+'\',\''+esc(chLabel)+'\')">✏️ 수정요청 등록</button>'+
    '<span class="muted">등록을 누르면 깃허브 창이 열립니다 — 초록색 “Submit new issue” 버튼만 누르면 접수 완료. 처리 상태는 이 게시판에 자동 표시됩니다.</span></div></div></div>';
  return h;
}
// ── 지침(브랜드 노트 + 채널 가이드) — AI 상시 학습 입력 창구 ──
const BRAND_FIELDS=[
  {k:'분석', f:'analysis', label:'🔍 브랜드 분석', ph:'우리 브랜드는 어떤 브랜드인지, 강점·차별점·고객이 우리를 찾는 이유를 적어주세요.'},
  {k:'방향성', f:'direction', label:'🧭 방향성 의견', ph:'앞으로 콘텐츠가 가야 할 방향, 밀고 싶은 메시지, 하지 말아야 할 것을 적어주세요.'},
  {k:'감도', f:'sensibility', label:'🎨 콘텐츠 감도', ph:'원하는 톤·비주얼 무드를 적어주세요. 예) 과장 없이 차분하게, 사진은 웜톤, 이모지 최소화'}
];
function guideNote(){
  return '<div class="muted" style="margin:2px 0 14px">여기 적은 내용은 자동으로 반영됩니다 — 등록 → 깃허브 창에서 제출 → 몇 분 내 시스템에 저장되어 <b>다음 콘텐츠 생성부터 프롬프트·소재 선정에 적용</b>됩니다. (이슈가 자동으로 닫히면 반영 완료)</div>';
}
function submitGuidance(title, bodyPrefix, taId){
  const ta=document.getElementById(taId);
  const txt=(ta&&ta.value.trim())||'';
  if(!txt){ alert('내용을 먼저 적어주세요.'); return; }
  window.open(issue(title, bodyPrefix+txt), '_blank');
  if(ta) ta.value='';
}
function guideView(client){
  let h='<div class="sect-h"><h2>🧭 지침 — AI가 상시 학습하는 브랜드 노트·채널 가이드</h2></div>'+guideNote();
  // 브랜드 노트 3종
  h+='<div class="panel" style="border-color:#c9d8f0;background:#f8fbff"><h3>🏷 브랜드 노트</h3>';
  const bb=client.brandBrief||{};

function sparkline(arr){
  if(!arr||arr.length<2) return '';
  const w=160,h=34,mx=Math.max(...arr,1),mn=Math.min(...arr,0);
  const dx=w/(arr.length-1);
  const pts=arr.map((v,i)=>[i*dx,h-((v-mn)/(mx-mn||1))*(h-6)-3]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  return '<svg class="spark" width="'+w+'" height="'+h+'"><path d="'+d+'" fill="none" stroke="#2b6fff" stroke-width="2"/></svg>';
}

// 네이버 붙여넣기용 평문(마크다운 기호 제거, 이미지 위치는 마커로)
function plainPostText(it){
  let n=0;
  return String(it.captionBody||'').split('\n').map(line=>{
    const t=line.trim();
    const img=t.match(/^!\[([^\]]*)\]\(([^)]+)\)$/);
    if(img){ n++; return '\n[📷 이미지'+n+' 삽입]\n'; }
    if(t.startsWith('## ')) return '\n■ '+t.slice(3);
    if(t.startsWith('# ')) return t.slice(2);
    if(t==='>'||t.startsWith('> ')) return t.replace(/^>\s?/,'');
    return line.replace(/\*\*([^*]+)\*\*/g,'$1');
  }).join('\n').replace(/\n{3,}/g,'\n\n').trim();
}
function flash(id,msg){ const b=document.getElementById(id); if(b){const o=b.textContent;b.textContent=msg;setTimeout(()=>b.textContent=o,1500);} }
function copyPost(id){
  const it=(DATA.clients[ci].planCards||[]).find(x=>x.id===id); if(!it) return;
  navigator.clipboard.writeText(plainPostText(it)).then(()=>flash('copybtn-'+id,'✅ 복사됨!')).catch(()=>alert('복사 실패 — 본문을 길게 눌러 직접 복사하세요.'));

// 블로그/대본 등 본문의 가벼운 마크다운(## 소제목, [HOOK] 등)을 보기 좋게
function mdInline(x){ return esc(x).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>'); }
function fmtCaption(s){
  return String(s||'').split('\n').map(line=>{
    const t=line.trim();
    const img=t.match(/^!\[([^\]]*)\]\(([^)]+)\)$/);
    if(img) return '<img class="md-img" src="'+esc(img[2])+'" alt="'+esc(img[1])+'" loading="lazy"/>';
    if(t.startsWith('## ')) return '<h4 class="md-h">'+mdInline(t.slice(3))+'</h4>';
    if(t.startsWith('# ')) return '<h3 class="md-h1">'+mdInline(t.slice(2))+'</h3>';
    if(t==='>'||t.startsWith('> ')) return '<div class="md-quote">'+mdInline(t.replace(/^>\s?/,''))+'</div>';

function blogSection(client){
  const b=client.blog;
  if(!b) return '';
  const core=b.core||b.trends||[];
  if(!core.length) return '';
  // 천단위 콤마 (정규식 없이 — 클라 템플릿리터럴 이스케이프 함정 회피)
  const fmt=function(n){ n=Math.round(n||0); var s=String(n),o='',c=0; for(var i=s.length-1;i>=0;i--){o=s[i]+o; if(++c%3===0&&i>0)o=','+o;} return o; };
  const isV2=core.some(function(t){return t.total!=null||t.pc!=null;});
  const compBadge=function(cc){ if(!cc) return ''; var col=cc==='높음'?'#e2503f':(cc==='중간'?'#c08a2a':'#3a8f5a'); return '<span style="color:'+col+'">●</span> '+esc(cc); };
  // 한 시트(표) 렌더 — 검색량順 top20
  const sheet=function(title,sub,rows){
    if(!rows||!rows.length) return '';
    var max=Math.max.apply(null,[1].concat(rows.map(function(t){return t.total||0;})));
    var h='<div style="margin-top:14px"><div class="sect-h" style="margin:0 0 6px"><h3 style="font-size:15px">'+title+'</h3><span class="muted" style="font-size:12px">'+sub+' · '+rows.length+'개</span></div>';
    h+='<div style="max-height:340px;overflow:auto;border:1px solid #eee;border-radius:8px"><table><tr><th>키워드</th><th>월검색수</th><th>PC·모바일</th><th>경쟁</th><th></th></tr>'+
      rows.map(function(t){ var v=t.total||0; var w=Math.round(v/max*100);
        return '<tr><td>#'+esc(t.kw)+'</td><td><b>'+fmt(v)+'</b></td><td class="muted" style="font-size:12px">'+fmt(t.pc)+' · '+fmt(t.mobile)+'</td><td style="font-size:12px">'+compBadge(t.comp)+'</td><td style="width:24%"><div class="bar"><i style="width:'+w+'%"></i></div></td></tr>';
      }).join('')+'</table></div></div>';
    return h;
  };
  let h='<div class="panel">';
  h+='<div class="sect-h" style="margin:0 0 6px"><h3>📊 '+(isV2?'네이버 월간 검색량 · 키워드 기반 기획':'네이버 검색 관심도')+'</h3><span class="muted">'+esc(b.trendMeta||'')+'</span></div>';
  if(isV2){
    if(b.baseDate) h+='<div class="muted" style="font-size:12px;margin:0 0 4px">📅 기준일 <b>'+esc(b.baseDate)+'</b> · '+esc(b.updateCycle||'매주 금요일')+' 자동 갱신 · 검색량順 = 기획 우선순위</div>';
    h+=sheet('🎯 핵심 키워드','브랜드 최상위 연관',b.core||core);
    h+=sheet('🔗 연관 키워드','핵심에서 파생·관련도 높음',b.related);
    h+=sheet('🗓️ 시의성 키워드','시즌·이슈 연결',b.timely);
    return h+'</div>';
  }
  // v1 폴백 (데이터랩 상대지수)
  var vals=core.map(function(t){return t.index==null?0:t.index;});
  var max1=Math.max.apply(null,[1].concat(vals));
  h+='<table><tr><th>키워드</th><th>상대 관심도</th><th></th></tr>'+
    core.map(function(t){
      var v=t.index==null?0:t.index; var w=Math.round(v/max1*100);
      var disp=t.index==null?'데이터 부족':(t.index<1?'<1':String(t.index));
      return '<tr><td>#'+esc(t.kw)+'</td><td>'+disp+'</td><td style="width:46%"><div class="bar"><i style="width:'+w+'%"></i></div></td></tr>';
    }).join('')+'</table></div>';
  return h;
}

    '<div style="display:flex;gap:12px;flex-wrap:wrap">'+cards+'</div></div>';
}
// ── 리서치 탭 — 브랜드·시장 학습 요약 (data/<id>/research.json) ──
function rstat(s){return '<div class="kpi"><div class="v">'+esc(s.v)+'</div><div class="l">'+esc(s.l)+'</div></div>';}
function rchart(c){
  const vals=c.items.map(function(i){return i.value||0;});
  const max=c.max||Math.max.apply(null,vals)||1;
  return '<div class="rchart"><div class="rchart-t">'+esc(c.title)+(c.unit?' <span class="muted">('+esc(c.unit)+')</span>':'')+'</div>'+
    c.items.map(function(i){
      const w=Math.max(2,Math.round((i.value||0)/max*100));
      return '<div class="rbar-row" title="'+esc(i.hint||i.label)+'"><div class="rbar-l">'+esc(i.label)+'</div>'+
        '<div class="rbar-t"><div class="rbar-f'+(i.accent?' acc':'')+'" style="width:'+w+'%"></div></div>'+
        '<div class="rbar-v">'+esc(String(i.value))+'</div></div>';
    }).join('')+'</div>';
}
function researchSection(s){
  let h='<div class="panel rsec" id="rs-'+esc(s.id)+'"><h3>'+(s.icon?esc(s.icon)+' ':'')+esc(s.title)+'</h3>';
  if(s.summary) h+='<div class="rsum">'+mdInline(s.summary)+'</div>';
  if(s.stats&&s.stats.length) h+='<div class="kpis" style="margin:10px 0 6px">'+s.stats.map(rstat).join('')+'</div>';
  if(s.bullets&&s.bullets.length) h+='<ul class="rlist">'+s.bullets.map(function(b){return '<li>'+mdInline(b)+'</li>';}).join('')+'</ul>';
  if(s.charts&&s.charts.length) h+=s.charts.map(rchart).join('');
  if(s.table) h+='<div style="overflow-x:auto;margin-top:8px"><table><tr>'+s.table.head.map(function(x){return '<th>'+esc(x)+'</th>';}).join('')+'</tr>'+
    s.table.rows.map(function(r){return '<tr>'+r.map(function(cell){return '<td>'+mdInline(cell)+'</td>';}).join('')+'</tr>';}).join('')+'</table></div>';
  if(s.tags&&s.tags.length) h+='<div style="margin-top:8px">'+s.tags.map(function(t){return '<span class="tag">'+esc(t)+'</span>';}).join('')+'</div>';
  if(s.links&&s.links.length) h+='<div class="rlinks">'+s.links.map(function(l){return '<a class="btn" target="_blank" rel="noopener" href="'+esc(l.url)+'">🔗 '+esc(l.label)+'</a>';}).join('')+'</div>';
  return h+'</div>';
}
function researchView(client){
  const r=client.research;
  if(!r||!r.sections||!r.sections.length) return '<div class="empty">리서치 요약이 아직 없습니다. data/clients/'+esc(client.id)+'/research.json 에 채워 넣으면 이 탭에 표시됩니다.</div>';
  let h='<div class="sect-h"><h2>📚 리서치 — 브랜드·시장 학습 요약</h2></div>';
  if(r.intro) h+='<div class="panel" style="background:#f8fbff;border-color:#c4d6f4"><div class="rsum" style="margin:0">'+mdInline(r.intro)+'</div>'+
    (r.updatedAt?'<div class="muted" style="margin-top:6px;font-size:12px">업데이트: '+esc(String(r.updatedAt).slice(0,10))+'</div>':'')+'</div>';
  h+='<div class="panel" style="padding:10px 14px;margin-top:12px">'+r.sections.map(function(s){return '<a class="tag" href="#rs-'+esc(s.id)+'">'+(s.icon?esc(s.icon)+' ':'')+esc(s.title)+'</a>';}).join(' ')+'</div>';
  h+=r.sections.map(researchSection).join('');
  h+=kwVolumesPanel(client);
  if(r.sources&&r.sources.length) h+='<div class="panel rsec"><h3>🔗 원본 문서·확인 링크</h3><div class="rlinks">'+
    r.sources.map(function(l){return '<a class="btn" target="_blank" rel="noopener" href="'+esc(l.url)+'">'+esc(l.label)+'</a>';}).join('')+'</div></div>';
  return h;
}
function fmtN(n){ return (n==null||isNaN(n))?'-':Number(n).toLocaleString('ko-KR'); }
function compBadge(c){
  if(!c) return '<span class="muted">-</span>';
  var cls=c==='높음'?'b-hold':(c==='중간'?'b-wait':'b-ok');
  return '<span class="badge '+cls+'">'+esc(c)+'</span>';
}
// 실측 월간검색수 — 네이버 검색광고 API(keywordstool) 수집분. 없으면 연동 안내.
function kwVolumesPanel(client){
  const kv=client.keywordVolumes;
  let h='<div class="panel rsec" id="rs-kwvol"><h3>📊 실측 월간검색수 — 네이버 키워드 도구</h3>';
  if(!kv||!kv.requested||!kv.requested.length){
    h+='<div class="rsum">아직 <b>실측 데이터가 비어 있습니다.</b> 위 차트의 수치는 데이터랩 <b>상대지수(추세 비교용)</b>이며 절대 검색량이 아닙니다. 실제 월간검색수는 검색광고 API 연동 후 이 자리에 자동 표시됩니다.</div>'+
      '<ul class="rlist">'+
      '<li>광고주센터 → 도구 → <b>API 사용 관리</b>에서 액세스라이선스·비밀키 발급</li>'+
      '<li>GitHub Secrets에 <b>NAVER_SEARCHAD_API_KEY / NAVER_SEARCHAD_API_SECRET / NAVER_SEARCHAD_CUSTOMER_ID</b> 등록 (CUSTOMER_ID는 광고주센터 주소의 ad-accounts/ 뒤 숫자)</li>'+
      '<li>Actions에서 <b>keyword volumes</b> 워크플로 실행 → 배치표 40개 키워드의 월간검색수(PC/모바일)·경쟁정도·연관키워드가 자동 수집됩니다</li>'+
      '</ul>'+
      '<div class="rlinks"><a class="btn" target="_blank" rel="noopener" href="https://github.com/'+REPO+'/settings/secrets/actions">🔗 Secrets 설정 열기</a>'+
      '<a class="btn" target="_blank" rel="noopener" href="https://github.com/'+REPO+'/actions">🔗 Actions 열기</a></div></div>';
    return h;
  }
  const items=kv.requested;
  const max=Math.max.apply(null,items.map(function(i){return i.total||0;}))||1;
  h+='<div class="muted" style="margin-bottom:8px">수집 '+esc(String(kv.updatedAt||'').slice(0,10))+' · '+esc(kv.source||'')+'</div>';
  h+='<div class="rchart"><div class="rchart-t">월간검색수 상위 (PC+모바일 합계)</div>'+
    items.slice(0,12).map(function(i){
      const w=Math.max(2,Math.round((i.total||0)/max*100));
      return '<div class="rbar-row" title="PC '+fmtN(i.pc)+' · 모바일 '+fmtN(i.mobile)+'"><div class="rbar-l">'+esc(i.keyword)+'</div>'+
        '<div class="rbar-t"><div class="rbar-f" style="width:'+w+'%"></div></div>'+
        '<div class="rbar-v" style="width:70px">'+fmtN(i.total)+'</div></div>';
    }).join('')+'</div>';
  h+='<div style="overflow-x:auto;margin-top:10px"><table><tr><th>키워드</th><th>월간검색수 PC</th><th>모바일</th><th>합계</th><th>경쟁정도</th><th>월평균노출 광고수</th></tr>'+
    items.map(function(i){
      return '<tr><td><b>'+esc(i.keyword)+'</b></td><td>'+fmtN(i.pc)+'</td><td>'+fmtN(i.mobile)+'</td><td><b>'+fmtN(i.total)+'</b></td><td>'+compBadge(i.compIdx)+'</td><td>'+fmtN(i.plAvgDepth)+'</td></tr>';
    }).join('')+'</table></div>';
  if(kv.related&&kv.related.length){
    h+='<div class="rchart-t" style="margin-top:12px">🔎 연관키워드 발굴 상위 '+Math.min(20,kv.related.length)+' (소재 후보)</div><div>'+
      kv.related.slice(0,20).map(function(i){return '<span class="tag" title="월간검색수 '+fmtN(i.total)+' · 경쟁 '+esc(i.compIdx||'-')+'">'+esc(i.keyword)+' '+fmtN(i.total)+'</span>';}).join('')+'</div>';
  }
  return h+'</div>';
}
function overview(client){
  let h=tokenBanner(client);
  h+=channelLinksPanel(client);
  h+=weekPlanPanel(client);
  h+=weeklyPanel(client);
  h+=periodBar();
  h+='<div class="kpis">'+
    kpi(client.totalCycles,'총 사이클')+
    kpi(client.totalPublished,'총 발행')+
    kpi(client.heldCount,'승인 대기',client.heldCount>0)+
    kpi('v'+client.designVersion,'디자인 진화')+'</div>';
  h+=learningPanel(client);
  h+='<div class="panel"><h3>채널별 요약</h3><table><tr><th>채널</th><th>상태</th><th>발행</th><th>대기</th><th>평균 참여율</th><th>수정요청</th></tr>'+
    client.channels.map(c=>{const lab=(DATA.channels.find(x=>x.key===c.key)||{});
      const iss=channelIssues(c.key); const openN=iss.filter(x=>x.state!=='closed').length;
      const reqCell=iss.length?(openN?'<span class="badge b-wait">🛠 처리중 '+openN+'</span>':'<span class="badge b-ok">✅ 완료 '+iss.length+'</span>'):'<span class="muted">-</span>';
      return '<tr><td>'+lab.icon+' '+lab.label+'</td><td>'+(c.active?'<span class="badge b-ok">연결</span>':'<span class="badge b-hold">미연결</span>')+'</td><td>'+c.stats.publishedCount+'</td><td>'+c.stats.pendingCount+'</td><td>'+pct(c.stats.avgEngagement)+' '+tIcon(c.stats.trend)+'</td><td>'+reqCell+'</td></tr>';}).join('')+'</table></div>';
  // 발행 전 콘텐츠 기획안 — 메인에는 발행 전(예정·수동대기)만 보여준다
  const plan=client.planCards||[];
  const pre=plan.filter(p=>p.status!=='published');
  const fbTitle='['+client.name+'] 기획안 전체 피드백';
  const fbBody='이번 달 기획안에 대한 의견/수정사항을 적어주세요.\n\n';
  const mon=new Date(DATA.generatedAt).getMonth()+1;
  h+='<div class="sect-h"><h2>🕓 '+mon+'월 발행 전 콘텐츠 ('+pre.length+')</h2><a class="btn fb" href="'+issue(fbTitle,fbBody)+'" target="_blank">✏️ 기획안 피드백</a></div>';
  if(!pre.length){ h+='<div class="empty">발행 전 콘텐츠가 없습니다. 다음 사이클에 자동 생성됩니다.</div>'; }
  else {
    for(const chDef of DATA.channels){
      const items=pre.filter(p=>(p.channels||[]).includes(chDef.key));
      if(!items.length) continue;
      const lab=chDef.icon+' '+chDef.label;
      h+='<div class="chgrp"><div class="chgrp-h">'+lab+' <span class="muted">'+items.length+'건 · '+esc((items[0].format)||'')+'</span></div>'+
         '<div class="cards">'+items.map(p=>planCard(client,chDef.label,p)).join('')+'</div></div>';
    }
  }
  // 선택한 기간의 발행 게시물 (기획 발행분 + 사이클 발행분)
  const planPub=plan.filter(p=>p.status==='published'&&inPeriod(p.publishedAt||p.scheduledFor))
    .sort((a,b)=>String(b.publishedAt||'').localeCompare(String(a.publishedAt||'')));
  const recent=[].concat(...client.channels.map(c=>c.published)).filter(p=>inPeriod(p.time))
    .sort((a,b)=>(b.time||'').localeCompare(a.time||'')).slice(0,12);
  h+='<div class="sect-h"><h2>✅ 발행된 게시물 · '+periodLabel()+' ('+(planPub.length+recent.length)+')</h2></div>';
  const pubCards=planPub.map(p=>{
    const chDef=DATA.channels.find(x=>x.key===((p.channels||[])[0]))||{label:''};
    return planCard(client,chDef.label,p);
  }).concat(recent.map(p=>publishedCard(p,'<span class="badge b-ok">발행</span>')));
  h+= pubCards.length?'<div class="cards">'+pubCards.join('')+'</div>':'<div class="empty">이 기간에 발행된 게시물이 없습니다.</div>';
  // 경쟁사
  h+='<div class="panel" style="margin-top:16px"><h3>벤치마킹 경쟁사</h3><div>'+(client.competitors.length?client.competitors.map(x=>'<span class="tag">@'+esc(x)+'</span>').join(''):'<span class="muted">미설정</span>')+'</div></div>';
  // 채널 연결 상황(압축) — 최하단
  h+=setupPanel();
  return h;
}
function kpi(v,l,accent){return '<div class="kpi"><div class="v'+(accent?' accent':'')+'">'+v+'</div><div class="l">'+l+'</div></div>';}
function renderClients(){
  document.getElementById('clients').innerHTML = DATA.clients.length>1 ? DATA.clients.map((c,i)=>'<button class="cbtn'+(i===ci?' on':'')+'" onclick="setClient('+i+')">'+esc(c.name)+'</button>').join('') : '';
}
function renderTabs(){
  const c=DATA.clients[ci];
  const tabs=[{key:'all',label:'전체',icon:'🏠',active:true}]
    .concat(c.channels.map(cc=>({key:cc.key,label:cc.label,icon:cc.icon,active:cc.active})))
    .concat(c.research&&c.research.sections&&c.research.sections.length?[{key:'research',label:'리서치',icon:'📚',active:true,noDot:true}]:[])
    .concat([{key:'guide',label:'지침',icon:'🧭',active:true,noDot:true}]);
  document.getElementById('tabs').innerHTML = tabs.map(t=>{
    // 수정요청 진행상황 아이콘 — 🛠 처리중 n건 / ✅ 전부 처리완료
    let req='';
    if(t.key!=='all'){
      const iss=channelIssues(t.key);
      const openN=iss.filter(x=>x.state!=='closed').length;
      req = openN ? '<span class="treq open" title="수정요청 처리중 '+openN+'건">🛠'+openN+'</span>'
          : (iss.length ? '<span class="treq done" title="수정요청 전부 처리완료">✅</span>' : '');
    }
    return '<button class="tab'+(t.key===ch?' on':'')+'" onclick="setCh(\''+t.key+'\')">'+t.icon+' '+t.label+(t.key!=='all'&&!t.noDot?'<span class="dot '+(t.active?'live':'off')+'"></span>':'')+req+'</button>';
  }).join('');
}
function renderView(){
  const c=DATA.clients[ci];
  document.getElementById('view').innerHTML = ch==='all'?overview(c):(ch==='guide'?guideView(c):(ch==='research'?researchView(c):channelDetail(c,c.channels.find(x=>x.key===ch))));
  document.getElementById('gen').textContent = ftime(DATA.generatedAt)+' (UTC)';
}
function setClient(i){ci=i;ch='all';renderClients();renderTabs();renderView();window.scrollTo(0,0);}
function setCh(k){ch=k;renderTabs();renderView();window.scrollTo(0,0);}
try {
  renderClients(); renderTabs(); renderView(); loadIssues();
} catch (e) {
  var v = document.getElementById('view');
  if (v) v.innerHTML = '<div style="padding:24px;line-height:1.7;color:#b91c1c">표시 중 오류: '
    + ((e && e.message) || e)
    + '<br><br><button onclick="location.reload(true)" style="padding:10px 16px;border-radius:8px;border:0;background:#2b6fff;color:#fff;font-size:15px">새로고침</button></div>';
}
</script>
</body>
</html>
