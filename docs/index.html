는 기대입니다.\n\n대행이 잘하는 건 “실행의 효율”입니다. 같은 예산으로 더 정교하게, 더 빠르게.\n하지만 “팔리는 상품”과 “살 이유”를 만드는 건 결국 브랜드의 몫이에요.\n\n이 경계가 정렬되지 않으면, 대행도 광고주도 둘 다 지칩니다.\n맡기기 전에 “우리가 책임질 것”부터 정하세요.\n\n#마케팅인사이트 #광고대행 #사업이야기","variant":"A"},{"id":"w1-fri","topic":"브랜딩","format":"카드뉴스","scheduledFor":"2026-07-03T10:00:00.000Z","kicker":"Brand Strategy","headline":"팔리는 브랜드는\u003cbr>‘무엇’이 아니라 *‘왜’*를 판다","sub":"작은 브랜드일수록 더 중요한 메시지 설계 이야기.","dayLabel":"금요일 · 브랜딩","cardImage":"cards/pslab/w1-fri.png","captionNote":"작은 브랜드일수록 더 중요한 메시지 설계 이야기.","captionBody":"사람들은 “무엇을 파는지”로 기억하지 않습니다. “왜 파는지”로 기억하죠.\n\n기능과 스펙은 경쟁사도 똑같이 말합니다. 차별은 “왜”에서 생깁니다.\n작은 브랜드일수록 더 그래요 — 자원이 적을수록 메시지가 무기니까.\n\n오늘 우리 브랜드의 “왜”를 한 문장으로 써보세요. 안 써지면, 그게 진짜 과제입니다.\n\n#브랜딩 #마케팅전략 #창업인사이트","variant":"A"},{"id":"w2-mon","topic":"마케팅전략","format":"카드뉴스","scheduledFor":"2026-07-06T10:00:00.000Z","kicker":"Decision","headline":"이 광고, 꺼야 할까?\u003cbr>판단하는 *숫자 하나*","sub":"감으로 끄지 마세요. 손익분기 한 줄 계산법.","dayLabel":"월요일 · 의사결정","cardImage":"cards/pslab/w2-mon.png","captionNote":"감으로 끄지 마세요. 손익분기 한 줄 계산법.","captionBody":"“이 광고 꺼야 하나, 더 둬야 하나” 감으로 정하지 마세요.\n\n판단은 숫자 하나로 충분합니다 — 손익분기 CPA.\n(객단가 × 마진율)이 허용 CPA입니다. 실제 CPA가 이걸 넘으면, 켤수록 적자.\n\n예) 객단가 5만 × 마진 40% = 허용 CPA 2만원. 지금 3만이면? 끄거나 고치세요.\n감이 아니라 선이 결정합니다.\n\n#퍼포먼스마케팅 #마케팅전략 #광고대행","variant":"B"},{"id":"w2-wed","topic":"퍼포먼스마케팅","format":"카드뉴스","scheduledFor":"2026-07-08T10:00:00.000Z","kicker":"Ad Ops","headline":"클릭은 느는데\u003cbr>매출이 *안 느는 이유*","sub":"클릭은 구매가 아닙니다. 전환이 새는 지점.","dayLabel":"수요일 · 광고운영","cardImage":"cards/pslab/w2-wed.png","captionNote":"클릭은 구매가 아닙니다. 전환이 새는 지점.","captionBody":"클릭은 느는데 매출은 그대로. 광고가 문제일까요?\n\n대개 아닙니다. 클릭은 “관심”이고 구매는 “확신”이에요. 둘 사이에서 새는 겁니다.\n랜딩의 첫 화면, 가격을 납득시키는 근거, 후기 같은 신뢰 장치 —\n이 중 하나만 약해도 클릭은 비용으로 끝납니다.\n\n광고를 더 돌리기 전에, 클릭 다음 화면부터 점검하세요.\n\n#퍼포먼스마케팅 #온라인마케팅 #전환율","variant":"B"},{"id":"w2-fri","topic":"창업인사이트","format":"카드뉴스","scheduledFor":"2026-07-10T10:00:00.000Z","kicker":"Startup","headline":"돈 없이 시작하는 마케팅,\u003cbr>*진짜 가능한가*","sub":"예산 0원부터 검증. 돈 쓰기 전에 할 것.","dayLabel":"금요일 · 창업","cardImage":"cards/pslab/w2-fri.png","captionNote":"예산 0원부터 검증. 돈 쓰기 전에 할 것.","captionBody":"“돈 없으면 마케팅 못 하죠” — 절반만 맞습니다.\n\n돈이 필요한 건 “확장”이고, “검증”은 거의 공짜로 가능합니다.\n콘텐츠 몇 개, DM 몇 통, 작은 설문으로 “살 사람이 있는지”부터 확인하세요.\n수요를 확인하기 전에 광고비부터 태우면, 빠르게 망하는 길입니다.\n\n돈은 검증된 다음에 붓는 겁니다.\n\n#창업인사이트 #사업이야기 #온라인마케팅","variant":"B"},{"id":"w3-mon","topic":"업계비하인드","format":"카드뉴스","scheduledFor":"2026-07-13T10:00:00.000Z","kicker":"Agency Behind","headline":"대행사가 절대\u003cbr>먼저 *말 안 해주는 것*","sub":"수수료 구조와 계약 전 꼭 물어야 할 질문.","dayLabel":"월요일 · 비하인드","cardImage":"cards/pslab/w3-mon.png","captionNote":"수수료 구조와 계약 전 꼭 물어야 할 질문.","captionBody":"대행사가 먼저 말 안 해주는 것들이 있습니다.\n\n- 수수료가 “매체비의 %”인지 “고정”인지에 따라 이해관계가 달라집니다.\n- 리포트의 “좋아 보이는 지표”와 “매출 지표”는 다릅니다.\n- 계약 전, 누가 무엇을 책임지는지 문서로 남기세요.\n\n나쁜 대행이라서가 아니라, 안 물으면 굳이 말 안 하는 구조라서예요.\n질문이 당신을 지킵니다.\n\n#광고대행 #마케팅인사이트 #업계비하인드","variant":"C"},{"id":"w3-wed","topic":"브랜딩","format":"카드뉴스","scheduledFor":"2026-07-15T10:00:00.000Z","kicker":"Brand Strategy","headline":"후기가 10개도 없는데\u003cbr>*광고부터* 돌린다고?","sub":"신뢰 자산 없이 광고를 태우면 새는 이유.","dayLabel":"수요일 · 브랜딩","cardImage":"cards/pslab/w3-wed.png","captionNote":"신뢰 자산 없이 광고를 태우면 새는 이유.","captionBody":"후기 10개도 없는데 광고부터 돌린다고요? 잠깐만요.\n\n광고는 “신뢰 위에” 부어야 효율이 납니다.\n신뢰 자산(후기·사용 사례·콘텐츠)이 비면, 들어온 트래픽이 그냥 빠져나가요.\n비싼 클릭으로 빈 그릇을 채우는 셈입니다.\n\n광고 예산의 일부를 먼저 “믿을 이유”를 쌓는 데 쓰세요. 순서가 효율을 만듭니다.\n\n#브랜딩 #마케팅전략 #온라인마케팅","variant":"C"},{"id":"w3-fri","topic":"마케팅인사이트","format":"카드뉴스","scheduledFor":"2026-07-17T10:00:00.000Z","kicker":"Marketing Insight","headline":"트렌드를 좇다 망한\u003cbr>브랜드들의 *공통점*","sub":"유행 추종과 본질. 트렌드를 제대로 쓰는 법.","dayLabel":"금요일 · 인사이트","cardImage":"cards/pslab/w3-fri.png","captionNote":"유행 추종과 본질. 트렌드를 제대로 쓰는 법.","captionBody":"트렌드를 좇다 사라진 브랜드들엔 공통점이 있습니다 — “왜”가 없었어요.\n\n유행은 “무엇”을 바꾸게 합니다. 하지만 본질(누구에게, 왜)이 없으면\n트렌드가 끝나는 순간 같이 끝납니다.\n\n트렌드는 “올라타는 것”이 아니라 “내 메시지를 실어 보내는 파도”입니다.\n좇지 말고, 태우세요.\n\n#마케팅인사이트 #온라인시장트렌드 #브랜딩","variant":"C"},{"id":"w4-mon","topic":"퍼포먼스마케팅","format":"카드뉴스","scheduledFor":"2026-07-20T10:00:00.000Z","kicker":"Ad Ops","headline":"예산의 *80%*를\u003cbr>어디에 써야 할까","sub":"테스트·확장·리타겟 배분 원칙.","dayLabel":"월요일 · 광고운영","cardImage":"cards/pslab/w4-mon.png","captionNote":"테스트·확장·리타겟 배분 원칙.","captionBody":"광고 예산, 어디에 얼마를 쓸지부터 틀리면 다 틀립니다.\n\n제 기준은 70-20-10입니다.\n- 70% 검증된 승자(확장)\n- 20% 새 타겟·소재 테스트\n- 10% 과감한 실험\n\n전부 “잘 되는 것”에 몰면 성장은 멈추고, 전부 “새것”에 걸면 돈이 셉니다.\n배분이 곧 전략입니다.\n\n#퍼포먼스마케팅 #광고대행 #마케팅전략","variant":"A"},{"id":"w4-wed","topic":"마케팅전략","format":"카드뉴스","scheduledFor":"2026-07-22T10:00:00.000Z","kicker":"Decision","headline":"대행을 맡길 때\u003cbr>vs *직접 할 때*","sub":"규모·역량·시간으로 보는 판단표.","dayLabel":"수요일 · 의사결정","cardImage":"cards/pslab/w4-wed.png","captionNote":"규모·역량·시간으로 보는 판단표.","captionBody":"대행을 맡길까, 직접 할까? 세 가지만 보세요.\n\n1. 규모 — 월 광고비가 인건비를 정당화하나요?\n2. 역량 — 내부에 “판단할 사람”이 있나요? (실행 말고 판단)\n3. 시간 — 배우며 할 6개월의 기회비용을 감당할 수 있나요?\n\n셋 다 “No”면 맡기고, “Yes”가 많으면 직접 + 부분 자문이 답입니다.\n정답은 없고, 상황만 있습니다.\n\n#광고대행 #마케팅전략 #사업이야기","variant":"A"},{"id":"w4-fri","topic":"사업이야기","format":"카드뉴스","scheduledFor":"2026-07-24T10:00:00.000Z","kicker":"Growth","headline":"매출이 정체됐을 때\u003cbr>가장 먼저 보는 *지표*","sub":"신규획득과 재구매, 어디가 막혔는지 진단.","dayLabel":"금요일 · 성장","cardImage":"cards/pslab/w4-fri.png","captionNote":"신규획득과 재구매, 어디가 막혔는지 진단.","captionBody":"매출이 정체됐을 때, 저는 광고부터 보지 않습니다. “어디가 막혔는지”부터 봅니다.\n\n- 신규는 들어오는데 안 사면 → 전환(상세·가격·신뢰)\n- 사는데 안 늘면 → 획득(채널·타겟)\n- 한 번 사고 안 오면 → 재구매(경험·CRM)\n\n막힌 곳이 다르면 처방도 다릅니다. 정체는 “광고 부족”이 아니라 “진단 부족”인 경우가 많아요.\n\n#사업이야기 #마케팅인사이트 #성장전략","variant":"A"}],"channels":[{"key":"instagram","label":"인스타그램","icon":"📸","active":true,"published":[{"topic":"온라인마케팅","time":"2026-06-25T13:40:06.315Z","imageUrl":"https://i.ibb.co/bgFmxyCH/680c27e00a8d.jpg","caption":"온라인마케팅에 대해 이야기해 볼게요.","url":"https://www.instagram.com/p/DaAsg05kj_n/","views":0,"likes":0,"comments":0,"engagementRate":0},{"topic":"온라인마케팅","time":"2026-06-25T13:09:58.908Z","imageUrl":"https://i.ibb.co/bjxKqrC7/315aa63bb230.jpg","caption":"온라인마케팅에 대해 이야기해 볼게요.","url":"https://www.instagram.com/p/DaApEYKE6Cr/","views":0,"likes":0,"comments":0,"engagementRate":0},{"topic":"온라인마케팅","time":"2026-06-25T12:42:58.071Z","imageUrl":"https://i.ibb.co/LwMY2nq/b961780986f0.jpg","caption":"온라인마케팅에 대해 이야기해 볼게요.","url":"https://instagram.com/p/ig_hewipimt_zgvd","views":0,"likes":0,"comments":0,"engagementRate":0.11063005983808519}],"pending":[{"id":"w1-mon","topic":"광고대행","format":"카드뉴스","scheduledFor":"2026-06-29T10:00:00.000Z","kicker":"Marketing Insight","headline":"광고비를 태우기 전에\u003cbr>반드시 점검할 *3가지*","sub":"15년간 대행하며 깨달은, 돈이 새는 지점부터 막는 법.","dayLabel":"월요일 · 인사이트","cardImage":"cards/pslab/w1-mon.png","captionNote":"15년간 대행하며 깨달은, 돈이 새는 지점부터 막는 법.","captionBody":"광고비, 켜기 전이 90%입니다.\n\n15년간 수백 개 계정을 만지며 깨달은 건 — 돈은 “운영”이 아니라 “준비”에서 샙니다.\n\n태우기 전 반드시 점검할 3가지\n1. 타겟 — “누구나”는 “아무도”입니다. 한 사람을 그리세요.\n2. 소재 — 첫 3초에 멈출 이유가 없으면 돈은 흐릅니다.\n3. 랜딩 — 클릭 다음 화면이 약하면 모든 클릭이 비용입니다.\n\n이 셋이 안 맞은 채 예산부터 올리는 순간, 적자는 정해집니다.\n\n#온라인마케팅 #광고대행 #퍼포먼스마케팅","variant":"A"},{"id":"w1-wed","topic":"업계비하인드","format":"카드뉴스","scheduledFor":"2026-07-01T10:00:00.000Z","kicker":"Agency Behind","headline":"대행사를 쓰면\u003cbr>매출이 오른다는 *착각*","sub":"대행이 할 수 있는 것과 없는 것, 솔직하게 말합니다.","dayLabel":"수요일 · 비하인드","cardImage":"cards/pslab/w1-wed.png","captionNote":"대행이 할 수 있는 것과 없는 것, 솔직하게 말합니다.","captionBody":"“대행 맡기면 알아서 매출 오르겠지” — 가장 많이 깨지는 기대입니다.\n\n대행이 잘하는 건 “실행의 효율”입니다. 같은 예산으로 더 정교하게, 더 빠르게.\n하지만 “팔리는 상품”과 “살 이유”를 만드는 건 결국 브랜드의 몫이에요.\n\n이 경계가 정렬되지 않으면, 대행도 광고주도 둘 다 지칩니다.\n맡기기 전에 “우리가 책임질 것”부터 정하세요.\n\n#마케팅인사이트 #광고대행 #사업이야기","variant":"A"},{"id":"w1-fri","topic":"브랜딩","format":"카드뉴스","scheduledFor":"2026-07-03T10:00:00.000Z","kicker":"Brand Strategy","headline":"팔리는 브랜드는\u003cbr>‘무엇’이 아니라 *‘왜’*를 판다","sub":"작은 브랜드일수록 더 중요한 메시지 설계 이야기.","dayLabel":"금요일 · 브랜딩","cardImage":"cards/pslab/w1-fri.png","captionNote":"작은 브랜드일수록 더 중요한 메시지 설계 이야기.","captionBody":"사람들은 “무엇을 파는지”로 기억하지 않습니다. “왜 파는지”로 기억하죠.\n\n기능과 스펙은 경쟁사도 똑같이 말합니다. 차별은 “왜”에서 생깁니다.\n작은 브랜드일수록 더 그래요 — 자원이 적을수록 메시지가 무기니까.\n\n오늘 우리 브랜드의 “왜”를 한 문장으로 써보세요. 안 써지면, 그게 진짜 과제입니다.\n\n#브랜딩 #마케팅전략 #창업인사이트","variant":"A"},{"id":"w2-mon","topic":"마케팅전략","format":"카드뉴스","scheduledFor":"2026-07-06T10:00:00.000Z","kicker":"Decision","headline":"이 광고, 꺼야 할까?\u003cbr>판단하는 *숫자 하나*","sub":"감으로 끄지 마세요. 손익분기 한 줄 계산법.","dayLabel":"월요일 · 의사결정","cardImage":"cards/pslab/w2-mon.png","captionNote":"감으로 끄지 마세요. 손익분기 한 줄 계산법.","captionBody":"“이 광고 꺼야 하나, 더 둬야 하나” 감으로 정하지 마세요.\n\n판단은 숫자 하나로 충분합니다 — 손익분기 CPA.\n(객단가 × 마진율)이 허용 CPA입니다. 실제 CPA가 이걸 넘으면, 켤수록 적자.\n\n예) 객단가 5만 × 마진 40% = 허용 CPA 2만원. 지금 3만이면? 끄거나 고치세요.\n감이 아니라 선이 결정합니다.\n\n#퍼포먼스마케팅 #마케팅전략 #광고대행","variant":"B"},{"id":"w2-wed","topic":"퍼포먼스마케팅","format":"카드뉴스","scheduledFor":"2026-07-08T10:00:00.000Z","kicker":"Ad Ops","headline":"클릭은 느는데\u003cbr>매출이 *안 느는 이유*","sub":"클릭은 구매가 아닙니다. 전환이 새는 지점.","dayLabel":"수요일 · 광고운영","cardImage":"cards/pslab/w2-wed.png","captionNote":"클릭은 구매가 아닙니다. 전환이 새는 지점.","captionBody":"클릭은 느는데 매출은 그대로. 광고가 문제일까요?\n\n대개 아닙니다. 클릭은 “관심”이고 구매는 “확신”이에요. 둘 사이에서 새는 겁니다.\n랜딩의 첫 화면, 가격을 납득시키는 근거, 후기 같은 신뢰 장치 —\n이 중 하나만 약해도 클릭은 비용으로 끝납니다.\n\n광고를 더 돌리기 전에, 클릭 다음 화면부터 점검하세요.\n\n#퍼포먼스마케팅 #온라인마케팅 #전환율","variant":"B"},{"id":"w2-fri","topic":"창업인사이트","format":"카드뉴스","scheduledFor":"2026-07-10T10:00:00.000Z","kicker":"Startup","headline":"돈 없이 시작하는 마케팅,\u003cbr>*진짜 가능한가*","sub":"예산 0원부터 검증. 돈 쓰기 전에 할 것.","dayLabel":"금요일 · 창업","cardImage":"cards/pslab/w2-fri.png","captionNote":"예산 0원부터 검증. 돈 쓰기 전에 할 것.","captionBody":"“돈 없으면 마케팅 못 하죠” — 절반만 맞습니다.\n\n돈이 필요한 건 “확장”이고, “검증”은 거의 공짜로 가능합니다.\n콘텐츠 몇 개, DM 몇 통, 작은 설문으로 “살 사람이 있는지”부터 확인하세요.\n수요를 확인하기 전에 광고비부터 태우면, 빠르게 망하는 길입니다.\n\n돈은 검증된 다음에 붓는 겁니다.\n\n#창업인사이트 #사업이야기 #온라인마케팅","variant":"B"},{"id":"w3-mon","topic":"업계비하인드","format":"카드뉴스","scheduledFor":"2026-07-13T10:00:00.000Z","kicker":"Agency Behind","headline":"대행사가 절대\u003cbr>먼저 *말 안 해주는 것*","sub":"수수료 구조와 계약 전 꼭 물어야 할 질문.","dayLabel":"월요일 · 비하인드","cardImage":"cards/pslab/w3-mon.png","captionNote":"수수료 구조와 계약 전 꼭 물어야 할 질문.","captionBody":"대행사가 먼저 말 안 해주는 것들이 있습니다.\n\n- 수수료가 “매체비의 %”인지 “고정”인지에 따라 이해관계가 달라집니다.\n- 리포트의 “좋아 보이는 const REPO = DATA.repo;
let ci = 0, ch = 'all';
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const ftime = s => !s?'-':String(s).replace('T',' ').slice(0,16);
const pct = v => (v*100).toFixed(1)+'%';
const tIcon = t => ({up:'📈',down:'📉','n/a':'·'}[t]||'·');
function issue(title, body){
  return 'https://github.com/'+REPO+'/issues/new?labels=feedback&title='+encodeURIComponent(title)+'&body='+encodeURIComponent(body);
}
function sparkline(arr){
  if(!arr||arr.length<2) return '';
  const w=160,h=34,mx=Math.max(...arr,1),mn=Math.min(...arr,0);
  const dx=w/(arr.length-1);
  const pts=arr.map((v,i)=>[i*dx,h-((v-mn)/(mx-mn||1))*(h-6)-3]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  return '<svg class="spark" width="'+w+'" height="'+h+'"><path d="'+d+'" fill="none" stroke="#2b6fff" stroke-width="2"/></svg>';
}
function publishedCard(p, badge){
  const img=p.imageUrl?'<img class="thumb" src="'+esc(p.imageUrl)+'" loading="lazy" alt=""/>':'<div class="thumb noimg">이미지 없음</div>';
  const link=p.url?'<a href="'+esc(p.url)+'" target="_blank">열기 ↗</a>':'';
  return '<div class="card">'+img+'<div class="cbody"><div class="ctop"><strong>'+esc(p.topic)+'</strong>'+badge+'</div>'+
    '<div class="muted">'+ftime(p.time)+'</div>'+
    '<div class="cap">'+esc(p.caption||'')+'</div>'+
    '<div class="met"><span>👁 '+p.views+'</span><span>❤ '+p.likes+'</span><span>💬 '+p.comments+'</span><span>'+pct(p.engagementRate)+'</span></div>'+
    '<div>'+link+'</div></div></div>';
}
function plainHead(it){ return it.headline?it.headline.replace(/<br>/g,' ').replace(/\*/g,''):it.topic; }
function vBadge(v){ return v?'<span class="badge b-var v-'+esc(v)+'">디자인 '+esc(v)+'</span>':''; }
function planCard(client, chLabel, it){
  const img=it.cardImage?'<img class="thumb" src="'+esc(it.cardImage)+'" loading="lazy" alt=""/>':'<div class="thumb noimg">카드 준비중</div>';
  const head=esc(plainHead(it));
  return '<div class="card clk" onclick="openDetail(\''+esc(it.id)+'\')">'+img+'<div class="cbody"><div class="ctop"><strong>'+head+'</strong><span class="badge b-plan">예정</span></div>'+
    '<div class="muted">🗓 '+ftime(it.scheduledFor)+(it.dayLabel?' · '+esc(it.dayLabel):'')+'</div>'+
    (it.captionNote?'<div class="cap">'+esc(it.captionNote)+'</div>':'')+
    '<div class="met" style="justify-content:space-between;align-items:center">'+vBadge(it.variant)+'<span class="muted">클릭하면 전체보기 →</span></div></div></div>';
}
function openDetail(id){
  const c=DATA.clients[ci];
  const it=(c.planCards||[]).find(x=>x.id===id); if(!it) return;
  const t='['+c.name+'] 콘텐츠 수정요청: '+plainHead(it);
  const b='이 콘텐츠 수정/방향 요청을 남겨주세요.\n\n- 헤드라인: '+plainHead(it)+'\n- 예정: '+ftime(it.scheduledFor)+'\n- 디자인: '+(it.variant||'')+'\n\n[수정 요청]\n';
  const img=it.cardImage?'<img src="'+esc(it.cardImage)+'" alt=""/>':'';
  const cap=esc(it.captionBody||it.captionNote||'').replace(/\n/g,'<br>');
  document.getElementById('mbody').innerHTML=
    '<div class="mgrid"><div class="mimg">'+img+'</div><div class="mtext">'+
    '<div class="kick">'+esc(it.kicker||'')+' · 디자인 '+esc(it.variant||'')+'</div>'+
    '<h2>'+esc(plainHead(it))+'</h2>'+
    '<div class="muted" style="margin:6px 0 16px">🗓 '+ftime(it.scheduledFor)+(it.dayLabel?' · '+esc(it.dayLabel):'')+' · 📸 인스타그램 · <span class="badge b-plan">발행 대기</span></div>'+
    '<div class="mcap">'+cap+'</div>'+
    '<div style="margin-top:18px;display:flex;gap:8px"><a class="btn fb" href="'+issue(t,b)+'" target="_blank">✏️ 수정요청</a><button class="btn" onclick="closeModal()">닫기</button></div>'+
    '</div></div>';
  document.getElementById('modal').classList.add('on');
}
function closeModal(){ document.getElementById('modal').classList.remove('on'); }
function channelDetail(client, c){
  const chLabel=(DATA.channels.find(x=>x.key===c.key)||{}).label||c.key;
  let h='';
  // 기획안 패널
  const planTitle='['+client.name+'/'+chLabel+'] 기획안 피드백';
  const planBody='이 채널 기획안에 대한 피드백/수정사항을 적어주세요.\n\n[현재 기획안]\n- 키워드: '+client.keywords.join(', ')+'\n- 브랜드 말투: '+client.brandTone+'\n- 발행시간: '+client.schedule.join(', ')+'\n- 디자인 스타일: '+client.designStyle.mood+' / '+client.designStyle.palette+'\n\n[수정 요청]\n';
  h+='<div class="panel"><div class="sect-h" style="margin:0 0 8px"><h3>📋 기획안</h3><a class="btn fb" href="'+issue(planTitle,planBody)+'" target="_blank">✏️ 기획안 피드백</a></div>'+
     '<div>'+client.keywords.map(k=>'<span class="tag">#'+esc(k)+'</span>').join('')+'</div>'+
     '<div class="muted" style="margin-top:8px">말투: '+esc(client.brandTone)+' · 발행 '+client.schedule.join(', ')+' · 검수 '+esc(client.reviewMode)+' · 디자인 v'+client.designVersion+'</div>'+
     '<div class="muted">디자인 스타일: '+esc(client.designStyle.mood)+' / '+esc(client.designStyle.palette)+' / '+esc(client.designStyle.composition)+'</div></div>';
  if(!c.active){
    h+='<div class="panel"><div class="empty">이 채널은 아직 <b>연결되지 않았습니다</b>. 설정표(targets)에 '+chLabel+'을 추가하고 키를 연결하면 자동 발행이 시작됩니다.</div></div>';
  }
  // KPI
  h+='<div class="kpis">'+
    kpi(c.stats.publishedCount,'발행됨')+
    kpi(c.stats.pendingCount,'발행 대기')+
    kpi(pct(c.stats.avgEngagement)+' '+tIcon(c.stats.trend),'평균 참여율',true)+
    kpi(c.stats.totalViews,'누적 조회')+
    kpi(c.stats.totalLikes,'누적 좋아요')+'</div>';
  if(c.series&&c.series.length>1){h+='<div class="panel"><h3>반응도 추세 (참여율 %)</h3>'+sparkline(c.series)+'</div>';}
  // 네이버 블로그 → blogdex 스타일
  if(c.key==='naver-blog'){ h+=blogSection(client); }
  // 발행 대기
  h+='<div class="sect-h"><h2>🕓 발행 대기 콘텐츠 ('+c.pending.length+')</h2></div>';
  h+= c.pending.length? '<div class="cards">'+c.pending.map(it=>planCard(client,chLabel,it)).join('')+'</div>' : '<div class="empty">예정된 콘텐츠가 없습니다. 다음 사이클에 자동 생성됩니다.</div>';
  // 발행됨
  h+='<div class="sect-h"><h2>✅ 발행된 콘텐츠 ('+c.published.length+')</h2></div>';
  h+= c.published.length? '<div class="cards">'+c.published.map(p=>publishedCard(p,'<span class="badge b-ok">발행</span>')).join('')+'</div>' : '<div class="empty">아직 발행된 콘텐츠가 없습니다.</div>';
  return h;
}
function blogSection(client){
  const b=client.blog;
  const color = b.score>=70?'#15331f':b.score>=40?'#33290f':'#262b3a';
  const fg = b.score>=70?'#4ade80':b.score>=40?'#ffb454':'#9aa3b5';
  let h='<div class="panel"><div class="sect-h" style="margin:0 0 10px"><h3>📊 블로그 지수 (blogdex 스타일)</h3><span class="muted">내부 추정 · 네이버 연동 시 실측 교체</span></div>';
  h+='<div class="row"><div class="grade" style="background:'+color+';color:'+fg+'">'+esc(b.grade)+'</div>'+
     '<div style="flex:1;min-width:160px"><div class="muted">종합 점수 '+b.score+'/100</div><div class="bar"><i style="width:'+b.score+'%"></i></div></div></div>';
  // 포스팅 분석
  if(b.posts.length){
    h+='<table style="margin-top:12px"><tr><th>포스팅</th><th>전문성</th><th>연관성</th><th>품질</th></tr>'+
      b.posts.slice(0,8).map(p=>'<tr><td>'+esc(p.topic)+'</td><td>'+p.expertise+'</td><td>'+p.relevance+'</td><td>'+p.quality+'</td></tr>').join('')+'</table>';
  }
  // 키워드 분석
  h+='<table style="margin-top:12px"><tr><th>키워드</th><th>검색지수</th><th>경쟁도</th></tr>'+
    b.keywords.map(k=>'<tr><td>#'+esc(k.kw)+'</td><td>'+k.searchIndex.toLocaleString()+'</td><td>'+esc(k.competition)+'</td></tr>').join('')+'</table>';
  h+='</div>';
  return h;
}
function overview(client){
  let h='<div class="kpis">'+
    kpi(client.totalCycles,'총 사이클')+
    kpi(client.totalPublished,'총 발행')+
    kpi(client.heldCount,'승인 대기',client.heldCount>0)+
    kpi('v'+client.designVersion,'디자인 진화')+'</div>';
  h+='<div class="panel"><h3>채널별 요약</h3><table><tr><th>채널</th><th>상태</th><th>발행</th><th>대기</th><th>평균 참여율</th></tr>'+
    client.channels.map(c=>{const lab=(DATA.channels.find(x=>x.key===c.key)||{});
      return '<tr><td>'+lab.icon+' '+lab.label+'</td><td>'+(c.active?'<span class="badge b-ok">연결</span>':'<span class="badge b-hold">미연결</span>')+'</td><td>'+c.stats.publishedCount+'</td><td>'+c.stats.pendingCount+'</td><td>'+pct(c.stats.avgEngagement)+' '+tIcon(c.stats.trend)+'</td></tr>';}).join('')+'</table></div>';
  // 이번 달 콘텐츠 기획안 (카드 미리보기)
  const plan=client.planCards||[];
  const fbTitle='['+client.name+'] 기획안 전체 피드백';
  const fbBody='이번 달 기획안(주 3회 매거진 카드)에 대한 의견/수정사항을 적어주세요.\n\n';
  h+='<div class="sect-h"><h2>📅 이번 달 콘텐츠 기획안 ('+plan.length+')</h2><a class="btn fb" href="'+issue(fbTitle,fbBody)+'" target="_blank">✏️ 기획안 피드백</a></div>';
  h+= plan.length?'<div class="cards">'+plan.map(p=>planCard(client,'인스타그램',p)).join('')+'</div>':'<div class="empty">기획안이 아직 없습니다.</div>';
  // 경쟁사 + 최근 발행 미리보기
  h+='<div class="panel" style="margin-top:16px"><h3>벤치마킹 경쟁사</h3><div>'+(client.competitors.length?client.competitors.map(x=>'<span class="tag">@'+esc(x)+'</span>').join(''):'<span class="muted">미설정</span>')+'</div></div>';
  const recent=[].concat(...client.channels.map(c=>c.published)).sort((a,b)=>(b.time||'').localeCompare(a.time||'')).slice(0,8);
  h+='<div class="sect-h"><h2>✅ 최근 발행</h2></div>';
  h+= recent.length?'<div class="cards">'+recent.map(p=>publishedCard(p,'<span class="badge b-ok">발행</span>')).join('')+'</div>':'<div class="empty">아직 발행된 콘텐츠가 없습니다. (검수 우선 — 승인 후 발행)</div>';
  return h;
}
function kpi(v,l,accent){return '<div class="kpi"><div class="v'+(accent?' accent':'')+'">'+v+'</div><div class="l">'+l+'</div></div>';}
function renderClients(){
  document.getElementById('clients').innerHTML = DATA.clients.length>1 ? DATA.clients.map((c,i)=>'<button class="cbtn'+(i===ci?' on':'')+'" onclick="setClient('+i+')">'+esc(c.name)+'</button>').join('') : '';
}
function renderTabs(){
  const c=DATA.clients[ci];
  const tabs=[{key:'all',label:'전체',icon:'🏠',active:true}].concat(DATA.channels.map(ch=>{const cc=c.channels.find(x=>x.key===ch.key);return {key:ch.key,label:ch.label,icon:ch.icon,active:cc&&cc.active};}));
  document.getElementById('tabs').innerHTML = tabs.map(t=>'<button class="tab'+(t.key===ch?' on':'')+'" onclick="setCh(\''+t.key+'\')">'+t.icon+' '+t.label+(t.key!=='all'?'<span class="dot '+(t.active?'live':'off')+'"></span>':'')+'</button>').join('');
}
function renderView(){
  const c=DATA.clients[ci];
  document.getElementById('view').innerHTML = ch==='all'?overview(c):channelDetail(c,c.channels.find(x=>x.key===ch));
  document.getElementById('gen').textContent = ftime(DATA.generatedAt)+' (UTC)';
}
function setClient(i){ci=i;ch='all';renderClients();renderTabs();renderView();window.scrollTo(0,0);}
function setCh(k){ch=k;renderTabs();renderView();window.scrollTo(0,0);}
renderClients();renderTabs();renderView();
</script>
</body>
</html>
