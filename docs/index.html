format":"링크드인 포스트","channels":["linkedin"],"scheduledFor":"2026-06-30T23:00:00.000Z","kicker":"Insight","headline":"대행을 쓸 때\u003cbr>가장 중요한 *한 가지*","sub":"15년간 본 성공·실패의 갈림길.","dayLabel":"링크드인 · 비즈니스","cardImage":"cards/pslab/linkedin-07-01-1.png","captionNote":"15년간 본 성공·실패의 갈림길.","captionBody":"대행과 오래가는 광고주에겐 공통점이 하나 있습니다 — '기대치 정렬'.\n\n광고대행 15년, 수백 곳을 보며 내린 결론입니다. 성공과 실패를 가른 건 예산도 업종도 아니었어요.\n\n대행이 잘하는 건 실행의 효율입니다. 같은 예산으로 더 정교하게, 더 빠르게.\n하지만 '팔리는 상품'과 '살 이유'를 만드는 건 끝까지 브랜드의 몫입니다.\n\n이 경계를 처음에 합의한 광고주는 대행과 오래갑니다.\n\"매출은 알아서 오르겠지\"로 시작한 곳은 3개월 안에 서로를 탓하더군요.\n\n하반기 대행을 고민 중이라면, 맡기기 전에 딱 하나만 정하세요 — '우리가 끝까지 책임질 것'은 무엇인가.\n\n#마케팅 #광고대행 #퍼포먼스마케팅","variant":"A","slideImages":["cards/pslab/linkedin-07-01-1.png"],"status":"planned"},{"id":"w1-wed","topic":"업계비하인드","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-07-01T10:00:00.000Z","kicker":"Agency Behind","headline":"대행사를 쓰면\u003cbr>매출이 오른다는 *착각*","sub":"대행이 할 수 있는 것과 없는 것, 솔직하게 말합니다.","dayLabel":"수요일 · 비하인드","cardImage":"cards/pslab/w1-wed-1.png","captionNote":"대행이 할 수 있는 것과 없는 것, 솔직하게 말합니다.","captionBody":"“대행 맡기면 알아서 매출 오르겠지” — 가장 많이 깨지는 기대입니다.\n\n대행이 잘하는 건 “실행의 효율”입니다. 같은 예산으로 더 정교하게, 더 빠르게.\n하지만 “팔리는 상품”과 “살 이유”를 만드는 건 결국 브랜드의 몫이에요.\n\n이 경계가 정렬되지 않으면, 대행도 광고주도 둘 다 지칩니다.\n맡기기 전에 “우리가 책임질 것”부터 정하세요.\n\n#마케팅인사이트 #광고대행 #사업이야기","variant":"A","slideImages":["cards/pslab/w1-wed-1.png","cards/pslab/w1-wed-2.png","cards/pslab/w1-wed-3.png","cards/pslab/w1-wed-4.png","cards/pslab/w1-wed-5.png"],"status":"planned"},{"id":"naver-blog-07-02","topic":"광고대행","format":"블로그 롱폼","channels":["naver-blog"],"scheduledFor":"2026-07-02T01:00:00.000Z","kicker":"Agency Guide","headline":"광고대행사 선택\u003cbr>맡기기 전 *5가지*","sub":"계약 전 체크리스트 — 15년차 솔직 후기.","dayLabel":"네이버블로그 · 롱폼","cardImage":"cards/pslab/naver-blog-07-02-1.png","captionNote":"계약 전 체크리스트 — 15년차 솔직 후기.","captionBody":"# 광고대행사 선택, 맡기기 전 꼭 확인할 5가지 (15년차 대표의 솔직 체크리스트)\n\n> [핵심 요약]\n> 광고대행은 '매출 보장'을 사는 게 아니라 '실행의 효율'을 사는 일입니다. 계약 전 ① 수수료 구조 ② 리포트 지표 ③ 실제 담당자 ④ 책임 범위(R&R) ⑤ 데이터 소유권, 이 5가지만 확인해도 실패 확률이 절반으로 줄어듭니다.\n\n상반기 결산이 끝나는 요즘, \"하반기엔 광고 제대로 해보자\"며 대행사를 알아보는 대표님이 부쩍 늘었습니다. 저도 15년간 대행을 해오며 수백 곳의 광고주를 만났는데요. 잘된 곳과 후회한 곳을 가른 건 예산이 아니라 '계약 전에 무엇을 확인했는가' 였습니다. 제 경험에서 추린 5가지를 공유합니다.\n\n## 1. 광고대행 수수료 구조 — %인가 고정인가\n가장 먼저 볼 건 수수료입니다. '매체비의 몇 %' 구조면 대행 입장에선 광고비를 더 쓰게 할 유인이 생깁니다. 고정 수수료면 그 유인은 없지만 효율 개선 동기가 약할 수 있고요. 정답은 없습니다. 다만 우리 상황(예산 규모, 성장 단계)에 맞는 구조인지, 그리고 그 구조가 대행의 행동을 어떻게 움직이는지를 이해하고 사인하세요.\n\n## 2. 리포트의 '진짜 지표' 확인하기\n제가 가장 많이 본 실패는 '예쁜 리포트'에 속은 경우입니다. 노출·클릭·CTR은 늘 좋아 보입니다. 하지만 통장에 찍히는 건 매출·전환·ROAS죠. 계약 전 리포트 양식을 미리 받아, 매출로 이어지는 지표가 들어있는지 보세요. 없다면 추가를 요청하세요.\n\n## 3. 영업이 아니라 '실제 운영 담당자'를 보라\n계약은 잘하는 영업이 따고, 운영은 신입이 하는 경우가 적지 않습니다. 내 계정을 실제로 만질 사람이 누구인지, 경력이 어떤지 물어보세요. 좋은 대행사는 이 질문을 반깁니다.\n\n## 4. 책임 범위(R&R)를 글로 남겨라\n소재 제작은 누가? 랜딩페이지는? CS는? 경계가 흐릿하면 성과가 안 날 때 서로를 탓하다 끝납니다. 계약 전에 'R&R 표'를 한 장 만들어 합의하세요. 이 한 장이 6개월 뒤의 분쟁을 막습니다.\n\n## 5. 종료 조건과 데이터 소유권\n의외로 가장 많이 놓치는 부분입니다. 계약이 끝났을 때 광고 계정·픽셀·전환 데이터를 우리가 온전히 가져올 수 있나요? 데이터는 다음 대행과 내부 운영의 자산입니다. 계약서에 소유권을 명시하세요.\n\n## 자주 묻는 질문 (FAQ)\n**Q. 광고대행 수수료는 보통 얼마인가요?**\nA. 매체비의 10~20%가 일반적이지만, 고정형·성과형도 있습니다. 금액보다 '구조가 우리에게 맞는가'가 더 중요합니다.\n\n**Q. 소액 광고도 대행을 맡길 수 있나요?**\nA. 가능합니다. 다만 월 광고비가 대행 수수료를 정당화하는 규모인지 따져보세요. 너무 작으면 직접 운영 + 부분 자문이 효율적입니다.\n\n**Q. 계약 기간은 어느 정도가 적당한가요?**\nA. 초기엔 3개월 단위를 권합니다. 데이터가 쌓이고 손발이 맞는지 본 뒤 연장하는 게 안전합니다.\n\n대행은 좋은 파트너를 만나면 분명 강력한 무기입니다. 다만 '맡기면 알아서 되겠지'가 아니라, 위 5가지를 확인하고 시작하셔야 그 무기가 우리 편이 됩니다. 도움이 되셨다면 저장해두고 계약 전에 한 번 더 펼쳐보세요.\n\n🔖 태그: #광고대행 #광고대행사선택 #온라인마케팅 #퍼포먼스마케팅 #마케팅대행","variant":"A","slideImages":["cards/pslab/naver-blog-07-02-1.png"],"status":"planned"},{"id":"w1-fri","topic":"브랜딩","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-07-03T10:00:00.000Z","kicker":"Brand Strategy","headline":"팔리는 브랜드는\u003cbr>‘무엇’이 아니라 *‘왜’*를 판다","sub":"작은 브랜드일수록 더 중요한 메시지 설계 이야기.","dayLabel":"금요일 · 브랜딩","cardImage":"cards/pslab/w1-fri-1.png","captionNote":"작은 브랜드일수록 더 중요한 메시지 설계 이야기.","captionBody":"사람들은 “무엇을 파는지”로 기억하지 않습니다. “왜 파는지”로 기억하죠.\n\n기능과 스펙은 경쟁사도 똑같이 말합니다. 차별은 “왜”에서 생깁니다.\n작은 브랜드일수록 더 그래요 — 자원이 적을수록 메시지가 무기니까.\n\n오늘 우리 브랜드의 “왜”를 한 문장으로 써보세요. 안 써지면, 그게 진짜 과제입니다.\n\n#브랜딩 #마케팅전략 #창업인사이트","variant":"A","slideImages":["cards/pslab/w1-fri-1.png","cards/pslab/w1-fri-2.png","cards/pslab/w1-fri-3.png","cards/pslab/w1-fri-4.png","cards/pslab/w1-fri-5.png"],"status":"planned"},{"id":"threads-07-04","topic":"온라인마케팅","format":"스레드(타래)","channels":["threads"],"scheduledFor":"2026-07-04T10:00:00.000Z","kicker":"Threads","headline":"광고비 태우기 전\u003cbr>점검 *3가지*","sub":"짧게 핵심만.","dayLabel":"스레드 · 타래","cardImage":"cards/pslab/threads-07-04-1.png","captionNote":"짧게 핵심만.","captionBody":"광고비, 켜기 전이 90%입니다. 🧵\n\n1) 타겟 — \"누구나\"는 \"아무도\"예요. 한 사람을 그리세요.\n\n2) 소재 — 첫 3초에 멈출 이유가 없으면 돈만 흐릅니다.\n\n3) 랜딩 — 클릭 다음 화면이 약하면 모든 클릭이 비용이에요.\n\n이 셋 맞추기 전에 예산부터 올리면? 적자는 정해진 결과입니다.","variant":"A","slideImages":["cards/pslab/threads-07-04-1.png"],"status":"planned"},{"id":"youtube-07-05","topic":"광고대행","format":"쇼츠 대본","channels":["youtube"],"scheduledFor":"2026-07-05T10:00:00.000Z","kicker":"Shorts","headline":"광고비 *날리는* 사장님 특징","sub":"30초 쇼츠.","dayLabel":"유튜브 · 쇼츠","cardImage":"cards/pslab/youtube-07-05-1.png","captionNote":"30초 쇼츠.","captionBody":"[HOOK · 0~3초]\n광고비 날리는 사장님들, 공통점이 있어요.\n\n[본론 · 3~25초]\n켜기 전 준비를 안 합니다.\n- 타겟이 \"누구나\" — 그럼 아무에게도 안 닿아요.\n- 소재가 평범 — 첫 3초에 멈출 이유가 없죠.\n- 랜딩이 부실 — 클릭해도 안 삽니다.\n이 셋 안 맞으면, 예산 올릴수록 적자예요.\n\n[CTA · 25~30초]\n켜기 전 이 3개부터. 저장해두세요.","variant":"A","slideImages":["cards/pslab/youtube-07-05-1.png"],"status":"planned"},{"id":"w2-mon","topic":"마케팅전략","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-07-06T10:00:00.000Z","kicker":"Decision","headline":"이 광고, 꺼야 할까?\u003cbr>판단하는 *숫자 하나*","sub":"감으로 끄지 마세요. 손익분기 한 줄 계산법.","dayLabel":"월요일 · 의사결정","cardImage":"cards/pslab/w2-mon-1.png","captionNote":"감으로 끄지 마세요. 손익분기 한 줄 계산법.","captionBody":"“이 광고 꺼야 하나, 더 둬야 하나” 감으로 정하지 마세요.\n\n판단은 숫자 하나로 충분합니다 — 손익분기 CPA.\n(객단가 × 마진율)이 허용 CPA입니다. 실제 CPA가 이걸 넘으면, 켤수록 적자.\n\n예) 객단가 5만 × 마진 40% = 허용 CPA 2만원. 지금 3만이면? 끄거나 고치세요.\n감이 아니라 선이 결정합니다.\n\n#퍼포먼스마케팅 #마케팅전략 #광고대행","variant":"B","slideImages":["cards/pslab/w2-mon-1.png","cards/pslab/w2-mon-2.png","cards/pslab/w2-mon-3.png","cards/pslab/w2-mon-4.png","cards/pslab/w2-mon-5.png"],"status":"planned"},{"id":"threads-07-07","topic":"업계비하인드","format":"스레드(타래)","channels":["threads"],"scheduledFor":"2026-07-07T10:00:00.000Z","kicker":"Threads","headline":"대행사가 *안 해주는* 말","sub":"솔직한 비하인드.","dayLabel":"스레드 · 타래","cardImage":"cards/pslab/threads-07-07-1.png","captionNote":"솔직한 비하인드.","captionBody":"대행사가 먼저 안 해주는 것들. 🧵\n\n· 수수료가 매체비의 %인지 고정인지에 따라 이해관계가 달라져요.\n\n· 리포트의 '좋아 보이는 지표'와 '매출 지표'는 다릅니다.\n\n· 계약 전, 누가 뭘 책임지는지 글로 남기세요.\n\n나쁜 대행이라서가 아니라, 안 물으면 굳이 말 안 하는 구조라서요.","variant":"B","slideImages":["cards/pslab/threads-07-07-1.png"],"status":"planned"},{"id":"linkedin-07-08","topic":"마케팅전략","format":"링크드인 포스트","channels":["linkedin"],"scheduledFor":"2026-07-07T23:00:00.000Z","kicker":"Decision","headline":"“이 광고 꺼야 하나”\u003cbr>판단하는 *숫자 하나*","sub":"감이 아니라 손익분기선으로.","dayLabel":"링크드인 · 비즈니스","cardImage":"cards/pslab/linkedin-07-08-1.png","captionNote":"감이 아니라 손익분기선으로.","captionBody":"\"이 광고 꺼야 하나?\"는 감이 아니라 숫자 하나로 정하면 됩니다 — 손익분기 CPA.\n\n대표님들이 가장 자주, 그리고 가장 감정적으로 내리는 결정이 광고를 끄고 켜는 일입니다. 기준을 드리겠습니다.\n\n(객단가 × 마진율) = 허용 CPA.\n실제 CPA가 이걸 넘으면, 켤수록 적자입니다.\n\n예) 객단가 5만원 × 마진 40% = 허용 CPA 2만원.\n지금 전환당 3만원이 든다면? 끄거나, 소재·타겟·랜딩을 고치세요.\n\n마케팅은 예술 같지만, 끄고 켜는 결정만큼은 산수입니다.\n이 한 줄을 모든 캠페인에 계산해 두면, 감정적 의사결정이 사라집니다.\n\n#마케팅전략 #퍼포먼스마케팅 #그로스","variant":"B","slideImages":["cards/pslab/linkedin-07-08-1.png"],"status":"planned"},{"id":"w2-wed","topic":"퍼포먼스마케팅","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-07-08T10:00:00.000Z","kicker":"Ad Ops","headline":"클릭은 느는데\u003cbr>매출이 *안 느는 이유*","sub":"클릭은 구매가 아닙니다. 전환이 새는 지점.","dayLabel":"수요일 · 광고운영","cardImage":"cards/pslab/w2-wed-1.png","captionNote":"클릭은 구매가 아닙니다. 전환이 새는 지점.","captionBody":"클릭은 느는데 매출은 그대로. 광고가 문제일까요?\n\n대개 아닙니다. 클릭은 “관심”이고 구매는 “확신”이에요. 둘 사이에서 새는 겁니다.\n랜딩의 첫 화면, 가격을 납득시키는 근거, 후기 같은 신뢰 장치 —\n이 중 하나만 약해도 클릭은 비용으로 끝납니다.\n\n광고를 더 돌리기 전에, 클릭 다음 화면부터 점검하세요.\n\n#퍼포먼스마케팅 #온라인마케팅 #전환율","variant":"B","slideImages":["cards/pslab/w2-wed-1.png","cards/pslab/w2-wed-2.png","cards/pslab/w2-wed-3.png","cards/pslab/w2-wed-4.png","cards/pslab/w2-wed-5.png"],"status":"planned"},{"id":"naver-blog-07-09","topic":"퍼포먼스마케팅","format":"블로그 롱폼","channels":["naver-blog"],"scheduledFor":"2026-07-09T01:00:00.000Z","kicker":"Performance","headline":"클릭은 느는데\u003cbr>매출이 *안 오르는* 이유","sub":"전환율 점검 가이드 — 새는 곳을 찾아라.","dayLabel":"네이버블로그 · 롱폼","cardImage":"cards/pslab/naver-blog-07-09-1.png","captionNote":"전환율 점검 가이드 — 새는 곳을 찾아라.","captionBody":"# 광고 클릭은 느는데 매출이 안 오르는 이유 (전환율 점검 가이드)\n\n> [핵심 요약]\n> 클릭이 느는데 매출이 그대로라면, 십중팔구 광고가 아니라 '광고 다음 화면'이 문제입니다. 전환은 보통 ① 랜딩 첫 화면 ② 가격의 근거 ③ 신뢰 장치, 이 세 곳에서 샙니다. 광고비를 늘리기 전에 여기부터 점검하세요.\n\n\"대행사는 성과가 좋다는데 왜 매출은 그대로일까요?\" 요즘처럼 광고비가 비싸진 시기에 정말 자주 받는 질문입니다. 제가 컨설팅에서 가장 먼저 하는 일은 광고가 아니라 '클릭 이후'를 보는 것입니다. 광고를 멈추지 않고도 매출을 끌어올린 사례 대부분이 여기서 나왔습니다.\n\n## 클릭은 '관심', 구매는 '확신'\n클릭은 \"한번 볼까?\" 하는 관심입니다. 구매는 \"사도 되겠다\"는 확신이고요. 이 둘 사이에 다리가 없으면, 늘어난 클릭은 그대로 비용으로 끝납니다. 광고는 사람을 데려올 뿐, 사게 만드는 건 그다음 화면입니다.\n\n## 전환이 새는 3곳\n**1) 랜딩 첫 화면** — 3초 안에 '이게 나에게 왜 필요한지'가 안 보이면 이탈합니다. 첫 화면에 핵심 가치를 한 문장으로 박으세요.\n**2) 가격의 근거** — 비싸 보이면 안 삽니다. 가격을 정당화할 이유(비교, 가치, 보장)를 보여주세요.\n**3) 신뢰 장치** — 후기, 사용 사례, 환불 보장이 없으면 결제 직전에 멈칫합니다.\n\n## 전환율 1%의 차이\n전환율을 1%에서 2%로만 올려도, 같은 광고비로 매출이 2배가 됩니다. 광고비를 2배 쓰는 것보다 훨씬 싸고 빠른 길이죠. 그래서 저는 '유입'보다 '전환'을 먼저 봅니다.\n\n## 자주 묻는 질문 (FAQ)\n**Q. 전환율 몇 %가 정상인가요?**\nA. 업종·객단가마다 다르지만 이커머스 기준 1~3%가 흔합니다. 절대 수치보다 '우리 추세가 오르는가'가 중요합니다.\n\n**Q. 그래도 광고비를 늘려야 하지 않나요?**\nA. 전환이 새는 상태에서 광고비를 늘리면 비싼 클릭으로 빈 그릇을 채우는 셈입니다. 전환을 먼저 막고 늘리세요.\n\n성과는 '유입 × 전환 × 객단가'입니다. 유입만 보면 절반만 보는 겁니다. 오늘은 우리 랜딩페이지 첫 화면부터 다시 보시길 권합니다.\n\n🔖 태그: #퍼포먼스마케팅 #전환율 #랜딩페이지 #온라인마케팅 #광고최적화","variant":"B","slideImages":["cards/pslab/naver-blog-07-09-1.png"],"status":"planned"},{"id":"w2-fri","topic":"창업인사이트","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-07-10T10:00:00.000Z","kicker":"Startup","headline":"돈 없이 시작하는 마케팅,\u003cbr>*진짜 가능한가*","sub":"예산 0원부터 검증. 돈 쓰기 전에 할 것.","dayLabel":"금요일 · 창업","cardImage":"cards/pslab/w2-fri-1.png","captionNote":"예산 0원부터 검증. 돈 쓰기 전에 할 것.","captionBody":"“돈 없으면 마케팅 못 하죠” — 절반만 맞습니다.\n\n돈이 필요한 건 “확장”이고, “검증”은 거의 공짜로 가능합니다.\n콘텐츠 몇 개, DM 몇 통, 작은 설문으로 “살 사람이 있는지”부터 확인하세요.\n수요를 확인하기 전에 광고비부터 태우면, 빠르게 망하는 길입니다.\n\n돈은 검증된 다음에 붓는 겁니다.\n\n#창업인사이트 #사업이야기 #온라인마케팅","variant":"B","slideImages":["cards/pslab/w2-fri-1.png","cards/pslab/w2-fri-2.png","cards/pslab/w2-fri-3.png","cards/pslab/w2-fri-4.png","cards/pslab/w2-fri-5.png"],"status":"planned"},{"id":"threads-07-11","topic":"창업인사이트","format":"스레드(타래)","channels":["threads"],"scheduledFor":"2026-07-11T10:00:00.000Z","kicker":"Threads","headline":"돈 없이 마케팅\u003cbr>*가능한가*","sub":"검증부터.","dayLabel":"스레드 · 타래","cardImage":"cards/pslab/threads-07-11-1.png","captionNote":"검증부터.","captionBody":"\"돈 없으면 마케팅 못 하죠\" — 절반만 맞아요. 🧵\n\n돈이 필요한 건 '확장'이고, '검증'은 거의 공짜입니다.\n\n콘텐츠 몇 개, DM 몇 통, 작은 설문으로 \"살 사람이 있는지\"부터 확인하세요.\n\n수요 확인 전에 광고비부터 태우면, 가장 빠르게 망하는 길입니다.\n\n돈은 검증된 다음에 붓는 겁니다.","variant":"C","slideImages":["cards/pslab/threads-07-11-1.png"],"status":"planned"},{"id":"youtube-07-12","topic":"마케팅전략","format":"쇼츠 대본","channels":["youtube"],"scheduledFor":"2026-07-12T10:00:00.000Z","kicker":"Shorts","headline":"이 광고 *꺼야 할까*?","sub":"숫자 하나로 판단.","dayLabel":"유튜브 · 쇼츠","cardImage":"cards/pslab/youtube-07-12-1.png","captionNote":"숫자 하나로 판단.","captionBody":"[HOOK]\n\"이 광고 꺼야 하나, 더 둬야 하나?\" 감으로 정하지 마세요.\n\n[본론]\n숫자 하나면 됩니다. 손익분기 CPA.\n객단가 곱하기 마진율. 그게 허용 CPA예요.\n객단가 5만, 마진 40%면 → 2만원.\n지금 전환당 3만원? 끄거나 고치세요.\n\n[CTA]\n감이 아니라 산수입니다. 계산해 보세요.","variant":"B","slideImages":["cards/pslab/youtube-07-12-1.png"],"status":"planned"},{"id":"w3-mon","topic":"업계비하인드","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-07-13T10:00:00.000Z","kicker":"Agency Behind","headline":"대행사가 절대\u003cbr>먼저 *말 안 해주는 것*","sub":"수수료 구조와 계약 전 꼭 물어야 할 질문.","dayLabel":"월요일 · 비하인드","cardImage":"cards/pslab/w3-mon-1.png","captionNote":"수수료 구조와 계약 전 꼭 물어야 할 질문.","captionBody":"대행사가 먼저 말 안 해주는 것들이 있습니다.\n\n- 수수료가 “매체비의 %”인지 “고정”인지에 따라 이해관계가 달라집니다.\n- 리포트의 “좋아 보이는 지표”와 “매출 지표”는 다릅니다.\n- 계약 전, 누가 무엇을 책임지는지 문서로 남기세요.\n\n나쁜 대행이라서가 아니라, 안 물으면 굳이 말 안 하는 구조라서예요.\n질문이 당신을 지킵니다.\n\n#광고대행 #마케팅인사이트 #업계비하인드","variant":"C","slideImages":["cards/pslab/w3-mon-1.png","cards/pslab/w3-mon-2.png","cards/pslab/w3-mon-3.png","cards/pslab/w3-mon-4.png","cards/pslab/w3-mon-5.png","cards/pslab/w3-mon-6.png"],"status":"planned"},{"id":"threads-07-14","topic":"퍼포먼스마케팅","format":"스레드(타래)","channels":["threads"],"scheduledFor":"2026-07-14T10:00:00.000Z","kicker":"Threads","headline":"클릭은 느는데\u003cbr>매출이 *그대로*","sub":"전환을 보라.","dayLabel":"스레드 · 타래","cardImage":"cards/pslab/threads-07-14-1.png","captionNote":"전환을 보라.","captionBody":"클릭은 느는데 매출은 그대로. 광고 탓일까요? 🧵\n\n대개 아니에요. 클릭은 '관심', 구매는 '확신'.\n\n랜딩 첫 화면 · 가격의 근거 · 후기.\n이 중 하나만 약해도 전환이 무너집니다.\n\n광고를 더 돌리기 전에, 클릭 다음 화면부터 보세요.","variant":"A","slideImages":["cards/pslab/threads-07-14-1.png"],"status":"planned"},{"id":"linkedin-07-15","topic":"브랜딩","format":"링크드인 포스트","channels":["linkedin"],"scheduledFor":"2026-07-14T23:00:00.000Z","kicker":"Branding","headline":"팔리는 브랜드는\u003cbr>*‘왜’*를 판다","sub":"기능이 아니라 이유로 기억된다.","dayLabel":"링크드인 · 비즈니스","cardImage":"cards/pslab/linkedin-07-15-1.png","captionNote":"기능이 아니라 이유로 기억된다.","captionBody":"경쟁사와 똑같은 기능을 말하고 있다면, 고객 입장에선 고를 이유가 없습니다.\n\n사람은 '무엇'이 아니라 '왜'로 브랜드를 기억합니다.\n\n스펙은 경쟁사도 똑같이 말합니다. 차별은 거기서 안 생깁니다.\n\"이 사람들은 왜 이걸 만들까\"에 답이 있을 때, 비로소 선택받습니다.\n\n특히 작은 브랜드일수록 그렇습니다. 자원이 적을수록 메시지가 유일한 무기니까요.\n\n오늘 한 가지만 해보세요.\n우리 브랜드의 '왜'를 한 문장으로 써보는 것.\n안 써진다면 — 그게 지금 가장 시급한 과제입니다.\n\n#브랜딩 #마케팅 #스타트업","variant":"C","slideImages":["cards/pslab/linkedin-07-15-1.png"],"status":"planned"},{"id":"w3-wed","topic":"브랜딩","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-07-15T10:00:00.000Z","kicker":"Brand Strategy","headline":"후기가 10개도 없는데\u003cbr>*광고부터* 돌린다고?","sub":"신뢰 자산 없이 광고를 태우면 새는 이유.","dayLabel":"수요일 · 브랜딩","cardImage":"cards/pslab/w3-wed-1.png","captionNote":"신뢰 자산 없이 광고를 태우면 새는 이유.","captionBody":"후기 10개도 없는데 광고부터 돌린다고요? 잠깐만요.\n\n광고는 “신뢰 위에” 부어야 효율이 납니다.\n신뢰 자산(후기·사용 사례·콘텐츠)이 비면, 들어온 트래픽이 그냥 빠져나가요.\n비싼 클릭으로 빈 그릇을 채우는 셈입니다.\n\n광고 예산의 일부를 먼저 “믿을 이유”를 쌓는 데 쓰세요. 순서가 효율을 만듭니다.\n\n#브랜딩 #마케팅전략 #온라인마케팅","variant":"C","slideImages":["cards/pslab/w3-wed-1.png","cards/pslab/w3-wed-2.png","cards/pslab/w3-wed-3.png","cards/pslab/w3-wed-4.png","cards/pslab/w3-wed-5.png"],"status":"planned"},{"id":"naver-blog-07-16","topic":"브랜딩","format":"블로그 롱폼","channels":["naver-blog"],"scheduledFor":"2026-07-16T01:00:00.000Z","kicker":"Branding","headline":"작은 브랜드일수록\u003cbr>*‘왜’*를 팔아야 한다","sub":"브랜드 메시지 설계법.","dayLabel":"네이버블로그 · 롱폼","cardImage":"cards/pslab/naver-blog-07-16-1.png","captionNote":"브랜드 메시지 설계법.","captionBody":"# 작은 브랜드일수록 '왜'를 팔아야 하는 이유 (브랜드 메시지 설계법)\n\n> [핵심 요약]\n> 작은 브랜드는 '무엇(기능·가격)'으로는 대기업을 이길 수 없습니다. 사람은 '무엇'이 아니라 '왜'로 브랜드를 기억하기 때문에, 작을수록 '왜'를 메시지로 설계해야 선택받습니다.\n\n요즘처럼 비슷한 제품이 쏟아지는 시장에서는, 기능만으로는 고를 이유를 주지 못합니다. 제가 브랜딩 컨설팅을 하며 반복해서 확인한 건 하나였습니다 — 오래 사랑받는 작은 브랜드는 예외 없이 '왜'가 분명했습니다.\n\n## 사람은 '왜'를 기억한다\n스펙은 잊혀도 \"이 사람들은 이래서 이걸 만들었대\"는 남습니다. 같은 제품도 '왜'가 붙으면 다른 물건이 됩니다. 대기업이 '무엇'으로 규모의 싸움을 할 때, 작은 브랜드는 '왜'로 마음의 싸움을 해야 이깁니다.\n\n## '왜'를 찾는 3가지 질문\n1) 우리는 어떤 불편을 못 참아서 시작했나?\n2) 고객의 어떤 순간을 바꾸고 싶은가?\n3) 우리가 절대 타협하지 않는 것은 무엇인가?\n이 세 질문의 답이 곧 '왜'의 재료입니다.\n\n## 메시지로 옮기기\n찾은 '왜'를 한 문장으로 압축하세요. 그리고 그 문장이 상세페이지 첫 줄, 인스타 프로필, 광고 후킹에 일관되게 흐르게 하세요. 메시지는 반복될 때 자산이 됩니다.\n\n## 자주 묻는 질문 (FAQ)\n**Q. 브랜드 메시지는 어떻게 한 문장으로 만드나요?**\nA. \"우리는 ___를 위해, ___를 ___하게 만든다\" 틀에 위 3질문의 답을 넣어 시작하세요. 다듬는 건 그다음입니다.\n\n**Q. '왜'가 잘 안 떠올라요.**\nA. 창업 당시의 불편·분노·아쉬움을 떠올려보세요. 거기에 거의 항상 '왜'가 숨어 있습니다.\n\n작을수록 메시지가 유일한 무기입니다. '무엇'으로 경쟁하지 말고 '왜'로 기억되세요. 오늘 우리 브랜드의 '왜'를 한 문장으로 적어보는 것부터 시작하시길 바랍니다.\n\n🔖 태그: #브랜딩 #브랜드메시지 #스몰브랜드 #마케팅전략 #창업","variant":"C","slideImages":["cards/pslab/naver-blog-07-16-1.png"],"status":"planned"},{"id":"w3-fri","topic":"마케팅인사이트","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-07-17T10:00:00.000Z","kicker":"Marketing Insight","headline":"트렌드를 좇다 망한\u003cbr>브랜드들의 *공통점*","sub":"유행 추종과 본질. 트렌드를 제대로 쓰는 법.","dayLabel":"금요일 · 인사이트","cardImage":"cards/pslab/w3-fri-1.png","captionNote":"유행 추종과 본질. 트렌드를 제대로 쓰는 법.","captionBody":"트렌드를 좇다 사라진 브랜드들엔 공통점이 있습니다 — “왜”가 없었어요.\n\n유행은 “무엇”을 바꾸게 합니다. 하지만 본질(누구에게, 왜)이 없으면\n트렌드가 끝나는 순간 같이 끝납니다.\n\n트렌드는 “올라타는 것”이 아니라 “내 메시지를 실어 보내는 파도”입니다.\n좇지 말고, 태우세요.\n\n#마케팅인사이트 #온라인시장트렌드 #브랜딩","variant":"C","slideImages":["cards/pslab/w3-fri-1.png","cards/pslab/w3-fri-2.png","cards/pslab/w3-fri-3.png","cards/pslab/w3-fri-4.png","cards/pslab/w3-fri-5.png"],"status":"planned"},{"id":"threads-07-18","topic":"브랜딩","format":"스레드(타래)","channels":["threads"],"scheduledFor":"2026-07-18T10:00:00.000Z","kicker":"Threads","headline":"*‘왜’*를 팔아라","sub":"기억되는 법.","dayLabel":"스레드 · 타래","cardImage":"cards/pslab/threads-07-18-1.png","captionNote":"기억되는 법.","captionBody":"사람은 '무엇'이 아니라 '왜'로 브랜드를 기억해요. 🧵\n\n기능은 경쟁사도 똑같이 말합니다. 차별은 '왜'에서 생겨요.\n\n작은 브랜드일수록 더 그렇습니다 — 자원이 적을수록 메시지가 무기니까.\n\n오늘 우리 브랜드의 '왜'를 한 문장으로 써보세요. 안 써지면, 그게 과제예요.","variant":"B","slideImages":["cards/pslab/threads-07-18-1.png"],"status":"planned"},{"id":"youtube-07-19","topic":"브랜딩","format":"쇼츠 대본","channels":["youtube"],"scheduledFor":"2026-07-19T10:00:00.000Z","kicker":"Shorts","headline":"작은 브랜드가 *이기는* 법","sub":"왜를 팔아라.","dayLabel":"유튜브 · 쇼츠","cardImage":"cards/pslab/youtube-07-19-1.png","captionNote":"왜를 팔아라.","captionBody":"[HOOK]\n작은 브랜드가 대기업을 이기는 유일한 방법.\n\n[본론]\n'무엇'으로 싸우지 마세요. 더 싸게, 더 많이는 못 이겨요.\n'왜'를 파세요.\n사람은 기능이 아니라 이유를 기억합니다.\n\"이 사람들은 왜 이걸 만들까\" — 거기에 답이 있으면 선택받아요.\n\n[CTA]\n우리 브랜드의 '왜', 한 문장으로 적어보세요.","variant":"C","slideImages":["cards/pslab/youtube-07-19-1.png"],"status":"planned"},{"id":"w4-mon","topic":"퍼포먼스마케팅","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-07-20T10:00:00.000Z","kicker":"Ad Ops","headline":"예산의 *80%*를\u003cbr>어디에 써야 할까","sub":"테스트·확장·리타겟 배분 원칙.","dayLabel":"월요일 · 광고운영","cardImage":"cards/pslab/w4-mon-1.png","captionNote":"테스트·확장·리타겟 배분 원칙.","captionBody":"광고 예산, 어디에 얼마를 쓸지부터 틀리면 다 틀립니다.\n\n제 기준은 70-20-10입니다.\n- 70% 검증된 승자(확장)\n- 20% 새 타겟·소재 테스트\n- 10% 과감한 실험\n\n전부 “잘 되는 것”에 몰면 성장은 멈추고, 전부 “새것”에 걸면 돈이 셉니다.\n배분이 곧 전략입니다.\n\n#퍼포먼스마케팅 #광고대행 #마케팅전략","variant":"A","slideImages":["cards/pslab/w4-mon-1.png","cards/pslab/w4-mon-2.png","cards/pslab/w4-mon-3.png","cards/pslab/w4-mon-4.png","cards/pslab/w4-mon-5.png","cards/pslab/w4-mon-6.png"],"status":"planned"},{"id":"threads-07-21","topic":"마케팅전략","format":"스레드(타래)","channels":["threads"],"scheduledFor":"2026-07-21T10:00:00.000Z","kicker":"Threads","headline":"예산 배분\u003cbr>*70-20-10*","sub":"한 줄 원칙.","dayLabel":"스레드 · 타래","cardImage":"cards/pslab/threads-07-21-1.png","captionNote":"한 줄 원칙.","captionBody":"광고 예산 배분, 저는 70-20-10으로 갑니다. 🧵\n\n70% 검증된 승자(확장)\n20% 새 타겟·소재 테스트\n10% 과감한 실험\n\n전부 승자에 몰면 성장 정지, 전부 새것에 걸면 돈 누수.\n\n배분이 곧 전략입니다.","variant":"C","slideImages":["cards/pslab/threads-07-21-1.png"],"status":"planned"},{"id":"linkedin-07-22","topic":"사업이야기","format":"링크드인 포스트","channels":["linkedin"],"scheduledFor":"2026-07-21T23:00:00.000Z","kicker":"Growth","headline":"매출이 정체됐을 때\u003cbr>먼저 보는 *지표*","sub":"광고가 아니라 병목부터.","dayLabel":"링크드인 · 비즈니스","cardImage":"cards/pslab/linkedin-07-22-1.png","captionNote":"광고가 아니라 병목부터.","captionBody":"매출이 정체되면 대부분 \"광고를 더 돌려야 하나\"부터 생각합니다.\n저는 광고를 마지막에 봅니다. 먼저 '어디가 막혔는지'를 봅니다.\n\n매출 = 신규획득 × 전환 × 재구매. 셋 중 어디가 막혔는지에 따라 처방이 완전히 다릅니다.\n\n· 신규는 오는데 안 산다 → 전환 문제 (상세·가격·신뢰)\n· 사는데 더 안 는다 → 획득 문제 (채널·타겟)\n· 한 번 사고 안 온다 → 재구매 문제 (경험·CRM)\n\n광고비를 붓는 건 '획득'에만 듣습니다.\n전환이 막혔는데 광고를 늘리면, 비싼 클릭으로 빈 그릇을 채우는 셈입니다.\n\n정체는 '광고 부족'이 아니라 '진단 부족'인 경우가 훨씬 많습니다.\n\n#그로스 #마케팅 #사업","variant":"A","slideImages":["cards/pslab/linkedin-07-22-1.png"],"status":"planned"},{"id":"w4-wed","topic":"마케팅전략","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-07-22T10:00:00.000Z","kicker":"Decision","headline":"대행을 맡길 때\u003cbr>vs *직접 할 때*","sub":"규모·역량·시간으로 보는 판단표.","dayLabel":"수요일 · 의사결정","cardImage":"cards/pslab/w4-wed-1.png","captionNote":"규모·역량·시간으로 보는 판단표.","captionBody":"대행을 맡길까, 직접 할까? 세 가지만 보세요.\n\n1. 규모 — 월 광고비가 인건비를 정당화하나요?\n2. 역량 — 내부에 “판단할 사람”이 있나요? (실행 말고 판단)\n3. 시간 — 배우며 할 6개월의 기회비용을 감당할 수 있나요?\n\n셋 다 “No”면 맡기고, “Yes”가 많으면 직접 + 부분 자문이 답입니다.\n정답은 없고, 상황만 있습니다.\n\n#광고대행 #마케팅전략 #사업이야기","variant":"A","slideImages":["cards/pslab/w4-wed-1.png","cards/pslab/w4-wed-2.png","cards/pslab/w4-wed-3.png","cards/pslab/w4-wed-4.png","cards/pslab/w4-wed-5.png","cards/pslab/w4-wed-6.png"],"status":"planned"},{"id":"naver-blog-07-23","topic":"마케팅전략","format":"블로그 롱폼","channels":["naver-blog"],"scheduledFor":"2026-07-23T01:00:00.000Z","kicker":"Budget","headline":"광고 예산 배분\u003cbr>*70-20-10* 법칙","sub":"실전 적용 가이드.","dayLabel":"네이버블로그 · 롱폼","cardImage":"cards/pslab/naver-blog-07-23-1.png","captionNote":"실전 적용 가이드.","captionBody":"# 광고 예산 배분의 정석: 70-20-10 법칙 (실전 적용 가이드)\n\n> [핵심 요약]\n> 광고 예산은 검증된 승자에 70%, 새 테스트에 20%, 과감한 도전에 10%로 나누세요. 전부 승자에 몰면 성장이 멈추고, 전부 새것에 걸면 돈이 샙니다. 배분 비율이 곧 전략입니다.\n\n하반기 예산을 다시 짜는 시기입니다. 소재를 아무리 잘 만들어도, 예산을 '어디에 얼마나' 쓸지부터 틀리면 결과가 안 납니다. 제가 15년간 크고 작은 계정에 적용해 온 배분 원칙이 70-20-10입니다.\n\n## 70% — 검증된 승자에\n이미 ROAS가 나오는 캠페인·소재·타겟에 예산의 대부분을 둡니다. 안정적으로 매출을 만드는 엔진이죠. 잘 도는 걸 괜히 건드리다 망치는 경우가 많으니, 여기는 지키세요.\n\n## 20% — 테스트에\n새 타겟, 새 소재, 새 채널을 실험하는 자리입니다. 다음 분기의 '승자'를 여기서 찾습니다. 이 20%가 없으면 당장은 효율이 좋아 보여도 성장은 멈춥니다.\n\n## 10% — 과감한 도전에\n완전히 새로운 시도(신규 플랫폼, 파격 크리에이티브)에 씁니다. 대부분 실패하지만, 가끔의 대박이 판을 바꿉니다. '잃어도 되는 돈'으로 미래를 삽니다.\n\n## 자주 묻는 질문 (FAQ)\n**Q. 예산이 적으면 어떻게 배분하나요?**\nA. 비율은 유지하되, 테스트·도전을 '한 번에 하나씩' 순차로 돌리세요. 동시에 여러 개를 테스트할 여력이 없을 뿐입니다.\n\n**Q. 70%의 승자가 식으면요?**\nA. 그래서 20% 테스트가 필요합니다. 승자가 식기 전에 다음 승자를 준비해 두는 구조입니다.\n\n배분이 곧 전략입니다. 소재를 고민하기 전에, 먼저 비율부터 정하세요. 이 한 장의 원칙이 1년 광고비의 효율을 가릅니다.\n\n🔖 태그: #광고예산 #퍼포먼스마케팅 #마케팅전략 #광고운영 #ROAS","variant":"A","slideImages":["cards/pslab/naver-blog-07-23-1.png"],"status":"planned"},{"id":"w4-fri","topic":"사업이야기","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-07-24T10:00:00.000Z","kicker":"Growth","headline":"매출이 정체됐을 때\u003cbr>가장 먼저 보는 *지표*","sub":"신규획득과 재구매, 어디가 막혔는지 진단.","dayLabel":"금요일 · 성장","cardImage":"cards/pslab/w4-fri-1.png","captionNote":"신규획득과 재구매, 어디가 막혔는지 진단.","captionBody":"매출이 정체됐을 때, 저는 광고부터 보지 않습니다. “어디가 막혔는지”부터 봅니다.\n\n- 신규는 들어오는데 안 사면 → 전환(상세·가격·신뢰)\n- 사는데 안 늘면 → 획득(채널·타겟)\n- 한 번 사고 안 오면 → 재구매(경험·CRM)\n\n막힌 곳이 다르면 처방도 다릅니다. 정체는 “광고 부족”이 아니라 “진단 부족”인 경우가 많아요.\n\n#사업이야기 #마케팅인사이트 #성장전략","variant":"A","slideImages":["cards/pslab/w4-fri-1.png","cards/pslab/w4-fri-2.png","cards/pslab/w4-fri-3.png","cards/pslab/w4-fri-4.png","cards/pslab/w4-fri-5.png","cards/pslab/w4-fri-6.png"],"status":"planned"},{"id":"youtube-07-26","topic":"사업이야기","format":"쇼츠 대본","channels":["youtube"],"scheduledFor":"2026-07-26T10:00:00.000Z","kicker":"Shorts","headline":"매출 *정체* 풀리는 순서","sub":"병목부터 보라.","dayLabel":"유튜브 · 쇼츠","cardImage":"cards/pslab/youtube-07-26-1.png","captionNote":"병목부터 보라.","captionBody":"[HOOK]\n매출이 멈췄을 때, 광고부터 늘리면 안 되는 이유.\n\n[본론]\n매출은 신규 × 전환 × 재구매예요.\n- 오는데 안 산다 → 전환(상세·가격·신뢰)\n- 사는데 안 는다 → 획득(채널·타겟)\n- 한 번 사고 끝 → 재구매(경험·CRM)\n막힌 곳이 다른데 광고만 늘리면 돈만 새요.\n\n[CTA]\n정체는 광고 부족이 아니라 진단 부족입니다.","variant":"A","slideImages":["cards/pslab/youtube-07-26-1.png"],"status":"planned"}],"channels":[{"key":"instagram","label":"인스타그램","icon":"📸","active":true,"published":[{"topic":"온라인마케팅","time":"2026-06-25T13:40:06.315Z","imageUrl":"https://i.ibb.co/bgFmxyCH/680c27e00a8d.jpg","caption":"온라인마케팅에 대해 이야기해 볼게요.","url":"https://www.instagram.com/p/DaAsg05kj_n/","views":0,"likes":0,"comments":0,"engagementRate":0},{"topic":"온라인마케팅","time":"2026-06-25T13:09:58.908Z","imageUrl":"https://i.ibb.co/bjxKqrC7/315aa63bb230.jpg","caption":"온라인마케팅에 대해 이야기해 볼게요.","url":"https://www.instagram.com/p/DaApEYKE6Cr/","views":0,"likes":0,"comments":0,"engagementRate":0},{"topic":"온라인마케팅","time":"2026-06-25T12:42:58.071Z","imageUrl":"https://i.ibb.co/LwMY2nq/b961780986f0.jpg","caption":"온라인마케팅에 대해 이야기해 볼게요.","url":"https://instagram.com/p/ig_hewipimt_zgvd","views":0,"likes":0,"comments":0,"engagementRate":0.11063005983808519}],"pending":[{"id":"w1-mon","topic":"광고대행","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-06-29T10:00:00.000Z","kicker":"Marketing Insight","headline":"광고비를 태우기 전에\u003cbr>반드시 점검할 *3가지*","sub":"15년간 대행하며 깨달은, 돈이 새는 지점부터 막는 법.","dayLabel":"월요일 · 인사이트","cardImage":"cards/pslab/w1-mon-1.png","captionNote":"15년간 대행하며 깨달은, 돈이 새는 지점부터 막는 법.","captionBody":"광고비, 켜기 전이 90%입니다.\n\n15년간 수백 개 계정을 만지며 깨달은 건 — 돈은 “운영”이 아니라 “준비”에서 샙니다.\n\n태우기 전 반드시 점검할 3가지\n1. 타겟 — “누구나”는 “아무도”입니다. 한 사람을 그리세요.\n2. 소재 — 첫 3초에 멈출 이유가 없으면 돈은 흐릅니다.\n3. 랜딩 — 클릭 다음 화면이 약하면 모든 클릭이 비용입니다.\n\n이 셋이 안 맞은 채 예산부터 올리는 순간, 적자는 정해집니다.\n\n#온라인마케팅 #광고대행 #퍼포먼스마케팅","variant":"A","slideImages":["cards/pslab/w1-mon-1.png","cards/pslab/w1-mon-2.png","cards/pslab/w1-mon-3.png","cards/pslab/w1-mon-4.png","cards/pslab/w1-mon-5.png","cards/pslab/w1-mon-6.png"],"status":"published","publishedUrl":"https://www.instagram.com/p/DaCerLaFY2L/"},{"id":"w1-wed","topic":"업계비하인드","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-07-01T10:00:00.000Z","kicker":"Agency Behind","headline":"대행사를 쓰면\u003cbr>매출이 오른다는 *착각*","sub":"대행이 할 수 있는 것과 없는 것, 솔직하게 말합니다.","dayLabel":"수요일 · 비하인드","cardImage":"cards/pslab/w1-wed-1.png","captionNote":"대행이 할 수 있는 것과 없는 것, 솔직하게 말합니다.","captionBody":"“대행 맡기면 알아서 매출 오르겠지” — 가장 많이 깨지는 기대입니다.\n\n대행이 잘하는 건 “실행의 효율”입니다. 같은 예산으로 더 정교하게, 더 빠르게.\n하지만 “팔리는 상품”과 “살 이유”를 만드는 건 결국 브랜드의 몫이에요.\n\n이 경계가 정렬되지 않으면, 대행도 광고주도 둘 다 지칩니다.\n맡기기 전에 “우리가 책임질 것”부터 정하세요.\n\n#마케팅인사이트 #광고대행 #사업이야기","variant":"A","slideImages":["cards/pslab/w1-wed-1.png","cards/pslab/w1-wed-2.png","cards/pslab/w1-wed-3.png","cards/pslab/w1-wed-4.png","cards/pslab/w1-wed-5.png"],"status":"planned"},{"id":"w1-fri","topic":"브랜딩","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-07-03T10:00:00.000Z","kicker":"Brand Strategy","headline":"팔리는 브랜드는\u003cbr>‘무엇’이 아니라 *‘왜’*를 판다","sub":"작은 브랜드일수록 더 중요한 메시지 설계 이야기.","dayLabel":"금요일 · 브랜딩","cardImage":"cards/pslab/w1-fri-1.png","captionNote":"작은 브랜드일수록 더 중요한 메시지 설계 이야기.","captionBody":"사람들은 “무엇을 파는지”로 기억하지 않습니다. “왜 파는지”로 기억하죠.\n\n기능과 스펙은 경쟁사도 똑같이 말합니다. 차별은 “왜”에서 생깁니다.\n작은 브랜드일수록 더 그래요 — 자원이 적을수록 메시지가 무기니까.\n\n오늘 우리 브랜드의 “왜”를 한 문장으로 써보세요. 안 써지면, 그게 진짜 과제입니다.\n\n#브랜딩 #마케팅전략 #창업인사이트","variant":"A","slideImages":["cards/pslab/w1-fri-1.png","cards/pslab/w1-fri-2.png","cards/pslab/w1-fri-3.png","cards/pslab/w1-fri-4.png","cards/pslab/w1-fri-5.png"],"status":"planned"},{"id":"w2-mon","topic":"마케팅전략","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-07-06T10:00:00.000Z","kicker":"Decision","headline":"이 광고, 꺼야 할까?\u003cbr>판단하는 *숫자 하나*","sub":"감으로 끄지 마세요. 손익분기 한 줄 계산법.","dayLabel":"월요일 · 의사결정","cardImage":"cards/pslab/w2-mon-1.png","captionNote":"감으로 끄지 마세요. 손익분기 한 줄 계산법.","captionBody":"“이 광고 꺼야 하나, 더 둬야 하나” 감으로 정하지 마세요.\n\n판단은 숫자 하나로 충분합니다 — 손익분기 CPA.\n(객단가 × 마진율)이 허용 CPA입니다. 실제 CPA가 이걸 넘으면, 켤수록 적자.\n\n예) 객단가 5만 × 마진 40% = 허용 CPA 2만원. 지금 3만이면? 끄거나 고치세요.\n감이 아니라 선이 결정합니다.\n\n#퍼포먼스마케팅 #마케팅전략 #광고대행","variant":"B","slideImages":["cards/pslab/w2-mon-1.png","cards/pslab/w2-mon-2.png","cards/pslab/w2-mon-3.png","cards/pslab/w2-mon-4.png","cards/pslab/w2-mon-5.png"],"status":"planned"},{"id":"w2-wed","topic":"퍼포먼스마케팅","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-07-08T10:00:00.000Z","kicker":"Ad Ops","headline":"클릭은 느는데\u003cbr>매출이 *안 느는 이유*","sub":"클릭은 구매가 아닙니다. 전환이 새는 지점.","dayLabel":"수요일 · 광고운영","cardImage":"cards/pslab/w2-wed-1.png","captionNote":"클릭은 구매가 아닙니다. 전환이 새는 지점.","captionBody":"클릭은 느는데 매출은 그대로. 광고가 문제일까요?\n\n대개 아닙니다. 클릭은 “관심”이고 구매는 “확신”이에요. 둘 사이에서 새는 겁니다.\n랜딩의 첫 화면, 가격을 납득시키는 근거, 후기 같은 신뢰 장치 —\n이 중 하나만 약해도 클릭은 비용으로 끝납니다.\n\n광고를 더 돌리기 전에, 클릭 다음 화면부터 점검하세요.\n\n#퍼포먼스마케팅 #온라인마케팅 #전환율","variant":"B","slideImages":["cards/pslab/w2-wed-1.png","cards/pslab/w2-wed-2.png","cards/pslab/w2-wed-3.png","cards/pslab/w2-wed-4.png","cards/pslab/w2-wed-5.png"],"status":"planned"},{"id":"w2-fri","topic":"창업인사이트","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-07-10T10:00:00.000Z","kicker":"Startup","headline":"돈 없이 시작하는 마케팅,\u003cbr>*진짜 가능한가*","sub":"예산 0원부터 검증. 돈 쓰기 전에 할 것.","dayLabel":"금요일 · 창업","cardImage":"cards/pslab/w2-fri-1.png","captionNote":"예산 0원부터 검증. 돈 쓰기 전에 할 것.","captionBody":"“돈 없으면 마케팅 못 하죠” — 절반만 맞습니다.\n\n돈이 필요한 건 “확장”이고, “검증”은 거의 공짜로 가능합니다.\n콘텐츠 몇 개, DM 몇 통, 작은 설문으로 “살 사람이 있는지”부터 확인하세요.\n수요를 확인하기 전에 광고비부터 태우면, 빠르게 망하는 길입니다.\n\n돈은 검증된 다음에 붓는 겁니다.\n\n#창업인사이트 #사업이야기 #온라인마케팅","variant":"B","slideImages":["cards/pslab/w2-fri-1.png","cards/pslab/w2-fri-2.png","cards/pslab/w2-fri-3.png","cards/pslab/w2-fri-4.png","cards/pslab/w2-fri-5.png"],"status":"planned"},{"id":"w3-mon","topic":"업계비하인드","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-07-13T10:00:00.000Z","kicker":"Agency Behind","headline":"대행사가 절대\u003cbr>먼저 *말 안 해주는 것*","sub":"수수료 구조와 계약 전 꼭 물어야 할 질문.","dayLabel":"월요일 · 비하인드","cardImage":"cards/pslab/w3-mon-1.png","captionNote":"수수료 구조와 계약 전 꼭 물어야 할 질문.","captionBody":"대행사가 먼저 말 안 해주는 것들이 있습니다.\n\n- 수수료가 “매체비의 %”인지 “고정”인지에 따라 이해관계가 달라집니다.\n- 리포트의 “좋아 보이는 지표”와 “매출 지표”는 다릅니다.\n- 계약 전, 누가 무엇을 책임지는지 문서로 남기세요.\n\n나쁜 대행이라서가 아니라, 안 물으면 굳이 말 안 하는 구조라서예요.\n질문이 당신을 지킵니다.\n\n#광고대행 #마케팅인사이트 #업계비하인드","variant":"C","slideImages":["cards/pslab/w3-mon-1.png","cards/pslab/w3-mon-2.png","cards/pslab/w3-mon-3.png","cards/pslab/w3-mon-4.png","cards/pslab/w3-mon-5.png","cards/pslab/w3-mon-6.png"],"status":"planned"},{"id":"w3-wed","topic":"브랜딩","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-07-15T10:00:00.000Z","kicker":"Brand Strategy","headline":"후기가 10개도 없는데\u003cbr>*광고부터* 돌린다고?","sub":"신뢰 자산 없이 광고를 태우면 새는 이유.","dayLabel":"수요일 · 브랜딩","cardImage":"cards/pslab/w3-wed-1.png","captionNote":"신뢰 자산 없이 광고를 태우면 새는 이유.","captionBody":"후기 10개도 없는데 광고부터 돌린다고요? 잠깐만요.\n\n광고는 “신뢰 위에” 부어야 효율이 납니다.\n신뢰 자산(후기·사용 사례·콘텐츠)이 비면, 들어온 트래픽이 그냥 빠져나가요.\n비싼 클릭으로 빈 그릇을 채우는 셈입니다.\n\n광고 예산의 일부를 먼저 “믿을 이유”를 쌓는 데 쓰세요. 순서가 효율을 만듭니다.\n\n#브랜딩 #마케팅전략 #온라인마케팅","variant":"C","slideImages":["cards/pslab/w3-wed-1.png","cards/pslab/w3-wed-2.png","cards/pslab/w3-wed-3.png","cards/pslab/w3-wed-4.png","cards/pslab/w3-wed-5.png"],"status":"planned"},{"id":"w3-fri","topic":"마케팅인사이트","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-07-17T10:00:00.000Z","kicker":"Marketing Insight","headline":"트렌드를 좇다 망한\u003cbr>브랜드들의 *공통점*","sub":"유행 추종과 본질. 트렌드를 제대로 쓰는 법.","dayLabel":"금요일 · 인사이트","cardImage":"cards/pslab/w3-fri-1.png","captionNote":"유행 추종과 본질. 트렌드를 제대로 쓰는 법.","captionBody":"트렌드를 좇다 사라진 브랜드들엔 공통점이 있습니다 — “왜”가 없었어요.\n\n유행은 “무엇”을 바꾸게 합니다. 하지만 본질(누구에게, 왜)이 없으면\n트렌드가 끝나는 순간 같이 끝납니다.\n\n트렌드는 “올라타는 것”이 아니라 “내 메시지를 실어 보내는 파도”입니다.\n좇지 말고, 태우세요.\n\n#마케팅인사이트 #온라인시장트렌드 #브랜딩","variant":"C","slideImages":["cards/pslab/w3-fri-1.png","cards/pslab/w3-fri-2.png","cards/pslab/w3-fri-3.png","cards/pslab/w3-fri-4.png","cards/pslab/w3-fri-5.png"],"status":"planned"},{"id":"w4-mon","topic":"퍼포먼스마케팅","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-07-20T10:00:00.000Z","kicker":"Ad Ops","headline":"예산의 *80%*를\u003cbr>어디에 써야 할까","sub":"테스트·확장·리타겟 배분 원칙.","dayLabel":"월요일 · 광고운영","cardImage":"cards/pslab/w4-mon-1.png","captionNote":"테스트·확장·리타겟 배분 원칙.","captionBody":"광고 예산, 어디에 얼마를 쓸지부터 틀리면 다 틀립니다.\n\n제 기준은 70-20-10입니다.\n- 70% 검증된 승자(확장)\n- 20% 새 타겟·소재 테스트\n- 10% 과감한 실험\n\n전부 “잘 되는 것”에 몰면 성장은 멈추고, 전부 “새것”에 걸면 돈이 셉니다.\n배분이 곧 전략입니다.\n\n#퍼포먼스마케팅 #광고대행 #마케팅전략","variant":"A","slideImages":["cards/pslab/w4-mon-1.png","cards/pslab/w4-mon-2.png","cards/pslab/w4-mon-3.png","cards/pslab/w4-mon-4.png","cards/pslab/w4-mon-5.png","cards/pslab/w4-mon-6.png"],"status":"planned"},{"id":"w4-wed","topic":"마케팅전략","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-07-22T10:00:00.000Z","kicker":"Decision","headline":"대행을 맡길 때\u003cbr>vs *직접 할 때*","sub":"규모·역량·시간으로 보는 판단표.","dayLabel":"수요일 · 의사결정","cardImage":"cards/pslab/w4-wed-1.png","captionNote":"규모·역량·시간으로 보는 판단표.","captionBody":"대행을 맡길까, 직접 할까? 세 가지만 보세요.\n\n1. 규모 — 월 광고비가 인건비를 정당화하나요?\n2. 역량 — 내부에 “판단할 사람”이 있나요? (실행 말고 판단)\n3. 시간 — 배우며 할 6개월의 기회비용을 감당할 수 있나요?\n\n셋 다 “No”면 맡기고, “Yes”가 많으면 직접 + 부분 자문이 답입니다.\n정답은 없고, 상황만 있습니다.\n\n#광고대행 #마케팅전략 #사업이야기","variant":"A","slideImages":["cards/pslab/w4-wed-1.png","cards/pslab/w4-wed-2.png","cards/pslab/w4-wed-3.png","cards/pslab/w4-wed-4.png","cards/pslab/w4-wed-5.png","cards/pslab/w4-wed-6.png"],"status":"planned"},{"id":"w4-fri","topic":"사업이야기","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-07-24T10:00:00.000Z","kicker":"Growth","headline":"매출이 정체됐을 때\u003cbr>가장 먼저 보는 *지표*","sub":"신규획득과 재구매, 어디가 막혔는지 진단.","dayLabel":"금요일 · 성장","cardImage":"cards/pslab/w4-fri-1.png","captionNote":"신규획득과 재구매, 어디가 막혔는지 진단.","captionBody":"매출이 정체됐을 때, 저는 광고부터 보지 않습니다. “어디가 막혔는지”부터 봅니다.\n\n- 신규는 들어오는데 안 사면 → 전환(상세·가격·신뢰)\n- 사는데 안 늘면 → 획득(채널·타겟)\n- 한 번 사고 안 오면 → 재구매(경험·CRM)\n\n막힌 곳이 다르면 처방도 다릅니다. 정체는 “광고 부족”이 아니라 “진단 부족”인 경우가 많아요.\n\n#사업이야기 #마케팅인사이트 #성장전략","variant":"A","slideImages":["cards/pslab/w4-fri-1.png","cards/pslab/w4-fri-2.png","cards/pslab/w4-fri-3.png","cards/pslab/w4-fri-4.png","cards/pslab/w4-fri-5.png","cards/pslab/w4-fri-6.png"],"status":"planned"}],"stats":{"publishedCount":3,"pendingCount":12,"avgEngagement":0.03687668661269506,"trend":"up","totalViews":0,"totalLikes":0},"series":[11.06300598380852,0,0]},{"key":"threads","label":"스레드","icon":"🧵","active":false,"published":[],"pending":[{"id":"threads-07-04","topic":"온라인마케팅","format":"스레드(타래)","channels":["threads"],"scheduledFor":"2026-07-04T10:00:00.000Z","kicker":"Threads","headline":"광고비 태우기 전\u003cbr>점검 *3가지*","sub":"짧게 핵심만.","dayLabel":"스레드 · 타래","cardImage":"cards/pslab/threads-07-04-1.png","captionNote":"짧게 핵심만.","captionBody":"광고비, 켜기 전이 90%입니다. 🧵\n\n1) 타겟 — \"누구나\"는 \"아무도\"예요. 한 사람을 그리세요.\n\n2) 소재 — 첫 3초에 멈출 이유가 없으면 돈만 흐릅니다.\n\n3) 랜딩 — 클릭 다음 화면이 약하면 모든 클릭이 비용이에요.\n\n이 셋 맞추기 전에 예산부터 올리면? 적자는 정해진 결과입니다.","variant":"A","slideImages":["cards/pslab/threads-07-04-1.png"],"status":"planned"},{"id":"threads-07-07","topic":"업계비하인드","format":"스레드(타래)","channels":["threads"],"scheduledFor":"2026-07-07T10:00:00.000Z","kicker":"Threads","headline":"대행사가 *안 해주는* 말","sub":"솔직한 비하인드.","dayLabel":"스레드 · 타래","cardImage":"cards/pslab/threads-07-07-1.png","captionNote":"솔직한 비하인드.","captionBody":"대행사가 먼저 안 해주는 것들. 🧵\n\n· 수수료가 매체비의 %인지 고정인지에 따라 이해관계가 달라져요.\n\n· 리포트의 '좋아 보이는 지표'와 '매출 지표'는 다릅니다.\n\n· 계약 전, 누가 뭘 책임지는지 글로 남기세요.\n\n나쁜 대행이라서가 아니라, 안 물으면 굳이 말 안 하는 구조라서요.","variant":"B","slideImages":["cards/pslab/threads-07-07-1.png"],"status":"planned"},{"id":"threads-07-11","topic":"창업인사이트","format":"스레드(타래)","channels":["threads"],"scheduledFor":"2026-07-11T10:00:00.000Z","kicker":"Threads","headline":"돈 없이 마케팅\u003cbr>*가능한가*","sub":"검증부터.","dayLabel":"스레드 · 타래","cardImage":"cards/pslab/threads-07-11-1.png","captionNote":"검증부터.","captionBody":"\"돈 없으면 마케팅 못 하죠\" — 절반만 맞아요. 🧵\n\n돈이 필요한 건 '확장'이고, '검증'은 거의 공짜입니다.\n\n콘텐츠 몇 개, DM 몇 통, 작은 설문으로 \"살 사람이 있는지\"부터 확인하세요.\n\n수요 확인 전에 광고비부터 태우면, 가장 빠르게 망하는 길입니다.\n\n돈은 검증된 다음에 붓는 겁니다.","variant":"C","slideImages":["cards/pslab/threads-07-11-1.png"],"status":"planned"},{"id":"threads-07-14","topic":"퍼포먼스마케팅","format":"스레드(타래)","channels":["threads"],"scheduledFor":"2026-07-14T10:00:00.000Z","kicker":"Threads","headline":"클릭은 느는데\u003cbr>매출이 *그대로*","sub":"전환을 보라.","dayLabel":"스레드 · 타래","cardImage":"cards/pslab/threads-07-14-1.png","captionNote":"전환을 보라.","captionBody":"클릭은 느는데 매출은 그대로. 광고 탓일까요? 🧵\n\n대개 아니에요. 클릭은 '관심', 구매는 '확신'.\n\n랜딩 첫 화면 · 가격의 근거 · 후기.\n이 중 하나만 약해도 전환이 무너집니다.\n\n광고를 더 돌리기 전에, 클릭 다음 화면부터 보세요.","variant":"A","slideImages":["cards/pslab/threads-07-14-1.png"],"status":"planned"},{"id":"threads-07-18","topic":"브랜딩","format":"스레드(타래)","channels":["threads"],"scheduledFor":"2026-07-18T10:00:00.000Z","kicker":"Threads","headline":"*‘왜’*를 팔아라","sub":"기억되는 법.","dayLabel":"스레드 · 타래","cardImage":"cards/pslab/threads-07-18-1.png","captionNote":"기억되는 법.","captionBody":"사람은 '무엇'이 아니라 '왜'로 브랜드를 기억해요. 🧵\n\n기능은 경쟁사도 똑같이 말합니다. 차별은 '왜'에서 생겨요.\n\n작은 브랜드일수록 더 그렇습니다 — 자원이 적을수록 메시지가 무기니까.\n\n오늘 우리 브랜드의 '왜'를 한 문장으로 써보세요. 안 써지면, 그게 과제예요.","variant":"B","slideImages":["cards/pslab/threads-07-18-1.png"],"status":"planned"},{"id":"threads-07-21","topic":"마케팅전략","format":"스레드(타래)","channels":["threads"],"scheduledFor":"2026-07-21T10:00:00.000Z","kicker":"Threads","headline":"예산 배분\u003cbr>*70-20-10*","sub":"한 줄 원칙.","dayLabel":"스레드 · 타래","cardImage":"cards/pslab/threads-07-21-1.png","captionNote":"한 줄 원칙.","captionBody":"광고 예산 배분, 저는 70-20-10으로 갑니다. 🧵\n\n70% 검증된 승자(확장)\n20% 새 타겟·소재 테스트\n10% 과감한 실험\n\n전부 승자에 몰면 성장 정지, 전부 새것에 걸면 돈 누수.\n\n배분이 곧 전략입니다.","variant":"C","slideImages":["cards/pslab/threads-07-21-1.png"],"status":"planned"}],"stats":{"publishedCount":0,"pendingCount":6,"avgEngagement":0,"trend":"n/a","totalViews":0,"totalLikes":0},"series":[]},{"key":"naver-blog","label":"네이버 블로그","icon":"📝","active":false,"published":[],"pending":[{"id":"naver-blog-07-02","topic":"광고대행","format":"블로그 롱폼","channels":["naver-blog"],"scheduledFor":"2026-07-02T01:00:00.000Z","kicker":"Agency Guide","headline":"광고대행사 선택\u003cbr>맡기기 전 *5가지*","sub":"계약 전 체크리스트 — 15년차 솔직 후기.","dayLabel":"네이버블로그 · 롱폼","cardImage":"cards/pslab/naver-blog-07-02-1.png","captionNote":"계약 전 체크리스트 — 15년차 솔직 후기.","captionBody":"# 광고대행사 선택, 맡기기 전 꼭 확인할 5가지 (15년차 대표의 솔직 체크리스트)\n\n> [핵심 요약]\n> 광고대행은 '매출 보장'을 사는 게 아니라 '실행의 효율'을 사는 일입니다. 계약 전 ① 수수료 구조 ② 리포트 지표 ③ 실제 담당자 ④ 책임 범위(R&R) ⑤ 데이터 소유권, 이 5가지만 확인해도 실패 확률이 절반으로 줄어듭니다.\n\n상반기 결산이 끝나는 요즘, \"하반기엔 광고 제대로 해보자\"며 대행사를 알아보는 대표님이 부쩍 늘었습니다. 저도 15년간 대행을 해오며 수백 곳의 광고주를 만났는데요. 잘된 곳과 후회한 곳을 가른 건 예산이 아니라 '계약 전에 무엇을 확인했는가' 였습니다. 제 경험에서 추린 5가지를 공유합니다.\n\n## 1. 광고대행 수수료 구조 — %인가 고정인가\n가장 먼저 볼 건 수수료입니다. '매체비의 몇 %' 구조면 대행 입장에선 광고비를 더 쓰게 할 유인이 생깁니다. 고정 수수료면 그 유인은 없지만 효율 개선 동기가 약할 수 있고요. 정답은 없습니다. 다만 우리 상황(예산 규모, 성장 단계)에 맞는 구조인지, 그리고 그 구조가 대행의 행동을 어떻게 움직이는지를 이해하고 사인하세요.\n\n## 2. 리포트의 '진짜 지표' 확인하기\n제가 가장 많이 본 실패는 '예쁜 리포트'에 속은 경우입니다. 노출·클릭·CTR은 늘 좋아 보입니다. 하지만 통장에 찍히는 건 매출·전환·ROAS죠. 계약 전 리포트 양식을 미리 받아, 매출로 이어지는 지표가 들어있는지 보세요. 없다면 추가를 요청하세요.\n\n## 3. 영업이 아니라 '실제 운영 담당자'를 보라\n계약은 잘하는 영업이 따고, 운영은 신입이 하는 경우가 적지 않습니다. 내 계정을 실제로 만질 사람이 누구인지, 경력이 어떤지 물어보세요. 좋은 대행사는 이 질문을 반깁니다.\n\n## 4. 책임 범위(R&R)를 글로 남겨라\n소재 제작은 누가? 랜딩페이지는? CS는? 경계가 흐릿하면 성과가 안 날 때 서로를 탓하다 끝납니다. 계약 전에 'R&R 표'를 한 장 만들어 합의하세요. 이 한 장이 6개월 뒤의 분쟁을 막습니다.\n\n## 5. 종료 조건과 데이터 소유권\n의외로 가장 많이 놓치는 부분입니다. 계약이 끝났을 때 광고 계정·픽셀·전환 데이터를 우리가 온전히 가져올 수 있나요? 데이터는 다음 대행과 내부 운영의 자산입니다. 계약서에 소유권을 명시하세요.\n\n## 자주 묻는 질문 (FAQ)\n**Q. 광고대행 수수료는 보통 얼마인가요?**\nA. 매체비의 10~20%가 일반적이지만, 고정형·성과형도 있습니다. 금액보다 '구조가 우리에게 맞는가'가 더 중요합니다.\n\n**Q. 소액 광고도 대행을 맡길 수 있나요?**\nA. 가능합니다. 다만 월 광고비가 대행 수수료를 정당화하는 규모인지 따져보세요. 너무 작으면 직접 운영 + 부분 자문이 효율적입니다.\n\n**Q. 계약 기간은 어느 정도가 적당한가요?**\nA. 초기엔 3개월 단위를 권합니다. 데이터가 쌓이고 손발이 맞는지 본 뒤 연장하는 게 안전합니다.\n\n대행은 좋은 파트너를 만나면 분명 강력한 무기입니다. 다만 '맡기면 알아서 되겠지'가 아니라, 위 5가지를 확인하고 시작하셔야 그 무기가 우리 편이 됩니다. 도움이 되셨다면 저장해두고 계약 전에 한 번 더 펼쳐보세요.\n\n🔖 태그: #광고대행 #광고대행사선택 #온라인마케팅 #퍼포먼스마케팅 #마케팅대행","variant":"A","slideImages":["cards/pslab/naver-blog-07-02-1.png"],"status":"planned"},{"id":"naver-blog-07-09","topic":"퍼포먼스마케팅","format":"블로그 롱폼","channels":["naver-blog"],"scheduledFor":"2026-07-09T01:00:00.000Z","kicker":"Performance","headline":"클릭은 느는데\u003cbr>매출이 *안 오르는* 이유","sub":"전환율 점검 가이드 — 새는 곳을 찾아라.","dayLabel":"네이버블로그 · 롱폼","cardImage":"cards/pslab/naver-blog-07-09-1.png","captionNote":"전환율 점검 가이드 — 새는 곳을 찾아라.","captionBody":"# 광고 클릭은 느는데 매출이 안 오르는 이유 (전환율 점검 가이드)\n\n> [핵심 요약]\n> 클릭이 느는데 매출이 그대로라면, 십중팔구 광고가 아니라 '광고 다음 화면'이 문제입니다. 전환은 보통 ① 랜딩 첫 화면 ② 가격의 근거 ③ 신뢰 장치, 이 세 곳에서 샙니다. 광고비를 늘리기 전에 여기부터 점검하세요.\n\n\"대행사는 성과가 좋다는데 왜 매출은 그대로일까요?\" 요즘처럼 광고비가 비싸진 시기에 정말 자주 받는 질문입니다. 제가 컨설팅에서 가장 먼저 하는 일은 광고가 아니라 '클릭 이후'를 보는 것입니다. 광고를 멈추지 않고도 매출을 끌어올린 사례 대부분이 여기서 나왔습니다.\n\n## 클릭은 '관심', 구매는 '확신'\n클릭은 \"한번 볼까?\" 하는 관심입니다. 구매는 \"사도 되겠다\"는 확신이고요. 이 둘 사이에 다리가 없으면, 늘어난 클릭은 그대로 비용으로 끝납니다. 광고는 사람을 데려올 뿐, 사게 만드는 건 그다음 화면입니다.\n\n## 전환이 새는 3곳\n**1) 랜딩 첫 화면** — 3초 안에 '이게 나에게 왜 필요한지'가 안 보이면 이탈합니다. 첫 화면에 핵심 가치를 한 문장으로 박으세요.\n**2) 가격의 근거** — 비싸 보이면 안 삽니다. 가격을 정당화할 이유(비교, 가치, 보장)를 보여주세요.\n**3) 신뢰 장치** — 후기, 사용 사례, 환불 보장이 없으면 결제 직전에 멈칫합니다.\n\n## 전환율 1%의 차이\n전환율을 1%에서 2%로만 올려도, 같은 광고비로 매출이 2배가 됩니다. 광고비를 2배 쓰는 것보다 훨씬 싸고 빠른 길이죠. 그래서 저는 '유입'보다 '전환'을 먼저 봅니다.\n\n## 자주 묻는 질문 (FAQ)\n**Q. 전환율 몇 %가 정상인가요?**\nA. 업종·객단가마다 다르지만 이커머스 기준 1~3%가 흔합니다. 절대 수치보다 '우리 추세가 오르는가'가 중요합니다.\n\n**Q. 그래도 광고비를 늘려야 하지 않나요?**\nA. 전환이 새는 상태에서 광고비를 늘리면 비싼 클릭으로 빈 그릇을 채우는 셈입니다. 전환을 먼저 막고 늘리세요.\n\n성과는 '유입 × 전환 × 객단가'입니다. 유입만 보면 절반만 보는 겁니다. 오늘은 우리 랜딩페이지 첫 화면부터 다시 보시길 권합니다.\n\n🔖 태그: #퍼포먼스마케팅 #전환율 #랜딩페이지 #온라인마케팅 #광고최적화","variant":"B","slideImages":["cards/pslab/naver-blog-07-09-1.png"],"status":"planned"},{"id":"naver-blog-07-16","topic":"브랜딩","format":"블로그 롱폼","channels":["naver-blog"],"scheduledFor":"2026-07-16T01:00:00.000Z","kicker":"Branding","headline":"작은 브랜드일수록\u003cbr>*‘왜’*를 팔아야 한다","sub":"브랜드 메시지 설계법.","dayLabel":"네이버블로그 · 롱폼","cardImage":"cards/pslab/naver-blog-07-16-1.png","captionNote":"브랜드 메시지 설계법.","captionBody":"# 작은 브랜드일수록 '왜'를 팔아야 하는 이유 (브랜드 메시지 설계법)\n\n> [핵심 요약]\n> 작은 브랜드는 '무엇(기능·가격)'으로는 대기업을 이길 수 없습니다. 사람은 '무엇'이 아니라 '왜'로 브랜드를 기억하기 때문에, 작을수록 '왜'를 메시지로 설계해야 선택받습니다.\n\n요즘처럼 비슷한 제품이 쏟아지는 시장에서는, 기능만으로는 고를 이유를 주지 못합니다. 제가 브랜딩 컨설팅을 하며 반복해서 확인한 건 하나였습니다 — 오래 사랑받는 작은 브랜드는 예외 없이 '왜'가 분명했습니다.\n\n## 사람은 '왜'를 기억한다\n스펙은 잊혀도 \"이 사람들은 이래서 이걸 만들었대\"는 남습니다. 같은 제품도 '왜'가 붙으면 다른 물건이 됩니다. 대기업이 '무엇'으로 규모의 싸움을 할 때, 작은 브랜드는 '왜'로 마음의 싸움을 해야 이깁니다.\n\n## '왜'를 찾는 3가지 질문\n1) 우리는 어떤 불편을 못 참아서 시작했나?\n2) 고객의 어떤 순간을 바꾸고 싶은가?\n3) 우리가 절대 타협하지 않는 것은 무엇인가?\n이 세 질문의 답이 곧 '왜'의 재료입니다.\n\n## 메시지로 옮기기\n찾은 '왜'를 한 문장으로 압축하세요. 그리고 그 문장이 상세페이지 첫 줄, 인스타 프로필, 광고 후킹에 일관되게 흐르게 하세요. 메시지는 반복될 때 자산이 됩니다.\n\n## 자주 묻는 질문 (FAQ)\n**Q. 브랜드 메시지는 어떻게 한 문장으로 만드나요?**\nA. \"우리는 ___를 위해, ___를 ___하게 만든다\" 틀에 위 3질문의 답을 넣어 시작하세요. 다듬는 건 그다음입니다.\n\n**Q. '왜'가 잘 안 떠올라요.**\nA. 창업 당시의 불편·분노·아쉬움을 떠올려보세요. 거기에 거의 항상 '왜'가 숨어 있습니다.\n\n작을수록 메시지가 유일한 무기입니다. '무엇'으로 경쟁하지 말고 '왜'로 기억되세요. 오늘 우리 브랜드의 '왜'를 한 문장으로 적어보는 것부터 시작하시길 바랍니다.\n\n🔖 태그: #브랜딩 #브랜드메시지 #스몰브랜드 #마케팅전략 #창업","variant":"C","slideImages":["cards/pslab/naver-blog-07-16-1.png"],"status":"planned"},{"id":"naver-blog-07-23","topic":"마케팅전략","format":"블로그 롱폼","channels":["naver-blog"],"scheduledFor":"2026-07-23T01:00:00.000Z","kicker":"Budget","headline":"광고 예산 배분\u003cbr>*70-20-10* 법칙","sub":"실전 적용 가이드.","dayLabel":"네이버블로그 · 롱폼","cardImage":"cards/pslab/naver-blog-07-23-1.png","captionNote":"실전 적용 가이드.","captionBody":"# 광고 예산 배분의 정석: 70-20-10 법칙 (실전 적용 가이드)\n\n> [핵심 요약]\n> 광고 예산은 검증된 승자에 70%, 새 테스트에 20%, 과감한 도전에 10%로 나누세요. 전부 승자에 몰면 성장이 멈추고, 전부 새것에 걸면 돈이 샙니다. 배분 비율이 곧 전략입니다.\n\n하반기 예산을 다시 짜는 시기입니다. 소재를 아무리 잘 만들어도, 예산을 '어디에 얼마나' 쓸지부터 틀리면 결과가 안 납니다. 제가 15년간 크고 작은 계정에 적용해 온 배분 원칙이 70-20-10입니다.\n\n## 70% — 검증된 승자에\n이미 ROAS가 나오는 캠페인·소재·타겟에 예산의 대부분을 둡니다. 안정적으로 매출을 만드는 엔진이죠. 잘 도는 걸 괜히 건드리다 망치는 경우가 많으니, 여기는 지키세요.\n\n## 20% — 테스트에\n새 타겟, 새 소재, 새 채널을 실험하는 자리입니다. 다음 분기의 '승자'를 여기서 찾습니다. 이 20%가 없으면 당장은 효율이 좋아 보여도 성장은 멈춥니다.\n\n## 10% — 과감한 도전에\n완전히 새로운 시도(신규 플랫폼, 파격 크리에이티브)에 씁니다. 대부분 실패하지만, 가끔의 대박이 판을 바꿉니다. '잃어도 되는 돈'으로 미래를 삽니다.\n\n## 자주 묻는 질문 (FAQ)\n**Q. 예산이 적으면 어떻게 배분하나요?**\nA. 비율은 유지하되, 테스트·도전을 '한 번에 하나씩' 순차로 돌리세요. 동시에 여러 개를 테스트할 여력이 없을 뿐입니다.\n\n**Q. 70%의 승자가 식으면요?**\nA. 그래서 20% 테스트가 필요합니다. 승자가 식기 전에 다음 승자를 준비해 두는 구조입니다.\n\n배분이 곧 전략입니다. 소재를 고민하기 전에, 먼저 비율부터 정하세요. 이 한 장의 원칙이 1년 광고비의 효율을 가릅니다.\n\n🔖 태그: #광고예산 #퍼포먼스마케팅 #마케팅전략 #광고운영 #ROAS","variant":"A","slideImages":["cards/pslab/naver-blog-07-23-1.png"],"status":"planned"}],"stats":{"publishedCount":0,"pendingCount":4,"avgEngagement":0,"trend":"n/a","totalViews":0,"totalLikes":0},"series":[]},{"key":"youtube","label":"유튜브","icon":"▶️","active":false,"published":[],"pending":[{"id":"youtube-07-05","topic":"광고대행","format":"쇼츠 대본","channels":["youtube"],"scheduledFor":"2026-07-05T10:00:00.000Z","kicker":"Shorts","headline":"광고비 *날리는* 사장님 특징","sub":"30초 쇼츠.","dayLabel":"유튜브 · 쇼츠","cardImage":"cards/pslab/youtube-07-05-1.png","captionNote":"30초 쇼츠.","captionBody":"[HOOK · 0~3초]\n광고비 날리는 사장님들, 공통점이 있어요.\n\n[본론 · 3~25초]\n켜기 전 준비를 안 합니다.\n- 타겟이 \"누구나\" — 그럼 아무에게도 안 닿아요.\n- 소재가 평범 — 첫 3초에 멈출 이유가 없죠.\n- 랜딩이 부실 — 클릭해도 안 삽니다.\n이 셋 안 맞으면, 예산 올릴수록 적자예요.\n\n[CTA · 25~30초]\n켜기 전 이 3개부터. 저장해두세요.","variant":"A","slideImages":["cards/pslab/youtube-07-05-1.png"],"status":"planned"},{"id":"youtube-07-12","topic":"마케팅전략","format":"쇼츠 대본","channels":["youtube"],"scheduledFor":"2026-07-12T10:00:00.000Z","kicker":"Shorts","headline":"이 광고 *꺼야 할까*?","sub":"숫자 하나로 판단.","dayLabel":"유튜브 · 쇼츠","cardImage":"cards/pslab/youtube-07-12-1.png","captionNote":"숫자 하나로 판단.","captionBody":"[HOOK]\n\"이 광고 꺼야 하나, 더 둬야 하나?\" 감으로 정하지 마세요.\n\n[본론]\n숫자 하나면 됩니다. 손익분기 CPA.\n객단가 곱하기 마진율. 그게 허용 CPA예요.\n객단가 5만, 마진 40%면 → 2만원.\n지금 전환당 3만원? 끄거나 고치세요.\n\n[CTA]\n감이 아니라 산수입니다. 계산해 보세요.","variant":"B","slideImages":["cards/pslab/youtube-07-12-1.png"],"status":"planned"},{"id":"youtube-07-19","topic":"브랜딩","format":"쇼츠 대본","channels":["youtube"],"scheduledFor":"2026-07-19T10:00:00.000Z","kicker":"Shorts","headline":"작은 브랜드가 *이기는* 법","sub":"왜를 팔아라.","dayLabel":"유튜브 · 쇼츠","cardImage":"cards/pslab/youtube-07-19-1.png","captionNote":"왜를 팔아라.","captionBody":"[HOOK]\n작은 브랜드가 대기업을 이기는 유일한 방법.\n\n[본론]\n'무엇'으로 싸우지 마세요. 더 싸게, 더 많이는 못 이겨요.\n'왜'를 파세요.\n사람은 기능이 아니라 이유를 기억합니다.\n\"이 사람들은 왜 이걸 만들까\" — 거기에 답이 있으면 선택받아요.\n\n[CTA]\n우리 브랜드의 '왜', 한 문장으로 적어보세요.","variant":"C","slideImages":["cards/pslab/youtube-07-19-1.png"],"status":"planned"},{"id":"youtube-07-26","topic":"사업이야기","format":"쇼츠 대본","channels":["youtube"],"scheduledFor":"2026-07-26T10:00:00.000Z","kicker":"Shorts","headline":"매출 *정체* 풀리는 순서","sub":"병목부터 보라.","dayLabel":"유튜브 · 쇼츠","cardImage":"cards/pslab/youtube-07-26-1.png","captionNote":"병목부터 보라.","captionBody":"[HOOK]\n매출이 멈췄을 때, 광고부터 늘리면 안 되는 이유.\n\n[본론]\n매출은 신규 × 전환 × 재구매예요.\n- 오는데 안 산다 → 전환(상세·가격·신뢰)\n- 사는데 안 는다 → 획득(채널·타겟)\n- 한 번 사고 끝 → 재구매(경험·CRM)\n막힌 곳이 다른데 광고만 늘리면 돈만 새요.\n\n[CTA]\n정체는 광고 부족이 아니라 진단 부족입니다.","variant":"A","slideImages":["cards/pslab/youtube-07-26-1.png"],"status":"planned"}],"stats":{"publishedCount":0,"pendingCount":4,"avgEngagement":0,"trend":"n/a","totalViews":0,"totalLikes":0},"series":[]},{"key":"linkedin","label":"링크드인","icon":"💼","active":false,"published":[],"pending":[{"id":"linkedin-07-01","topic":"광고대행","format":"링크드인 포스트","channels":["linkedin"],"scheduledFor":"2026-06-30T23:00:00.000Z","kicker":"Insight","headline":"대행을 쓸 때\u003cbr>가장 중요한 *한 가지*","sub":"15년간 본 성공·실패의 갈림길.","dayLabel":"링크드인 · 비즈니스","cardImage":"cards/pslab/linkedin-07-01-1.png","captionNote":"15년간 본 성공·실패의 갈림길.","captionBody":"대행과 오래가는 광고주에겐 공통점이 하나 있습니다 — '기대치 정렬'.\n\n광고대행 15년, 수백 곳을 보며 내린 결론입니다. 성공과 실패를 가른 건 예산도 업종도 아니었어요.\n\n대행이 잘하는 건 실행의 효율입니다. 같은 예산으로 더 정교하게, 더 빠르게.\n하지만 '팔리는 상품'과 '살 이유'를 만드는 건 끝까지 브랜드의 몫입니다.\n\n이 경계를 처음에 합의한 광고주는 대행과 오래갑니다.\n\"매출은 알아서 오르겠지\"로 시작한 곳은 3개월 안에 서로를 탓하더군요.\n\n하반기 대행을 고민 중이라면, 맡기기 전에 딱 하나만 정하세요 — '우리가 끝까지 책임질 것'은 무엇인가.\n\n#마케팅 #광고대행 #퍼포먼스마케팅","variant":"A","slideImages":["cards/pslab/linkedin-07-01-1.png"],"status":"planned"},{"id":"linkedin-07-08","topic":"마케팅전략","format":"링크드인 포스트","channels":["linkedin"],"scheduledFor":"2026-07-07T23:00:00.000Z","kicker":"Decision","headline":"“이 광고 꺼야 하나”\u003cbr>판단하는 *숫자 하나*","sub":"감이 아니라 손익분기선으로.","dayLabel":"링크드인 · 비즈니스","cardImage":"cards/pslab/linkedin-07-08-1.png","captionNote":"감이 아니라 손익분기선으로.","captionBody":"\"이 광고 꺼야 하나?\"는 감이 아니라 숫자 하나로 정하면 됩니다 — 손익분기 CPA.\n\n대표님들이 가장 자주, 그리고 가장 감정적으로 내리는 결정이 광고를 끄고 켜는 일입니다. 기준을 드리겠습니다.\n\n(객단가 × 마진율) = 허용 CPA.\n실제 CPA가 이걸 넘으면, 켤수록 적자입니다.\n\n예) 객단가 5만원 × 마진 40% = 허용 CPA 2만원.\n지금 전환당 3만원이 든다면? 끄거나, 소재·타겟·랜딩을 고치세요.\n\n마케팅은 예술 같지만, 끄고 켜는 결정만큼은 산수입니다.\n이 한 줄을 모든 캠페인에 계산해 두면, 감정적 의사결정이 사라집니다.\n\n#마케팅전략 #퍼포먼스마케팅 #그로스","variant":"B","slideImages":["cards/pslab/linkedin-07-08-1.png"],"status":"planned"},{"id":"linkedin-07-15","topic":"브랜딩","format":"링크드인 포스트","channels":["linkedin"],"scheduledFor":"2026-07-14T23:00:00.000Z","kicker":"Branding","headline":"팔리는 브랜드는\u003cbr>*‘왜’*를 판다","sub":"기능이 아니라 이유로 기억된다.","dayLabel":"링크드인 · 비즈니스","cardImage":"cards/pslab/linkedin-07-15-1.png","captionNote":"기능이 아니라 이유로 기억된다.","captionBody":"경쟁사와 똑같은 기능을 말하고 있다면, 고객 입장에선 고를 이유가 없습니다.\n\n사람은 '무엇'이 아니라 '왜'로 브랜드를 기억합니다.\n\n스펙은 경쟁사도 똑같이 말합니다. 차별은 거기서 안 생깁니다.\n\"이 사람들은 왜 이걸 만들까\"에 답이 있을 때, 비로소 선택받습니다.\n\n특히 작은 브랜드일수록 그렇습니다. 자원이 적을수록 메시지가 유일한 무기니까요.\n\n오늘 한 가지만 해보세요.\n우리 브랜드의 '왜'를 한 문장으로 써보는 것.\n안 써진다면 — 그게 지금 가장 시급한 과제입니다.\n\n#브랜딩 #마케팅 #스타트업","variant":"C","slideImages":["cards/pslab/linkedin-07-15-1.png"],"status":"planned"},{"id":"linkedin-07-22","topic":"사업이야기","format":"링크드인 포스트","channels":["linkedin"],"scheduledFor":"2026-07-21T23:00:00.000Z","kicker":"Growth","headline":"매출이 정체됐을 때\u003cbr>먼저 보는 *지표*","sub":"광고가 아니라 병목부터.","dayLabel":"링크드인 · 비즈니스","cardImage":"cards/pslab/linkedin-07-22-1.png","captionNote":"광고가 아니라 병목부터.","captionBody":"매출이 정체되면 대부분 \"광고를 더 돌려야 하나\"부터 생각합니다.\n저는 광고를 마지막에 봅니다. 먼저 '어디가 막혔는지'를 봅니다.\n\n매출 = 신규획득 × 전환 × 재구매. 셋 중 어디가 막혔는지에 따라 처방이 완전히 다릅니다.\n\n· 신규는 오는데 안 산다 → 전환 문제 (상세·가격·신뢰)\n· 사는데 더 안 는다 → 획득 문제 (채널·타겟)\n· 한 번 사고 안 온다 → 재구매 문제 (경험·CRM)\n\n광고비를 붓는 건 '획득'에만 듣습니다.\n전환이 막혔는데 광고를 늘리면, 비싼 클릭으로 빈 그릇을 채우는 셈입니다.\n\n정체는 '광고 부족'이 아니라 '진단 부족'인 경우가 훨씬 많습니다.\n\n#그로스 #마케팅 #사업","variant":"A","slideImages":["cards/pslab/linkedin-07-22-1.png"],"status":"planned"}],"stats":{"publishedCount":0,"pendingCount":4,"avgEngagement":0,"trend":"n/a","totalViews":0,"totalLikes":0},"series":[]}],"blog":{"measured":false,"grade":"측정 전","score":0,"posts":[],"keywords":[{"kw":"온라인마케팅","searchIndex":28271,"competition":"보통"},{"kw":"마케팅인사이트","searchIndex":90527,"competition":"보통"},{"kw":"광고대행","searchIndex":15726,"competition":"높음"},{"kw":"퍼포먼스마케팅","searchIndex":70479,"competition":"높음"},{"kw":"온라인시장트렌드","searchIndex":34145,"competition":"보통"},{"kw":"마케팅전략","searchIndex":41224,"competition":"낮음"},{"kw":"사업이야기","searchIndex":38089,"competition":"낮음"},{"kw":"창업인사이트","searchIndex":20358,"competition":"높음"},{"kw":"브랜딩","searchIndex":35107,"competition":"낮음"},{"kw":"업계비하인드","searchIndex":63725,"competition":"보통"}]}}]};
const REPO = DATA.repo;
let ci = 0, ch = 'all';
// 카드 이미지 캐시버스팅 — 기획안 갱신 시에만 새로 받게 버전 쿼리 부여
const VER = (((DATA.clients[0]||{}).planUpdatedAt)||DATA.generatedAt||'').replace(/\D/g,'').slice(0,14);
const imgv = s => !s ? s : (s + (s.indexOf('?')<0?'?':'&') + 'v=' + VER);
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const ftime = s => !s?'-':String(s).replace('T',' ').slice(0,16);
const pct = v => (v*100).toFixed(1)+'%';
const tIcon = t => ({up:'📈',down:'📉','n/a':'·'}[t]||'·');
function issue(title, body){
  return 'https://github.com/'+REPO+'/issues/new?labels=feedback&title='+encodeURIComponent(title)+'&body='+encodeURIComponent(body);
}
function sparkline(arr){
  if(!arr||arr.length<2) return '';
  const w=160,h=34,mx=Math.max(...arr,1),mn=Math.min(...arr,0);
  const dx=w/(arr.length-1);
  const pts=arr.map((v,i)=>[i*dx,h-((v-mn)/(mx-mn||1))*(h-6)-3]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  return '<svg class="spark" width="'+w+'" height="'+h+'"><path d="'+d+'" fill="none" stroke="#2b6fff" stroke-width="2"/></svg>';
}
function publishedCard(p, badge){
  const img=p.imageUrl?'<img class="thumb" src="'+esc(p.imageUrl)+'" loading="lazy" alt=""/>':'<div class="thumb noimg">이미지 없음</div>';
  const link=p.url?'<a href="'+esc(p.url)+'" target="_blank">열기 ↗</a>':'';
  return '<div class="card">'+img+'<div class="cbody"><div class="ctop"><strong>'+esc(p.topic)+'</strong>'+badge+'</div>'+
    '<div class="muted">'+ftime(p.time)+'</div>'+
    '<div class="cap">'+esc(p.caption||'')+'</div>'+
    '<div class="met"><span>👁 '+p.views+'</span><span>❤ '+p.likes+'</span><span>💬 '+p.comments+'</span><span>'+pct(p.engagementRate)+'</span></div>'+
    '<div>'+link+'</div></div></div>';
}
function plainHead(it){ return it.headline?it.headline.replace(/<br>/g,' ').replace(/\*/g,''):it.topic; }
function vBadge(v){ return v?'<span class="badge b-var v-'+esc(v)+'">디자인 '+esc(v)+'</span>':''; }
function slideCount(it){ return (it.slideImages&&it.slideImages.length)||1; }
function planCard(client, chLabel, it){
  const img=it.cardImage?'<img class="thumb" src="'+esc(imgv(it.cardImage))+'" loading="lazy" alt=""/>':'<div class="thumb noimg">카드 준비중</div>';
  const head=esc(plainHead(it));
  const n=slideCount(it);
  const carBadge=n>1?'<span class="badge b-car">📑 '+n+'장</span>':'';
  const pub=it.status==='published';
  const stBadge=pub?'<span class="badge b-ok">발행됨</span>':'<span class="badge b-plan">예정</span>';
  const right=pub&&it.publishedUrl?'<a href="'+esc(it.publishedUrl)+'" target="_blank" onclick="event.stopPropagation()">열기 ↗</a>':'<span class="muted">클릭하면 전체보기 →</span>';
  return '<div class="card clk" onclick="openDetail(\''+esc(it.id)+'\')">'+
    '<div class="thumbwrap">'+img+carBadge+'</div>'+
    '<div class="cbody"><div class="ctop"><strong>'+head+'</strong>'+stBadge+'</div>'+
    '<div class="muted">🗓 '+ftime(it.scheduledFor)+(it.dayLabel?' · '+esc(it.dayLabel):'')+'</div>'+
    (it.captionNote?'<div class="cap">'+esc(it.captionNote)+'</div>':'')+
    '<div class="met" style="justify-content:space-between;align-items:center">'+vBadge(it.variant)+right+'</div></div></div>';
}
function openDetail(id){
  const c=DATA.clients[ci];
  const it=(c.planCards||[]).find(x=>x.id===id); if(!it) return;
  const t='['+c.name+'] 콘텐츠 수정요청: '+plainHead(it);
  const b='이 콘텐츠 수정/방향 요청을 남겨주세요.\n\n- 헤드라인: '+plainHead(it)+'\n- 예정: '+ftime(it.scheduledFor)+'\n- 디자인: '+(it.variant||'')+'\n\n[수정 요청]\n';
  const imgs=(it.slideImages&&it.slideImages.length)?it.slideImages:(it.cardImage?[it.cardImage]:[]);
  const chDef=DATA.channels.find(x=>x.key===((it.channels||[])[0]))||{icon:'📸',label:'인스타그램',key:'instagram'};
  const isCarousel=imgs.length>1;
  const capLabel=chDef.key==='naver-blog'?'📝 블로그 본문':chDef.key==='youtube'?'🎬 쇼츠 대본':chDef.key==='threads'?'🧵 스레드 타래':chDef.key==='linkedin'?'💼 링크드인 포스트':'📝 발행 캡션';
  const slides=imgs.map((s,i)=>'<div class="slide"><img src="'+esc(imgv(s))+'" alt=""/><span class="snum">'+(i+1)+' / '+imgs.length+'</span></div>').join('');
  const cap=fmtCaption(it.captionBody||it.captionNote||'');
  document.getElementById('mbody').innerHTML=
    '<div class="kick">'+esc(it.kicker||'')+' · 디자인 '+esc(it.variant||'')+(isCarousel?' · 📑 캐러셀 '+imgs.length+'장':'')+'</div>'+
    '<h2 style="margin:2px 0 4px">'+esc(plainHead(it))+'</h2>'+
    '<div class="muted" style="margin-bottom:14px">🗓 '+ftime(it.scheduledFor)+(it.dayLabel?' · '+esc(it.dayLabel):'')+' · '+chDef.icon+' '+esc(chDef.label)+' · <span class="badge b-plan">발행 대기</span></div>'+
    '<div class="carou">'+slides+'</div>'+
    (isCarousel?'<div class="muted" style="margin:6px 0 14px">← 좌우로 넘겨 보세요 ('+imgs.length+'장)</div>':'<div style="height:8px"></div>')+
    '<div class="capbox"><div class="caphd">'+capLabel+'</div><div class="mcap">'+cap+'</div></div>'+
    '<div style="margin-top:16px;display:flex;gap:8px"><a class="btn fb" href="'+issue(t,b)+'" target="_blank">✏️ 수정요청</a><button class="btn" onclick="closeModal()">닫기</button></div>';
  document.getElementById('modal').classList.add('on');
  const car=document.querySelector('.carou'); if(car) car.scrollLeft=0;
}
function closeModal(){ document.getElementById('modal').classList.remove('on'); }
// 블로그/대본 등 본문의 가벼운 마크다운(## 소제목, [HOOK] 등)을 보기 좋게
function mdInline(x){ return esc(x).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>'); }
function fmtCaption(s){
  return String(s||'').split('\n').map(line=>{
    const t=line.trim();
    if(t.startsWith('## ')) return '<h4 class="md-h">'+mdInline(t.slice(3))+'</h4>';
    if(t.startsWith('# ')) return '<h3 class="md-h1">'+mdInline(t.slice(2))+'</h3>';
    if(t==='>'||t.startsWith('> ')) return '<div class="md-quote">'+mdInline(t.replace(/^>\s?/,''))+'</div>';
    if(t.indexOf('🔖')===0) return '<div class="md-tags">'+esc(t)+'</div>';
    if(/^\[.+\]$/.test(t)) return '<div class="md-tag">'+esc(t)+'</div>';
    if(t==='---'||t==='') return '<div class="md-sp"></div>';
    return '<div>'+mdInline(line)+'</div>';
  }).join('');
}
function channelDetail(client, c){
  const chLabel=(DATA.channels.find(x=>x.key===c.key)||{}).label||c.key;
  let h='';
  // 기획안 패널
  const planTitle='['+client.name+'/'+chLabel+'] 기획안 피드백';
  const planBody='이 채널 기획안에 대한 피드백/수정사항을 적어주세요.\n\n[현재 기획안]\n- 키워드: '+client.keywords.join(', ')+'\n- 브랜드 말투: '+client.brandTone+'\n- 발행시간: '+client.schedule.join(', ')+'\n- 디자인 스타일: '+client.designStyle.mood+' / '+client.designStyle.palette+'\n\n[수정 요청]\n';
  h+='<div class="panel"><div class="sect-h" style="margin:0 0 8px"><h3>📋 기획안</h3><a class="btn fb" href="'+issue(planTitle,planBody)+'" target="_blank">✏️ 기획안 피드백</a></div>'+
     '<div>'+client.keywords.map(k=>'<span class="tag">#'+esc(k)+'</span>').join('')+'</div>'+
     '<div class="muted" style="margin-top:8px">말투: '+esc(client.brandTone)+' · 발행 '+client.schedule.join(', ')+' · 검수 '+esc(client.reviewMode)+' · 디자인 v'+client.designVersion+'</div>'+
     '<div class="muted">디자인 스타일: '+esc(client.designStyle.mood)+' / '+esc(client.designStyle.palette)+' / '+esc(client.designStyle.composition)+'</div></div>';
  if(!c.active){
    h+='<div class="panel"><div class="empty">이 채널은 아직 <b>연결되지 않았습니다</b>. 설정표(targets)에 '+chLabel+'을 추가하고 키를 연결하면 자동 발행이 시작됩니다.</div></div>';
  }
  // KPI
  h+='<div class="kpis">'+
    kpi(c.stats.publishedCount,'발행됨')+
    kpi(c.stats.pendingCount,'발행 대기')+
    kpi(pct(c.stats.avgEngagement)+' '+tIcon(c.stats.trend),'평균 참여율',true)+
    kpi(c.stats.totalViews,'누적 조회')+
    kpi(c.stats.totalLikes,'누적 좋아요')+'</div>';
  if(c.series&&c.series.length>1){h+='<div class="panel"><h3>반응도 추세 (참여율 %)</h3>'+sparkline(c.series)+'</div>';}
  // 네이버 블로그 → blogdex 스타일
  if(c.key==='naver-blog'){ h+=blogSection(client); }
  // 발행 대기
  h+='<div class="sect-h"><h2>🕓 발행 대기 콘텐츠 ('+c.pending.length+')</h2></div>';
  h+= c.pending.length? '<div class="cards">'+c.pending.map(it=>planCard(client,chLabel,it)).join('')+'</div>' : '<div class="empty">예정된 콘텐츠가 없습니다. 다음 사이클에 자동 생성됩니다.</div>';
  // 발행됨
  h+='<div class="sect-h"><h2>✅ 발행된 콘텐츠 ('+c.published.length+')</h2></div>';
  h+= c.published.length? '<div class="cards">'+c.published.map(p=>publishedCard(p,'<span class="badge b-ok">발행</span>')).join('')+'</div>' : '<div class="empty">아직 발행된 콘텐츠가 없습니다.</div>';
  return h;
}
function blogSection(client){
  const b=client.blog;
  const color = b.score>=70?'#15331f':b.score>=40?'#33290f':'#262b3a';
  const fg = b.score>=70?'#4ade80':b.score>=40?'#ffb454':'#9aa3b5';
  let h='<div class="panel"><div class="sect-h" style="margin:0 0 10px"><h3>📊 블로그 지수 (blogdex 스타일)</h3><span class="muted">내부 추정 · 네이버 연동 시 실측 교체</span></div>';
  h+='<div class="row"><div class="grade" style="background:'+color+';color:'+fg+'">'+esc(b.grade)+'</div>'+
     '<div style="flex:1;min-width:160px"><div class="muted">종합 점수 '+b.score+'/100</div><div class="bar"><i style="width:'+b.score+'%"></i></div></div></div>';
  // 포스팅 분석
  if(b.posts.length){
    h+='<table style="margin-top:12px"><tr><th>포스팅</th><th>전문성</th><th>연관성</th><th>품질</th></tr>'+
      b.posts.slice(0,8).map(p=>'<tr><td>'+esc(p.topic)+'</td><td>'+p.expertise+'</td><td>'+p.relevance+'</td><td>'+p.quality+'</td></tr>').join('')+'</table>';
  }
  // 키워드 분석
  h+='<table style="margin-top:12px"><tr><th>키워드</th><th>검색지수</th><th>경쟁도</th></tr>'+
    b.keywords.map(k=>'<tr><td>#'+esc(k.kw)+'</td><td>'+k.searchIndex.toLocaleString()+'</td><td>'+esc(k.competition)+'</td></tr>').join('')+'</table>';
  h+='</div>';
  return h;
}
function overview(client){
  let h='<div class="kpis">'+
    kpi(client.totalCycles,'총 사이클')+
    kpi(client.totalPublished,'총 발행')+
    kpi(client.heldCount,'승인 대기',client.heldCount>0)+
    kpi('v'+client.designVersion,'디자인 진화')+'</div>';
  h+='<div class="panel"><h3>채널별 요약</h3><table><tr><th>채널</th><th>상태</th><th>발행</th><th>대기</th><th>평균 참여율</th></tr>'+
    client.channels.map(c=>{const lab=(DATA.channels.find(x=>x.key===c.key)||{});
      return '<tr><td>'+lab.icon+' '+lab.label+'</td><td>'+(c.active?'<span class="badge b-ok">연결</span>':'<span class="badge b-hold">미연결</span>')+'</td><td>'+c.stats.publishedCount+'</td><td>'+c.stats.pendingCount+'</td><td>'+pct(c.stats.avgEngagement)+' '+tIcon(c.stats.trend)+'</td></tr>';}).join('')+'</table></div>';
  // 이번 달 콘텐츠 기획안 — 채널별로 묶어서 (채널별 순차 검수)
  const plan=client.planCards||[];
  const fbTitle='['+client.name+'] 기획안 전체 피드백';
  const fbBody='이번 달 기획안에 대한 의견/수정사항을 적어주세요.\n\n';
  h+='<div class="sect-h"><h2>📅 7월 콘텐츠 기획안 ('+plan.length+')</h2><a class="btn fb" href="'+issue(fbTitle,fbBody)+'" target="_blank">✏️ 기획안 피드백</a></div>';
  if(!plan.length){ h+='<div class="empty">기획안이 아직 없습니다.</div>'; }
  else {
    for(const chDef of DATA.channels){
      const items=plan.filter(p=>(p.channels||[]).includes(chDef.key));
      if(!items.length) continue;
      const lab=chDef.icon+' '+chDef.label;
      h+='<div class="chgrp"><div class="chgrp-h">'+lab+' <span class="muted">'+items.length+'건 · '+esc((items[0].format)||'')+'</span></div>'+
         '<div class="cards">'+items.map(p=>planCard(client,chDef.label,p)).join('')+'</div></div>';
    }
  }
  // 경쟁사 + 최근 발행 미리보기
  h+='<div class="panel" style="margin-top:16px"><h3>벤치마킹 경쟁사</h3><div>'+(client.competitors.length?client.competitors.map(x=>'<span class="tag">@'+esc(x)+'</span>').join(''):'<span class="muted">미설정</span>')+'</div></div>';
  const recent=[].concat(...client.channels.map(c=>c.published)).sort((a,b)=>(b.time||'').localeCompare(a.time||'')).slice(0,8);
  h+='<div class="sect-h"><h2>✅ 최근 발행</h2></div>';
  h+= recent.length?'<div class="cards">'+recent.map(p=>publishedCard(p,'<span class="badge b-ok">발행</span>')).join('')+'</div>':'<div class="empty">아직 발행된 콘텐츠가 없습니다. (검수 우선 — 승인 후 발행)</div>';
  return h;
}
function kpi(v,l,accent){return '<div class="kpi"><div class="v'+(accent?' accent':'')+'">'+v+'</div><div class="l">'+l+'</div></div>';}
function renderClients(){
  document.getElementById('clients').innerHTML = DATA.clients.length>1 ? DATA.clients.map((c,i)=>'<button class="cbtn'+(i===ci?' on':'')+'" onclick="setClient('+i+')">'+esc(c.name)+'</button>').join('') : '';
}
function renderTabs(){
  const c=DATA.clients[ci];
  const tabs=[{key:'all',label:'전체',icon:'🏠',active:true}].concat(DATA.channels.map(ch=>{const cc=c.channels.find(x=>x.key===ch.key);return {key:ch.key,label:ch.label,icon:ch.icon,active:cc&&cc.active};}));
  document.getElementById('tabs').innerHTML = tabs.map(t=>'<button class="tab'+(t.key===ch?' on':'')+'" onclick="setCh(\''+t.key+'\')">'+t.icon+' '+t.label+(t.key!=='all'?'<span class="dot '+(t.active?'live':'off')+'"></span>':'')+'</button>').join('');
}
function renderView(){
  const c=DATA.clients[ci];
  document.getElementById('view').innerHTML = ch==='all'?overview(c):channelDetail(c,c.channels.find(x=>x.key===ch));
  document.getElementById('gen').textContent = ftime(DATA.generatedAt)+' (UTC)';
}
function setClient(i){ci=i;ch='all';renderClients();renderTabs();renderView();window.scrollTo(0,0);}
function setCh(k){ch=k;renderTabs();renderView();window.scrollTo(0,0);}
renderClients();renderTabs();renderView();
</script>
</body>
