hed","publishedUrl":"https://www.instagram.com/p/DaK2fegjYUt/","metrics":{"views":3,"likes":2,"comments":0,"shares":0,"engagementRate":0.6666666666666666},"insightComment":"참여율 66.7%로 평균(15.3%)을 웃돌았어요. 디자인 A안·결론 우선 구조가 먹힌 것으로 보입니다 — 다음에도 같은 톤을 유지하세요.","publishedAt":"2026-06-29T12:19:41.176Z"},{"id":"threads-07-07","topic":"업계비하인드","format":"스레드(타래)","channels":["threads"],"scheduledFor":"2026-07-02T09:00:00.000Z","kicker":"Threads","headline":"대행사가 *안 해주는* 말","sub":"솔직한 비하인드.","dayLabel":"스레드 · 타래","cardImage":"cards/pslab/threads-07-07-1.png","captionNote":"솔직한 비하인드.","captionBody":"대행사가 먼저 안 해주는 것들. 🧵\n\n· 수수료가 매체비의 %인지 고정인지에 따라 이해관계가 달라져요.\n\n· 리포트의 '좋아 보이는 지표'와 '매출 지표'는 다릅니다.\n\n· 계약 전, 누가 뭘 책임지는지 글로 남기세요.\n\n나쁜 대행이라서가 아니라, 안 물으면 굳이 말 안 하는 구조라서요.","variant":"B","slideImages":["cards/pslab/threads-07-07-1.png"],"status":"published","publishedUrl":"https://www.threads.com/@_pslab/post/DaSgRE-IAw4","metrics":{"views":15,"likes":0,"comments":0,"shares":0,"engagementRate":0},"insightComment":"조회 15·좋아요 0. 노출 대비 반응을 키우려면 첫 3초 후킹을 강화하세요.","publishedAt":"2026-07-02T11:39:25.721Z"},{"id":"youtube-07-05","topic":"광고대행","format":"쇼츠 대본","channels":["youtube"],"scheduledFor":"2026-07-03T09:00:00.000Z","kicker":"Shorts","headline":"광고비 *날리는* 사장님 특징","sub":"30초 쇼츠.","dayLabel":"유튜브 · 쇼츠","cardImage":"cards/pslab/youtube-07-05-1.png","captionNote":"30초 쇼츠.","captionBody":"[HOOK · 0~3초]\n광고비 날리는 사장님들, 공통점이 있어요.\n\n[본론 · 3~25초]\n켜기 전 준비를 안 합니다.\n- 타겟이 \"누구나\" — 그럼 아무에게도 안 닿아요.\n- 소재가 평범 — 첫 3초에 멈출 이유가 없죠.\n- 랜딩이 부실 — 클릭해도 안 삽니다.\n이 셋 안 맞으면, 예산 올릴수록 적자예요.\n\n[CTA · 25~30초]\n켜기 전 이 3개부터. 저장해두세요.","variant":"A","slideImages":["cards/pslab/youtube-07-05-1.png"],"status":"published","publishedUrl":"https://youtu.be/ulDu8KIb_0Y","publishedAt":"2026-07-03T11:37:56.889Z","videoFile":"shorts/youtube-07-05/youtube-07-05.mp4","ytTitle":"광고비 날리는 사장님 3가지 특징｜광고 켜기 전 필수 점검 #shorts","ytDescription":"광고비를 태우기 전에 이 3가지부터 점검하세요. 타겟·소재·랜딩페이지가 안 맞으면 예산을 올릴수록 적자입니다.\n\n✅ 이 영상에서 다루는 것\n· 광고 타겟을 \"누구나\"로 잡으면 안 되는 이유\n· 첫 3초에 멈추게 하는 광고 소재\n· 클릭 후 전환을 막는 랜딩페이지 문제\n\n소상공인·자영업 사장님, 광고대행을 맡기기 전 직접 점검하고 싶은 분께 추천합니다.\n\n📌 더 많은 실전 마케팅 인사이트 → @_pslab\n👍 도움이 됐다면 구독과 저장!\n\n#광고비 #소상공인마케팅 #퍼포먼스마케팅 #광고대행 #온라인마케팅 #마케팅전략 #자영업 #창업 #shorts","ytTags":["광고비 절약","소상공인 마케팅","퍼포먼스 마케팅","광고 타겟팅","상세페이지","광고대행사","온라인마케팅","마케팅 전략","자영업 광고","창업 마케팅"]},{"id":"blogger-07-02","topic":"대행사와 3년 일하며 후회한 것, 잘한 것","format":"blogger","channels":["blogger"],"scheduledFor":"2026-07-03T09:00:00.000Z","kicker":"Agency","headline":"대행사와 3년 일하며 후회한 것, 잘한 것","sub":"결론부터: 대행사는 \"맡기는 것\"이 아니라 \"같이 운영하는 것\"입니다. 통째로 맡기면 반드시 후회합니다.","dayLabel":"구글 블로그","cardImage":"cards/pslab/blogger-07-02-1.png","captionNote":"결론부터: 대행사는 \"맡기는 것\"이 아니라 \"같이 운영하는 것\"입니다. 통째로 맡기면 반드시 후회합니다.","captionBody":"# 대행사와 3년 일하며 후회한 것, 잘한 것\n> [핵심 요약] 결론부터: 대행사는 \"맡기는 것\"이 아니라 \"같이 운영하는 것\"입니다. 통째로 맡기면 반드시 후회합니다.\n\n제안서 비교만 하던 시절엔 늘 실패했습니다. 방식을 바꾸고 나서야 대행이 일하기 시작했죠. 직접 겪은 후회 둘, 잘한 셋을 풉니다.\n\n## 후회 1 — \"알아서 해주세요\"라고 맡긴 것\n브랜드를 가장 잘 아는 건 결국 우리입니다. 방향을 안 주면 대행사는 무난한 평균값으로 갑니다. 결과는 \"나쁘진 않은데 아무것도 아닌\" 광고였습니다.\n![후회 1 — \"알아서 해주세요\"라고 맡긴 것](https://leejiho-pslab.github.io/pslab/blog/blogger-07-02/fig-1.png)\n\n## 후회 2 — 매주 숫자를 안 본 것\n한 달에 한 번 보고만 받으니, 안 되는 소재에 3주를 버렸습니다. 대시보드를 같이 보기 시작한 뒤로 낭비가 절반으로 줄었습니다.\n![후회 2 — 매주 숫자를 안 본 것](https://leejiho-pslab.github.io/pslab/blog/blogger-07-02/fig-2.png)\n\n## 잘한 1 — 소재 아이디어를 우리가 던진 것\n현장의 고객 질문, 후기, 반품 사유 — 이게 최고의 광고 소재입니다. 대행사는 이걸 모릅니다. 우리가 소재를 던지고 대행사가 다듬자 반응이 올랐습니다.\n![잘한 1 — 소재 아이디어를 우리가 던진 것](https://leejiho-pslab.github.io/pslab/blog/blogger-07-02/fig-3.png)\n\n## 잘한 2 — 역할을 문서로 나눈 것\n\"누가 무엇을, 언제까지\"를 한 장으로 정리했습니다. 책임이 분명해지자 핑퐁이 사라졌죠.\n![잘한 2 — 역할을 문서로 나눈 것](https://leejiho-pslab.github.io/pslab/blog/blogger-07-02/fig-4.png)\n\n## 자주 묻는 질문\n**Q. 대행사를 바꿔야 할 신호는?**\n3개월 연속 같은 변명, 매출 언어 부재, 담당자 잦은 교체 — 셋 중 둘이면 교체를 검토하세요.\n\n**Q. 소액인데 같이 운영이 가능한가요?**\n오히려 소액일수록 우리가 소재를 주도해야 효율이 납니다.\n\n대행을 통째로 맡기지 마세요. 방향은 우리가, 실행은 대행사가 — 이 경계가 성과를 만듭니다.\n\n🔖 태그: #광고대행사 #마케팅 #협업 #성과관리","variant":"A","slideImages":["cards/pslab/blogger-07-02-1.png"],"status":"published","publishedUrl":"https://pslab2026.blogspot.com/2026/06/3.html","metrics":{"views":0,"likes":0,"comments":0,"shares":0,"engagementRate":0},"insightComment":"조회 0·좋아요 0. 노출 대비 반응을 키우려면 첫 3초 후킹을 강화하세요.","publishedAt":"2026-06-30T02:24:22.852Z"},{"id":"blogger-07-09","topic":"전환율을 두 배로 올린 랜딩페이지 점검표","format":"blogger","channels":["blogger"],"scheduledFor":"2026-07-03T09:00:00.000Z","kicker":"Landing","headline":"전환율을 두 배로 올린 랜딩페이지 점검표","sub":"광고를 안 바꾸고 페이지만 고쳐 전환율을 2배로 올린 적이 있습니다. 그때 쓴 점검표를 공개합니다.","dayLabel":"구글 블로그","cardImage":"cards/pslab/blogger-07-09-1.png","captionNote":"광고를 안 바꾸고 페이지만 고쳐 전환율을 2배로 올린 적이 있습니다. 그때 쓴 점검표를 공개합니다.","captionBody":"# 전환율을 두 배로 올린 랜딩페이지 점검표\n> [핵심 요약] 광고를 안 바꾸고 페이지만 고쳐 전환율을 2배로 올린 적이 있습니다. 그때 쓴 점검표를 공개합니다.\n\n소재를 아무리 바꿔도 매출이 안 늘던 브랜드가 있었습니다. 광고는 그대로 두고 페이지만 9곳 고쳤더니 전환율이 두 배가 됐죠.\n\n## 히어로 영역: 한 문장으로 끝내라\n맨 위 한 문장이 \"무엇을, 누구에게, 왜 좋은지\"를 못 담으면 아래는 안 읽힙니다. 형용사 말고 숫자와 결과로 쓰세요.\n![히어로 영역: 한 문장으로 끝내라](https://leejiho-pslab.github.io/pslab/blog/blogger-07-09/fig-1.png)\n\n## 증거를 위로 올려라\n후기·인증·수상·판매수를 페이지 하단에 묻어두지 마세요. 첫 화면 바로 아래로 올리면 신뢰가 빨라집니다.\n![증거를 위로 올려라](https://leejiho-pslab.github.io/pslab/blog/blogger-07-09/fig-2.png)\n\n## CTA는 한 가지만\n\"구매·상담·뉴스레터\" 세 개를 동시에 권하면 아무것도 안 누릅니다. 페이지마다 행동 하나로 좁히세요.\n![CTA는 한 가지만](https://leejiho-pslab.github.io/pslab/blog/blogger-07-09/fig-3.png)\n\n## 모바일에서 다시 보라\n트래픽의 80%는 모바일입니다. 데스크톱에서 멀쩡해도 모바일에서 버튼이 접히거나 글자가 작으면 거기서 매출이 샙니다.\n![모바일에서 다시 보라](https://leejiho-pslab.github.io/pslab/blog/blogger-07-09/fig-4.png)\n\n## 자주 묻는 질문\n**Q. 몇 개를 한 번에 바꿔야 하나요?**\n한 번에 하나씩 바꿔 A/B로 검증하는 게 정석이지만, 트래픽이 적으면 묶어서 크게 바꾸고 추세를 보세요.\n\n**Q. 전환율은 어디서 보나요?**\nGA4·네이버 애널리틱스의 구매전환 이벤트로 단계별 이탈을 봅니다.\n\n광고를 더 만지기 전에 이 점검표로 페이지부터 고치세요. 가장 싸게 매출을 올리는 방법입니다.\n\n🔖 태그: #랜딩페이지 #전환율 #CRO #상세페이지","variant":"B","slideImages":["cards/pslab/blogger-07-09-1.png"],"status":"published","publishedUrl":"https://pslab2026.blogspot.com/2026/07/blog-post.html","metrics":{"views":0,"likes":0,"comments":0,"shares":0,"engagementRate":0},"insightComment":"조회 0·좋아요 0. 노출 대비 반응을 키우려면 첫 3초 후킹을 강화하세요.","publishedAt":"2026-07-03T11:37:58.921Z"},{"id":"w2-mon","topic":"마케팅전략","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-07-04T09:00:00.000Z","kicker":"Decision","headline":"이 광고, 꺼야 할까?\u003cbr>판단하는 *숫자 하나*","sub":"감으로 끄지 마세요. 손익분기 한 줄 계산법.","dayLabel":"월요일 · 의사결정","cardImage":"cards/pslab/w2-mon-1.png","captionNote":"감으로 끄지 마세요. 손익분기 한 줄 계산법.","captionBody":"“이 광고 꺼야 하나, 더 둬야 하나” 감으로 정하지 마세요.\n\n판단은 숫자 하나로 충분합니다 — 손익분기 CPA.\n(객단가 × 마진율)이 허용 CPA입니다. 실제 CPA가 이걸 넘으면, 켤수록 적자.\n\n예) 객단가 5만 × 마진 40% = 허용 CPA 2만원. 지금 3만이면? 끄거나 고치세요.\n감이 아니라 선이 결정합니다.\n\n#퍼포먼스마케팅 #마케팅전략 #광고대행","variant":"B","slideImages":["cards/pslab/w2-mon-1.png","cards/pslab/w2-mon-2.png","cards/pslab/w2-mon-3.png","cards/pslab/w2-mon-4.png","cards/pslab/w2-mon-5.png"],"status":"published","publishedUrl":"https://www.instagram.com/p/DaXlHvkjzDc/","metrics":{"views":3,"likes":1,"comments":0,"shares":0,"engagementRate":0.3333333333333333},"insightComment":"참여율 33.3%로 평균(15.3%)을 웃돌았어요. 디자인 B안·결론 우선 구조가 먹힌 것으로 보입니다 — 다음에도 같은 톤을 유지하세요.","publishedAt":"2026-07-04T10:57:58.853Z"},{"id":"threads-07-04","topic":"온라인마케팅","format":"스레드(타래)","channels":["threads"],"scheduledFor":"2026-07-04T10:00:00.000Z","kicker":"Threads","headline":"광고비 태우기 전\u003cbr>점검 *3가지*","sub":"짧게 핵심만.","dayLabel":"스레드 · 타래","cardImage":"cards/pslab/threads-07-04-1.png","captionNote":"짧게 핵심만.","captionBody":"광고비, 켜기 전이 90%입니다. 🧵\n\n1) 타겟 — \"누구나\"는 \"아무도\"예요. 한 사람을 그리세요.\n\n2) 소재 — 첫 3초에 멈출 이유가 없으면 돈만 흐릅니다.\n\n3) 랜딩 — 클릭 다음 화면이 약하면 모든 클릭이 비용이에요.\n\n이 셋 맞추기 전에 예산부터 올리면? 적자는 정해진 결과입니다.","variant":"A","slideImages":["cards/pslab/threads-07-04-1.png"],"status":"published","publishedUrl":"https://www.threads.com/@_pslab/post/DaIUz7QGpp_","publishedAt":"2026-06-28T12:46:54.616Z"},{"id":"threads-07-11","topic":"창업인사이트","format":"스레드(타래)","channels":["threads"],"scheduledFor":"2026-07-05T09:00:00.000Z","kicker":"Threads","headline":"돈 없이 마케팅\u003cbr>*가능한가*","sub":"검증부터.","dayLabel":"스레드 · 타래","cardImage":"cards/pslab/threads-07-11-1.png","captionNote":"검증부터.","captionBody":"\"돈 없으면 마케팅 못 하죠\" — 절반만 맞아요. 🧵\n\n돈이 필요한 건 '확장'이고, '검증'은 거의 공짜입니다.\n\n콘텐츠 몇 개, DM 몇 통, 작은 설문으로 \"살 사람이 있는지\"부터 확인하세요.\n\n수요 확인 전에 광고비부터 태우면, 가장 빠르게 망하는 길입니다.\n\n돈은 검증된 다음에 붓는 겁니다.","variant":"C","slideImages":["cards/pslab/threads-07-11-1.png"],"status":"published","publishedUrl":"https://www.threads.com/@_pslab/post/DaaLHIOGybk","metrics":{"views":76,"likes":0,"comments":0,"shares":0,"engagementRate":0},"insightComment":"조회 76·좋아요 0. 노출 대비 반응을 키우려면 첫 3초 후킹을 강화하세요.","publishedAt":"2026-07-05T11:08:27.476Z"},{"id":"youtube-07-12","topic":"마케팅전략","format":"쇼츠 대본","channels":["youtube"],"scheduledFor":"2026-07-06T09:00:00.000Z","kicker":"Shorts","headline":"이 광고 *꺼야 할까*?","sub":"숫자 하나로 판단.","dayLabel":"유튜브 · 쇼츠","cardImage":"cards/pslab/youtube-07-12-1.png","captionNote":"숫자 하나로 판단.","captionBody":"[HOOK]\n\"이 광고 꺼야 하나, 더 둬야 하나?\" 감으로 정하지 마세요.\n\n[본론]\n숫자 하나면 됩니다. 손익분기 CPA.\n객단가 곱하기 마진율. 그게 허용 CPA예요.\n객단가 5만, 마진 40%면 → 2만원.\n지금 전환당 3만원? 끄거나 고치세요.\n\n[CTA]\n감이 아니라 산수입니다. 계산해 보세요.","variant":"B","slideImages":["cards/pslab/youtube-07-12-1.png"],"status":"published","publishedUrl":"https://youtu.be/43G-r4KHvUs","publishedAt":"2026-07-06T12:54:52.581Z","videoFile":"shorts/youtube-07-12/youtube-07-12.mp4","ytTitle":"광고 끌까 말까? 숫자 하나로 정하세요｜손익분기 CPA 계산법 #shorts","ytDescription":"\"이 광고 꺼야 하나, 더 둬야 하나?\" 감으로 정하지 마세요. 손익분기 CPA 하나면 됩니다.\n\n✅ 허용 CPA = 객단가 × 마진율\n예) 객단가 5만원 × 마진 40% = 2만원\n전환당 3만원이면? 끄거나 고치세요.\n\n광고 효율(ROAS)이 헷갈리는 사장님, 광고를 감이 아니라 숫자로 판단하고 싶은 분께.\n\n📌 실전 광고 운영 노하우 → @_pslab\n👍 도움이 됐다면 구독!\n\n#CPA #ROAS #광고효율 #퍼포먼스마케팅 #광고비 #손익분기 #온라인마케팅 #마케팅전략 #shorts","ytTags":["손익분기 CPA","ROAS","광고 효율","퍼포먼스 마케팅","광고비 계산","객단가 마진율","광고 끄는 기준","온라인마케팅","광고 최적화","마케팅 전략"]},{"id":"blogger-07-16","topic":"작은 브랜드가 대기업과 '다르게' 싸우는 4가지 방법","format":"blogger","channels":["blogger"],"scheduledFor":"2026-07-06T09:00:00.000Z","kicker":"Strategy","headline":"작은 브랜드가 대기업과 '다르게' 싸우는 4가지 방법","sub":"대기업과 같은 방식으로 싸우면 집니다. 작을 때만 쓸 수 있는 무기 네 가지로 판을 바꾸세요.","dayLabel":"구글 블로그","cardImage":"cards/pslab/blogger-07-16-1.png","captionNote":"대기업과 같은 방식으로 싸우면 집니다. 작을 때만 쓸 수 있는 무기 네 가지로 판을 바꾸세요.","captionBody":"# 작은 브랜드가 대기업과 '다르게' 싸우는 4가지 방법\n> [핵심 요약] 대기업과 같은 방식으로 싸우면 집니다. 작을 때만 쓸 수 있는 무기 네 가지로 판을 바꾸세요.\n\n예산도 인력도 밀리는데 같은 운동장에서 싸우면 당연히 집니다. 작을 때만 가능한 방식이 따로 있습니다.\n\n## 1. 속도로 싸운다\n대기업은 의사결정이 느립니다. 우리는 오늘 본 트렌드를 내일 콘텐츠로 만들 수 있죠. 시의성은 작은 브랜드의 가장 큰 무기입니다.\n![1. 속도로 싸운다](https://leejiho-pslab.github.io/pslab/blog/blogger-07-16/fig-1.png)\n\n## 2. 좁은 시장 1등을 노린다\n전체 시장 10등보다, 좁은 카테고리 1등이 훨씬 강합니다. \"○○ 하면 이 브랜드\"가 되는 한 칸을 먼저 차지하세요.\n![2. 좁은 시장 1등을 노린다](https://leejiho-pslab.github.io/pslab/blog/blogger-07-16/fig-2.png)\n\n## 3. 얼굴을 보여준다\n대기업은 브랜드 뒤에 숨지만, 작은 브랜드는 사람이 앞에 설 수 있습니다. 창업자·직원의 얼굴과 과정이 곧 차별화입니다.\n![3. 얼굴을 보여준다](https://leejiho-pslab.github.io/pslab/blog/blogger-07-16/fig-3.png)\n\n## 4. 팬을 만든다\n100만 명에게 한 번 보이는 것보다, 1,000명이 매번 사주고 소문내는 게 강합니다. 작은 브랜드는 도달이 아니라 관계로 큽니다.\n![4. 팬을 만든다](https://leejiho-pslab.github.io/pslab/blog/blogger-07-16/fig-4.png)\n\n## 자주 묻는 질문\n**Q. 좁히면 시장이 너무 작지 않나요?**\n처음엔 좁게 1등 → 인접 카테고리로 확장이 정석입니다. 넓게 시작해 망하는 경우가 더 많습니다.\n\n**Q. 얼굴 노출이 부담스러워요.**\n꼭 대표가 아니어도 됩니다. 과정·손·작업 현장만 보여도 사람 냄새가 납니다.\n\n대기업의 방식을 따라 하지 마세요. 속도·집중·사람·관계 — 작을 때만 쓸 수 있는 무기로 싸우세요.\n\n🔖 태그: #스몰브랜드 #마케팅전략 #포지셔닝 #차별화","variant":"C","slideImages":["cards/pslab/blogger-07-16-1.png"],"status":"published","publishedUrl":"https://pslab2026.blogspot.com/2026/07/4.html","metrics":{"views":0,"likes":0,"comments":0,"shares":0,"engagementRate":0},"insightComment":"조회 0·좋아요 0. 노출 대비 반응을 키우려면 첫 3초 후킹을 강화하세요.","publishedAt":"2026-07-06T12:54:54.333Z"},{"id":"w2-wed","topic":"퍼포먼스마케팅","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-07-07T09:00:00.000Z","kicker":"Ad Ops","headline":"클릭은 느는데\u003cbr>매출이 *안 느는 이유*","sub":"클릭은 구매가 아닙니다. 전환이 새는 지점.","dayLabel":"수요일 · 광고운영","cardImage":"cards/pslab/w2-wed-1.png","captionNote":"클릭은 구매가 아닙니다. 전환이 새는 지점.","captionBody":"클릭은 느는데 매출은 그대로. 광고가 문제일까요?\n\n대개 아닙니다. 클릭은 “관심”이고 구매는 “확신”이에요. 둘 사이에서 새는 겁니다.\n랜딩의 첫 화면, 가격을 납득시키는 근거, 후기 같은 신뢰 장치 —\n이 중 하나만 약해도 클릭은 비용으로 끝납니다.\n\n광고를 더 돌리기 전에, 클릭 다음 화면부터 점검하세요.\n\n#퍼포먼스마케팅 #온라인마케팅 #전환율","variant":"B","slideImages":["cards/pslab/w2-wed-1.png","cards/pslab/w2-wed-2.png","cards/pslab/w2-wed-3.png","cards/pslab/w2-wed-4.png","cards/pslab/w2-wed-5.png"],"status":"published","publishedUrl":"https://www.instagram.com/p/DafckBAmnn9/","metrics":{"views":4,"likes":1,"comments":0,"shares":0,"engagementRate":0.25},"insightComment":"참여율 25.0%로 평균(15.3%)을 웃돌았어요. 디자인 B안·결론 우선 구조가 먹힌 것으로 보입니다 — 다음에도 같은 톤을 유지하세요.","publishedAt":"2026-07-07T12:17:07.179Z"},{"id":"threads-07-14","topic":"퍼포먼스마케팅","format":"스레드(타래)","channels":["threads"],"scheduledFor":"2026-07-08T09:00:00.000Z","kicker":"Threads","headline":"클릭은 느는데\u003cbr>매출이 *그대로*","sub":"전환을 보라.","dayLabel":"스레드 · 타래","cardImage":"cards/pslab/threads-07-14-1.png","captionNote":"전환을 보라.","captionBody":"클릭은 느는데 매출은 그대로. 광고 탓일까요? 🧵\n\n대개 아니에요. 클릭은 '관심', 구매는 '확신'.\n\n랜딩 첫 화면 · 가격의 근거 · 후기.\n이 중 하나만 약해도 전환이 무너집니다.\n\n광고를 더 돌리기 전에, 클릭 다음 화면부터 보세요.","variant":"A","slideImages":["cards/pslab/threads-07-14-1.png"],"status":"published","publishedUrl":"https://www.threads.com/@_pslab/post/Dah5rq9nBc_","metrics":{"views":21,"likes":0,"comments":0,"shares":0,"engagementRate":0},"insightComment":"조회 21·좋아요 0. 노출 대비 반응을 키우려면 첫 3초 후킹을 강화하세요.","publishedAt":"2026-07-08T11:10:04.327Z"},{"id":"youtube-07-19","topic":"브랜딩","format":"쇼츠 대본","channels":["youtube"],"scheduledFor":"2026-07-09T09:00:00.000Z","kicker":"Shorts","headline":"작은 브랜드가 *이기는* 법","sub":"왜를 팔아라.","dayLabel":"유튜브 · 쇼츠","cardImage":"cards/pslab/youtube-07-19-1.png","captionNote":"왜를 팔아라.","captionBody":"[HOOK]\n작은 브랜드가 대기업을 이기는 유일한 방법.\n\n[본론]\n'무엇'으로 싸우지 마세요. 더 싸게, 더 많이는 못 이겨요.\n'왜'를 파세요.\n사람은 기능이 아니라 이유를 기억합니다.\n\"이 사람들은 왜 이걸 만들까\" — 거기에 답이 있으면 선택받아요.\n\n[CTA]\n우리 브랜드의 '왜', 한 문장으로 적어보세요.","variant":"C","slideImages":["cards/pslab/youtube-07-19-1.png"],"status":"published","publishedUrl":"https://youtu.be/rTEmo9xwl0o","publishedAt":"2026-07-09T12:21:57.879Z","videoFile":"shorts/youtube-07-19/youtube-07-19.mp4","ytTitle":"작은 브랜드가 대기업을 이기는 유일한 방법｜브랜딩의 핵심 #shorts","ytDescription":"작은 브랜드가 대기업을 이기는 방법은 '무엇'이 아니라 '왜'를 파는 것입니다.\n\n✅ 기능·가격으로 싸우면 집니다\n✅ 사람은 기능이 아니라 '이유'를 기억합니다\n✅ \"왜 이걸 만드는가\"에 답이 있으면 선택받습니다\n\n스몰브랜드·1인 창업·자영업 브랜딩을 고민하는 분께.\n\n📌 브랜딩·성장 인사이트 → @_pslab\n👍 도움이 됐다면 구독!\n\n#브랜딩 #스몰브랜드 #포지셔닝 #마케팅전략 #창업 #브랜드차별화 #온라인마케팅 #shorts","ytTags":["브랜딩","스몰브랜드","포지셔닝","브랜드 차별화","작은 브랜드 마케팅","창업 브랜딩","마케팅 전략","why 마케팅","온라인마케팅","브랜드 스토리"]},{"id":"blogger-07-23","topic":"월 100만원으로 시작하는 광고, 이렇게 나눴습니다","format":"blogger","channels":["blogger"],"scheduledFor":"2026-07-09T09:00:00.000Z","kicker":"Budget","headline":"월 100만원으로 시작하는 광고, 이렇게 나눴습니다","sub":"예산이 적을수록 분산은 독입니다. 월 100만원을 실제로 어떻게 쪼갰는지, 숫자 그대로 공개합니다.","dayLabel":"구글 블로그","cardImage":"cards/pslab/blogger-07-23-1.png","captionNote":"예산이 적을수록 분산은 독입니다. 월 100만원을 실제로 어떻게 쪼갰는지, 숫자 그대로 공개합니다.","captionBody":"# 월 100만원으로 시작하는 광고, 이렇게 나눴습니다\n> [핵심 요약] 예산이 적을수록 분산은 독입니다. 월 100만원을 실제로 어떻게 쪼갰는지, 숫자 그대로 공개합니다.\n\n\"예산이 적은데 어디에 써야 하나요?\"—가장 많이 받는 질문입니다. 월 100만원 기준, 제가 실제로 굴리는 방식입니다.\n\n## 먼저 70만원: 한 채널만 판다\n소액일수록 채널을 늘리면 안 됩니다. 우리 고객이 가장 많은 한 곳에 70만원을 몰아 데이터를 빨리 모으세요.\n![먼저 70만원: 한 채널만 판다](https://leejiho-pslab.github.io/pslab/blog/blogger-07-23/fig-1.png)\n\n## 20만원: 소재 실험에만 쓴다\n같은 채널 안에서 소재 3~4종을 20만원으로 돌립니다. 승자 소재를 찾으면 70만원이 더 잘 돕니다.\n![20만원: 소재 실험에만 쓴다](https://leejiho-pslab.github.io/pslab/blog/blogger-07-23/fig-2.png)\n\n## 10만원: 콘텐츠/후기 자산에 쓴다\n광고만으론 한계가 있습니다. 10만원은 후기 확보, 콘텐츠 제작 같은 \"쌓이는 자산\"에 투자하세요. 광고가 꺼져도 남습니다.\n![10만원: 콘텐츠/후기 자산에 쓴다](https://leejiho-pslab.github.io/pslab/blog/blogger-07-23/fig-3.png)\n\n## 석 달 뒤 숫자로 다시 정한다\n100만원을 3개월 돌리면 어디가 효율적인지 보입니다. 그때 비율을 키우거나 채널을 바꾸세요. 처음 배분은 가설일 뿐입니다.\n![석 달 뒤 숫자로 다시 정한다](https://leejiho-pslab.github.io/pslab/blog/blogger-07-23/fig-4.png)\n\n## 자주 묻는 질문\n**Q. 100만원도 안 되면요?**\n50만원이면 채널 하나 + 소재 실험만 하세요. 자산 투자는 매출이 나면 시작해도 늦지 않습니다.\n\n**Q. 어느 채널부터 시작할까요?**\n고객이 검색으로 오면 검색광고, 발견으로 오면 인스타·메타부터 테스트하세요.\n\n적은 예산일수록 \"나누지 말고 몰아주세요.\" 한 채널에서 이기는 공식을 먼저 찾는 게 순서입니다.\n\n🔖 태그: #소액광고 #광고예산 #스타트업마케팅 #예산배분","variant":"A","slideImages":["cards/pslab/blogger-07-23-1.png"],"status":"published","publishedUrl":"https://pslab2026.blogspot.com/2026/07/100.html","metrics":{"views":0,"likes":0,"comments":0,"shares":0,"engagementRate":0},"insightComment":"조회 0·좋아요 0. 노출 대비 반응을 키우려면 첫 3초 후킹을 강화하세요.","publishedAt":"2026-07-09T12:21:59.335Z"},{"id":"w2-fri","topic":"창업인사이트","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-07-10T09:00:00.000Z","kicker":"Startup","headline":"돈 없이 시작하는 마케팅,\u003cbr>*진짜 가능한가*","sub":"예산 0원부터 검증. 돈 쓰기 전에 할 것.","dayLabel":"금요일 · 창업","cardImage":"cards/pslab/w2-fri-1.png","captionNote":"예산 0원부터 검증. 돈 쓰기 전에 할 것.","captionBody":"“돈 없으면 마케팅 못 하죠” — 절반만 맞습니다.\n\n돈이 필요한 건 “확장”이고, “검증”은 거의 공짜로 가능합니다.\n콘텐츠 몇 개, DM 몇 통, 작은 설문으로 “살 사람이 있는지”부터 확인하세요.\n수요를 확인하기 전에 광고비부터 태우면, 빠르게 망하는 길입니다.\n\n돈은 검증된 다음에 붓는 겁니다.\n\n#창업인사이트 #사업이야기 #온라인마케팅","variant":"B","slideImages":["cards/pslab/w2-fri-1.png","cards/pslab/w2-fri-2.png","cards/pslab/w2-fri-3.png","cards/pslab/w2-fri-4.png","cards/pslab/w2-fri-5.png"],"status":"published","publishedUrl":"https://www.instagram.com/p/DanJLwVknio/","metrics":{"views":3,"likes":2,"comments":0,"shares":0,"engagementRate":0.6666666666666666},"insightComment":"참여율 66.7%로 평균(15.3%)을 웃돌았어요. 디자인 B안·결론 우선 구조가 먹힌 것으로 보입니다 — 다음에도 같은 톤을 유지하세요.","publishedAt":"2026-07-10T12:01:46.886Z"},{"id":"threads-07-18","topic":"브랜딩","format":"스레드(타래)","channels":["threads"],"scheduledFor":"2026-07-11T09:00:00.000Z","kicker":"Threads","headline":"*‘왜’*를 팔아라","sub":"기억되는 법.","dayLabel":"스레드 · 타래","cardImage":"cards/pslab/threads-07-18-1.png","captionNote":"기억되는 법.","captionBody":"사람은 '무엇'이 아니라 '왜'로 브랜드를 기억해요. 🧵\n\n기능은 경쟁사도 똑같이 말합니다. 차별은 '왜'에서 생겨요.\n\n작은 브랜드일수록 더 그렇습니다 — 자원이 적을수록 메시지가 무기니까.\n\n오늘 우리 브랜드의 '왜'를 한 문장으로 써보세요. 안 써지면, 그게 과제예요.","variant":"B","slideImages":[ captionBody":"광고비, 켜기 전이 90%입니다.\n\n15년간 수백 개 계정을 만지며 깨달은 건 — 돈은 “운영”이 아니라 “준비”에서 샙니다.\n\n태우기 전 반드시 점검할 3가지\n1. 타겟 — “누구나”는 “아무도”입니다. 한 사람을 그리세요.\n2. 소재 — 첫 3초에 멈출 이유가 없으면 돈은 흐릅니다.\n3. 랜딩 — 클릭 다음 화면이 약하면 모든 클릭이 비용입니다.\n\n이 셋이 안 맞은 채 예산부터 올리는 순간, 적자는 정해집니다.\n\n#온라인마케팅 #광고대행 #퍼포먼스마케팅","variant":"A","slideImages":["cards/pslab/w1-mon-1.png","cards/pslab/w1-mon-2.png","cards/pslab/w1-mon-3.png","cards/pslab/w1-mon-4.png","cards/pslab/w1-mon-5.png","cards/pslab/w1-mon-6.png"],"status":"published","publishedUrl":"https://www.instagram.com/p/DaCerLaFY2L/","publishedAt":"2026-06-26T06:17:35.229Z"},{"id":"w1-wed","topic":"업계비하인드","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-07-01T10:00:00.000Z","kicker":"Agency Behind","headline":"대행사를 쓰면\u003cbr>매출이 오른다는 *착각*","sub":"대행이 할 수 있는 것과 없는 것, 솔직하게 말합니다.","dayLabel":"수요일 · 비하인드","cardImage":"cards/pslab/w1-wed-1.png","captionNote":"대행이 할 수 있는 것과 없는 것, 솔직하게 말합니다.","captionBody":"“대행 맡기면 알아서 매출 오르겠지” — 가장 많이 깨지는 기대입니다.\n\n대행이 잘하는 건 “실행의 효율”입니다. 같은 예산으로 더 정교하게, 더 빠르게.\n하지만 “팔리는 상품”과 “살 이유”를 만드는 건 결국 브랜드의 몫이에요.\n\n이 경계가 정렬되지 않으면, 대행도 광고주도 둘 다 지칩니다.\n맡기기 전에 “우리가 책임질 것”부터 정하세요.\n\n#마케팅인사이트 #광고대행 #사업이야기","variant":"A","slideImages":["cards/pslab/w1-wed-1.png","cards/pslab/w1-wed-2.png","cards/pslab/w1-wed-3.png","cards/pslab/w1-wed-4.png","cards/pslab/w1-wed-5.png"],"status":"published","publishedUrl":"https://www.instagram.com/p/DaK2fegjYUt/","metrics":{"views":3,"likes":2,"comments":0,"shares":0,"engagementRate":0.6666666666666666},"insightComment":"참여율 66.7%로 평균(15.3%)을 웃돌았어요. 디자인 A안·결론 우선 구조가 먹힌 것으로 보입니다 — 다음에도 같은 톤을 유지하세요.","publishedAt":"2026-06-29T12:19:41.176Z"},{"id":"w1-fri","topic":"브랜딩","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-07-01T09:00:00.000Z","kicker":"Brand Strategy","headline":"팔리는 브랜드는\u003cbr>‘무엇’이 아니라 *‘왜’*를 판다","sub":"작은 브랜드일수록 더 중요한 메시지 설계 이야기.","dayLabel":"금요일 · 브랜딩","cardImage":"cards/pslab/w1-fri-1.png","captionNote":"작은 브랜드일수록 더 중요한 메시지 설계 이야기.","captionBody":"사람들은 “무엇을 파는지”로 기억하지 않습니다. “왜 파는지”로 기억하죠.\n\n기능과 스펙은 경쟁사도 똑같이 말합니다. 차별은 “왜”에서 생깁니다.\n작은 브랜드일수록 더 그래요 — 자원이 적을수록 메시지가 무기니까.\n\n오늘 우리 브랜드의 “왜”를 한 문장으로 써보세요. 안 써지면, 그게 진짜 과제입니다.\n\n#브랜딩 #마케팅전략 #창업인사이트","variant":"A","slideImages":["cards/pslab/w1-fri-1.png","cards/pslab/w1-fri-2.png","cards/pslab/w1-fri-3.png","cards/pslab/w1-fri-4.png","cards/pslab/w1-fri-5.png"],"status":"published","publishedUrl":"https://www.instagram.com/p/DaP-NdfDv3F/","metrics":{"views":3,"likes":2,"comments":0,"shares":0,"engagementRate":0.6666666666666666},"insightComment":"참여율 66.7%로 평균(15.3%)을 웃돌았어요. 디자인 A안·결론 우선 구조가 먹힌 것으로 보입니다 — 다음에도 같은 톤을 유지하세요.","publishedAt":"2026-07-01T12:03:17.068Z"},{"id":"w2-mon","topic":"마케팅전략","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-07-04T09:00:00.000Z","kicker":"Decision","headline":"이 광고, 꺼야 할까?\u003cbr>판단하는 *숫자 하나*","sub":"감으로 끄지 마세요. 손익분기 한 줄 계산법.","dayLabel":"월요일 · 의사결정","cardImage":"cards/pslab/w2-mon-1.png","captionNote":"감으로 끄지 마세요. 손익분기 한 줄 계산법.","captionBody":"“이 광고 꺼야 하나, 더 둬야 하나” 감으로 정하지 마세요.\n\n판단은 숫자 하나로 충분합니다 — 손익분기 CPA.\n(객단가 × 마진율)이 허용 CPA입니다. 실제 CPA가 이걸 넘으면, 켤수록 적자.\n\n예) 객단가 5만 × 마진 40% = 허용 CPA 2만원. 지금 3만이면? 끄거나 고치세요.\n감이 아니라 선이 결정합니다.\n\n#퍼포먼스마케팅 #마케팅전략 #광고대행","variant":"B","slideImages":["cards/pslab/w2-mon-1.png","cards/pslab/w2-mon-2.png","cards/pslab/w2-mon-3.png","cards/pslab/w2-mon-4.png","cards/pslab/w2-mon-5.png"],"status":"published","publishedUrl":"https://www.instagram.com/p/DaXlHvkjzDc/","metrics":{"views":3,"likes":1,"comments":0,"shares":0,"engagementRate":0.3333333333333333},"insightComment":"참여율 33.3%로 평균(15.3%)을 웃돌았어요. 디자인 B안·결론 우선 구조가 먹힌 것으로 보입니다 — 다음에도 같은 톤을 유지하세요.","publishedAt":"2026-07-04T10:57:58.853Z"},{"id":"w2-wed","topic":"퍼포먼스마케팅","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-07-07T09:00:00.000Z","kicker":"Ad Ops","headline":"클릭은 느는데\u003cbr>매출이 *안 느는 이유*","sub":"클릭은 구매가 아닙니다. 전환이 새는 지점.","dayLabel":"수요일 · 광고운영","cardImage":"cards/pslab/w2-wed-1.png","captionNote":"클릭은 구매가 아닙니다. 전환이 새는 지점.","captionBody":"클릭은 느는데 매출은 그대로. 광고가 문제일까요?\n\n대개 아닙니다. 클릭은 “관심”이고 구매는 “확신”이에요. 둘 사이에서 새는 겁니다.\n랜딩의 첫 화면, 가격을 납득시키는 근거, 후기 같은 신뢰 장치 —\n이 중 하나만 약해도 클릭은 비용으로 끝납니다.\n\n광고를 더 돌리기 전에, 클릭 다음 화면부터 점검하세요.\n\n#퍼포먼스마케팅 #온라인마케팅 #전환율","variant":"B","slideImages":["cards/pslab/w2-wed-1.png","cards/pslab/w2-wed-2.png","cards/pslab/w2-wed-3.png","cards/pslab/w2-wed-4.png","cards/pslab/w2-wed-5.png"],"status":"published","publishedUrl":"https://www.instagram.com/p/DafckBAmnn9/","metrics":{"views":4,"likes":1,"comments":0,"shares":0,"engagementRate":0.25},"insightComment":"참여율 25.0%로 평균(15.3%)을 웃돌았어요. 디자인 B안·결론 우선 구조가 먹힌 것으로 보입니다 — 다음에도 같은 톤을 유지하세요.","publishedAt":"2026-07-07T12:17:07.179Z"},{"id":"w2-fri","topic":"창업인사이트","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-07-10T09:00:00.000Z","kicker":"Startup","headline":"돈 없이 시작하는 마케팅,\u003cbr>*진짜 가능한가*","sub":"예산 0원부터 검증. 돈 쓰기 전에 할 것.","dayLabel":"금요일 · 창업","cardImage":"cards/pslab/w2-fri-1.png","captionNote":"예산 0원부터 검증. 돈 쓰기 전에 할 것.","captionBody":"“돈 없으면 마케팅 못 하죠” — 절반만 맞습니다.\n\n돈이 필요한 건 “확장”이고, “검증”은 거의 공짜로 가능합니다.\n콘텐츠 몇 개, DM 몇 통, 작은 설문으로 “살 사람이 있는지”부터 확인하세요.\n수요를 확인하기 전에 광고비부터 태우면, 빠르게 망하는 길입니다.\n\n돈은 검증된 다음에 붓는 겁니다.\n\n#창업인사이트 #사업이야기 #온라인마케팅","variant":"B","slideImages":["cards/pslab/w2-fri-1.png","cards/pslab/w2-fri-2.png","cards/pslab/w2-fri-3.png","cards/pslab/w2-fri-4.png","cards/pslab/w2-fri-5.png"],"status":"published","publishedUrl":"https://www.instagram.com/p/DanJLwVknio/","metrics":{"views":3,"likes":2,"comments":0,"shares":0,"engagementRate":0.6666666666666666},"insightComment":"참여율 66.7%로 평균(15.3%)을 웃돌았어요. 디자인 B안·결론 우선 구조가 먹힌 것으로 보입니다 — 다음에도 같은 톤을 유지하세요.","publishedAt":"2026-07-10T12:01:46.886Z"},{"id":"w3-mon","topic":"업계비하인드","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-07-12T09:00:00.000Z","kicker":"Agency Behind","headline":"대행사가 절대\u003cbr>먼저 *말 안 해주는 것*","sub":"수수료 구조와 계약 전 꼭 물어야 할 질문.","dayLabel":"월요일 · 비하인드","cardImage":"cards/pslab/w3-mon-1.png","captionNote":"수수료 구조와 계약 전 꼭 물어야 할 질문.","captionBody":"대행사가 먼저 말 안 해주는 것들이 있습니다.\n\n- 수수료가 “매체비의 %”인지 “고정”인지에 따라 이해관계가 달라집니다.\n- 리포트의 “좋아 보이는 지표”와 “매출 지표”는 다릅니다.\n- 계약 전, 누가 무엇을 책임지는지 문서로 남기세요.\n\n나쁜 대행이라서가 아니라, 안 물으면 굳이 말 안 하는 구조라서예요.\n질문이 당신을 지킵니다.\n\n#광고대행 #마케팅인사이트 #업계비하인드","variant":"C","slideImages":["cards/pslab/w3-mon-1.png","cards/pslab/w3-mon-2.png","cards/pslab/w3-mon-3.png","cards/pslab/w3-mon-4.png","cards/pslab/w3-mon-5.png","cards/pslab/w3-mon-6.png"],"status":"published","publishedUrl":"https://www.instagram.com/p/DasJZPlnywV/","metrics":{"views":3,"likes":1,"comments":0,"shares":0,"engagementRate":0.3333333333333333},"insightComment":"참여율 33.3%로 평균(15.3%)을 웃돌았어요. 디자인 C안·결론 우선 구조가 먹힌 것으로 보입니다 — 다음에도 같은 톤을 유지하세요.","publishedAt":"2026-07-12T10:39:51.681Z"},{"id":"reels-07-27","topic":"ALWAYS ON · 문제 제기","format":"릴스","channels":["instagram"],"scheduledFor":"2026-07-27T09:00:00.000Z","kicker":"ALWAYS ON","headline":"마지막 게시물,\u003cbr>*언제 올리셨어요?*","sub":"3주 멈춘 SNS, 손님 눈엔 닫힌 가게입니다.","dayLabel":"월요일 · 릴스","cardImage":"cards/pslab/reels-07-27-1.png","captionNote":"문제 공감 훅 — 멈춘 계정의 신호 → ALWAYS ON 소개, 댓글 인터랙션 유도","captionBody":"사장님, 마지막 SNS 게시물 언제 올리셨어요?\n\n3주 멈춘 SNS는 손님 눈에 \"닫힌 가게\"로 보입니다. 그렇다고 매일 5개 채널을 혼자 올리는 건 애초에 무리예요. 의지가 아니라 구조의 문제거든요.\n\nALWAYS ON은 조사→제작→발행→성과 학습을 매일 자동으로 돌리는 SNS 채널 자동화 솔루션입니다. 사장님이 주무시는 동안에도 인스타·블로그·스레드·유튜브가 올라갑니다.\n\n장사에 집중하세요. 채널은 시스템이 지킵니다.\n\n💬 댓글에 \"온\"이라고 남기면 솔루션 소개서를 보내드려요.\n\n#ALWAYSON #얼웨이즈온 #SNS자동화 #SNS마케팅 #소상공인마케팅 #사장님","variant":"A","slideImages":["cards/pslab/reels-07-27-1.png"],"status":"published","publishedUrl":"https://www.instagram.com/reel/DbS9GeMDPVL/","metrics":{"views":98,"likes":2,"comments":0,"shares":0,"engagementRate":0.02040816326530612},"insightComment":"참여율 2.0%로 평균(15.3%)을 밑돌았어요. 첫 슬라이드 후킹과 결론 한 줄을 더 세게, 저장 유도 문구를 명확히 해보세요.","publishedAt":"2026-07-27T12:23:12.537Z","videoFile":"shorts/reels-07-27/reels-07-27.mp4","reelsScript":"[HOOK]\n마지막 게시물, 언제 올리셨어요?\n\n[본론]\n3주 멈춘 계정은 손님 눈엔 닫힌 가게.\n이제 5채널이 매일 자동으로.\n\n[CTA]\n댓글에 \"온\" — 소개서 보내드려요."},{"id":"car-07-29","topic":"ALWAYS ON · 솔루션 설명","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-07-29T09:00:00.000Z","kicker":"ALWAYS ON","headline":"오늘도 SNS,\u003cbr>*못 올리셨죠?*","sub":"괜찮습니다 — 안 올려도 올라가게 만들면 됩니다.","dayLabel":"수요일 · 캐러셀","cardImage":"cards/pslab/car-07-29-1.png","captionNote":"훅(공감 질문) → 솔루션 설명 → 가치 환산 → 저장·프로필 링크 CTA","captionBody":"오늘도 SNS 못 올리셨죠? 괜찮습니다. \"안 올려도 올라가게\" 만들면 되니까요.\n\nALWAYS ON은 16년차 광고대행사 P.S.LAB이 만든 SNS 채널 자동화 솔루션입니다.\n\n✔ 조사·기획부터 제작·발행·성과 학습까지 매일 자동\n✔ 인스타·네이버 블로그·구글 블로그·스레드·유튜브 5채널 동시 발행\n✔ 시장·경쟁사·키워드 조사로 반응 나올 주제부터 공략\n✔ 대시보드 링크 하나로 전 채널 관제 + 텔레그램 알림\n\n사람을 쓰면 월 300만원, 대행에 맡기면 월 500만원+. 그 일을 시스템이 대신합니다.\n\n💾 저장해두고, 프로필 링크에서 솔루션 소개서를 받아보세요.\n\n#ALWAYSON #얼웨이즈온 #SNS자동화 #SNS마케팅 #콘텐츠마케팅 #소상공인 #자영업","variant":"B","slideImages":["cards/pslab/car-07-29-1.png","cards/pslab/car-07-29-2.png","cards/pslab/car-07-29-3.png","cards/pslab/car-07-29-4.png","cards/pslab/car-07-29-5.png","cards/pslab/car-07-29-6.png","cards/pslab/car-07-29-7.png"],"status":"published","publishedUrl":"https://www.instagram.com/p/DbYCEecjfWg/","metrics":{"views":0,"likes":0,"comments":0,"shares":0,"engagementRate":0},"insightComment":"조회 0·좋아요 0. 노출 대비 반응을 키우려면 첫 3초 후킹을 강화하세요.","publishedAt":"2026-07-29T11:42:20.787Z"},{"id":"reels-07-31","topic":"ALWAYS ON · 가치 설득","format":"릴스","channels":["instagram"],"scheduledFor":"2026-07-31T09:00:00.000Z","kicker":"ALWAYS ON","headline":"SNS 대행 견적,\u003cbr>*받아보셨어요?*","sub":"5채널 대행 월 500만원+ — 시스템은 다르게 풉니다.","dayLabel":"금요일 · 릴스","cardImage":"cards/pslab/reels-07-31-1.png","captionNote":"비용 비교 훅 → 자동화 가치 환산 → 댓글 \"견적\" 인터랙션","captionBody":"SNS 5채널 대행 견적, 받아보면 월 500만원부터 시작합니다. 직원을 뽑으면 월 300만원, 직접 하면 내 시간이 월 40시간씩 들어가요.\n\nALWAYS ON은 이 일을 자동화 시스템으로 대신합니다.\n\n조사·제작·발행·성과 학습이 매일 자동으로 돌고, 1년이면 콘텐츠 700개가 쌓입니다. 검색과 AI 추천에 남는 브랜드 자산이라, 광고비처럼 사라지지 않아요.\n\n월 고정비는 상담을 통해 브랜드에 맞게 산정됩니다.\n\n💬 댓글에 \"견적\"이라고 남기거나, 프로필 링크에서 소개서를 받아보세요.\n\n#ALWAYSON #얼웨이즈온 #SNS자동화 #SNS대행 #마케팅비용 #소상공인마케팅","variant":"C","slideImages":["cards/pslab/reels-07-31-1.png"],"status":"planned","videoFile":"shorts/reels-07-31/reels-07-31.mp4","reelsScript":"[HOOK]\nSNS 대행 견적, 받아보셨어요?\n\n[본론]\n5채널이면 월 500만원부터.\n시스템은 1년에 콘텐츠 700개.\n\n[CTA]\n댓글에 \"견적\" — 소개서 보내드려요."}],"stats":{"publishedCount":3,"pendingCount":10,"avgEngagement":0.03687668661269506,"trend":"up","totalViews":0,"totalLikes":0},"series":[11.06300598380852,0,0]},{"key":"threads","label":"스레드","icon":"🧵","active":false,"published":[],"pending":[{"id":"threads-07-04","topic":"온라인마케팅","format":"스레드(타래)","channels":["threads"],"scheduledFor":"2026-07-04T10:00:00.000Z","kicker":"Threads","headline":"광고비 태우기 전\u003cbr>점검 *3가지*","sub":"짧게 핵심만.","dayLabel":"스레드 · 타래","cardImage":"cards/pslab/threads-07-04-1.png","captionNote":"짧게 핵심만.","captionBody":"광고비, 켜기 전이 90%입니다. 🧵\n\n1) 타겟 — \"누구나\"는 \"아무도\"예요. 한 사람을 그리세요.\n\n2) 소재 — 첫 3초에 멈출 이유가 없으면 돈만 흐릅니다.\n\n3) 랜딩 — 클릭 다음 화면이 약하면 모든 클릭이 비용이에요.\n\n이 셋 맞추기 전에 예산부터 올리면? 적자는 정해진 결과입니다.","variant":"A","slideImages":["cards/pslab/threads-07-04-1.png"],"status":"published","publishedUrl":"https://www.threads.com/@_pslab/post/DaIUz7QGpp_","publishedAt":"2026-06-28T12:46:54.616Z"},{"id":"threads-07-07","topic":"업계비하인드","format":"스레드(타래)","channels":["threads"],"scheduledFor":"2026-07-02T09:00:00.000Z","kicker":"Threads","headline":"대행사가 *안 해주는* 말","sub":"솔직한 비하인드.","dayLabel":"스레드 · 타래","cardImage":"cards/pslab/threads-07-07-1.png","captionNote":"솔직한 비하인드.","captionBody":"대행사가 먼저 안 해주는 것들. 🧵\n\n· 수수료가 매체비의 %인지 고정인지에 따라 이해관계가 달라져요.\n\n· 리포트의 '좋아 보이는 지표'와 '매출 지표'는 다릅니다.\n\n· 계약 전, 누가 뭘 책임지는지 글로 남기세요.\n\n나쁜 대행이라서가 아니라, 안 물으면 굳이 말 안 하는 구조라서요.","variant":"B","slideImages":["cards/pslab/threads-07-07-1.png"],"status":"published","publishedUrl":"https://www.threads.com/@_pslab/post/DaSgRE-IAw4","metrics":{"views":15,"likes":0,"comments":0,"shares":0,"engagementRate":0},"insightComment":"조회 15·좋아요 0. 노출 대비 반응을 키우려면 첫 3초 후킹을 강화하세요.","publishedAt":"2026-07-02T11:39:25.721Z"},{"id":"threads-07-11","topic":"창업인사이트","format":"스레드(타래)","channels":["threads"],"scheduledFor":"2026-07-05T09:00:00.000Z","kicker":"Threads","headline":"돈 없이 마케팅\u003cbr>*가능한가*","sub":"검증부터.","dayLabel":"스레드 · 타래","cardImage":"cards/pslab/threads-07-11-1.png","captionNote":"검증부터.","captionBody":"\"돈 없으면 마케팅 못 하죠\" — 절반만 맞아요. 🧵\n\n돈이 필요한 건 '확장'이고, '검증'은 거의 공짜입니다.\n\n콘텐츠 몇 개, DM 몇 통, 작은 설문으로 \"살 사람이 있는지\"부터 확인하세요.\n\n수요 확인 전에 광고비부터 태우면, 가장 빠르게 망하는 길입니다.\n\n돈은 검증된 다음에 붓는 겁니다.","variant":"C","slideImages":["cards/pslab/threads-07-11-1.png"],"status":"published","publishedUrl":"https://www.threads.com/@_pslab/post/DaaLHIOGybk","metrics":{"views":76,"likes":0,"comments":0,"shares":0,"engagementRate":0},"insightComment":"조회 76·좋아요 0. 노출 대비 반응을 키우려면 첫 3초 후킹을 강화하세요.","publishedAt":"2026-07-05T11:08:27.476Z"},{"id":"threads-07-14","topic":"퍼포먼스마케팅","format":"스레드(타래)","channels":["threads"],"scheduledFor":"2026-07-08T09:00:00.000Z","kicker":"Threads","headline":"클릭은 느는데\u003cbr>매출이 *그대로*","sub":"전환을 보라.","dayLabel":"스레드 · 타래","cardImage":"cards/pslab/threads-07-14-1.png","captionNote":"전환을 보라.","captionBody":"클릭은 느는데 매출은 그대로. 광고 탓일까요? 🧵\n\n대개 아니에요. 클릭은 '관심', 구매는 '확신'.\n\n랜딩 첫 화면 · 가격의 근거 · 후기.\n이 중 하나만 약해도 전환이 무너집니다.\n\n광고를 더 돌리기 전에, 클릭 다음 화면부터 보세요.","variant":"A","slideImages":["cards/pslab/threads-07-14-1.png"],"status":"published","publishedUrl":"https://www.threads.com/@_pslab/post/Dah5rq9nBc_","metrics":{"views":21,"likes":0,"comments":0,"shares":0,"engagementRate":0},"insightComment":"조회 21·좋아요 0. 노출 대비 반응을 키우려면 첫 3초 후킹을 강화하세요.","publishedAt":"2026-07-08T11:10:04.327Z"},{"id":"threads-07-18","topic":"브랜딩","format":"스레드(타래)","channels":["threads"],"scheduledFor":"2026-07-11T09:00:00.000Z","kicker":"Threads","headline":"*‘왜’*를 팔아라","sub":"기억되는 법.","dayLabel":"스레드 · 타래","cardImage":"cards/pslab/threads-07-18-1.png","captionNote":"기억되는 법.","captionBody":"사람은 '무엇'이 아니라 '왜'로 브랜드를 기억해요. 🧵\n\n기능은 경쟁사도 똑같이 말합니다. 차별은 '왜'에서 생겨요.\n\n작은 브랜드일수록 더 그렇습니다 — 자원이 적을수록 메시지가 무기니까.\n\n오늘 우리 브랜드의 '왜'를 한 문장으로 써보세요. 안 써지면, 그게 과제예요.","variant":"B","slideImages":["cards/pslab/threads-07-18-1.png"],"status":"published","publishedUrl":"https://www.threads.com/@_pslab/post/DapiY57GylK","metrics":{"views":47,"likes":1,"comments":0,"shares":0,"engagementRate":0.02127659574468085},"insightComment":"참여율 2.1%로 평균(15.3%)을 밑돌았어요. 첫 슬라이드 후킹과 결론 한 줄을 더 세게, 저장 유도 문구를 명확히 해보세요.","publishedAt":"2026-07-11T10:20:29.407Z"}],"stats":{"publishedCount":0,"pendingCount":5,"avgEngagement":0,"trend":"n/a","totalViews":0,"totalLikes":0},"series":[]},{"key":"naver-blog","label":"네이버 블로그","icon":"📝","active":false,"published":[],"pending":[],"stats":{"publishedCount":0,"pendingCount":0,"avgEngagement":0,"trend":"n/a","totalViews":0,"totalLikes":0},"series":[]},{"key":"blogger","label":"구글 블로그","icon":"🅱️","active":false,"published":[],"pending":[{"id":"blogger-07-02","topic":"대행사와 3년 일하며 후회한 것, 잘한 것","format":"blogger","channels":["blogger"],"scheduledFor":"2026-07-03T09:00:00.000Z","kicker":"Agency","headline":"대행사와 3년 일하며 후회한 것, 잘한 것","sub":"결론부터: 대행사는 \"맡기는 것\"이 아니라 \"같이 운영하는 것\"입니다. 통째로 맡기면 반드시 후회합니다.","dayLabel":"구글 블로그","cardImage":"cards/pslab/blogger-07-02-1.png","captionNote":"결론부터: 대행사는 \"맡기는 것\"이 아니라 \"같이 운영하는 것\"입니다. 통째로 맡기면 반드시 후회합니다.","captionBody":"# 대행사와 3년 일하며 후회한 것, 잘한 것\n> [핵심 요약] 결론부터: 대행사는 \"맡기는 것\"이 아니라 \"같이 운영하는 것\"입니다. 통째로 맡기면 반드시 후회합니다.\n\n제안서 비교만 하던 시절엔 늘 실패했습니다. 방식을 바꾸고 나서야 대행이 일하기 시작했죠. 직접 겪은 후회 둘, 잘한 셋을 풉니다.\n\n## 후회 1 — \"알아서 해주세요\"라고 맡긴 것\n브랜드를 가장 잘 아는 건 결국 우리입니다. 방향을 안 주면 대행사는 무난한 평균값으로 갑니다. 결과는 \"나쁘진 않은데 아무것도 아닌\" 광고였습니다.\n![후회 1 — \"알아서 해주세요\"라고 맡긴 것](https://leejiho-pslab.github.io/pslab/blog/blogger-07-02/fig-1.png)\n\n## 후회 2 — 매주 숫자를 안 본 것\n한 달에 한 번 보고만 받으니, 안 되는 소재에 3주를 버렸습니다. 대시보드를 같이 보기 시작한 뒤로 낭비가 절반으로 줄었습니다.\n![후회 2 — 매주 숫자를 안 본 것](https://leejiho-pslab.github.io/pslab/blog/blogger-07-02/fig-2.png)\n\n## 잘한 1 — 소재 아이디어를 우리가 던진 것\n현장의 고객 질문, 후기, 반품 사유 — 이게 최고의 광고 소재입니다. 대행사는 이걸 모릅니다. 우리가 소재를 던지고 대행사가 다듬자 반응이 올랐습니다.\n![잘한 1 — 소재 아이디어를 우리가 던진 것](https://leejiho-pslab.github.io/pslab/blog/blogger-07-02/fig-3.png)\n\n## 잘한 2 — 역할을 문서로 나눈 것\n\"누가 무엇을, 언제까지\"를 한 장으로 정리했습니다. 책임이 분명해지자 핑퐁이 사라졌죠.\n![잘한 2 — 역할을 문서로 나눈 것](https://leejiho-pslab.github.io/pslab/blog/blogger-07-02/fig-4.png)\n\n## 자주 묻는 질문\n**Q. 대행사를 바꿔야 할 신호는?**\n3개월 연속 같은 변명, 매출 언어 부재, 담당자 잦은 교체 — 셋 중 둘이면 교체를 검토하세요.\n\n**Q. 소액인데 같이 운영이 가능한가요?**\n오히려 소액일수록 우리가 소재를 주도해야 효율이 납니다.\n\n대행을 통째로 맡기지 마세요. 방향은 우리가, 실행은 대행사가 — 이 경계가 성과를 만듭니다.\n\n🔖 태그: #광고대행사 #마케팅 #협업 #성과관리","variant":"A","slideImages":["cards/pslab/blogger-07-02-1.png"],"status":"published","publishedUrl":"https://pslab2026.blogspot.com/2026/06/3.html","metrics":{"views":0,"likes":0,"comments":0,"shares":0,"engagementRate":0},"insightComment":"조회 0·좋아요 0. 노출 대비 반응을 키우려면 첫 3초 후킹을 강화하세요.","publishedAt":"2026-06-30T02:24:22.852Z"},{"id":"blogger-07-09","topic":"전환율을 두 배로 올린 랜딩페이지 점검표","format":"blogger","channels":["blogger"],"scheduledFor":"2026-07-03T09:00:00.000Z","kicker":"Landing","headline":"전환율을 두 배로 올린 랜딩페이지 점검표","sub":"광고를 안 바꾸고 페이지만 고쳐 전환율을 2배로 올린 적이 있습니다. 그때 쓴 점검표를 공개합니다.","dayLabel":"구글 블로그","cardImage":"cards/pslab/blogger-07-09-1.png","captionNote":"광고를 안 바꾸고 페이지만 고쳐 전환율을 2배로 올린 적이 있습니다. 그때 쓴 점검표를 공개합니다.","captionBody":"# 전환율을 두 배로 올린 랜딩페이지 점검표\n> [핵심 요약] 광고를 안 바꾸고 페이지만 고쳐 전환율을 2배로 올린 적이 있습니다. 그때 쓴 점검표를 공개합니다.\n\n소재를 아무리 바꿔도 매출이 안 늘던 브랜드가 있었습니다. 광고는 그대로 두고 페이지만 9곳 고쳤더니 전환율이 두 배가 됐죠.\n\n## 히어로 영역: 한 문장으로 끝내라\n맨 위 한 문장이 \"무엇을, 누구에게, 왜 좋은지\"를 못 담으면 아래는 안 읽힙니다. 형용사 말고 숫자와 결과로 쓰세요.\n![히어로 영역: 한 문장으로 끝내라](https://leejiho-pslab.github.io/pslab/blog/blogger-07-09/fig-1.png)\n\n## 증거를 위로 올려라\n후기·인증·수상·판매수를 페이지 하단에 묻어두지 마세요. 첫 화면 바로 아래로 올리면 신뢰가 빨라집니다.\n![증거를 위로 올려라](https://leejiho-pslab.github.io/pslab/blog/blogger-07-09/fig-2.png)\n\n## CTA는 한 가지만\n\"구매·상담·뉴스레터\" 세 개를 동시에 권하면 아무것도 안 누릅니다. 페이지마다 행동 하나로 좁히세요.\n![CTA는 한 가지만](https://leejiho-pslab.github.io/pslab/blog/blogger-07-09/fig-3.png)\n\n## 모바일에서 다시 보라\n트래픽의 80%는 모바일입니다. 데스크톱에서 멀쩡해도 모바일에서 버튼이 접히거나 글자가 작으면 거기서 매출이 샙니다.\n![모바일에서 다시 보라](https://leejiho-pslab.github.io/pslab/blog/blogger-07-09/fig-4.png)\n\n## 자주 묻는 질문\n**Q. 몇 개를 한 번에 바꿔야 하나요?**\n한 번에 하나씩 바꿔 A/B로 검증하는 게 정석이지만, 트래픽이 적으면 묶어서 크게 바꾸고 추세를 보세요.\n\n**Q. 전환율은 어디서 보나요?**\nGA4·네이버 애널리틱스의 구매전환 이벤트로 단계별 이탈을 봅니다.\n\n광고를 더 만지기 전에 이 점검표로 페이지부터 고치세요. 가장 싸게 매출을 올리는 방법입니다.\n\n🔖 태그: #랜딩페이지 #전환율 #CRO #상세페이지","variant":"B","slideImages":["cards/pslab/blogger-07-09-1.png"],"status":"published","publishedUrl":"https://pslab2026.blogspot.com/2026/07/blog-post.html","metrics":{"views":0,"likes":0,"comments":0,"shares":0,"engagementRate":0},"insightComment":"조회 0·좋아요 0. 노출 대비 반응을 키우려면 첫 3초 후킹을 강화하세요.","publishedAt":"2026-07-03T11:37:58.921Z"},{"id":"blogger-07-16","topic":"작은 브랜드가 대기업과 '다르게' 싸우는 4가지 방법","format":"blogger","channels":["blogger"],"scheduledFor":"2026-07-06T09:00:00.000Z","kicker":"Strategy","headline":"작은 브랜드가 대기업과 '다르게' 싸우는 4가지 방법","sub":"대기업과 같은 방식으로 싸우면 집니다. 작을 때만 쓸 수 있는 무기 네 가지로 판을 바꾸세요.","dayLabel":"구글 블로그","cardImage":"cards/pslab/blogger-07-16-1.png","captionNote":"대기업과 같은 방식으로 싸우면 집니다. 작을 때만 쓸 수 있는 무기 네 가지로 판을 바꾸세요.","captionBody":"# 작은 브랜드가 대기업과 '다르게' 싸우는 4가지 방법\n> [핵심 요약] 대기업과 같은 방식으로 싸우면 집니다. 작을 때만 쓸 수 있는 무기 네 가지로 판을 바꾸세요.\n\n예산도 인력도 밀리는데 같은 운동장에서 싸우면 당연히 집니다. 작을 때만 가능한 방식이 따로 있습니다.\n\n## 1. 속도로 싸운다\n대기업은 의사결정이 느립니다. 우리는 오늘 본 트렌드를 내일 콘텐츠로 만들 수 있죠. 시의성은 작은 브랜드의 가장 큰 무기입니다.\n![1. 속도로 싸운다](https://leejiho-pslab.github.io/pslab/blog/blogger-07-16/fig-1.png)\n\n## 2. 좁은 시장 1등을 노린다\n전체 시장 10등보다, 좁은 카테고리 1등이 훨씬 강합니다. \"○○ 하면 이 브랜드\"가 되는 한 칸을 먼저 차지하세요.\n![2. 좁은 시장 1등을 노린다](https://leejiho-pslab.github.io/pslab/blog/blogger-07-16/fig-2.png)\n\n## 3. 얼굴을 보여준다\n대기업은 브랜드 뒤에 숨지만, 작은 브랜드는 사람이 앞에 설 수 있습니다. 창업자·직원의 얼굴과 과정이 곧 차별화입니다.\n![3. 얼굴을 보여준다](https://leejiho-pslab.github.io/pslab/blog/blogger-07-16/fig-3.png)\n\n## 4. 팬을 만든다\n100만 명에게 한 번 보이는 것보다, 1,000명이 매번 사주고 소문내는 게 강합니다. 작은 브랜드는 도달이 아니라 관계로 큽니다.\n![4. 팬을 만든다](https://leejiho-pslab.github.io/pslab/blog/blogger-07-16/fig-4.png)\n\n## 자주 묻는 질문\n**Q. 좁히면 시장이 너무 작지 않나요?**\n처음엔 좁게 1등 → 인접 카테고리로 확장이 정석입니다. 넓게 시작해 망하는 경우가 더 많습니다.\n\n**Q. 얼굴 노출이 부담스러워요.**\n꼭 대표가 아니어도 됩니다. 과정·손·작업 현장만 보여도 사람 냄새가 납니다.\n\n대기업의 방식을 따라 하지 마세요. 속도·집중·사람·관계 — 작을 때만 쓸 수 있는 무기로 싸우세요.\n\n🔖 태그: #스몰브랜드 #마케팅전략 #포지셔닝 #차별화","variant":"C","slideImages":["cards/pslab/blogger-07-16-1.png"],"status":"published","publishedUrl":"https://pslab2026.blogspot.com/2026/07/4.html","metrics":{"views":0,"likes":0,"comments":0,"shares":0,"engagementRate":0},"insightComment":"조회 0·좋아요 0. 노출 대비 반응을 키우려면 첫 3초 후킹을 강화하세요.","publishedAt":"2026-07-06T12:54:54.333Z"},{"id":"blogger-07-23","topic":"월 100만원으로 시작하는 광고, 이렇게 나눴습니다","format":"blogger","channels":["blogger"],"scheduledFor":"2026-07-09T09:00:00.000Z","kicker":"Budget","headline":"월 100만원으로 시작하는 광고, 이렇게 나눴습니다","sub":"예산이 적을수록 분산은 독입니다. 월 100만원을 실제로 어떻게 쪼갰는지, 숫자 그대로 공개합니다.","dayLabel":"구글 블로그","cardImage":"cards/pslab/blogger-07-23-1.png","captionNote":"예산이 적을수록 분산은 독입니다. 월 100만원을 실제로 어떻게 쪼갰는지, 숫자 그대로 공개합니다.","captionBody":"# 월 100만원으로 시작하는 광고, 이렇게 나눴습니다\n> [핵심 요약] 예산이 적을수록 분산은 독입니다. 월 100만원을 실제로 어떻게 쪼갰는지, 숫자 그대로 공개합니다.\n\n\"예산이 적은데 어디에 써야 하나요?\"—가장 많이 받는 질문입니다. 월 100만원 기준, 제가 실제로 굴리는 방식입니다.\n\n## 먼저 70만원: 한 채널만 판다\n소액일수록 채널을 늘리면 안 됩니다. 우리 고객이 가장 많은 한 곳에 70만원을 몰아 데이터를 빨리 모으세요.\n![먼저 70만원: 한 채널만 판다](https://leejiho-pslab.github.io/pslab/blog/blogger-07-23/fig-1.png)\n\n## 20만원: 소재 실험에만 쓴다\n같은 채널 안에서 소재 3~4종을 20만원으로 돌립니다. 승자 소재를 찾으면 70만원이 더 잘 돕니다.\n![20만원: 소재 실험에만 쓴다](https://leejiho-pslab.github.io/pslab/blog/blogger-07-23/fig-2.png)\n\n## 10만원: 콘텐츠/후기 자산에 쓴다\n광고만으론 한계가 있습니다. 10만원은 후기 확보, 콘텐츠 제작 같은 \"쌓이는 자산\"에 투자하세요. 광고가 꺼져도 남습니다.\n![10만원: 콘텐츠/후기 자산에 쓴다](https://leejiho-pslab.github.io/pslab/blog/blogger-07-23/fig-3.png)\n\n## 석 달 뒤 숫자로 다시 정한다\n100만원을 3개월 돌리면 어디가 효율적인지 보입니다. 그때 비율을 키우거나 채널을 바꾸세요. 처음 배분은 가설일 뿐입니다.\n![석 달 뒤 숫자로 다시 정한다](https://leejiho-pslab.github.io/pslab/blog/blogger-07-23/fig-4.png)\n\n## 자주 묻는 질문\n**Q. 100만원도 안 되면요?**\n50만원이면 채널 하나 + 소재 실험만 하세요. 자산 투자는 매출이 나면 시작해도 늦지 않습니다.\n\n**Q. 어느 채널부터 시작할까요?**\n고객이 검색으로 오면 검색광고, 발견으로 오면 인스타·메타부터 테스트하세요.\n\n적은 예산일수록 \"나누지 말고 몰아주세요.\" 한 채널에서 이기는 공식을 먼저 찾는 게 순서입니다. // ── 운영 기간 선택 (전역 상태) ──
let period = { key:'all', from:null, to:null };
function periodRange(){
  if(period.key==='all') return null;
  const now=new Date(); let from,to;
  if(period.key==='7d'){ to=now; from=new Date(now.getTime()-6*864e5); }
  else if(period.key==='14d'){ to=now; from=new Date(now.getTime()-13*864e5); }
  else if(period.key==='30d'){ to=now; from=new Date(now.getTime()-29*864e5); }
  else if(period.key==='month'){ from=new Date(now.getFullYear(),now.getMonth(),1); to=now; }
  else if(period.key==='prev'){ from=new Date(now.getFullYear(),now.getMonth()-1,1); to=new Date(now.getFullYear(),now.getMonth(),0); }
  else if(period.key==='custom'){
    if(!period.from&&!period.to) return null;
    from=period.from?new Date(period.from):new Date(0);
    to=period.to?new Date(period.to):now;
  } else return null;
  const f=new Date(from); f.setHours(0,0,0,0);
  const t=new Date(to); t.setHours(23,59,59,999);
  return [f.getTime(), t.getTime()];
}
function inPeriod(s){ const r=periodRange(); if(!r) return true; if(!s) return false; const t=new Date(s).getTime(); return t>=r[0]&&t<=r[1]; }
function periodLabel(){
  const names={all:'전체 기간','7d':'최근 7일','14d':'최근 14일','30d':'최근 30일',month:'이번 달',prev:'지난 달',custom:'직접 선택'};
  const r=periodRange();
  const d=x=>new Date(x).toISOString().slice(0,10);
  return names[period.key]+(r?' ('+d(r[0])+' ~ '+d(r[1])+')':'');
}

function sparkline(arr){
  if(!arr||arr.length<2) return '';
  const w=160,h=34,mx=Math.max(...arr,1),mn=Math.min(...arr,0);
  const dx=w/(arr.length-1);
  const pts=arr.map((v,i)=>[i*dx,h-((v-mn)/(mx-mn||1))*(h-6)-3]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  return '<svg class="spark" width="'+w+'" height="'+h+'"><path d="'+d+'" fill="none" stroke="#2b6fff" stroke-width="2"/></svg>';
}

// 네이버 붙여넣기용 평문(마크다운 기호 제거, 이미지 위치는 마커로)
function plainPostText(it){
  let n=0;
  return String(it.captionBody||'').split('\n').map(line=>{
    const t=line.trim();
    const img=t.match(/^!\[([^\]]*)\]\(([^)]+)\)$/);
    if(img){ n++; return '\n[📷 이미지'+n+' 삽입]\n'; }
    if(t.startsWith('## ')) return '\n■ '+t.slice(3);
    if(t.startsWith('# ')) return t.slice(2);
    if(t==='>'||t.startsWith('> ')) return t.replace(/^>\s?/,'');
    return line.replace(/\*\*([^*]+)\*\*/g,'$1');
  }).join('\n').replace(/\n{3,}/g,'\n\n').trim();
}

function mdInline(x){ return esc(x).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>'); }
function fmtCaption(s){
  return String(s||'').split('\n').map(line=>{
    const t=line.trim();
    const img=t.match(/^!\[([^\]]*)\]\(([^)]+)\)$/);
    if(img) return '<img class="md-img" src="'+esc(img[2])+'" alt="'+esc(img[1])+'" loading="lazy"/>';
    if(t.startsWith('## ')) return '<h4 class="md-h">'+mdInline(t.slice(3))+'</h4>';
    if(t.startsWith('# ')) return '<h3 class="md-h1">'+mdInline(t.slice(2))+'</h3>';
    if(t==='>'||t.startsWith('> ')) return '<div class="md-quote">'+mdInline(t.replace(/^>\s?/,''))+'</div>';
    if(t.indexOf('🔖')===0) return '<div class="md-tags">'+esc(t)+'</div>';
    if(/^\[.+\]$/.test(t)) return '<div class="md-tag">'+esc(t)+'</div>';
    if(t==='---'||t==='') return '<div class="md-sp"></div>';
    return '<div>'+mdInline(line)+'</div>';
  }).join('');
}

    '<div style="font-size:13px;color:#4a5264;opacity:.9">'+esc(l.sub)+'</div></a>').join('');
  return '<div class="panel"><div class="sect-h" style="margin:0 0 10px"><h3>🔗 채널 바로가기</h3><span class="muted">클릭하면 각 채널 관리로 이동</span></div>'+
    '<div style="display:flex;gap:12px;flex-wrap:wrap">'+cards+'</div></div>';
}
// 📅 차주 콘텐츠 기획 (ADR-0006: 금 키워드 수집 → 토 기획 → week-plan.json, plan.json과 분리)
function weekPlanPanel(client){
  const wp=client.weekPlan;
  let h='<div class="panel"><div class="sect-h" style="margin:0 0 8px"><h3>📅 차주 콘텐츠 기획</h3><span class="muted">'+
    (wp&&wp.baseDate?'기준일 '+esc(String(wp.baseDate).slice(0,10)):'키워드 실측 연동 후 매주 토요일 자동 생성')+'</span></div>';
  if(!wp){
    h+='<div class="empty" style="padding:10px">아직 차주 기획이 없습니다 — 네이버 검색광고 키워드 수집(금) → 차주 기획(토) 파이프라인은 계정 연결 단계에서 켜집니다.</div>';
  } else {
    h+='<table><tr><th style="width:90px">날짜</th><th style="width:130px">채널</th><th>제안 제목</th><th style="width:80px">시트</th></tr>'+
      wp.items.map(it=>{
        const cd=DATA.channels.find(x=>x.key===it.channel)||{icon:'',label:it.channel||''};
        return '<tr><td class="muted">'+esc(it.date||'')+'</td><td>'+cd.icon+' '+esc(cd.label)+'</td><td>'+esc(it.title||'')+'</td><td><span class="tag">'+esc(it.sheet||'')+'</span></td></tr>';
      }).join('')+'</table>'+
      '<div class="muted" style="margin-top:8px">이 기획안은 감도·가짜글자 검수를 거친 뒤에만 실제 제작으로 넘어갑니다 (자동발행 큐와 분리).</div>';
  }
  return h+'</div>';
}
// 🔌 채널 연결 상황 — 압축 칩 (개요 최하단, docs/06-대시보드 레이아웃 원칙)
function connChips(client){
  const st=DATA.setup||{};
  const on={'instagram':st.instagram,'threads':st.threads,'blogger':st.blogger,'youtube':st.youtube};
  const chips=client.channels.map(c=>{
    const lab=DATA.channels.find(x=>x.key===c.key)||{icon:'',label:c.key};
    const mark=c.key==='naver-blog'?'✍️ 수동':(on[c.key]?'✅':'⬜');
    return '<span class="tag" style="font-size:12px;padding:5px 10px">'+lab.icon+' '+esc(lab.label)+' '+mark+'</span>';
  }).join(' ');
  return '<div class="panel"><div class="sect-h" style="margin:0 0 8px"><h3>🔌 채널 연결 상황</h3><span class="muted">계정 연결은 온보딩 마지막 단계 — 상세 절차는 아래 체크리스트</span></div><div>'+chips+'</div></div>';
}
function overview(client){
  let h=tokenBanner(client);
  h+=channelLinksPanel(client);
  h+=weekPlanPanel(client);
  h+=weeklyPanel(client);
  h+=periodBar();
  h+='<div class="kpis">'+
    kpi(client.totalCycles,'총 사이클')+
    kpi(client.totalPublished,'총 발행')+
    kpi(client.heldCount,'승인 대기',client.heldCount>0)+
    kpi('v'+client.designVersion,'디자인 진화')+'</div>';
  h+=learningPanel(client);
  h+='<div class="panel"><h3>채널별 요약</h3><table><tr><th>채널</th><th>상태</th><th>발행</th><th>대기</th><th>평균 참여율</th><th>수정요청</th></tr>'+
    client.channels.map(c=>{const lab=(DATA.channels.find(x=>x.key===c.key)||{});
      const iss=channelIssues(c.key); const openN=iss.filter(x=>x.state!=='closed').length;
      const reqCell=iss.length?(openN?'<span class="badge b-wait">🛠 처리중 '+openN+'</span>':'<span class="badge b-ok">✅ 완료 '+iss.length+'</span>'):'<span class="muted">-</span>';
      return '<tr><td>'+lab.icon+' '+lab.label+'</td><td>'+(c.active?'<span class="badge b-ok">연결</span>':'<span class="badge b-hold">미연결</span>')+'</td><td>'+c.stats.publishedCount+'</td><td>'+c.stats.pendingCount+'</td><td>'+pct(c.stats.avgEngagement)+' '+tIcon(c.stats.trend)+'</td><td>'+reqCell+'</td></tr>';}).join('')+'</table></div>';
  // 발행 전 콘텐츠 기획안 — 메인에는 발행 전(예정·수동대기)만 보여준다
  const plan=client.planCards||[];
  const pre=plan.filter(p=>p.status!=='published');
  const fbTitle='['+client.name+'] 기획안 전체 피드백';
  const fbBody='이번 달 기획안에 대한 의견/수정사항을 적어주세요.\n\n';
  const mon=new Date(DATA.generatedAt).getMonth()+1;
  h+='<div class="sect-h"><h2>🕓 '+mon+'월 발행 전 콘텐츠 ('+pre.length+')</h2><a class="btn fb" href="'+issue(fbTitle,fbBody)+'" target="_blank">✏️ 기획안 피드백</a></div>';
  if(!pre.length){ h+='<div class="empty">발행 전 콘텐츠가 없습니다. 다음 사이클에 자동 생성됩니다.</div>'; }
  else {
    for(const chDef of DATA.channels){
      const items=pre.filter(p=>(p.channels||[]).includes(chDef.key));
      if(!items.length) continue;
      const lab=chDef.icon+' '+chDef.label;
      h+='<div class="chgrp"><div class="chgrp-h">'+lab+' <span class="muted">'+items.length+'건 · '+esc((items[0].format)||'')+'</span></div>'+
         '<div class="cards">'+items.map(p=>planCard(client,chDef.label,p)).join('')+'</div></div>';
    }
  }
  // 선택한 기간의 발행 게시물 (기획 발행분 + 사이클 발행분)
  const planPub=plan.filter(p=>p.status==='published'&&inPeriod(p.publishedAt||p.scheduledFor))
    .sort((a,b)=>String(b.publishedAt||'').localeCompare(String(a.publishedAt||'')));
  const recent=[].concat(...client.channels.map(c=>c.published)).filter(p=>inPeriod(p.time))
    .sort((a,b)=>(b.time||'').localeCompare(a.time||'')).slice(0,12);
  h+='<div class="sect-h"><h2>✅ 발행된 게시물 · '+periodLabel()+' ('+(planPub.length+recent.length)+')</h2></div>';
  const pubCards=planPub.map(p=>{
    const chDef=DATA.channels.find(x=>x.key===((p.channels||[])[0]))||{label:''};
    return planCard(client,chDef.label,p);
  }).concat(recent.map(p=>publishedCard(p,'<span class="badge b-ok">발행</span>')));
  h+= pubCards.length?'<div class="cards">'+pubCards.join('')+'</div>':'<div class="empty">이 기간에 발행된 게시물이 없습니다.</div>';
  // 경쟁사
  h+='<div class="panel" style="margin-top:16px"><h3>벤치마킹 경쟁사</h3><div>'+(client.competitors.length?client.competitors.map(x=>'<span class="tag">@'+esc(x)+'</span>').join(''):'<span class="muted">미설정</span>')+'</div></div>';
  // 저중요 패널은 최하단 — 연결 상황 압축 칩 + 오픈 준비 체크리스트 (docs/06-대시보드 레이아웃 원칙)
  h+=connChips(client);
  h+=setupPanel();
  return h;
}
function kpi(v,l,accent){return '<div class="kpi"><div class="v'+(accent?' accent':'')+'">'+v+'</div><div class="l">'+l+'</div></div>';}
// ── 리서치 탭 — research-brief.json이 있으면 항목별 시각화(통계·막대·표·타임라인·링크) ──
function researchView(client){
  const r=client.research;
  if(!r||!r.sections||!r.sections.length) return '<div class="empty">리서치 데이터가 없습니다.</div>';
  let h='<div class="sect-h"><h2>📊 '+esc(r.title||'브랜드 리서치')+'</h2><span class="muted">'+(r.updatedAt?('업데이트 '+String(r.updatedAt).slice(0,10)):'')+'</span></div>';
  if(r.note) h+='<div class="muted" style="margin:0 0 14px;line-height:1.6">'+esc(r.note)+'</div>';
  for(const s of r.sections){
    h+='<div class="panel"><h3>'+esc((s.icon?s.icon+' ':'')+s.title)+'</h3>';
    if(s.desc) h+='<div class="muted" style="margin:-4px 0 10px;font-size:12.5px;line-height:1.65">'+esc(s.desc)+'</div>';
    if(s.stats&&s.stats.length) h+='<div class="kpis">'+s.stats.map(x=>kpi(esc(x.v),esc(x.l),x.accent)).join('')+'</div>';
    if(s.bars&&s.bars.items&&s.bars.items.length){
      const mx=s.bars.max||Math.max.apply(null,s.bars.items.map(x=>x.value))||1;
      if(s.bars.title) h+='<div style="font-weight:700;font-size:12.5px;margin:4px 0 6px">'+esc(s.bars.title)+'</div>';
      h+=s.bars.items.map(x=>'<div class="rbarrow"><div class="rl" title="'+esc(x.label)+'">'+esc(x.label)+'</div><div class="rtrack"><div class="rfill" style="width:'+Math.max(2,Math.round(x.value/mx*100))+'%'+(x.color?';background:'+esc(x.color):'')+'"></div></div><div class="rv">'+esc(String(x.value))+(s.bars.unit?esc(s.bars.unit):'')+(x.note?' · '+esc(x.note):'')+'</div></div>').join('');
    }
    if(s.table&&s.table.head) h+='<div style="overflow-x:auto;margin-top:8px"><table><tr>'+s.table.head.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr>'+(s.table.rows||[]).map(row=>'<tr>'+row.map(cd=>'<td>'+esc(cd)+'</td>').join('')+'</tr>').join('')+'</table></div>';
    if(s.list&&s.list.length) h+='<ul style="margin:8px 0 2px;padding-left:18px;font-size:13px;line-height:1.75">'+s.list.map(x=>'<li><b>'+esc(x.t)+'</b>'+(x.d?' — <span style="color:#4a5266">'+esc(x.d)+'</span>':'')+'</li>').join('')+'</ul>';
    if(s.timeline&&s.timeline.length) h+='<div class="rtl" style="margin-top:10px">'+s.timeline.map(x=>'<div class="ri"><span class="rd">'+esc(x.date)+'</span> · '+esc(x.text)+(x.url?' <a href="'+esc(x.url)+'" target="_blank">확인↗</a>':'')+'</div>').join('')+'</div>';
    if(s.tags&&s.tags.length) h+='<div style="margin-top:8px">'+s.tags.map(x=>'<span class="tag">'+esc(x)+'</span>').join('')+'</div>';
    if(s.links&&s.links.length) h+='<div style="margin-top:10px">'+s.links.map(x=>'<a class="rlink" href="'+esc(x.url)+'" target="_blank">🔗 '+esc(x.label)+' ↗</a>'+(x.note?'<span class="muted" style="font-size:11.5px;margin-right:8px">'+esc(x.note)+'</span>':'')).join('')+'</div>';
    h+='</div>';
  }
  return h;
}
function renderClients(){
  // 헤더 로고는 제품명 "ALWAYS ON 콘텐츠 관제실" 고정 — 업체 식별은 클라이언트 칩으로 (docs/06-대시보드)
  document.getElementById('clients').innerHTML = DATA.clients.map((c,i)=>'<button class="cbtn'+(i===ci?' on':'')+'" onclick="setClient('+i+')">'+esc(c.name)+'</button>').join('');
  const c=DATA.clients[ci];
  if(c){
    document.getElementById('dashsub').textContent=(c.industry?c.industry+' · ':'')+'채널별 현황 · 발행/대기 · 반응도 · 기획안 피드백 · 5분 자동 새로고침';
    document.documentElement.style.setProperty('--brand', c.themeColor||'#2b6fff');
  }
}
function renderTabs(){
  const c=DATA.clients[ci];
  const tabs=[{key:'all',label:'전체',icon:'🏠',active:true}]
    .concat(DATA.channels.map(ch=>{const cc=c.channels.find(x=>x.key===ch.key);return {key:ch.key,label:ch.label,icon:ch.icon,active:cc&&cc.active};}))
    .concat(c.research?[{key:'research',label:'리서치',icon:'📊',active:true,noDot:true}]:[])
    .concat([{key:'guide',label:'지침',icon:'🧭',active:true,noDot:true}]);
  document.getElementById('tabs').innerHTML = tabs.map(t=>{
    // 수정요청 진행상황 아이콘 — 🛠 처리중 n건 / ✅ 전부 처리완료
    let req='';
    if(t.key!=='all'){
      const iss=channelIssues(t.key);
      const openN=iss.filter(x=>x.state!=='closed').length;
      req = openN ? '<span class="treq open" title="수정요청 처리중 '+openN+'건">🛠'+openN+'</span>'
          : (iss.length ? '<span class="treq done" title="수정요청 전부 처리완료">✅</span>' : '');
    }
    return '<button class="tab'+(t.key===ch?' on':'')+'" onclick="setCh(\''+t.key+'\')">'+t.icon+' '+t.label+(t.key!=='all'&&!t.noDot?'<span class="dot '+(t.active?'live':'off')+'"></span>':'')+req+'</button>';
  }).join('');
}
function renderView(){
  const c=DATA.clients[ci];
  document.getElementById('view').innerHTML = ch==='all'?overview(c):(ch==='guide'?guideView(c):(ch==='research'?researchView(c):channelDetail(c,c.channels.find(x=>x.key===ch))));
  document.getElementById('gen').textContent = ftime(DATA.generatedAt)+' (UTC)';
}
function setClient(i){ci=i;ch='all';renderClients();renderTabs();renderView();window.scrollTo(0,0);}
function setCh(k){ch=k;renderTabs();renderView();window.scrollTo(0,0);}
try {
  renderClients(); renderTabs(); renderView(); loadIssues();
} catch (e) {
  var v = document.getElementById('view');
  if (v) v.innerHTML = '<div style="padding:24px;line-height:1.7;color:#b91c1c">표시 중 오류: '
    + ((e && e.message) || e)
    + '<br><br><button onclick="location.reload(true)" style="padding:10px 16px;border-radius:8px;border:0;background:#2b6fff;color:#fff;font-size:15px">새로고침</button></div>';
}
</script>
</body>
</html>
