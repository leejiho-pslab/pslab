"cards/pslab/w1-mon-5.png","cards/pslab/w1-mon-6.png"],"status":"published","publishedUrl":"https://www.instagram.com/p/DaCerLaFY2L/","publishedAt":"2026-06-26T06:17:35.229Z"},{"id":"w1-fri","topic":"브랜딩","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-07-01T09:00:00.000Z","kicker":"Brand Strategy","headline":"팔리는 브랜드는\u003cbr>‘무엇’이 아니라 *‘왜’*를 판다","sub":"작은 브랜드일수록 더 중요한 메시지 설계 이야기.","dayLabel":"금요일 · 브랜딩","cardImage":"cards/pslab/w1-fri-1.png","captionNote":"작은 브랜드일수록 더 중요한 메시지 설계 이야기.","captionBody":"사람들은 “무엇을 파는지”로 기억하지 않습니다. “왜 파는지”로 기억하죠.\n\n기능과 스펙은 경쟁사도 똑같이 말합니다. 차별은 “왜”에서 생깁니다.\n작은 브랜드일수록 더 그래요 — 자원이 적을수록 메시지가 무기니까.\n\n오늘 우리 브랜드의 “왜”를 한 문장으로 써보세요. 안 써지면, 그게 진짜 과제입니다.\n\n#브랜딩 #마케팅전략 #창업인사이트","variant":"A","slideImages":["cards/pslab/w1-fri-1.png","cards/pslab/w1-fri-2.png","cards/pslab/w1-fri-3.png","cards/pslab/w1-fri-4.png","cards/pslab/w1-fri-5.png"],"status":"published","publishedUrl":"https://www.instagram.com/p/DaP-NdfDv3F/","metrics":{"views":34400,"likes":2752,"comments":137,"shares":220,"engagementRate":0.09037790697674418},"insightComment":"참여율 9.0%로 평균(6.7%)을 웃돌았어요. 디자인 A안·결론 우선 구조가 먹힌 것으로 보입니다 — 다음에도 같은 톤을 유지하세요.","publishedAt":"2026-07-01T12:03:17.068Z"},{"id":"naver-blog-07-02","topic":"광고대행사에 맡기기 전, 반드시 확인할 5가지","format":"naver-blog","channels":["naver-blog"],"scheduledFor":"2026-07-01T09:00:00.000Z","kicker":"Agency","headline":"광고대행사에 맡기기 전, 반드시 확인할 5가지","sub":"대행사를 잘못 만나면 돈만 태웁니다. 계약 전 \"이 다섯 가지\"를 물어보면 80%는 거를 수 있습니다.","dayLabel":"네이버 블로그","cardImage":"cards/pslab/naver-blog-07-02-1.png","captionNote":"대행사를 잘못 만나면 돈만 태웁니다. 계약 전 \"이 다섯 가지\"를 물어보면 80%는 거를 수 있습니다.","captionBody":"# 광고대행사에 맡기기 전, 반드시 확인할 5가지\n> [핵심 요약] 대행사를 잘못 만나면 돈만 태웁니다. 계약 전 \"이 다섯 가지\"를 물어보면 80%는 거를 수 있습니다.\n\n15년간 대행 일을 하며, 또 반대로 대행사를 써보며 깨달은 건 분명합니다. 실력 차이는 제안서가 아니라 \"질문에 답하는 방식\"에서 드러납니다.\n\n## 1. 누가 실제로 내 계정을 만지는가\n제안 미팅엔 베테랑이 오고, 운영은 신입이 하는 구조가 흔합니다. \"담당자 경력과 동시 운영 계정 수\"를 반드시 물어보세요. 한 명이 20개를 돌리면 내 계정은 방치됩니다.\n![1. 누가 실제로 내 계정을 만지는가](https://leejiho-pslab.github.io/pslab/blog/naver-blog-07-02/fig-1.png)\n\n## 2. 성과 보고가 \"지표\"인가 \"매출\"인가\n노출·클릭·CTR만 잔뜩 적힌 보고서는 위험 신호입니다. 클릭은 늘어도 매출은 그대로일 수 있으니까요. 전환·매출·ROAS로 말하는 곳을 고르세요.\n![2. 성과 보고가 \"지표\"인가 \"매출\"인가](https://leejiho-pslab.github.io/pslab/blog/naver-blog-07-02/fig-2.png)\n\n## 3. 광고비와 수수료가 분리돼 있는가\n광고비에 수수료가 녹아 있으면 대행사는 \"더 쓰게\" 만들 동기가 생깁니다. 광고비와 운영 수수료를 항목으로 분리한 견적을 요구하세요.\n![3. 광고비와 수수료가 분리돼 있는가](https://leejiho-pslab.github.io/pslab/blog/naver-blog-07-02/fig-3.png)\n\n## 4. 초기 2주에 무엇을 하기로 했는가\n잘하는 곳은 첫 2주를 \"학습 기간\"으로 설계합니다. 소액으로 여러 소재를 테스트해 데이터를 모으죠. 처음부터 풀예산을 태우자는 곳은 거르세요.\n![4. 초기 2주에 무엇을 하기로 했는가](https://leejiho-pslab.github.io/pslab/blog/naver-blog-07-02/fig-4.png)\n\n## 자주 묻는 질문\n**Q. 수수료는 보통 몇 %인가요?**\n매체비의 10~20%가 일반적입니다. 다만 \"관리 범위(제작 포함 여부)\"에 따라 다르니 항목으로 확인하세요.\n\n**Q. 소규모도 대행을 맡기는 게 나을까요?**\n월 광고비 300만원 미만이면 직접 + 부분 자문이 효율적일 때가 많습니다.\n\n대행사 미팅 전에 이 다섯 질문을 그대로 던져보세요. 답하는 태도만 봐도 절반은 결정됩니다.\n\n🔖 태그: #광고대행사 #마케팅대행 #대행사선택 #광고비","variant":"A","slideImages":["cards/pslab/naver-blog-07-02-1.png"],"status":"manual"},{"id":"w1-wed","topic":"업계비하인드","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-07-01T10:00:00.000Z","kicker":"Agency Behind","headline":"대행사를 쓰면\u003cbr>매출이 오른다는 *착각*","sub":"대행이 할 수 있는 것과 없는 것, 솔직하게 말합니다.","dayLabel":"수요일 · 비하인드","cardImage":"cards/pslab/w1-wed-1.png","captionNote":"대행이 할 수 있는 것과 없는 것, 솔직하게 말합니다.","captionBody":"“대행 맡기면 알아서 매출 오르겠지” — 가장 많이 깨지는 기대입니다.\n\n대행이 잘하는 건 “실행의 효율”입니다. 같은 예산으로 더 정교하게, 더 빠르게.\n하지만 “팔리는 상품”과 “살 이유”를 만드는 건 결국 브랜드의 몫이에요.\n\n이 경계가 정렬되지 않으면, 대행도 광고주도 둘 다 지칩니다.\n맡기기 전에 “우리가 책임질 것”부터 정하세요.\n\n#마케팅인사이트 #광고대행 #사업이야기","variant":"A","slideImages":["cards/pslab/w1-wed-1.png","cards/pslab/w1-wed-2.png","cards/pslab/w1-wed-3.png","cards/pslab/w1-wed-4.png","cards/pslab/w1-wed-5.png"],"status":"published","publishedUrl":"https://www.instagram.com/p/DaK2fegjYUt/","metrics":{"views":32645,"likes":2774,"comments":277,"shares":360,"engagementRate":0.10448767039362843},"insightComment":"참여율 10.4%로 평균(6.7%)을 웃돌았어요. 디자인 A안·결론 우선 구조가 먹힌 것으로 보입니다 — 다음에도 같은 톤을 유지하세요.","publishedAt":"2026-06-29T12:19:41.176Z"},{"id":"linkedin-07-01","topic":"광고대행","format":"링크드인 포스트","channels":["linkedin"],"scheduledFor":"2026-07-02T09:00:00.000Z","kicker":"Insight","headline":"대행을 쓸 때\u003cbr>가장 중요한 *한 가지*","sub":"15년간 본 성공·실패의 갈림길.","dayLabel":"링크드인 · 비즈니스","cardImage":"cards/pslab/linkedin-07-01-1.png","captionNote":"15년간 본 성공·실패의 갈림길.","captionBody":"대행과 오래가는 광고주에겐 공통점이 하나 있습니다 — '기대치 정렬'.\n\n광고대행 15년, 수백 곳을 보며 내린 결론입니다. 성공과 실패를 가른 건 예산도 업종도 아니었어요.\n\n대행이 잘하는 건 실행의 효율입니다. 같은 예산으로 더 정교하게, 더 빠르게.\n하지만 '팔리는 상품'과 '살 이유'를 만드는 건 끝까지 브랜드의 몫입니다.\n\n이 경계를 처음에 합의한 광고주는 대행과 오래갑니다.\n\"매출은 알아서 오르겠지\"로 시작한 곳은 3개월 안에 서로를 탓하더군요.\n\n하반기 대행을 고민 중이라면, 맡기기 전에 딱 하나만 정하세요 — '우리가 끝까지 책임질 것'은 무엇인가.\n\n#마케팅 #광고대행 #퍼포먼스마케팅","variant":"A","slideImages":["cards/pslab/linkedin-07-01-1.png"],"status":"planned"},{"id":"threads-07-07","topic":"업계비하인드","format":"스레드(타래)","channels":["threads"],"scheduledFor":"2026-07-02T09:00:00.000Z","kicker":"Threads","headline":"대행사가 *안 해주는* 말","sub":"솔직한 비하인드.","dayLabel":"스레드 · 타래","cardImage":"cards/pslab/threads-07-07-1.png","captionNote":"솔직한 비하인드.","captionBody":"대행사가 먼저 안 해주는 것들. 🧵\n\n· 수수료가 매체비의 %인지 고정인지에 따라 이해관계가 달라져요.\n\n· 리포트의 '좋아 보이는 지표'와 '매출 지표'는 다릅니다.\n\n· 계약 전, 누가 뭘 책임지는지 글로 남기세요.\n\n나쁜 대행이라서가 아니라, 안 물으면 굳이 말 안 하는 구조라서요.","variant":"B","slideImages":["cards/pslab/threads-07-07-1.png"],"status":"published","publishedUrl":"https://www.threads.com/@_pslab/post/DaSgRE-IAw4","metrics":{"views":50291,"likes":2564,"comments":410,"shares":102,"engagementRate":0.06116402537233302},"insightComment":"참여율 6.1% — 평균 수준입니다. 좋아요 2564·댓글 410. 다음엔 댓글을 유도하는 질문형 마무리를 시도해보세요.","publishedAt":"2026-07-02T11:39:25.721Z"},{"id":"youtube-07-05","topic":"광고대행","format":"쇼츠 대본","channels":["youtube"],"scheduledFor":"2026-07-03T09:00:00.000Z","kicker":"Shorts","headline":"광고비 *날리는* 사장님 특징","sub":"30초 쇼츠.","dayLabel":"유튜브 · 쇼츠","cardImage":"cards/pslab/youtube-07-05-1.png","captionNote":"30초 쇼츠.","captionBody":"[HOOK · 0~3초]\n광고비 날리는 사장님들, 공통점이 있어요.\n\n[본론 · 3~25초]\n켜기 전 준비를 안 합니다.\n- 타겟이 \"누구나\" — 그럼 아무에게도 안 닿아요.\n- 소재가 평범 — 첫 3초에 멈출 이유가 없죠.\n- 랜딩이 부실 — 클릭해도 안 삽니다.\n이 셋 안 맞으면, 예산 올릴수록 적자예요.\n\n[CTA · 25~30초]\n켜기 전 이 3개부터. 저장해두세요.","variant":"A","slideImages":["cards/pslab/youtube-07-05-1.png"],"status":"published","publishedUrl":"https://youtu.be/ulDu8KIb_0Y","metrics":{"views":26841,"likes":1100,"comments":66,"shares":44,"engagementRate":0.0450802876196863},"insightComment":"참여율 4.5%로 평균(6.7%)을 밑돌았어요. 첫 슬라이드 후킹과 결론 한 줄을 더 세게, 저장 유도 문구를 명확히 해보세요.","publishedAt":"2026-07-03T11:37:56.889Z","videoFile":"shorts/youtube-07-05/youtube-07-05.mp4","ytTitle":"광고비 날리는 사장님 3가지 특징｜광고 켜기 전 필수 점검 #shorts","ytDescription":"광고비를 태우기 전에 이 3가지부터 점검하세요. 타겟·소재·랜딩페이지가 안 맞으면 예산을 올릴수록 적자입니다.\n\n✅ 이 영상에서 다루는 것\n· 광고 타겟을 \"누구나\"로 잡으면 안 되는 이유\n· 첫 3초에 멈추게 하는 광고 소재\n· 클릭 후 전환을 막는 랜딩페이지 문제\n\n소상공인·자영업 사장님, 광고대행을 맡기기 전 직접 점검하고 싶은 분께 추천합니다.\n\n📌 더 많은 실전 마케팅 인사이트 → @_pslab\n👍 도움이 됐다면 구독과 저장!\n\n#광고비 #소상공인마케팅 #퍼포먼스마케팅 #광고대행 #온라인마케팅 #마케팅전략 #자영업 #창업 #shorts","ytTags":["광고비 절약","소상공인 마케팅","퍼포먼스 마케팅","광고 타겟팅","상세페이지","광고대행사","온라인마케팅","마케팅 전략","자영업 광고","창업 마케팅"]},{"id":"blogger-07-02","topic":"대행사와 3년 일하며 후회한 것, 잘한 것","format":"blogger","channels":["blogger"],"scheduledFor":"2026-07-03T09:00:00.000Z","kicker":"Agency","headline":"대행사와 3년 일하며 후회한 것, 잘한 것","sub":"결론부터: 대행사는 \"맡기는 것\"이 아니라 \"같이 운영하는 것\"입니다. 통째로 맡기면 반드시 후회합니다.","dayLabel":"구글 블로그","cardImage":"cards/pslab/blogger-07-02-1.png","captionNote":"결론부터: 대행사는 \"맡기는 것\"이 아니라 \"같이 운영하는 것\"입니다. 통째로 맡기면 반드시 후회합니다.","captionBody":"# 대행사와 3년 일하며 후회한 것, 잘한 것\n> [핵심 요약] 결론부터: 대행사는 \"맡기는 것\"이 아니라 \"같이 운영하는 것\"입니다. 통째로 맡기면 반드시 후회합니다.\n\n제안서 비교만 하던 시절엔 늘 실패했습니다. 방식을 바꾸고 나서야 대행이 일하기 시작했죠. 직접 겪은 후회 둘, 잘한 셋을 풉니다.\n\n## 후회 1 — \"알아서 해주세요\"라고 맡긴 것\n브랜드를 가장 잘 아는 건 결국 우리입니다. 방향을 안 주면 대행사는 무난한 평균값으로 갑니다. 결과는 \"나쁘진 않은데 아무것도 아닌\" 광고였습니다.\n![후회 1 — \"알아서 해주세요\"라고 맡긴 것](https://leejiho-pslab.github.io/pslab/blog/blogger-07-02/fig-1.png)\n\n## 후회 2 — 매주 숫자를 안 본 것\n한 달에 한 번 보고만 받으니, 안 되는 소재에 3주를 버렸습니다. 대시보드를 같이 보기 시작한 뒤로 낭비가 절반으로 줄었습니다.\n![후회 2 — 매주 숫자를 안 본 것](https://leejiho-pslab.github.io/pslab/blog/blogger-07-02/fig-2.png)\n\n## 잘한 1 — 소재 아이디어를 우리가 던진 것\n현장의 고객 질문, 후기, 반품 사유 — 이게 최고의 광고 소재입니다. 대행사는 이걸 모릅니다. 우리가 소재를 던지고 대행사가 다듬자 반응이 올랐습니다.\n![잘한 1 — 소재 아이디어를 우리가 던진 것](https://leejiho-pslab.github.io/pslab/blog/blogger-07-02/fig-3.png)\n\n## 잘한 2 — 역할을 문서로 나눈 것\n\"누가 무엇을, 언제까지\"를 한 장으로 정리했습니다. 책임이 분명해지자 핑퐁이 사라졌죠.\n![잘한 2 — 역할을 문서로 나눈 것](https://leejiho-pslab.github.io/pslab/blog/blogger-07-02/fig-4.png)\n\n## 자주 묻는 질문\n**Q. 대행사를 바꿔야 할 신호는?**\n3개월 연속 같은 변명, 매출 언어 부재, 담당자 잦은 교체 — 셋 중 둘이면 교체를 검토하세요.\n\n**Q. 소액인데 같이 운영이 가능한가요?**\n오히려 소액일수록 우리가 소재를 주도해야 효율이 납니다.\n\n대행을 통째로 맡기지 마세요. 방향은 우리가, 실행은 대행사가 — 이 경계가 성과를 만듭니다.\n\n🔖 태그: #광고대행사 #마케팅 #협업 #성과관리","variant":"A","slideImages":["cards/pslab/blogger-07-02-1.png"],"status":"published","publishedUrl":"https://pslab2026.blogspot.com/2026/06/3.html","metrics":{"views":0,"likes":0,"comments":0,"shares":0,"engagementRate":0},"insightComment":"조회 0·좋아요 0. 노출 대비 반응을 키우려면 첫 3초 후킹을 강화하세요.","publishedAt":"2026-06-30T02:24:22.852Z"},{"id":"blogger-07-09","topic":"전환율을 두 배로 올린 랜딩페이지 점검표","format":"blogger","channels":["blogger"],"scheduledFor":"2026-07-03T09:00:00.000Z","kicker":"Landing","headline":"전환율을 두 배로 올린 랜딩페이지 점검표","sub":"광고를 안 바꾸고 페이지만 고쳐 전환율을 2배로 올린 적이 있습니다. 그때 쓴 점검표를 공개합니다.","dayLabel":"구글 블로그","cardImage":"cards/pslab/blogger-07-09-1.png","captionNote":"광고를 안 바꾸고 페이지만 고쳐 전환율을 2배로 올린 적이 있습니다. 그때 쓴 점검표를 공개합니다.","captionBody":"# 전환율을 두 배로 올린 랜딩페이지 점검표\n> [핵심 요약] 광고를 안 바꾸고 페이지만 고쳐 전환율을 2배로 올린 적이 있습니다. 그때 쓴 점검표를 공개합니다.\n\n소재를 아무리 바꿔도 매출이 안 늘던 브랜드가 있었습니다. 광고는 그대로 두고 페이지만 9곳 고쳤더니 전환율이 두 배가 됐죠.\n\n## 히어로 영역: 한 문장으로 끝내라\n맨 위 한 문장이 \"무엇을, 누구에게, 왜 좋은지\"를 못 담으면 아래는 안 읽힙니다. 형용사 말고 숫자와 결과로 쓰세요.\n![히어로 영역: 한 문장으로 끝내라](https://leejiho-pslab.github.io/pslab/blog/blogger-07-09/fig-1.png)\n\n## 증거를 위로 올려라\n후기·인증·수상·판매수를 페이지 하단에 묻어두지 마세요. 첫 화면 바로 아래로 올리면 신뢰가 빨라집니다.\n![증거를 위로 올려라](https://leejiho-pslab.github.io/pslab/blog/blogger-07-09/fig-2.png)\n\n## CTA는 한 가지만\n\"구매·상담·뉴스레터\" 세 개를 동시에 권하면 아무것도 안 누릅니다. 페이지마다 행동 하나로 좁히세요.\n![CTA는 한 가지만](https://leejiho-pslab.github.io/pslab/blog/blogger-07-09/fig-3.png)\n\n## 모바일에서 다시 보라\n트래픽의 80%는 모바일입니다. 데스크톱에서 멀쩡해도 모바일에서 버튼이 접히거나 글자가 작으면 거기서 매출이 샙니다.\n![모바일에서 다시 보라](https://leejiho-pslab.github.io/pslab/blog/blogger-07-09/fig-4.png)\n\n## 자주 묻는 질문\n**Q. 몇 개를 한 번에 바꿔야 하나요?**\n한 번에 하나씩 바꿔 A/B로 검증하는 게 정석이지만, 트래픽이 적으면 묶어서 크게 바꾸고 추세를 보세요.\n\n**Q. 전환율은 어디서 보나요?**\nGA4·네이버 애널리틱스의 구매전환 이벤트로 단계별 이탈을 봅니다.\n\n광고를 더 만지기 전에 이 점검표로 페이지부터 고치세요. 가장 싸게 매출을 올리는 방법입니다.\n\n🔖 태그: #랜딩페이지 #전환율 #CRO #상세페이지","variant":"B","slideImages":["cards/pslab/blogger-07-09-1.png"],"status":"published","publishedUrl":"https://pslab2026.blogspot.com/2026/07/blog-post.html","metrics":{"views":0,"likes":0,"comments":0,"shares":0,"engagementRate":0},"insightComment":"조회 0·좋아요 0. 노출 대비 반응을 키우려면 첫 3초 후킹을 강화하세요.","publishedAt":"2026-07-03T11:37:58.921Z"},{"id":"w2-mon","topic":"마케팅전략","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-07-04T09:00:00.000Z","kicker":"Decision","headline":"이 광고, 꺼야 할까?\u003cbr>판단하는 *숫자 하나*","sub":"감으로 끄지 마세요. 손익분기 한 줄 계산법.","dayLabel":"월요일 · 의사결정","cardImage":"cards/pslab/w2-mon-1.png","captionNote":"감으로 끄지 마세요. 손익분기 한 줄 계산법.","captionBody":"“이 광고 꺼야 하나, 더 둬야 하나” 감으로 정하지 마세요.\n\n판단은 숫자 하나로 충분합니다 — 손익분기 CPA.\n(객단가 × 마진율)이 허용 CPA입니다. 실제 CPA가 이걸 넘으면, 켤수록 적자.\n\n예) 객단가 5만 × 마진 40% = 허용 CPA 2만원. 지금 3만이면? 끄거나 고치세요.\n감이 아니라 선이 결정합니다.\n\n#퍼포먼스마케팅 #마케팅전략 #광고대행","variant":"B","slideImages":["cards/pslab/w2-mon-1.png","cards/pslab/w2-mon-2.png","cards/pslab/w2-mon-3.png","cards/pslab/w2-mon-4.png","cards/pslab/w2-mon-5.png"],"status":"published","publishedUrl":"https://www.instagram.com/p/DaXlHvkjzDc/","metrics":{"views":8489,"likes":755,"comments":105,"shares":90,"engagementRate":0.11190952997997408},"insightComment":"참여율 11.2%로 평균(6.7%)을 웃돌았어요. 디자인 B안·결론 우선 구조가 먹힌 것으로 보입니다 — 다음에도 같은 톤을 유지하세요.","publishedAt":"2026-07-04T10:57:58.853Z"},{"id":"naver-blog-07-09","topic":"클릭은 느는데 매출이 안 오르는 진짜 이유","format":"naver-blog","channels":["naver-blog"],"scheduledFor":"2026-07-04T09:00:00.000Z","kicker":"Conversion","headline":"클릭은 느는데 매출이 안 오르는 진짜 이유","sub":"광고를 늘렸는데 매출이 그대로라면, 문제는 광고가 아니라 \"클릭 다음\"에 있습니다.","dayLabel":"네이버 블로그","cardImage":"cards/pslab/naver-blog-07-09-1.png","captionNote":"광고를 늘렸는데 매출이 그대로라면, 문제는 광고가 아니라 \"클릭 다음\"에 있습니다.","captionBody":"# 클릭은 느는데 매출이 안 오르는 진짜 이유\n> [핵심 요약] 광고를 늘렸는데 매출이 그대로라면, 문제는 광고가 아니라 \"클릭 다음\"에 있습니다.\n\n\"광고비를 늘렸는데 왜 매출이 안 늘죠?\" 가장 많이 받는 질문입니다. 답은 거의 항상 광고 바깥, 도착 페이지에 있습니다.\n\n## 클릭과 매출 사이엔 깔때기가 있다\n클릭 → 페이지 체류 → 장바구니 → 결제. 이 깔때기에서 어디가 새는지 모르면 광고비만 늘립니다. 먼저 단계별 이탈률부터 보세요.\n![클릭과 매출 사이엔 깔때기가 있다](https://leejiho-pslab.github.io/pslab/blog/naver-blog-07-09/fig-1.png)\n\n## 첫 3초가 매출을 결정한다\n도착 페이지 상단에서 \"여기가 내가 찾던 곳\"이라는 확신을 3초 안에 못 주면 떠납니다. 광고 문구와 페이지 첫 화면의 메시지를 똑같이 맞추세요.\n![첫 3초가 매출을 결정한다](https://leejiho-pslab.github.io/pslab/blog/naver-blog-07-09/fig-2.png)\n\n## 후기가 없으면 결제까지 안 간다\n특히 처음 보는 브랜드는 후기 수가 곧 전환율입니다. 후기 10개 미만이라면 광고 확장보다 후기 확보가 먼저입니다.\n![후기가 없으면 결제까지 안 간다](https://leejiho-pslab.github.io/pslab/blog/naver-blog-07-09/fig-3.png)\n\n## 결제 단계의 마찰을 없애라\n회원가입 강제, 과한 입력칸, 느린 로딩 — 결제 직전 이탈의 주범입니다. 비회원 결제와 간편결제를 열어두세요.\n![결제 단계의 마찰을 없애라](https://leejiho-pslab.github.io/pslab/blog/naver-blog-07-09/fig-4.png)\n\n## 자주 묻는 질문\n**Q. 광고를 멈춰야 하나요?**\n아니요. 광고는 유지하되 예산 증액을 멈추고, 페이지 전환율부터 올리세요.\n\n**Q. 전환율 몇 %가 정상인가요?**\n업종마다 다르지만 이커머스 1~3%가 일반적입니다. 1% 미만이면 페이지부터 점검하세요.\n\n광고비를 더 쓰기 전에, 클릭 다음의 깔때기부터 막으세요. 같은 광고비로 매출이 달라집니다.\n\n🔖 태그: #전환율 #랜딩페이지 #광고효율 #CRO","variant":"B","slideImages":["cards/pslab/naver-blog-07-09-1.png"],"status":"manual"},{"id":"threads-07-04","topic":"온라인마케팅","format":"스레드(타래)","channels":["threads"],"scheduledFor":"2026-07-04T10:00:00.000Z","kicker":"Threads","headline":"광고비 태우기 전\u003cbr>점검 *3가지*","sub":"짧게 핵심만.","dayLabel":"스레드 · 타래","cardImage":"cards/pslab/threads-07-04-1.png","captionNote":"짧게 핵심만.","captionBody":"광고비, 켜기 전이 90%입니다. 🧵\n\n1) 타겟 — \"누구나\"는 \"아무도\"예요. 한 사람을 그리세요.\n\n2) 소재 — 첫 3초에 멈출 이유가 없으면 돈만 흐릅니다.\n\n3) 랜딩 — 클릭 다음 화면이 약하면 모든 클릭이 비용이에요.\n\n이 셋 맞추기 전에 예산부터 올리면? 적자는 정해진 결과입니다.","variant":"A","slideImages":["cards/pslab/threads-07-04-1.png"],"status":"published","publishedUrl":"https://www.threads.com/@_pslab/post/DaIUz7QGpp_","publishedAt":"2026-06-28T12:46:54.616Z"},{"id":"linkedin-07-08","topic":"마케팅전략","format":"링크드인 포스트","channels":["linkedin"],"scheduledFor":"2026-07-05T09:00:00.000Z","kicker":"Decision","headline":"“이 광고 꺼야 하나”\u003cbr>판단하는 *숫자 하나*","sub":"감이 아니라 손익분기선으로.","dayLabel":"링크드인 · 비즈니스","cardImage":"cards/pslab/linkedin-07-08-1.png","captionNote":"감이 아니라 손익분기선으로.","captionBody":"\"이 광고 꺼야 하나?\"는 감이 아니라 숫자 하나로 정하면 됩니다 — 손익분기 CPA.\n\n대표님들이 가장 자주, 그리고 가장 감정적으로 내리는 결정이 광고를 끄고 켜는 일입니다. 기준을 드리겠습니다.\n\n(객단가 × 마진율) = 허용 CPA.\n실제 CPA가 이걸 넘으면, 켤수록 적자입니다.\n\n예) 객단가 5만원 × 마진 40% = 허용 CPA 2만원.\n지금 전환당 3만원이 든다면? 끄거나, 소재·타겟·랜딩을 고치세요.\n\n마케팅은 예술 같지만, 끄고 켜는 결정만큼은 산수입니다.\n이 한 줄을 모든 캠페인에 계산해 두면, 감정적 의사결정이 사라집니다.\n\n#마케팅전략 #퍼포먼스마케팅 #그로스","variant":"B","slideImages":["cards/pslab/linkedin-07-08-1.png"],"status":"planned"},{"id":"threads-07-11","topic":"창업인사이트","format":"스레드(타래)","channels":["threads"],"scheduledFor":"2026-07-05T09:00:00.000Z","kicker":"Threads","headline":"돈 없이 마케팅\u003cbr>*가능한가*","sub":"검증부터.","dayLabel":"스레드 · 타래","cardImage":"cards/pslab/threads-07-11-1.png","captionNote":"검증부터.","captionBody":"\"돈 없으면 마케팅 못 하죠\" — 절반만 맞아요. 🧵\n\n돈이 필요한 건 '확장'이고, '검증'은 거의 공짜입니다.\n\n콘텐츠 몇 개, DM 몇 통, 작은 설문으로 \"살 사람이 있는지\"부터 확인하세요.\n\n수요 확인 전에 광고비부터 태우면, 가장 빠르게 망하는 길입니다.\n\n돈은 검증된 다음에 붓는 겁니다.","variant":"C","slideImages":["cards/pslab/threads-07-11-1.png"],"status":"published","publishedUrl":"https://www.threads.com/@_pslab/post/DaaLHIOGybk","metrics":{"views":41618,"likes":4078,"comments":937,"shares":448,"engagementRate":0.13126531789129703},"insightComment":"참여율 13.1%로 평균(6.7%)을 웃돌았어요. 디자인 C안·결론 우선 구조가 먹힌 것으로 보입니다 — 다음에도 같은 톤을 유지하세요.","publishedAt":"2026-07-05T11:08:27.476Z"},{"id":"youtube-07-12","topic":"마케팅전략","format":"쇼츠 대본","channels":["youtube"],"scheduledFor":"2026-07-06T09:00:00.000Z","kicker":"Shorts","headline":"이 광고 *꺼야 할까*?","sub":"숫자 하나로 판단.","dayLabel":"유튜브 · 쇼츠","cardImage":"cards/pslab/youtube-07-12-1.png","captionNote":"숫자 하나로 판단.","captionBody":"[HOOK]\n\"이 광고 꺼야 하나, 더 둬야 하나?\" 감으로 정하지 마세요.\n\n[본론]\n숫자 하나면 됩니다. 손익분기 CPA.\n객단가 곱하기 마진율. 그게 허용 CPA예요.\n객단가 5만, 마진 40%면 → 2만원.\n지금 전환당 3만원? 끄거나 고치세요.\n\n[CTA]\n감이 아니라 산수입니다. 계산해 보세요.","variant":"B","slideImages":["cards/pslab/youtube-07-12-1.png"],"status":"published","publishedUrl":"https://youtu.be/43G-r4KHvUs","metrics":{"views":25973,"likes":1376,"comments":247,"shares":151,"engagementRate":0.06830169791706772},"insightComment":"참여율 6.8% — 평균 수준입니다. 좋아요 1376·댓글 247. 다음엔 댓글을 유도하는 질문형 마무리를 시도해보세요.","publishedAt":"2026-07-06T12:54:52.581Z","videoFile":"shorts/youtube-07-12/youtube-07-12.mp4","ytTitle":"광고 끌까 말까? 숫자 하나로 정하세요｜손익분기 CPA 계산법 #shorts","ytDescription":"\"이 광고 꺼야 하나, 더 둬야 하나?\" 감으로 정하지 마세요. 손익분기 CPA 하나면 됩니다.\n\n✅ 허용 CPA = 객단가 × 마진율\n예) 객단가 5만원 × 마진 40% = 2만원\n전환당 3만원이면? 끄거나 고치세요.\n\n광고 효율(ROAS)이 헷갈리는 사장님, 광고를 감이 아니라 숫자로 판단하고 싶은 분께.\n\n📌 실전 광고 운영 노하우 → @_pslab\n👍 도움이 됐다면 구독!\n\n#CPA #ROAS #광고효율 #퍼포먼스마케팅 #광고비 #손익분기 #온라인마케팅 #마케팅전략 #shorts","ytTags":["손익분기 CPA","ROAS","광고 효율","퍼포먼스 마케팅","광고비 계산","객단가 마진율","광고 끄는 기준","온라인마케팅","광고 최적화","마케팅 전략"]},{"id":"blogger-07-16","topic":"작은 브랜드가 대기업과 '다르게' 싸우는 4가지 방법","format":"blogger","channels":["blogger"],"scheduledFor":"2026-07-06T09:00:00.000Z","kicker":"Strategy","headline":"작은 브랜드가 대기업과 '다르게' 싸우는 4가지 방법","sub":"대기업과 같은 방식으로 싸우면 집니다. 작을 때만 쓸 수 있는 무기 네 가지로 판을 바꾸세요.","dayLabel":"구글 블로그","cardImage":"cards/pslab/blogger-07-16-1.png","captionNote":"대기업과 같은 방식으로 싸우면 집니다. 작을 때만 쓸 수 있는 무기 네 가지로 판을 바꾸세요.","captionBody":"# 작은 브랜드가 대기업과 '다르게' 싸우는 4가지 방법\n> [핵심 요약] 대기업과 같은 방식으로 싸우면 집니다. 작을 때만 쓸 수 있는 무기 네 가지로 판을 바꾸세요.\n\n예산도 인력도 밀리는데 같은 운동장에서 싸우면 당연히 집니다. 작을 때만 가능한 방식이 따로 있습니다.\n\n## 1. 속도로 싸운다\n대기업은 의사결정이 느립니다. 우리는 오늘 본 트렌드를 내일 콘텐츠로 만들 수 있죠. 시의성은 작은 브랜드의 가장 큰 무기입니다.\n![1. 속도로 싸운다](https://leejiho-pslab.github.io/pslab/blog/blogger-07-16/fig-1.png)\n\n## 2. 좁은 시장 1등을 노린다\n전체 시장 10등보다, 좁은 카테고리 1등이 훨씬 강합니다. \"○○ 하면 이 브랜드\"가 되는 한 칸을 먼저 차지하세요.\n![2. 좁은 시장 1등을 노린다](https://leejiho-pslab.github.io/pslab/blog/blogger-07-16/fig-2.png)\n\n## 3. 얼굴을 보여준다\n대기업은 브랜드 뒤에 숨지만, 작은 브랜드는 사람이 앞에 설 수 있습니다. 창업자·직원의 얼굴과 과정이 곧 차별화입니다.\n![3. 얼굴을 보여준다](https://leejiho-pslab.github.io/pslab/blog/blogger-07-16/fig-3.png)\n\n## 4. 팬을 만든다\n100만 명에게 한 번 보이는 것보다, 1,000명이 매번 사주고 소문내는 게 강합니다. 작은 브랜드는 도달이 아니라 관계로 큽니다.\n![4. 팬을 만든다](https://leejiho-pslab.github.io/pslab/blog/blogger-07-16/fig-4.png)\n\n## 자주 묻는 질문\n**Q. 좁히면 시장이 너무 작지 않나요?**\n처음엔 좁게 1등 → 인접 카테고리로 확장이 정석입니다. 넓게 시작해 망하는 경우가 더 많습니다.\n\n**Q. 얼굴 노출이 부담스러워요.**\n꼭 대표가 아니어도 됩니다. 과정·손·작업 현장만 보여도 사람 냄새가 납니다.\n\n대기업의 방식을 따라 하지 마세요. 속도·집중·사람·관계 — 작을 때만 쓸 수 있는 무기로 싸우세요.\n\n🔖 태그: #스몰브랜드 #마케팅전략 #포지셔닝 #차별화","variant":"C","slideImages":["cards/pslab/blogger-07-16-1.png"],"status":"published","publishedUrl":"https://pslab2026.blogspot.com/2026/07/4.html","metrics":{"views":0,"likes":0,"comments":0,"shares":0,"engagementRate":0},"insightComment":"조회 0·좋아요 0. 노출 대비 반응을 키우려면 첫 3초 후킹을 강화하세요.","publishedAt":"2026-07-06T12:54:54.333Z"},{"id":"w2-wed","topic":"퍼포먼스마케팅","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-07-07T09:00:00.000Z","kicker":"Ad Ops","headline":"클릭은 느는데\u003cbr>매출이 *안 느는 이유*","sub":"클릭은 구매가 아닙니다. 전환이 새는 지점.","dayLabel":"수요일 · 광고운영","cardImage":"cards/pslab/w2-wed-1.png","captionNote":"클릭은 구매가 아닙니다. 전환이 새는 지점.","captionBody":"클릭은 느는데 매출은 그대로. 광고가 문제일까요?\n\n대개 아닙니다. 클릭은 “관심”이고 구매는 “확신”이에요. 둘 사이에서 새는 겁니다.\n랜딩의 첫 화면, 가격을 납득시키는 근거, 후기 같은 신뢰 장치 —\n이 중 하나만 약해도 클릭은 비용으로 끝납니다.\n\n광고를 더 돌리기 전에, 클릭 다음 화면부터 점검하세요.\n\n#퍼포먼스마케팅 #온라인마케팅 #전환율","variant":"B","slideImages":["cards/pslab/w2-wed-1.png","cards/pslab/w2-wed-2.png","cards/pslab/w2-wed-3.png","cards/pslab/w2-wed-4.png","cards/pslab/w2-wed-5.png"],"status":"published","publishedUrl":"https://www.instagram.com/p/DafckBAmnn9/","metrics":{"views":20019,"likes":1981,"comments":475,"shares":237,"engagementRate":0.13452220390628902},"insightComment":"참여율 13.5%로 평균(6.7%)을 웃돌았어요. 디자인 B안·결론 우선 구조가 먹힌 것으로 보입니다 — 다음에도 같은 톤을 유지하세요.","publishedAt":"2026-07-07T12:17:07.179Z"},{"id":"naver-blog-07-16","topic":"작은 브랜드일수록 '무엇'이 아니라 '왜'를 팔아야 합니다","format":"naver-blog","channels":["naver-blog"],"scheduledFor":"2026-07-07T09:00:00.000Z","kicker":"Brand","headline":"작은 브랜드일수록 '무엇'이 아니라 '왜'를 팔아야 합니다","sub":"기능으로 싸우면 대기업을 못 이깁니다. 작은 브랜드의 무기는 \"왜 이걸 만들었는가\"라는 이유입니다.","dayLabel":"네이버 블로그","cardImage":"cards/pslab/naver-blog-07-16-1.png","captionNote":"기능으로 싸우면 대기업을 못 이깁니다. 작은 브랜드의 무기는 \"왜 이걸 만들었는가\"라는 이유입니다.","captionBody":"# 작은 브랜드일수록 '무엇'이 아니라 '왜'를 팔아야 합니다\n> [핵심 요약] 기능으로 싸우면 대기업을 못 이깁니다. 작은 브랜드의 무기는 \"왜 이걸 만들었는가\"라는 이유입니다.\n\n스펙 비교표를 만들수록 작은 브랜드는 불리해집니다. 가격도 물량도 밀리니까요. 그런데 \"왜\"로 옮기는 순간 판이 바뀝니다.\n\n## 기능은 복제되지만 이유는 복제 안 된다\n같은 성분, 같은 사양은 곧 따라옵니다. 하지만 \"왜 시작했는지\"는 베낄 수 없습니다. 그게 작은 브랜드의 유일한 해자입니다.\n![기능은 복제되지만 이유는 복제 안 된다](https://leejiho-pslab.github.io/pslab/blog/naver-blog-07-16/fig-1.png)\n\n## '왜'는 한 사람의 이야기에서 나온다\n거창한 미션이 아니라, 창업자가 겪은 구체적 불편 하나면 충분합니다. 그 장면을 보여주면 고객은 자기 이야기로 받아들입니다.\n!['왜'는 한 사람의 이야기에서 나온다](https://leejiho-pslab.github.io/pslab/blog/naver-blog-07-16/fig-2.png)\n\n## 이유가 같은 사람만 모아라\n모두를 설득하려 하면 아무에게도 안 남습니다. \"이 이유에 공감하는 사람\"만 정확히 겨냥하세요. 작을수록 좁혀야 합니다.\n![이유가 같은 사람만 모아라](https://leejiho-pslab.github.io/pslab/blog/naver-blog-07-16/fig-3.png)\n\n## '왜'를 모든 접점에 반복하라\n상세페이지, 패키지, SNS, 응대까지 같은 이유가 흐르면 브랜드가 됩니다. 채널마다 말투는 달라도 이유는 하나여야 합니다.\n!['왜'를 모든 접점에 반복하라](https://leejiho-pslab.github.io/pslab/blog/naver-blog-07-16/fig-4.png)\n\n## 자주 묻는 질문\n**Q. 스토리가 특별하지 않은데요?**\n특별할 필요 없습니다. 구체적이면 됩니다. \"왜\"는 크기가 아니라 진정성으로 작동합니다.\n\n**Q. 기능 설명은 빼야 하나요?**\n아니요. 이유로 끌고 기능으로 확신을 주세요. 순서가 핵심입니다.\n\n오늘 상세페이지 첫 문단을 \"왜\"로 바꿔보세요. 같은 제품이 다르게 보이기 시작합니다.\n\n🔖 태그: #브랜딩 #스몰브랜드 #포지셔닝 #브랜드스토리","variant":"C","slideImages":["cards/pslab/naver-blog-07-16-1.png"],"status":"manual"},{"id":"linkedin-07-15","topic":"브랜딩","format":"링크드인 포스트","channels":["linkedin"],"scheduledFor":"2026-07-08T09:00:00.000Z","kicker":"Branding","headline":"팔리는 브랜드는\u003cbr>*‘왜’*를 판다","sub":"기능이 아니라 이유로 기억된다.","dayLabel":"링크드인 · 비즈니스","cardImage":"cards/pslab/linkedin-07-15-1.png","captionNote":"기능이 아니라 이유로 기억된다.","captionBody":"경쟁사와 똑같은 기능을 말하고 있다면, 고객 입장에선 고를 이유가 없습니다.\n\n사람은 '무엇'이 아니라 '왜'로 브랜드를 기억합니다.\n\n스펙은 경쟁사도 똑같이 말합니다. 차별은 거기서 안 생깁니다.\n\"이 사람들은 왜 이걸 만들까\"에 답이 있을 때, 비로소 선택받습니다.\n\n특히 작은 브랜드일수록 그렇습니다. 자원이 적을수록 메시지가 유일한 무기니까요.\n\n오늘 한 가지만 해보세요.\n우리 브랜드의 '왜'를 한 문장으로 써보는 것.\n안 써진다면 — 그게 지금 가장 시급한 과제입니다.\n\n#브랜딩 #마케팅 #스타트업","variant":"C","slideImages":["cards/pslab/linkedin-07-15-1.png"],"status":"planned"},{"id":"threads-07-14","topic":"퍼포먼스마케팅","format":"스레드(타래)","channels":["threads"],"scheduledFor":"2026-07-08T09:00:00.000Z","kicker":"Threads","headline":"클릭은 느는데\u003cbr>매출이 *그대로*","sub":"전환을 보라.","dayLabel":"스레드 · 타래","cardImage":"cards/pslab/threads-07-14-1.png","captionNote":"전환을 보라.","captionBody":"클릭은 느는데 매출은 그대로. 광고 탓일까요? 🧵\n\n대개 아니에요. 클릭은 '관심', 구매는 '확신'.\n\n랜딩 첫 화면 · 가격의 근거 · 후기.\n이 중 하나만 약해도 전환이 무너집니다.\n\n광고를 더 돌리기 전에, 클릭 다음 화면부터 보세요.","variant":"A","slideImages":["cards/pslab/threads-07-14-1.png"],"status":"published","publishedUrl":"https://www.threads.com/@_pslab/post/Dah5rq9nBc_","metrics":{"views":21744,"likes":1391,"comments":125,"shares":97,"engagementRate":0.07418138337012509},"insightComment":"참여율 7.4%로 평균(6.7%)을 웃돌았어요. 디자인 A안·결론 우선 구조가 먹힌 것으로 보입니다 — 다음에도 같은 톤을 유지하세요.","publishedAt":"2026-07-08T11:10:04.327Z"},{"id":"youtube-07-19","topic":"브랜딩","format":"쇼츠 대본","channels":["youtube"],"scheduledFor":"2026-07-09T09:00:00.000Z","kicker":"Shorts","headline":"작은 브랜드가 *이기는* 법","sub":"왜를 팔아라.","dayLabel":"유튜브 · 쇼츠","cardImage":"cards/pslab/youtube-07-19-1.png","captionNote":"왜를 팔아라.","captionBody":"[HOOK]\n작은 브랜드가 대기업을 이기는 유일한 방법.\n\n[본론]\n'무엇'으로 싸우지 마세요. 더 싸게, 더 많이는 못 이겨요.\n'왜'를 파세요.\n사람은 기능이 아니라 이유를 기억합니다.\n\"이 사람들은 왜 이걸 만들까\" — 거기에 답이 있으면 선택받아요.\n\n[CTA]\n우리 브랜드의 '왜', 한 문장으로 적어보세요.","variant":"C","slideImages":["cards/pslab/youtube-07-19-1.png"],"status":"published","publishedUrl":"https://youtu.be/rTEmo9xwl0o","metrics":{"views":16285,"likes":732,"comments":73,"shares":21,"engagementRate":0.05072152287381025},"insightComment":"참여율 5.1%로 평균(6.7%)을 밑돌았어요. 첫 슬라이드 후킹과 결론 한 줄을 더 세게, 저장 유도 문구를 명확히 해보세요.","publishedAt":"2026-07-09T12:21:57.879Z","videoFile":"shorts/youtube-07-19/youtube-07-19.mp4","ytTitle":"작은 브랜드가 대기업을 이기는 유일한 방법｜브랜딩의 핵심 #shorts","ytDescription":"작은 브랜드가 대기업을 이기는 방법은 '무엇'이 아니라 '왜'를 파는 것입니다.\n\n✅ 기능·가격으로 싸우면 집니다\n✅ 사람은 기능이 아니라 '이유'를 기억합니다\n✅ \"왜 이걸 만드는가\"에 답이 있으면 선택받습니다\n\n스몰브랜드·1인 창업·자영업 브랜딩을 고민하는 분께.\n\n📌 브랜딩·성장 인사이트 → @_pslab\n👍 도움이 됐다면 구독!\n\n#브랜딩 #스몰브랜드 #포지셔닝 #마케팅전략 #창업 #브랜드차별화 #온라인마케팅 #shorts","ytTags":["브랜딩","스몰브랜드","포지셔닝","브랜드 차별화","작은 브랜드 마케팅","창업 브랜딩","마케팅 전략","why 마케팅","온라인마케팅","브랜드 스토리"]},{"id":"blogger-07-23","topic":"월 100만원으로 시작하는 광고, 이렇게 나눴습니다","format":"blogger","channels":["blogger"],"scheduledFor":"2026-07-09T09:00:00.000Z","kicker":"Budget","headline":"월 100만원으로 시작하는 광고, 이렇게 나눴습니다","sub":"예산이 적을수록 분산은 독입니다. 월 100만원을 실제로 어떻게 쪼갰는지, 숫자 그대로 공개합니다.","dayLabel":"구글 블로그","cardImage":"cards/pslab/blogger-07-23-1.png","captionNote":"예산이 적을수록 분산은 독입니다. 월 100만원을 실제로 어떻게 쪼갰는지, 숫자 그대로 공개합니다.","captionBody":"# 월 100만원으로 시작하는 광고, 이렇게 나눴습니다\n> [핵심 요약] 예산이 적을수록 분산은 독입니다. 월 100만원을 실제로 어떻게 쪼갰는지, 숫자 그대로 공개합니다.\n\n\"예산이 적은데 어디에 써야 하나요?\"—가장 많이 받는 질문입니다. 월 100만원 기준, 제가 실제로 굴리는 방식입니다.\n\n## 먼저 70만원: 한 채널만 판다\n소액일수록 채널을 늘리면 안 됩니다. 우리 고객이 가장 많은 한 곳에 70만원을 몰아 데이터를 빨리 모으세요.\n![먼저 70만원: 한 채널만 판다](https://leejiho-pslab.github.io/pslab/blog/blogger-07-23/fig-1.png)\n\n## 20만원: 소재 실험에만 쓴다\n같은 채널 안에서 소재 3~4종을 20만원으로 돌립니다. 승자 소재를 찾으면 70만원이 더 잘 돕니다.\n![20만원: 소재 실험에만 쓴다](https://leejiho-pslab.github.io/pslab/blog/blogger-07-23/fig-2.png)\n\n## 10만원: 콘텐츠/후기 자산에 쓴다\n광고만으론 한계가 있습니다. 10만원은 후기 확보, 콘텐츠 제작 같은 \"쌓이는 자산\"에 투자하세요. 광고가 꺼져도 남습니다.\n![10만원: 콘텐츠/후기 자산에 쓴다](https://leejiho-pslab.github.io/pslab/blog/blogger-07-23/fig-3.png)\n\n## 석 달 뒤 숫자로 다시 정한다\n100만원을 3개월 돌리면 어디가 효율적인지 보입니다. 그때 비율을 키우거나 채널을 바꾸세요. 처음 배분은 가설일 뿐입니다.\n![석 달 뒤 숫자로 다시 정한다](https://leejiho-pslab.github.io/pslab/blog/blogger-07-23/fig-4.png)\n\n## 자주 묻는 질문\n**Q. 100만원도 안 되면요?**\n50만원이면 채널 하나 + 소재 실험만 하세요. 자산 투자는 매출이 나면 시작해도 늦지 않습니다.\n\n**Q. 어느 채널부터 시작할까요?**\n고객이 검색으로 오면 검색광고, 발견으로 오면 인스타·메타부터 테스트하세요.\n\n적은 예산일수록 \"나누지 말고 몰아주세요.\" 한 채널에서 이기는 공식을 먼저 찾는 게 순서입니다.\n\n🔖 태그: #소액광고 #광고예산 #스타트업마케팅 #예산배분","variant":"A","slideImages":["cards/pslab/blogger-07-23-1.png"],"status":"published","publishedUrl":"https://pslab2026.blogspot.com/2026/07/100.html","metrics":{"views":0,"likes":0,"comments":0,"shares":0,"engagementRate":0},"insightComment":"조회 0·좋아요 0. 노출 대비 반응을 키우려면 첫 3초 후킹을 강화하세요.","publishedAt":"2026-07-09T12:21:59.335Z"},{"id":"w2-fri","topic":"창업인사이트","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-07-10T09:00:00.000Z","kicker":"Startup","headline":"돈 없이 시작하는 마케팅,\u003cbr>*진짜 가능한가*","sub":"예산 0원부터 검증. 돈 쓰기 전에 할 것.","dayLabel":"금요일 · 창업","cardImage":"cards/pslab/w2-fri-1.png","captionNote":"예산 0원부터 검증. 돈 쓰기 전에 할 것.","captionBody":"“돈 없으면 마케팅 못 하죠” — 절반만 맞습니다.\n\n돈이 필요한 건 “확장”이고, “검증”은 거의 공짜로 가능합니다.\n콘텐츠 몇 개, DM 몇 통, 작은 설문으로 “살 사람이 있는지”부터 확인하세요.\n수요를 확인하기 전에 광고비부터 태우면, 빠르게 망하는 길입니다.\n\n돈은 검증된 다음에 붓는 겁니다.\n\n#창업인사이트 #사업이야기 #온라인마케팅","variant":"B","slideImages":["cards/pslab/w2-fri-1.png","cards/pslab/w2-fri-2.png","cards/pslab/w2-fri-3.png","cards/pslab/w2-fri-4.png","cards/pslab/w2-fri-5.png"],"status":"published","publishedUrl":"https://www.instagram.com/p/DanJLwVknio/","metrics":{"views":3335,"likes":183,"comments":36,"shares":5,"engagementRate":0.06716641679160419},"insightComment":"참여율 6.7% — 평균 수준입니다. 좋아요 183·댓글 36. 다음엔 댓글을 유도하는 질문형 마무리를 시도해보세요.","publishedAt":"2026-07-10T12:01:46.886Z"},{"id":"naver-blog-07-23","topic":"광고 예산, 어디에 써야 하나 — 70-20-10 법칙","format":"naver-blog","channels":["naver-blog"],"scheduledFor":"2026-07-10T09:00:00.000Z","kicker":"Budget","headline":"광고 예산, 어디에 써야 하나 — 70-20-10 법칙","sub":"예산을 골고루 나누면 골고루 실패합니다. 검증된 곳에 70%, 확장에 20%, 실험에 10%로 가세요.","dayLabel":"네이버 블로그","cardImage":"cards/pslab/naver-blog-07-23-1.png","captionNote":"예산을 골고루 나누면 골고루 실패합니다. 검증된 곳에 70%, 확장에 20%, 실험에 10%로 가세요.","captionBody":"# 광고 예산, 어디에 써야 하나 — 70-20-10 법칙\n> [핵심 요약] 예산을 골고루 나누면 골고루 실패합니다. 검증된 곳에 70%, 확장에 20%, 실험에 10%로 가세요.\n\n예산 배분에서 가장 흔한 실수는 \"공평하게 나누기\"입니다. 마케팅은 공평이 아니라 집중이 이깁니다.\n\n## 70% — 검증된 곳에 몰아준다\n이미 ROAS가 나오는 채널·소재에 예산의 70%를 둡니다. 잘 되는 걸 더 키우는 게 가장 확실한 성장입니다.\n![70% — 검증된 곳에 몰아준다](https://leejiho-pslab.github.io/pslab/blog/naver-blog-07-23/fig-1.png)\n\n## 20% — 될 것 같은 곳을 확장한다\n신호는 있지만 아직 검증 전인 채널·타겟에 20%. 여기서 다음 70%가 나옵니다. 확장 없이 70%만 지키면 정체합니다.\n![20% — 될 것 같은 곳을 확장한다](https://leejiho-pslab.github.io/pslab/blog/naver-blog-07-23/fig-2.png)\n\n## 10% — 깨질 각오로 실험한다\n새 채널, 엉뚱한 소재, 낯선 타겟. 10%는 잃어도 되는 돈입니다. 이 실험이 없으면 브랜드는 한 우물에 갇힙니다.\n![10% — 깨질 각오로 실험한다](https://leejiho-pslab.github.io/pslab/blog/naver-blog-07-23/fig-3.png)\n\n## 한 달에 한 번 비율을 다시 짠다\n70-20-10은 고정이 아닙니다. 실험에서 신호가 나오면 확장으로, 확장이 검증되면 주력으로 — 매달 자리를 갈아끼우세요.\n![한 달에 한 번 비율을 다시 짠다](https://leejiho-pslab.github.io/pslab/blog/naver-blog-07-23/fig-4.png)\n\n## 자주 묻는 질문\n**Q. 예산이 적어도 이 비율을 지키나요?**\n월 100만원이라도 70/20/10은 유효합니다. 다만 10%(10만원)는 한 가지 실험에 몰아주세요.\n\n**Q. 70%를 어떻게 정하나요?**\n최근 4주 ROAS가 가장 높은 채널·소재 조합이 기준입니다.\n\n오늘 예산을 70-20-10으로 다시 나눠보세요. 공평을 버리고 집중을 택하는 순간 효율이 달라집니다.\n\n🔖 태그: #광고예산 #예산배분 #ROAS #퍼포먼스마케팅","variant":"A","slideImages":["cards/pslab/naver-blog-07-23-1.png"],"status":"manual"},{"id":"linkedin-07-22","topic":"사업이야기","format":"링크드인 포스트","channels":["linkedin"],"scheduledFor":"2026-07-11T09:00:00.000Z","kicker":"Growth","headline":"매출이 정체됐을 때\u003cbr>먼저 보는 *지표*","sub":"광고가 아니라 병목부터.","dayLabel":"링크드인 · 비즈니스","cardImage":"cards/pslab/linkedin-07-22-1.png","captionNote":"광고가 아니라 병목부터.","captionBody":"매출이 정체되면 대부분 \"광고를 더 돌려야 하나\"부터 생각합니다.\n저는 광고를 마지막에 봅니다. 먼저 '어디가 막혔는지'를 봅니다.\n\n매출 = 신규획득 × 전환 × 재구매. 셋 중 어디가 막혔는지에 따라 처방이 완전히 다릅니다.\n\n· 신규는 오는데 안 산다 → 전환 문제 (상세·가격·신뢰)\n· 사는데 더 안 는다 → 획득 문제 (채널·타겟)\n· 한 번 사고 안 온다 → 재구매 문제 (경험·CRM)\n\n광고비를 붓는 건 '획득'에만 듣습니다.\n전환이 막혔는데 광고를 늘리면, 비싼 클릭으로 빈 그릇을 채우는 셈입니다.\n\n정체는 '광고 부족'이 아니라 '진단 부족'인 경우가 훨씬 많습니다.\n\n#그로스 #마케팅 #사업","variant":"A","slideImages":["cards/pslab/linkedin-07-22-1.png"],"status":"planned"},{"id":"threads-07-18","topic":"브랜딩","format":"스레드(타래)","channels":["threads"],"scheduledFor":"2026-07-11T09:00:00.000Z","kicker":"Threads","headline":"*‘왜’*를 팔아라","sub":"기억되는 법.","dayLabel":"스레드 · 타래","cardImage":"cards/pslab/threads-07-18-1.png","captionNote":"기억되는 법.","captionBody":"사람은 '무엇'이 아니라 '왜'로 브랜드를 기억해요. 🧵\n\n기능은 경쟁사도 똑같이 말합니다. 차별은 '왜'에서 생겨요.\n\n작은 브랜드일수록 더 그렇습니다 — 자원이 적을수록 메시지가 무기니까.\n\n오늘 우리 브랜드의 '왜'를 한 문장으로 써보세요. 안 써지면, 그게 과제예요.","variant":"B","slideImages":["cards/pslab/threads-07-18-1.png"],"status":"published","publishedUrl":"https://www.threads.com/@_pslab/post/DapiY57GylK","metrics":{"views":26880,"likes":2150,"comments":107,"shares":279,"engagementRate":0.0943452380952381},"insightComment":"참여율 9.4%로 평균(6.7%)을 웃돌았어요. 디자인 B안·결론 우선 구조가 먹힌 것으로 보입니다 — 다음에도 같은 톤을 유지하세요.","publishedAt":"2026-07-11T10:20:29.407Z"},{"id":"w3-mon","topic":"업계비하인드","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-07-12T09:00:00.000Z","kicker":"Agency Behind","headline":"대행사가 절대\u003cbr>먼저 *말 안 해주는 것*","sub":"수수료 구조와 계약 전 꼭 물어야 할 질문.","dayLabel":"월요일 · 비하인드","cardImage":"cards/pslab/w3-mon-1.png","captionNote":"수수료 구조와 계약 전 꼭 물어야 할 질문.","captionBody":"대행사가 먼저 말 안 해주는 것들이 있습니다.\n\n- 수수료가 “매체비의 %”인지 “고정”인지에 따라 이해관계가 달라집니다.\n- 리포트의 “좋아 보이는 지표”와 “매출 지표”는 다릅니다.\n- 계약 전, 누가 무엇을 책임지는지 문서로 남기세요.\n\n나쁜 대행이라서가 아니라, 안 물으면 굳이 말 안 하는 구조라서예요.\n질문이 당신을 지킵니다.\n\n#광고대행 #마케팅인사이트 #업계비하인드","variant":"C","slideImages":["cards/pslab/w3-mon-1.png","cards/pslab/w3-mon-2.png","cards/pslab/w3-mon-3.png","cards/pslab/w3-mon-4.png","cards/pslab/w3-mon-5.png","cards/pslab/w3-mon-6.png"],"status":"published","publishedUrl":"https://www.instagram.com/p/DasJZPlnywV/","metrics":{"views":44235,"likes":3317,"comments":663,"shares":431,"engagementRate":0.0997174183338985},"insightComment":"참여율 10.0%로 평균(6.7%)을 웃돌았어요. 디자인 C안·결론 우선 구조가 먹힌 것으로 보입니다 — 다음에도 같은 톤을 유지하세요.","publishedAt":"2026-07-12T10:39:51.681Z"},{"id":"youtube-07-26","topic":"사업이야기","format":"쇼츠 대본","channels":["youtube"],"scheduledFor":"2026-07-12T09:00:00.000Z","kicker":"Shorts","headline":"매출 *정체* 풀리는 순서","sub":"병목부터 보라.","dayLabel":"유튜브 · 쇼츠","cardImage":"cards/pslab/youtube-07-26-1.png","captionNote":"병목부터 보라.","captionBody":"[HOOK]\n매출이 멈췄을 때, 광고부터 늘리면 안 되는 이유.\n\n[본론]\n매출은 신규 × 전환 × 재구매예요.\n- 오는데 안 산다 → 전환(상세·가격·신뢰)\n- 사는데 안 는다 → 획득(채널·타겟)\n- 한 번 사고 끝 → 재구매(경험·CRM)\n막힌 곳이 다른데 광고만 늘리면 돈만 새요.\n\n[CTA]\n정체는 광고 부족이 아니라 진단 부족입니다.","variant":"A","slideImages":["cards/pslab/youtube-07-26-1.png"],"status":"planned","videoFile":"shorts/youtube-07-26/youtube-07-26.mp4","ytTitle":"매출 멈췄을 때 광고부터 늘리면 안 되는 이유｜매출 공식 #shorts","ytDescription":"매출이 정체됐을 때 광고부터 늘리면 돈만 샙니다. 매출 = 신규 × 전환 × 재구매, 막힌 곳부터 찾으세요.\n\n✅ 오는데 안 산다 → 전환(상세·가격·신뢰)\n✅ 사는데 안 는다 → 획득(채널·타겟)\n✅ 한 번 사고 끝 → 재구매(경험·CRM)\n\n매출 정체로 고민하는 사장님, 광고비를 더 쓰기 전에 진단부터 하고 싶은 분께.\n\n📌 마케팅 의사결정 기준 → @_pslab\n👍 도움이 됐다면 구독!\n\n#매출증대 #전환율 #재구매 #CRM #퍼포먼스마케팅 #온라인마케팅 #마케팅전략 #자영업 #shorts","ytTags":["매출 증대","전환율 개선","재구매율","CRM 마케팅","매출 정체","매출 공식","퍼포먼스 마케팅","온라인마케팅","마케팅 전략","자영업 매출"]},{"id":"w3-wed","topic":"브랜딩","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-07-13T09:00:00.000Z","kicker":"Brand Strategy","headline":"후기가 10개도 없는데\u003cbr>*광고부터* 돌린다고?","sub":"신뢰 자산 없이 광고를 태우면 새는 이유.","dayLabel":"수요일 · 브랜딩","cardImage":"cards/pslab/w3-wed-1.png","captionNote":"신뢰 자산 없이 광고를 태우면 새는 이유.","captionBody":"후기 10개도 없는데 광고부터 돌린다고요? 잠깐만요.\n\n광고는 “신뢰 위에” 부어야 효율이 납니다.\n신뢰 자산(후기·사용 사례·콘텐츠)이 비면, 들어온 트래픽이 그냥 빠져나가요.\n비싼 클릭으로 빈 그릇을 채우는 셈입니다.\n\n광고 예산의 일부를 먼저 “믿을 이유”를 쌓는 데 쓰세요. 순서가 효율을 만듭니다.\n\n#브랜딩 #마케팅전략 #온라인마케팅","variant":"C","slideImages":["cards/pslab/w3-wed-1.png","cards/pslab/w3-wed-2.png","cards/pslab/w3-wed-3.png","cards/pslab/w3-wed-4.png","cards/pslab/w3-wed-5.png"],"status":"planned"},{"id":"threads-07-21","topic":"마케팅전략","format":"스레드(타래)","channels":["threads"],"scheduledFor":"2026-07-13T09:00:00.000Z","kicker":"Threads","headline":"예산 배분\u003cbr>*70-20-10*","sub":"한 줄 원칙.","dayLabel":"스레드 · 타래","cardImage":"cards/pslab/threads-07-21-1.png","captionNote":"한 줄 원칙.","captionBody":"광고 예산 배분, 저는 70-20-10으로 갑니다. 🧵\n\n70% 검증된 승자(확장)\n20% 새 타겟·소재 테스트\n10% 과감한 실험\n\n전부 승자에 몰면 성장 정지, 전부 새것에 걸면 돈 누수.\n\n배분이 곧 전략입니다.","variant":"C","slideImages":["cards/pslab/threads-07-21-1.png"],"status":"planned"},{"id":"w3-fri","topic":"마케팅인사이트","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-07-14T09:00:00.000Z","kicker":"Marketing Insight","headline":"트렌드를 좇다 망한\u003cbr>브랜드들의 *공통점*","sub":"유행 추종과 본질. 트렌드를 제대로 쓰는 법.","dayLabel":"금요일 · 인사이트","cardImage":"cards/pslab/w3-fri-1.png","captionNote":"유행 추종과 본질. 트렌드를 제대로 쓰는 법.","captionBody":"트렌드를 좇다 사라진 브랜드들엔 공통점이 있습니다 — “왜”가 없었어요.\n\n유행은 “무엇”을 바꾸게 합니다. 하지만 본질(누구에게, 왜)이 없으면\n트렌드가 끝나는 순간 같이 끝납니다.\n\n트렌드는 “올라타는 것”이 아니라 “내 메시지를 실어 보내는 파도”입니다.\n좇지 말고, 태우세요.\n\n#마케팅인사이트 #온라인시장트렌드 #브랜딩","variant":"C","slideImages":["cards/pslab/w3-fri-1.png","cards/pslab/w3-fri-2.png","cards/pslab/w3-fri-3.png","cards/pslab/w3-fri-4.png","cards/pslab/w3-fri-5.png"],"status":"planned"},{"id":"w4-mon","topic":"퍼포먼스마케팅","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-07-14T09:00:00.000Z","kicker":"Ad Ops","headline":"예산의 *80%*를\u003cbr>어디에 써야 할까","sub":"테스트·확장·리타겟 배분 원칙.","dayLabel":"월요일 · 광고운영","cardImage":"cards/pslab/w4-mon-1.png","captionNote":"테스트·확장·리타겟 배분 원칙.","captionBody":"광고 예산, 어디에 얼마를 쓸지부터 틀리면 다 틀립니다.\n\n제 기준은 70-20-10입니다.\n- 70% 검증된 승자(확장)\n- 20% 새 타겟·소재 테스트\n- 10% 과감한 실험\n\n전부 “잘 되는 것”에 몰면 성장은 멈추고, 전부 “새것”에 걸면 돈이 셉니다.\n배분이 곧 전략입니다.\n\n#퍼포먼스마케팅 #광고대행 #마케팅전략","variant":"A","slideImages":["cards/pslab/w4-mon-1.png","cards/pslab/w4-mon-2.png","cards/pslab/w4-mon-3.png","cards/pslab/w4-mon-4.png","cards/pslab/w4-mon-5.png","cards/pslab/w4-mon-6.png"],"status":"planned"},{"id":"w4-wed","topic":"마케팅전략","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-07-15T09:00:00.000Z","kicker":"Decision","headline":"대행을 맡길 때\u003cbr>vs *직접 할 때*","sub":"규모·역량·시간으로 보는 판단표.","dayLabel":"수요일 · 의사결정","cardImage":"cards/pslab/w4-wed-1.png","captionNote":"규모·역량·시간으로 보는 판단표.","captionBody":"대행을 맡길까, 직접 할까? 세 가지만 보세요.\n\n1. 규모 — 월 광고비가 인건비를 정당화하나요?\n2. 역량 — 내부에 “판단할 사람”이 있나요? (실행 말고 판단)\n3. 시간 — 배우며 할 6개월의 기회비용을 감당할 수 있나요?\n\n셋 다 “No”면 맡기고, “Yes”가 많으면 직접 + 부분 자문이 답입니다.\n정답은 없고, 상황만 있습니다.\n\n#광고대행 #마케팅전략 #사업이야기","variant":"A","slideImages":["cards/pslab/w4-wed-1.png","cards/pslab/w4-wed-2.png","cards/pslab/w4-wed-3.png","cards/pslab/w4-wed-4.png","cards/pslab/w4-wed-5.png","cards/pslab/w4-wed-6.png"],"status":"planned"},{"id":"w4-fri","topic":"사업이야기","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-07-15T09:00:00.000Z","kicker":"Growth","headline":"매출이 정체됐을 때\u003cbr>가장 먼저 보는 *지표*","sub":"신규획득과 재구매, 어디가 막혔는지 진단.","dayLabel":"금요일 · 성장","cardImage":"cards/pslab/w4-fri-1.png","captionNote":"신규획득과 재구매, 어디가 막혔는지 진단.","captionBody":"매출이 정체됐을 때, 저는 광고부터 보지 않습니다. “어디가 막혔는지”부터 봅니다.\n\n- 신규는 들어오는데 안 사면 → 전환(상세·가격·신뢰)\n- 사는데 안 늘면 → 획득(채널·타겟)\n- 한 번 사고 안 오면 → 재구매(경험·CRM)\n\n막힌 곳이 다르면 처방도 다릅니다. 정체는 “광고 부족”이 아니라 “진단 부족”인 경우가 많아요.\n\n#사업이야기 #마케팅인사이트 #성장전략","variant":"A","slideImages":["cards/pslab/w4-fri-1.png","cards/pslab/w4-fri-2.png","cards/pslab/w4-fri-3.png","cards/pslab/w4-fri-4.png","cards/pslab/w4-fri-5.png","cards/pslab/w4-fri-6.png"],"status":"planned"}],"channels":[{"key":"instagram","label":"인스타그램","icon":"📸","active":true,"published":[{"topic":"온라인마케팅","time":"2026-06-25T13:40:06.315Z","imageUrl":"https://i.ibb.co/bgFmxyCH/680c27e00a8d.jpg","caption":"온라인마케팅에 대해 이야기해 볼게요.","url":"https://www.instagram.com/p/DaAsg05kj_n/","views":0,"likes":0,"comments":0,"engagementRate":0},{"topic":"온라인마케팅","time":"2026-06-25T13:09:58.908Z","imageUrl":"https://i.ibb.co/bjxKqrC7/315aa63bb230.jpg","caption":"온라인마케팅에 대해 이야기해 볼게요.","url":"https://www.instagram.com/p/DaApEYKE6Cr/","views":0,"likes":0,"comments":0,"engagementRate":0},{"topic":"온라인마케팅","time":"2026-06-25T12:42:58.071Z","imageUrl":"https://i.ibb.co/LwMY2nq/b961780986f0.jpg","caption":"온라인마케팅에 대해 이야기해 볼게요.","url":"https://instagram.com/p/ig_hewipimt_zgvd","views":0,"likes":0,"comments":0,"engagementRate":0.11063005983808519}],"pending":[{"id":"w1-mon","topic":"광고대행","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-06-29T10:00:00.000Z","kicker":"Marketing Insight","headline":"광고비를 태우기 전에\u003cbr>반드시 점검할 *3가지*","sub":"15년간 대행하며 깨달은, 돈이 새는 지점부터 막는 법.","dayLabel":"월요일 · 인사이트","cardImage":"cards/pslab/w1-mon-1.png","captionNote":"15년간 대행하며 깨달은, 돈이 새는 지점부터 막는 법.","captionBody":"광고비, 켜기 전이 90%입니다.\n\n15년간 수백 개 계정을 만지며 깨달은 건 — 돈은 “운영”이 아니라 “준비”에서 샙니다.\n\n태우기 전 반드시 점검할 3가지\n1. 타겟 — “누구나”는 “아무도”입니다. 한 사람을 그리세요.\n2. 소재 — 첫 3초에 멈출 이유가 없으면 돈은 흐릅니다.\n3. 랜딩 — 클릭 다음 화면이 약하면 모든 클릭이 비용입니다.\n\n이 셋이 안 맞은 채 예산부터 올리는 순간, 적자는 정해집니다.\n\n#온라인마케팅 #광고대행 #퍼포먼스마케팅","variant":"A","slideImages":["cards/pslab/w1-mon-1.png","cards/pslab/w1-mon-2.png","cards/pslab/w1-mon-3.png","cards/pslab/w1-mon-4.png","cards/pslab/w1-mon-5.png","cards/pslab/w1-mon-6.png"],"status":"published","publishedUrl":"https://www.instagram.com/p/DaCerLaFY2L/","publishedAt":"2026-06-26T06:17:35.229Z"},{"id":"w1-wed","topic":"업계비하인드","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-07-01T10:00:00.000Z","kicker":"Agency Behind","headline":"대행사를 쓰면\u003cbr>매출이 오른다는 *착각*","sub":"대행이 할 수 있는 것과 없는 것, 솔직하게 말합니다.","dayLabel":"수요일 · 비하인드","cardImage":"cards/pslab/w1-wed-1.png","captionNote":"대행이 할 수 있는 것과 없는 것, 솔직하게 말합니다.","captionBody":"“대행 맡기면 알아서 매출 오르겠지” — 가장 많이 깨지는 기대입니다.\n\n대행이 잘하는 건 “실행의 효율”입니다. 같은 예산으로 더 정교하게, 더 빠르게.\n하지만 “팔리는 상품”과 “살 이유”를 만드는 건 결국 브랜드의 몫이에요.\n\n이 경계가 정렬되지 않으면, 대행도 광고주도 둘 다 지칩니다.\n맡기기 전에 “우리가 책임질 것”부터 정하세요.\n\n#마케팅인사이트 #광고대행 #사업이야기","variant":"A","slideImages":["cards/pslab/w1-wed-1.png","cards/pslab/w1-wed-2.png","cards/pslab/w1-wed-3.png","cards/pslab/w1-wed-4.png","cards/pslab/w1-wed-5.png"],"status":"published","publishedUrl":"https://www.instagram.com/p/DaK2fegjYUt/","metrics":{"views":32645,"likes":2774,"comments":277,"shares":360,"engagementRate":0.10448767039362843},"insightComment":"참여율 10.4%로 평균(6.7%)을 웃돌았어요. 디자인 A안·결론 우선 구조가 먹힌 것으로 보입니다 — 다음에도 같은 톤을 유지하세요.","publishedAt":"2026-06-29T12:19:41.176Z"},{"id":"w1-fri","topic":"브랜딩","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-07-01T09:00:00.000Z","kicker":"Brand Strategy","headline":"팔리는 브랜드는\u003cbr>‘무엇’이 아니라 *‘왜’*를 판다","sub":"작은 브랜드일수록 더 중요한 메시지 설계 이야기.","dayLabel":"금요일 · 브랜딩","cardImage":"cards/pslab/w1-fri-1.png","captionNote":"작은 브랜드일수록 더 중요한 메시지 설계 이야기.","captionBody":"사람들은 “무엇을 파는지”로 기억하지 않습니다. “왜 파는지”로 기억하죠.\n\n기능과 스펙은 경쟁사도 똑같이 말합니다. 차별은 “왜”에서 생깁니다.\n작은 브랜드일수록 더 그래요 — 자원이 적을수록 메시지가 무기니까.\n\n오늘 우리 브랜드의 “왜”를 한 문장으로 써보세요. 안 써지면, 그게 진짜 과제입니다.\n\n#브랜딩 #마케팅전략 #창업인사이트","variant":"A","slideImages":["cards/pslab/w1-fri-1.png","cards/pslab/w1-fri-2.png","cards/pslab/w1-fri-3.png","cards/pslab/w1-fri-4.png","cards/pslab/w1-fri-5.png"],"status":"published","publishedUrl":"https://www.instagram.com/p/DaP-NdfDv3F/","metrics":{"views":34400,"likes":2752,"comments":137,"shares":220,"engagementRate":0.09037790697674418},"insightComment":"참여율 9.0%로 평균(6.7%)을 웃돌았어요. 디자인 A안·결론 우선 구조가 먹힌 것으로 보입니다 — 다음에도 같은 톤을 유지하세요.","publishedAt":"2026-07-01T12:03:17.068Z"},{"id":"w2-mon","topic":"마케팅전략","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-07-04T09:00:00.000Z","kicker":"Decision","headline":"이 광고, 꺼야 할까?\u003cbr>판단하는 *숫자 하나*","sub":"감으로 끄지 마세요. 손익분기 한 줄 계산법.","dayLabel":"월요일 · 의사결정","cardImage":"cards/pslab/w2-mon-1.png","captionNote":"감으로 끄지 마세요. 손익분기 한 줄 계산법.","captionBody":"“이 광고 꺼야 하나, 더 둬야 하나” 감으로 정하지 마세요.\n\n판단은 숫자 하나로 충분합니다 — 손익분기 CPA.\n(객단가 × 마진율)이 허용 CPA입니다. 실제 CPA가 이걸 넘으면, 켤수록 적자.\n\n예) 객단가 5만 × 마진 40% = 허용 CPA 2만원. 지금 3만이면? 끄거나 고치세요.\n감이 아니라 선이 결정합니다.\n\n#퍼포먼스마케팅 #마케팅전략 #광고대행","variant":"B","slideImages":["cards/pslab/w2-mon-1.png","cards/pslab/w2-mon-2.png","cards/pslab/w2-mon-3.png","cards/pslab/w2-mon-4.png","cards/pslab/w2-mon-5.png"],"status":"published","publishedUrl":"https://www.instagram.com/p/DaXlHvkjzDc/","metrics":{"views":8489,"likes":755,"comments":105,"shares":90,"engagementRate":0.11190952997997408},"insightComment":"참여율 11.2%로 평균(6.7%)을 웃돌았어요. 디자인 B안·결론 우선 구조가 먹힌 것으로 보입니다 — 다음에도 같은 톤을 유지하세요.","publishedAt":"2026-07-04T10:57:58.853Z"},{"id":"w2-wed","topic":"퍼포먼스마케팅","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-07-07T09:00:00.000Z","kicker":"Ad Ops","headline":"클릭은 느는데\u003cbr>매출이 *안 느는 이유*","sub":"클릭은 구매가 아닙니다. 전환이 새는 지점.","dayLabel":"수요일 · 광고운영","cardImage":"cards/pslab/w2-wed-1.png","captionNote":"클릭은 구매가 아닙니다. 전환이 새는 지점.","captionBody":"클릭은 느는데 매출은 그대로. 광고가 문제일까요?\n\n대개 아닙니다. 클릭은 “관심”이고 구매는 “확신”이에요. 둘 사이에서 새는 겁니다.\n랜딩의 첫 화면, 가격을 납득시키는 근거, 후기 같은 신뢰 장치 —\n이 중 하나만 약해도 클릭은 비용으로 끝납니다.\n\n광고를 더 돌리기 전에, 클릭 다음 화면부터 점검하세요.\n\n#퍼포먼스마케팅 #온라인마케팅 #전환율","variant":"B","slideImages":["cards/pslab/w2-wed-1.png","cards/pslab/w2-wed-2.png","cards/pslab/w2-wed-3.png","cards/pslab/w2-wed-4.png","cards/pslab/w2-wed-5.png"],"status":"published","publishedUrl":"https://www.instagram.com/p/DafckBAmnn9/","metrics":{"views":20019,"likes":1981,"comments":475,"shares":237,"engagementRate":0.13452220390628902},"insightComment":"참여율 13.5%로 평균(6.7%)을 웃돌았어요. 디자인 B안·결론 우선 구조가 먹힌 것으로 보입니다 — 다음에도 같은 톤을 유지하세요.","publishedAt":"2026-07-07T12:17:07.179Z"},{"id":"w2-fri","topic":"창업인사이트","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-07-10T09:00:00.000Z","kicker":"Startup","headline":"돈 없이 시작하는 마케팅,\u003cbr>*진짜 가능한가*","sub":"예산 0원부터 검증. 돈 쓰기 전에 할 것.","dayLabel":"금요일 · 창업","cardImage":"cards/pslab/w2-fri-1.png","captionNote":"예산 0원부터 검증. 돈 쓰기 전에 할 것.","captionBody":"“돈 없으면 마케팅 못 하죠” — 절반만 맞습니다.\n\n돈이 필요한 건 “확장”이고, “검증”은 거의 공짜로 가능합니다.\n콘텐츠 몇 개, DM 몇 통, 작은 설문으로 “살 사람이 있는지”부터 확인하세요.\n수요를 확인하기 전에 광고비부터 태우면, 빠르게 망하는 길입니다.\n\n돈은 검증된 다음에 붓는 겁니다.\n\n#창업인사이트 #사업이야기 #온라인마케팅","variant":"B","slideImages":["cards/pslab/w2-fri-1.png","cards/pslab/w2-fri-2.png","cards/pslab/w2-fri-3.png","cards/pslab/w2-fri-4.png","cards/pslab/w2-fri-5.png"],"status":"published","publishedUrl":"https://www.instagram.com/p/DanJLwVknio/","metrics":{"views":3335,"likes":183,"comments":36,"shares":5,"engagementRate":0.06716641679160419},"insightComment":"참여율 6.7% — 평균 수준입니다. 좋아요 183·댓글 36. 다음엔 댓글을 유도하는 질문형 마무리를 시도해보세요.","publishedAt":"2026-07-10T12:01:46.886Z"},{"id":"w3-mon","topic":"업계비하인드","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-07-12T09:00:00.000Z","kicker":"Agency Behind","headline":"대행사가 절대\u003cbr>먼저 *말 안 해주는 것*","sub":"수수료 구조와 계약 전 꼭 물어야 할 질문.","dayLabel":"월요일 · 비하인드","cardImage":"cards/pslab/w3-mon-1.png","captionNote":"수수료 구조와 계약 전 꼭 물어야 할 질문.","captionBody":"대행사가 먼저 말 안 해주는 것들이 있습니다.\n\n- 수수료가 “매체비의 %”인지 “고정”인지에 따라 이해관계가 달라집니다.\n- 리포트의 “좋아 보이는 지표”와 “매출 지표”는 다릅니다.\n- 계약 전, 누가 무엇을 책임지는지 문서로 남기세요.\n\n나쁜 대행이라서가 아니라, 안 물으면 굳이 말 안 하는 구조라서예요.\n질문이 당신을 지킵니다.\n\n#광고대행 #마케팅인사이트 #업계비하인드","variant":"C","slideImages":["cards/pslab/w3-mon-1.png","cards/pslab/w3-mon-2.png","cards/pslab/w3-mon-3.png","cards/pslab/w3-mon-4.png","cards/pslab/w3-mon-5.png","cards/pslab/w3-mon-6.png"],"status":"published","publishedUrl":"https://www.instagram.com/p/DasJZPlnywV/","metrics":{"views":44235,"likes":3317,"comments":663,"shares":431,"engagementRate":0.0997174183338985},"insightComment":"참여율 10.0%로 평균(6.7%)을 웃돌았어요. 디자인 C안·결론 우선 구조가 먹힌 것으로 보입니다 — 다음에도 같은 톤을 유지하세요.","publishedAt":"2026-07-12T10:39:51.681Z"},{"id":"w3-wed","topic":"브랜딩","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-07-13T09:00:00.000Z","kicker":"Brand Strategy","headline":"후기가 10개도 없는데\u003cbr>*광고부터* 돌린다고?","sub":"신뢰 자산 없이 광고를 태우면 새는 이유.","dayLabel":"수요일 · 브랜딩","cardImage":"cards/pslab/w3-wed-1.png","captionNote":"신뢰 자산 없이 광고를 태우면 새는 이유.","captionBody":"후기 10개도 없는데 광고부터 돌린다고요? 잠깐만요.\n\n광고는 “신뢰 위에” 부어야 효율이 납니다.\n신뢰 자산(후기·사용 사례·콘텐츠)이 비면, 들어온 트래픽이 그냥 빠져나가요.\n비싼 클릭으로 빈 그릇을 채우는 셈입니다.\n\n광고 예산의 일부를 먼저 “믿을 이유”를 쌓는 데 쓰세요. 순서가 효율을 만듭니다.\n\n#브랜딩 #마케팅전략 #온라인마케팅","variant":"C","slideImages":["cards/pslab/w3-wed-1.png","cards/pslab/w3-wed-2.png","cards/pslab/w3-wed-3.png","cards/pslab/w3-wed-4.png","cards/pslab/w3-wed-5.png"],"status":"planned"},{"id":"w3-fri","topic":"마케팅인사이트","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-07-14T09:00:00.000Z","kicker":"Marketing Insight","headline":"트렌드를 좇다 망한\u003cbr>브랜드들의 *공통점*","sub":"유행 추종과 본질. 트렌드를 제대로 쓰는 법.","dayLabel":"금요일 · 인사이트","cardImage":"cards/pslab/w3-fri-1.png","captionNote":"유행 추종과 본질. 트렌드를 제대로 쓰는 법.","captionBody":"트렌드를 좇다 사라진 브랜드들엔 공통점이 있습니다 — “왜”가 없었어요.\n\n유행은 “무엇”을 바꾸게 합니다. 하지만 본질(누구에게, 왜)이 없으면\n트렌드가 끝나는 순간 같이 끝납니다.\n\n트렌드는 “올라타는 것”이 아니라 “내 메시지를 실어 보내는 파도”입니다.\n좇지 말고, 태우세요.\n\n#마케팅인사이트 #온라인시장트렌드 #브랜딩","variant":"C","slideImages":["cards/pslab/w3-fri-1.png","cards/pslab/w3-fri-2.png","cards/pslab/w3-fri-3.png","cards/pslab/w3-fri-4.png","cards/pslab/w3-fri-5.png"],"status":"planned"},{"id":"w4-mon","topic":"퍼포먼스마케팅","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-07-14T09:00:00.000Z","kicker":"Ad Ops","headline":"예산의 *80%*를\u003cbr>어디에 써야 할까","sub":"테스트·확장·리타겟 배분 원칙.","dayLabel":"월요일 · 광고운영","cardImage":"cards/pslab/w4-mon-1.png","captionNote":"테스트·확장·리타겟 배분 원칙.","captionBody":"광고 예산, 어디에 얼마를 쓸지부터 틀리면 다 틀립니다.\n\n제 기준은 70-20-10입니다.\n- 70% 검증된 승자(확장)\n- 20% 새 타겟·소재 테스트\n- 10% 과감한 실험\n\n전부 “잘 되는 것”에 몰면 성장은 멈추고, 전부 “새것”에 걸면 돈이 셉니다.\n배분이 곧 전략입니다.\n\n#퍼포먼스마케팅 #광고대행 #마케팅전략","variant":"A","slideImages":["cards/pslab/w4-mon-1.png","cards/pslab/w4-mon-2.png","cards/pslab/w4-mon-3.png","cards/pslab/w4-mon-4.png","cards/pslab/w4-mon-5.png","cards/pslab/w4-mon-6.png"],"status":"planned"},{"id":"w4-wed","topic":"마케팅전략","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-07-15T09:00:00.000Z","kicker":"Decision","headline":"대행을 맡길 때\u003cbr>vs *직접 할 때*","sub":"규모·역량·시간으로 보는 판단표.","dayLabel":"수요일 · 의사결정","cardImage":"cards/pslab/w4-wed-1.png","captionNote":"규모·역량·시간으로 보는 판단표.","captionBody":"대행을 맡길까, 직접 할까? 세 가지만 보세요.\n\n1. 규모 — 월 광고비가 인건비를 정당화하나요?\n2. 역량 — 내부에 “판단할 사람”이 있나요? (실행 말고 판단)\n3. 시간 — 배우며 할 6개월의 기회비용을 감당할 수 있나요?\n\n셋 다 “No”면 맡기고, “Yes”가 많으면 직접 + 부분 자문이 답입니다.\n정답은 없고, 상황만 있습니다.\n\n#광고대행 #마케팅전략 #사업이야기","variant":"A","slideImages":["cards/pslab/w4-wed-1.png","cards/pslab/w4-wed-2.png","cards/pslab/w4-wed-3.png","cards/pslab/w4-wed-4.png","cards/pslab/w4-wed-5.png","cards/pslab/w4-wed-6.png"],"status":"planned"},{"id":"w4-fri","topic":"사업이야기","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-07-15T09:00:00.000Z","kicker":"Growth","headline":"매출이 정체됐을 때\u003cbr>가장 먼저 보는 *지표*","sub":"신규획득과 재구매, 어디가 막혔는지 진단.","dayLabel":"금요일 · 성장","cardImage":"cards/pslab/w4-fri-1.png","captionNote":"신규획득과 재구매, 어디가 막혔는지 진단.","captionBody":"매출이 정체됐을 때, 저는 광고부터 보지 않습니다. “어디가 막혔는지”부터 봅니다.\n\n- 신규는 들어오는데 안 사면 → 전환(상세·가격·신뢰)\n- 사는데 안 늘면 → 획득(채널·타겟)\n- 한 번 사고 안 오면 → 재구매(경험·CRM)\n\n막힌 곳이 다르면 처방도 다릅니다. 정체는 “광고 부족”이 아니라 “진단 부족”인 경우가 많아요.\n\n#사업이야기 #마케팅인사이트 #성장전략","variant":"A","slideImages":["cards/pslab/w4-fri-1.png","cards/pslab/w4-fri-2.png","cards/pslab/w4-fri-3.png","cards/pslab/w4-fri-4.png","cards/pslab/w4-fri-5.png","cards/pslab/w4-fri-6.png"],"status":"planned"}],"stats":{"publishedCount":3,"pendingCount":12,"avgEngagement":0.03687668661269506,"trend":"up","totalViews":0,"totalLikes":0},"series":[11.06300598380852,0,0]},{"key":"threads","label":"스레드","icon":"🧵","active":false,"published":[],"pending":[{"id":"threads-07-04","topic":"온라인마케팅","format":"스레드(타래)","channels":["threads"],"scheduledFor":"2026-07-04T10:00:00.000Z","kicker":"Threads","headline":"광고비 태우기 전\u003cbr>점검 *3가지*","sub":"짧게 핵심만.","dayLabel":"스레드 · 타래","cardImage":"cards/pslab/threads-07-04-1.png","captionNote":"짧게 핵심만.","captionBody":"광고비, 켜기 전이 90%입니다. 🧵\n\n1) 타겟 — \"누구나\"는 \"아무도\"예요. 한 사람을 그리세요.\n\n2) 소재 — 첫 3초에 멈출 이유가 없으면 돈만 흐릅니다.\n\n3) 랜딩 — 클릭 다음 화면이 약하면 모든 클릭이 비용이에요.\n\n이 셋 맞추기 전에 예산부터 올리면? 적자는 정해진 결과입니다.","variant":"A","slideImages":["cards/pslab/threads-07-04-1.png"],"status":"published","publishedUrl":"https://www.threads.com/@_pslab/post/DaIUz7QGpp_","publishedAt":"2026-06-28T12:46:54.616Z"},{"id":"threads-07-07","topic":"업계비하인드","format":"스레드(타래)","channels":["threads"],"scheduledFor":"2026-07-02T09:00:00.000Z","kicker":"Threads","headline":"대행사가 *안 해주는* 말","sub":"솔직한 비하인드.","dayLabel":"스레드 · 타래","cardImage":"cards/pslab/threads-07-07-1.png","captionNote":"솔직한 비하인드.","captionBody":"대행사가 먼저 안 해주는 것들. 🧵\n\n· 수수료가 매체비의 %인지 고정인지에 따라 이해관계가 달라져요.\n\n· 리포트의 '좋아 보이는 지표'와 '매출 지표'는 다릅니다.\n\n· 계약 전, 누가 뭘 책임지는지 글로 남기세요.\n\n나쁜 대행이라서가 아니라, 안 물으면 굳이 말 안 하는 구조라서요.","variant":"B","slideImages":["cards/pslab/threads-07-07-1.png"],"status":"published","publishedUrl":"https://www.threads.com/@_pslab/post/DaSgRE-IAw4","metrics":{"views":50291,"likes":2564,"comments":410,"shares":102,"engagementRate":0.06116402537233302},"insightComment":"참여율 6.1% — 평균 수준입니다. 좋아요 2564·댓글 410. 다음엔 댓글을 유도하는 질문형 마무리를 시도해보세요.","publishedAt":"2026-07-02T11:39:25.721Z"},{"id":"threads-07-11","topic":"창업인사이트","format":"스레드(타래)","channels":["threads"],"scheduledFor":"2026-07-05T09:00:00.000Z","kicker":"Threads","headline":"돈 없이 마케팅\u003cbr>*가능한가*","sub":"검증부터.","dayLabel":"스레드 · 타래","cardImage":"cards/pslab/threads-07-11-1.png","captionNote":"검증부터.","captionBody":"\"돈 없으면 마케팅 못 하죠\" — 절반만 맞아요. 🧵\n\n돈이 필요한 건 '확장'이고, '검증'은 거의 공짜입니다.\n\n콘텐츠 몇 개, DM 몇 통, 작은 설문으로 \"살 사람이 있는지\"부터 확인하세요.\n\n수요 확인 전에 광고비부터 태우면, 가장 빠르게 망하는 길입니다.\n\n돈은 검증된 다음에 붓는 겁니다.","variant":"C","slideImages":["cards/pslab/threads-07-11-1.png"],"status":"published","publishedUrl":"https://www.threads.com/@_pslab/post/DaaLHIOGybk","metrics":{"views":41618,"likes":4078,"comments":937,"shares":448,"engagementRate":0.13126531789129703},"insightComment":"참여율 13.1%로 평균(6.7%)을 웃돌았어요. 디자인 C안·결론 우선 구조가 먹힌 것으로 보입니다 — 다음에도 같은 톤을 유지하세요.","publishedAt":"2026-07-05T11:08:27.476Z"},{"id":"threads-07-14","topic":"퍼포먼스마케팅","format":"스레드(타래)","channels":["threads"],"scheduledFor":"2026-07-08T09:00:00.000Z","kicker":"Threads","headline":"클릭은 느는데\u003cbr>매출이 *그대로*","sub":"전환을 보라.","dayLabel":"스레드 · 타래","cardImage":"cards/pslab/threads-07-14-1.png","captionNote":"전환을 보라.","captionBody":"클릭은 느는데 매출은 그대로. 광고 탓일까요? 🧵\n\n대개 아니에요. 클릭은 '관심', 구매는 '확신'.\n\n랜딩 첫 화면 · 가격의 근거 · 후기.\n이 중 하나만 약해도 전환이 무너집니다.\n\n광고를 더 돌리기 전에, 클릭 다음 화면부터 보세요.","variant":"A","slideImages":["cards/pslab/threads-07-14-1.png"],"status":"published","publishedUrl":"https://www.threads.com/@_pslab/post/Dah5rq9nBc_","metrics":{"views":21744,"likes":1391,"comments":125,"shares":97,"engagementRate":0.07418138337012509},"insightComment":"참여율 7.4%로 평균(6.7%)을 웃돌았어요. 디자인 A안·결론 우선 구조가 먹힌 것으로 보입니다 — 다음에도 같은 톤을 유지하세요.","publishedAt":"2026-07-08T11:10:04.327Z"},{"id":"threads-07-18","topic":"브랜딩","format":"스레드(타래)","channels":["threads"],"scheduledFor":"2026-07-11T09:00:00.000Z","kicker":"Threads","headline":"*‘왜’*를 팔아라","sub":"기억되는 법.","dayLabel":"스레드 · 타래","cardImage":"cards/pslab/threads-07-18-1.png","captionNote":"기억되는 법.","captionBody":"사람은 '무엇'이 아니라 '왜'로 브랜드를 기억해요. 🧵\n\n기능은 경쟁사도 똑같이 말합니다. 차별은 '왜'에서 생겨요.\n\n작은 브랜드일수록 더 그렇습니다 — 자원이 적을수록 메시지가 무기니까.\n\n오늘 우리 브랜드의 '왜'를 한 문장으로 써보세요. 안 써지면, 그게 과제예요.","variant":"B","slideImages":["cards/pslab/threads-07-18-1.png"],"status":"published","publishedUrl":"https://www.threads.com/@_pslab/post/DapiY57GylK","metrics":{"views":26880,"likes":2150,"comments":107,"shares":279,"engagementRate":0.0943452380952381},"insightComment":"참여율 9.4%로 평균(6.7%)을 웃돌았어요. 디자인 B안·결론 우선 구조가 먹힌 것으로 보입니다 — 다음에도 같은 톤을 유지하세요.","publishedAt":"2026-07-11T10:20:29.407Z"},{"id":"threads-07-21","topic":"마케팅전략","format":"스레드(타래)","channels":["threads"],"scheduledFor":"2026-07-13T09:00:00.000Z","kicker":"Threads","headline":"예산 배분\u003cbr>*70-20-10*","sub":"한 줄 원칙.","dayLabel":"스레드 · 타래","cardImage":"cards/pslab/threads-07-21-1.png","captionNote":"한 줄 원칙.","captionBody":"광고 예산 배분, 저는 70-20-10으로 갑니다. 🧵\n\n70% 검증된 승자(확장)\n20% 새 타겟·소재 테스트\n10% 과감한 실험\n\n전부 승자에 몰면 성장 정지, 전부 새것에 걸면 돈 누수.\n\n배분이 곧 전략입니다.","variant":"C","slideImages":["cards/pslab/threads-07-21-1.png"],"status":"planned"}],"stats":{"publishedCount":0,"pendingCount":6,"avgEngagement":0,"trend":"n/a","totalViews":0,"totalLikes":0},"series":[]},{"key":"naver-blog","label":"네이버 블로그","icon":"📝","active":false,"published":[],"pending":[{"id":"naver-blog-07-02","topic":"광고대행사에 맡기기 전, 반드시 확인할 5가지","format":"naver-blog","channels":["naver-blog"],"scheduledFor":"2026-07-01T09:00:00.000Z","kicker":"Agency","headline":"광고대행사에 맡기기 전, 반드시 확인할 5가지","sub":"대행사를 잘못 만나면 돈만 태웁니다. 계약 전 \"이 다섯 가지\"를 물어보면 80%는 거를 수 있습니다.","dayLabel":"네이버 블로그","cardImage":"cards/pslab/naver-blog-07-02-1.png","captionNote":"대행사를 잘못 만나면 돈만 태웁니다. 계약 전 \"이 다섯 가지\"를 물어보면 80%는 거를 수 있습니다.","captionBody":"# 광고대행사에 맡기기 전, 반드시 확인할 5가지\n> [핵심 요약] 대행사를 잘못 만나면 돈만 태웁니다. 계약 전 \"이 다섯 가지\"를 물어보면 80%는 거를 수 있습니다.\n\n15년간 대행 일을 하며, 또 반대로 대행사를 써보며 깨달은 건 분명합니다. 실력 차이는 제안서가 아니라 \"질문에 답하는 방식\"에서 드러납니다.\n\n## 1. 누가 실제로 내 계정을 만지는가\n제안 미팅엔 베테랑이 오고, 운영은 신입이 하는 구조가 흔합니다. \"담당자 경력과 동시 운영 계정 수\"를 반드시 물어보세요. 한 명이 20개를 돌리면 내 계정은 방치됩니다.\n![1. 누가 실제로 내 계정을 만지는가](https://leejiho-pslab.github.io/pslab/blog/naver-blog-07-02/fig-1.png)\n\n## 2. 성과 보고가 \"지표\"인가 \"매출\"인가\n노출·클릭·CTR만 잔뜩 적힌 보고서는 위험 신호입니다. 클릭은 늘어도 매출은 그대로일 수 있으니까요. 전환·매출·ROAS로 말하는 곳을 고르세요.\n![2. 성과 보고가 \"지표\"인가 \"매출\"인가](https://leejiho-pslab.github.io/pslab/blog/naver-blog-07-02/fig-2.png)\n\n## 3. 광고비와 수수료가 분리돼 있는가\n광고비에 수수료가 녹아 있으면 대행사는 \"더 쓰게\" 만들 동기가 생깁니다. 광고비와 운영 수수료를 항목으로 분리한 견적을 요구하세요.\n![3. 광고비와 수수료가 분리돼 있는가](https://leejiho-pslab.github.io/pslab/blog/naver-blog-07-02/fig-3.png)\n\n## 4. 초기 2주에 무엇을 하기로 했는가\n잘하는 곳은 첫 2주를 \"학습 기간\"으로 설계합니다. 소액으로 여러 소재를 테스트해 데이터를 모으죠. 처음부터 풀예산을 태우자는 곳은 거르세요.\n![4. 초기 2주에 무엇을 하기로 했는가](https://leejiho-pslab.github.io/pslab/blog/naver-blog-07-02/fig-4.png)\n\n## 자주 묻는 질문\n**Q. 수수료는 보통 몇 %인가요?**\n매체비의 10~20%가 일반적입니다. 다만 \"관리 범위(제작 포함 여부)\"에 따라 다르니 항목으로 확인하세요.\n\n**Q. 소규모도 대행을 맡기는 게 나을까요?**\n월 광고비 300만원 미만이면 직접 + 부분 자문이 효율적일 때가 많습니다.\n\n대행사 미팅 전에 이 다섯 질문을 그대로 던져보세요. 답하는 태도만 봐도 절반은 결정됩니다.\n\n🔖 태그: #광고대행사 #마케팅대행 #대행사선택 #광고비","variant":"A","slideImages":["cards/pslab/naver-blog-07-02-1.png"],"status":"manual"},{"id":"naver-blog-07-09","topic":"클릭은 느는데 매출이 안 오르는 진짜 이유","format":"naver-blog","channels":["naver-blog"],"scheduledFor":"2026-07-04T09:00:00.000Z","kicker":"Conversion","headline":"클릭은 느는데 매출이 안 오르는 진짜 이유","sub":"광고를 늘렸는데 매출이 그대로라면, 문제는 광고가 아니라 \"클릭 다음\"에 있습니다.","dayLabel":"네이버 블로그","cardImage":"cards/pslab/naver-blog-07-09-1.png","captionNote":"광고를 늘렸는데 매출이 그대로라면, 문제는 광고가 아니라 \"클릭 다음\"에 있습니다.","captionBody":"# 클릭은 느는데 매출이 안 오르는 진짜 이유\n> [핵심 요약] 광고를 늘렸는데 매출이 그대로라면, 문제는 광고가 아니라 \"클릭 다음\"에 있습니다.\n\n\"광고비를 늘렸는데 왜 매출이 안 늘죠?\" 가장 많이 받는 질문입니다. 답은 거의 항상 광고 바깥, 도착 페이지에 있습니다.\n\n## 클릭과 매출 사이엔 깔때기가 있다\n클릭 → 페이지 체류 → 장바구니 → 결제. 이 깔때기에서 어디가 새는지 모르면 광고비만 늘립니다. 먼저 단계별 이탈률부터 보세요.\n![클릭과 매출 사이엔 깔때기가 있다](https://leejiho-pslab.github.io/pslab/blog/naver-blog-07-09/fig-1.png)\n\n## 첫 3초가 매출을 결정한다\n도착 페이지 상단에서 \"여기가 내가 찾던 곳\"이라는 확신을 3초 안에 못 주면 떠납니다. 광고 문구와 페이지 첫 화면의 메시지를 똑같이 맞추세요.\n![첫 3초가 매출을 결정한다](https://leejiho-pslab.github.io/pslab/blog/naver-blog-07-09/fig-2.png)\n\n## 후기가 없으면 결제까지 안 간다\n특히 처음 보는 브랜드는 후기 수가 곧 전환율입니다. 후기 10개 미만이라면 광고 확장보다 후기 확보가 먼저입니다.\n![후기가 없으면 결제까지 안 간다](https://leejiho-pslab.github.io/pslab/blog/naver-blog-07-09/fig-3.png)\n\n## 결제 단계의 마찰을 없애라\n회원가입 강제, 과한 입력칸, 느린 로딩 — 결제 직전 이탈의 주범입니다. 비회원 결제와 간편결제를 열어두세요.\n![결제 단계의 마찰을 없애라](https://leejiho-pslab.github.io/pslab/blog/naver-blog-07-09/fig-4.png)\n\n## 자주 묻는 질문\n**Q. 광고를 멈춰야 하나요?**\n아니요. 광고는 유지하되 예산 증액을 멈추고, 페이지 전환율부터 올리세요.\n\n**Q. 전환율 몇 %가 정상인가요?**\n업종마다 다르지만 이커머스 1~3%가 일반적입니다. 1% 미만이면 페이지부터 점검하세요.\n\n광고비를 더 쓰기 전에, 클릭 다음의 깔때기부터 막으세요. 같은 광고비로 매출이 달라집니다.\n\n🔖 태그: #전환율 #랜딩페이지 #광고효율 #CRO","variant":"B","slideImages":["cards/pslab/naver-blog-07-09-1.png"],"status":"manual"},{"id":"naver-blog-07-16","topic":"작은 브랜드일수록 '무엇'이 아니라 '왜'를 팔아야 합니다","format":"naver-blog","channels":["naver-blog"],"scheduledFor":"2026-07-07T09:00:00.000Z","kicker":"Brand","headline":"작은 브랜드일수록 '무엇'이 아니라 '왜'를 팔아야 합니다","sub":"기능으로 싸우면 대기업을 못 이깁니다. 작은 브랜드의 무기는 \"왜 이걸 만들었는가\"라는 이유입니다.","dayLabel":"네이버 블로그","cardImage":"cards/pslab/naver-blog-07-16-1.png","captionNote":"기능으로 싸우면 대기업을 못 이깁니다. 작은 브랜드의 무기는 \"왜 이걸 만들었는가\"라는 이유입니다.","captionBody":"# 작은 브랜드일수록 '무엇'이 아니라 '왜'를 팔아야 합니다\n> [핵심 요약] 기능으로 싸우면 대기업을 못 이깁니다. 작은 브랜드의 무기는 \"왜 이걸 만들었는가\"라는 이유입니다.\n\n스펙 비교표를 만들수록 작은 브랜드는 불리해집니다. 가격도 물량도 밀리니까요. 그런데 \"왜\"로 옮기는 순간 판이 바뀝니다.\n\n## 기능은 복제되지만 이유는 복제 안 된다\n같은 성분, 같은 사양은 곧 따라옵니다. 하지만 \"왜 시작했는지\"는 베낄 수 없습니다. 그게 작은 브랜드의 유일한 해자입니다.\n![기능은 복제되지만 이유는 복제 안 된다](https://leejiho-pslab.github.io/pslab/blog/naver-blog-07-16/fig-1.png)\n\n## '왜'는 한 사람의 이야기에서 나온다\n거창한 미션이 아니라, 창업자가 겪은 구체적 불편 하나면 충분합니다. 그 장면을 보여주면 고객은 자기 이야기로 받아들입니다.\n!['왜'는 한 사람의 이야기에서 나온다](https://leejiho-pslab.github.io/pslab/blog/naver-blog-07-16/fig-2.png)\n\n## 이유가 같은 사람만 모아라\n모두를 설득하려 하면 아무에게도 안 남습니다. \"이 이유에 공감하는 사람\"만 정확히 겨냥하세요. 작을수록 좁혀야 합니다.\n![이유가 같은 사람만 모아라](https://leejiho-pslab.github.io/pslab/blog/naver-blog-07-16/fig-3.png)\n\n## '왜'를 모든 접점에 반복하라\n상세페이지, 패키지, SNS, 응대까지 같은 이유가 흐르면 브랜드가 됩니다. 채널마다 말투는 달라도 이유는 하나여야 합니다.\n!['왜'를 모든 접점에 반복하라](https://leejiho-pslab.github.io/pslab/blog/naver-blog-07-16/fig-4.png)\n\n## 자주 묻는 질문\n**Q. 스토리가 특별하지 않은데요?**\n특별할 필요 없습니다. 구체적이면 됩니다. \"왜\"는 크기가 아니라 진정성으로 작동합니다.\n\n**Q. 기능 설명은 빼야 하나요?**\n아니요. 이유로 끌고 기능으로 확신을 주세요. 순서가 핵심입니다.\n\n오늘 상세페이지 첫 문단을 \"왜\"로 바꿔보세요. 같은 제품이 다르게 보이기 시작합니다.\n\n🔖 태그: #브랜딩 #스몰브랜드 #포지셔닝 #브랜드스토리","variant":"C","slideImages":["cards/pslab/naver-blog-07-16-1.png"],"status":"manual"},{"id":"naver-blog-07-23","topic":"광고 예산, 어디에 써야 하나 — 70-20-10 법칙","format":"naver-blog","channels":["naver-blog"],"scheduledFor":"2026-07-10T09:00:00.000Z","kicker":"Budget","headline":"광고 예산, 어디에 써야 하나 — 70-20-10 법칙","sub":"예산을 골고루 나누면 골고루 실패합니다. 검증된 곳에 70%, 확장에 20%, 실험에 10%로 가세요.","dayLabel":"네이버 블로그","cardImage":"cards/pslab/naver-blog-07-23-1.png","captionNote":"예산을 골고루 나누면 골고루 실패합니다. 검증된 곳에 70%, 확장에 20%, 실험에 10%로 가세요.","captionBody":"# 광고 예산, 어디에 써야 하나 — 70-20-10 법칙\n> [핵심 요약] 예산을 골고루 나누면 골고루 실패합니다. 검증된 곳에 70%, 확장에 20%, 실험에 10%로 가세요.\n\n예산 배분에서 가장 흔한 실수는 \"공평하게 나누기\"입니다. 마케팅은 공평이 아니라 집중이 이깁니다.\n\n## 70% — 검증된 곳에 몰아준다\n이미 ROAS가 나오는 채널·소재에 예산의 70%를 둡니다. 잘 되는 걸 더 키우는 게 가장 확실한 성장입니다.\n![70% — 검증된 곳에 몰아준다](https://leejiho-pslab.github.io/pslab/blog/naver-blog-07-23/fig-1.png)\n\n## 20% — 될 것 같은 곳을 확장한다\n신호는 있지만 아직 검증 전인 채널·타겟에 20%. 여기서 다음 70%가 나옵니다. 확장 없이 70%만 지키면 정체합니다.\n![20% — 될 것 같은 곳을 확장한다](https://leejiho-pslab.github.io/pslab/blog/naver-blog-07-23/fig-2.png)\n\n## 10% — 깨질 각오로 실험한다\n새 채널, 엉뚱한 소재, 낯선 타겟. 10%는 잃어도 되는 돈입니다. 이 실험이 없으면 브랜드는 한 우물에 갇힙니다.\n![10% — 깨질 각오로 실험한다](https://leejiho-pslab.github.io/pslab/blog/naver-blog-07-23/fig-3.png)\n\n## 한 달에 한 번 비율을 다시 짠다\n70-20-10은 고정이 아닙니다. 실험에서 신호가 나오면 확장으로, 확장이 검증되면 주력으로 — 매달 자리를 갈아끼우세요.\n![한 달에 한 번 비율을 다시 짠다](https://leejiho-pslab.github.io/pslab/blog/naver-blog-07-23/fig-4.png)\n\n## 자주 묻는 질문\n**Q. 예산이 적어도 이 비율을 지키나요?**\n월 100만원이라도 70/20/10은 유효합니다. 다만 10%(10만원)는 한 가지 실험에 몰아주세요.\n\n**Q. 70%를 어떻게 정하나요?**\n최근 4주 ROAS가 가장 높은 채널·소재 조합이 기준입니다.\n\n오늘 예산을 70-20-10으로 다시 나눠보세요. 공평을 버리고 집중을 택하는 순간 효율이 달라집니다.\n\n🔖 태그: #광고예산 #예산배분 #ROAS #퍼포먼스마케팅","variant":"A","slideImages":["cards/pslab/naver-blog-07-23-1.png"],"status":"manual"}],"stats":{"publishedCount":0,"pendingCount":4,"avgEngagement":0,"trend":"n/a","totalViews":0,"totalLikes":0},"series":[]},{"key":"blogger","label":"구글 블로그","icon":"🅱️","active":false,"published":[],"pending":[{"id":"blogger-07-02","topic":"대행사와 3년 일하며 후회한 것, 잘한 것","format":"blogger","channels":["blogger"],"scheduledFor":"2026-07-03T09:00:00.000Z","kicker":"Agency","headline":"대행사와 3년 일하며 후회한 것, 잘한 것","sub":"결론부터: 대행사는 \"맡기는 것\"이 아니라 \"같이 운영하는 것\"입니다. 통째로 맡기면 반드시 후회합니다.","dayLabel":"구글 블로그","cardImage":"cards/pslab/blogger-07-02-1.png","captionNote":"결론부터: 대행사는 \"맡기는 것\"이 아니라 \"같이 운영하는 것\"입니다. 통째로 맡기면 반드시 후회합니다.","captionBody":"# 대행사와 3년 일하며 후회한 것, 잘한 것\n> [핵심 요약] 결론부터: 대행사는 \"맡기는 것\"이 아니라 \"같이 운영하는 것\"입니다. 통째로 맡기면 반드시 후회합니다.\n\n제안서 비교만 하던 시절엔 늘 실패했습니다. 방식을 바꾸고 나서야 대행이 일하기 시작했죠. 직접 겪은 후회 둘, 잘한 셋을 풉니다.\n\n## 후회 1 — \"알아서 해주세요\"라고 맡긴 것\n브랜드를 가장 잘 아는 건 결국 우리입니다. 방향을 안 주면 대행사는 무난한 평균값으로 갑니다. 결과는 \"나쁘진 않은데 아무것도 아닌\" 광고였습니다.\n![후회 1 — \"알아서 해주세요\"라고 맡긴 것](https://leejiho-pslab.github.io/pslab/blog/blogger-07-02/fig-1.png)\n\n## 후회 2 — 매주 숫자를 안 본 것\n한 달에 한 번 보고만 받으니, 안 되는 소재에 3주를 버렸습니다. 대시보드를 같이 보기 시작한 뒤로 낭비가 절반으로 줄었습니다.\n![후회 2 — 매주 숫자를 안 본 것](https://leejiho-pslab.github.io/pslab/blog/blogger-07-02/fig-2.png)\n\n## 잘한 1 — 소재 아이디어를 우리가 던진 것\n현장의 고객 질문, 후기, 반품 사유 — 이게 최고의 광고 소재입니다. 대행사는 이걸 모릅니다. 우리가 소재를 던지고 대행사가 다듬자 반응이 올랐습니다.\n![잘한 1 — 소재 아이디어를 우리가 던진 것](https://leejiho-pslab.github.io/pslab/blog/blogger-07-02/fig-3.png)\n\n## 잘한 2 — 역할을 문서로 나눈 것\n\"누가 무엇을, 언제까지\"를 한 장으로 정리했습니다. 책임이 분명해지자 핑퐁이 사라졌죠.\n![잘한 2 — 역할을 문서로 나눈 것](https://leejiho-pslab.github.io/pslab/blog/blogger-07-02/fig-4.png)\n\n## 자주 묻는 질문\n**Q. 대행사를 바꿔야 할 신호는?**\n3개월 연속 같은 변명, 매출 언어 부재, 담당자 잦은 교체 — 셋 중 둘이면 교체를 검토하세요.\n\n**Q. 소액인데 같이 운영이 가능한가요?**\n오히려 소액일수록 우리가 소재를 주도해야 효율이 납니다.\n\n대행을 통째로 맡기지 마세요. 방향은 우리가, 실행은 대행사가 — 이 경계가 성과를 만듭니다.\n\n🔖 태그: #광고대행사 #마케팅 #협업 #성과관리","variant":"A","slideImages":["cards/pslab/blogger-07-02-1.png"],"status":"published","publishedUrl":"https://pslab2026.blogspot.com/2026/06/3.html","metrics":{"views":0,"likes":0,"comments":0,"shares":0,"engagementRate":0},"insightComment":"조회 0·좋아요 0. 노출 대비 반응을 키우려면 첫 3초 후킹을 강화하세요.","publishedAt":"2026-06-30T02:24:22.852Z"},{"id":"blogger-07-09","topic":"전환율을 두 배로 올린 랜딩페이지 점검표","format":"blogger","channels":["blogger"],"scheduledFor":"2026-07-03T09:00:00.000Z","kicker":"Landing","headline":"전환율을 두 배로 올린 랜딩페이지 점검표","sub":"광고를 안 바꾸고 페이지만 고쳐 전환율을 2배로 올린 적이 있습니다. 그때 쓴 점검표를 공개합니다.","dayLabel":"구글 블로그","cardImage":"cards/pslab/blogger-07-09-1.png","captionNote":"광고를 안 바꾸고 페이지만 고쳐 전환율을 2배로 올린 적이 있습니다. 그때 쓴 점검표를 공개합니다.","captionBody":"# 전환율을 두 배로 올린 랜딩페이지 점검표\n> [핵심 요약] 광고를 안 바꾸고 페이지만 고쳐 전환율을 2배로 올린 적이 있습니다. 그때 쓴 점검표를 공개합니다.\n\n소재를 아무리 바꿔도 매출이 안 늘던 브랜드가 있었습니다. 광고는 그대로 두고 페이지만 9곳 고쳤더니 전환율이 두 배가 됐죠.\n\n## 히어로 영역: 한 문장으로 끝내라\n맨 위 한 문장이 \"무엇을, 누구에게, 왜 좋은지\"를 못 담으면 아래는 안 읽힙니다. 형용사 말고 숫자와 결과로 쓰세요.\n![히어로 영역: 한 문장으로 끝내라](https://leejiho-pslab.github.io/pslab/blog/blogger-07-09/fig-1.png)\n\n## 증거를 위로 올려라\n후기·인증·수상·판매수를 페이지 하단에 묻어두지 마세요. 첫 화면 바로 아래로 올리면 신뢰가 빨라집니다.\n![증거를 위로 올려라](https://leejiho-pslab.github.io/pslab/blog/blogger-07-09/fig-2.png)\n\n## CTA는 한 가지만\n\"구매·상담·뉴스레터\" 세 개를 동시에 권하면 아무것도 안 누릅니다. 페이지마다 행동 하나로 좁히세요.\n![CTA는 한 가지만](https://leejiho-pslab.github.io/pslab/blog/blogger-07-09/fig-3.png)\n\n## 모바일에서 다시 보라\n트래픽의 80%는 모바일입니다. 데스크톱에서 멀쩡해도 모바일에서 버튼이 접히거나 글자가 작으면 거기서 매출이 샙니다.\n![모바일에서 다시 보라](https://leejiho-pslab.github.io/pslab/blog/blogger-07-09/fig-4.png)\n\n## 자주 묻는 질문\n**Q. 몇 개를 한 번에 바꿔야 하나요?**\n한 번에 하나씩 바꿔 A/B로 검증하는 게 정석이지만, 트래픽이 적으면 묶어서 크게 바꾸고 추세를 보세요.\n\n**Q. 전환율은 어디서 보나요?**\nGA4·네이버 애널리틱스의 구매전환 이벤트로 단계별 이탈을 봅니다.\n\n광고를 더 만지기 전에 이 점검표로 페이지부터 고치세요. 가장 싸게 매출을 올리는 방법입니다.\n\n🔖 태그: #랜딩페이지 #전환율 #CRO #상세페이지","variant":"B","slideImages":["cards/pslab/blogger-07-09-1.png"],"status":"published","publishedUrl":"https://pslab2026.blogspot.com/2026/07/blog-post.html","metrics":{"views":0,"likes":0,"comments":0,"shares":0,"engagementRate":0},"insightComment":"조회 0·좋아요 0. 노출 대비 반응을 키우려면 첫 3초 후킹을 강화하세요.","publishedAt":"2026-07-03T11:37:58.921Z"},{"id":"blogger-07-16","topic":"작은 브랜드가 대기업과 '다르게' 싸우는 4가지 방법","format":"blogger","channels":["blogger"],"scheduledFor":"2026-07-06T09:00:00.000Z","kicker":"Strategy","headline":"작은 브랜드가 대기업과 '다르게' 싸우는 4가지 방법","sub":"대기업과 같은 방식으로 싸우면 집니다. 작을 때만 쓸 수 있는 무기 네 가지로 판을 바꾸세요.","dayLabel":"구글 블로그","cardImage":"cards/pslab/blogger-07-16-1.png","captionNote":"대기업과 같은 방식으로 싸우면 집니다. 작을 때만 쓸 수 있는 무기 네 가지로 판을 바꾸세요.","captionBody":"# 작은 브랜드가 대기업과 '다르게' 싸우는 4가지 방법\n> [핵심 요약] 대기업과 같은 방식으로 싸우면 집니다. 작을 때만 쓸 수 있는 무기 네 가지로 판을 바꾸세요.\n\n예산도 인력도 밀리는데 같은 운동장에서 싸우면 당연히 집니다. 작을 때만 가능한 방식이 따로 있습니다.\n\n## 1. 속도로 싸운다\n대기업은 의사결정이 느립니다. 우리는 오늘 본 트렌드를 내일 콘텐츠로 만들 수 있죠. 시의성은 작은 브랜드의 가장 큰 무기입니다.\n![1. 속도로 싸운다](https://leejiho-pslab.github.io/pslab/blog/blogger-07-16/fig-1.png)\n\n## 2. 좁은 시장 1등을 노린다\n전체 시장 10등보다, 좁은 카테고리 1등이 훨씬 강합니다. \"○○ 하면 이 브랜드\"가 되는 한 칸을 먼저 차지하세요.\n![2. 좁은 시장 1등을 노린다](https://leejiho-pslab.github.io/pslab/blog/blogger-07-16/fig-2.png)\n\n## 3. 얼굴을 보여준다\n대기업은 브랜드 뒤에 숨지만, 작은 브랜드는 사람이 앞에 설 수 있습니다. 창업자·직원의 얼굴과 과정이 곧 차별화입니다.\n![3. 얼굴을 보여준다](https://leejiho-pslab.github.io/pslab/blog/blogger-07-16/fig-3.png)\n\n## 4. 팬을 만든다\n100만 명에게 한 번 보이는 것보다, 1,000명이 매번 사주고 소문내는 게 강합니다. 작은 브랜드는 도달이 아니라 관계로 큽니다.\n![4. 팬을 만든다](https://leejiho-pslab.github.io/pslab/blog/blogger-07-16/fig-4.png)\n\n## 자주 묻는 질문\n**Q. 좁히면 시장이 너무 작지 않나요?**\n처음엔 좁게 1등 → 인접 카테고리로 확장이 정석입니다. 넓게 시작해 망하는 경우가 더 많습니다.\n\n**Q. 얼굴 노출이 부담스러워요.**\n꼭 대표가 아니어도 됩니다. 과정·손·작업 현장만 보여도 사람 냄새가 납니다.\n\n대기업의 방식을 따라 하지 마세요. 속도·집중·사람·관계 — 작을 때만 쓸 수 있는 무기로 싸우세요.\n\n🔖 태그: #스몰브랜드 #마케팅전략 #포지셔닝 #차별화","variant":"C","slideImages":["cards/pslab/blogger-07-16-1.png"],"status":"published","publishedUrl":"https://pslab2026.blogspot.com/2026/07/4.html","metrics":{"views":0,"likes":0,"comments":0,"shares":0,"engagementRate":0},"insightComment":"조회 0·좋아요 0. 노출 대비 반응을 키우려면 첫 3초 후킹을 강화하세요.","publishedAt":"2026-07-06T12:54:54.333Z"},{"id":"blogger-07-23","topic":"월 100만원으로 시작하는 광고, 이렇게 나눴습니다","format":"blogger","channels":["blogger"],"scheduledFor":"2026-07-09T09:00:00.000Z","kicker":"Budget","headline":"월 100만원으로 시작하는 광고, 이렇게 나눴습니다","sub":"예산이 적을수록 분산은 독입니다. 월 100만원을 실제로 어떻게 쪼갰는지, 숫자 그대로 공개합니다.","dayLabel":"구글 블로그","cardImage":"cards/pslab/blogger-07-23-1.png","captionNote":"예산이 적을수록 분산은 독입니다. 월 100만원을 실제로 어떻게 쪼갰는지, 숫자 그대로 공개합니다.","captionBody":"# 월 100만원으로 시작하는 광고, 이렇게 나눴습니다\n> [핵심 요약] 예산이 적을수록 분산은 독입니다. 월 100만원을 실제로 어떻게 쪼갰는지, 숫자 그대로 공개합니다.\n\n\"예산이 적은데 어디에 써야 하나요?\"—가장 많이 받는 질문입니다. 월 100만원 기준, 제가 실제로 굴리는 방식입니다.\n\n## 먼저 70만원: 한 채널만 판다\n소액일수록 채널을 늘리면 안 됩니다. 우리 고객이 가장 많은 한 곳에 70만원을 몰아 데이터를 빨리 모으세요.\n![먼저 70만원: 한 채널만 판다](https://leejiho-pslab.github.io/pslab/blog/blogger-07-23/fig-1.png)\n\n## 20만원: 소재 실험에만 쓴다\n같은 채널 안에서 소재 3~4종을 20만원으로 돌립니다. 승자 소재를 찾으면 70만원이 더 잘 돕니다.\n![20만원: 소재 실험에만 쓴다](https://leejiho-pslab.github.io/pslab/blog/blogger-07-23/fig-2.png)\n\n## 10만원: 콘텐츠/후기 자산에 쓴다\n광고만으론 한계가 있습니다. 10만원은 후기 확보, 콘텐츠 제작 같은 \"쌓이는 자산\"에 투자하세요. 광고가 꺼져도 남습니다.\n![10만원: 콘텐츠/후기 자산에 쓴다](https://leejiho-pslab.github.io/pslab/blog/blogger-07-23/fig-3.png)\n\n## 석 달 뒤 숫자로 다시 정한다\n100만원을 3개월 돌리면 어디가 효율적인지 보입니다. 그때 비율을 키우거나 채널을 바꾸세요. 처음 배분은 가설일 뿐입니다.\n![석 달 뒤 숫자로 다시 정한다](https://leejiho-pslab.github.io/pslab/blog/blogger-07-23/fig-4.png)\n\n## 자주 묻는 질문\n**Q. 100만원도 안 되면요?**\n50만원이면 채널 하나 + 소재 실험만 하세요. 자산 투자는 매출이 나면 시작해도 늦지 않습니다.\n\n**Q. 어느 채널부터 시작할까요?**\n고객이 검색으로 오면 검색광고, 발견으로 오면 인스타·메타부터 테스트하세요.\n\n적은 예산일수록 \"나누지 말고 몰아주세요.\" 한 채널에서 이기는 공식을 먼저 찾는 게 순서입니다.\n\n🔖 태그: #소액광고 #광고예산 #스타트업마케팅 #예산배분","variant":"A","slideImages":["cards/pslab/blogger-07-23-1.png"],"status":"published","publishedUrl":"https://pslab2026.blogspot.com/2026/07/100.html","metrics":{"views":0,"likes":0,"comments":0,"shares":0,"engagementRate":0},"insightComment":"조회 0·좋아요 0. 노출 대비 반응을 키우려면 첫 3초 후킹을 강화하세요.","publishedAt":"2026-07-09T12:21:59.335Z"}],"stats":{"publishedCount":0,"pendingCount":4,"avgEngagement":0,"trend":"n/a","totalViews":0,"totalLikes":0},"series":[]},{"key":"youtube","label":"유튜브","icon":"▶️","active":false,"published":[],"pending":[{"id":"youtube-07-05","topic":"광고대행","format":"쇼츠 대본","channels":["youtube"],"scheduledFor":"2026-07-03T09:00:00.000Z","kicker":"Shorts","headline":"광고비 *날리는* 사장님 특징","sub":"30초 쇼츠.","dayLabel":"유튜브 · 쇼츠","cardImage":"cards/pslab/youtube-07-05-1.png","captionNote":"30초 쇼츠.","captionBody":"[HOOK · 0~3초]\n광고비 날리는 사장님들, 공통점이 있어요.\n\n[본론 · 3~25초]\n켜기 전 준비를 안 합니다.\n- 타겟이 \"누구나\" — 그럼 아무에게도 안 닿아요.\n- 소재가 평범 — 첫 3초에 멈출 이유가 없죠.\n- 랜딩이 부실 — 클릭해도 안 삽니다.\n이 셋 안 맞으면, 예산 올릴수록 적자예요.\n\n[CTA · 25~30초]\n켜기 전 이 3개부터. 저장해두세요.","variant":"A","slideImages":["cards/pslab/youtube-07-05-1.png"],"status":"published","publishedUrl":"https://youtu.be/ulDu8KIb_0Y","metrics":{"views":26841,"likes":1100,"comments":66,"shares":44,"engagementRate":0.0450802876196863},"insightComment":"참여율 4.5%로 평균(6.7%)을 밑돌았어요. 첫 슬라이드 후킹과 결론 한 줄을 더 세게, 저장 유도 문구를 명확히 해보세요.","publishedAt":"2026-07-03T11:37:56.889Z","videoFile":"shorts/youtube-07-05/youtube-07-05.mp4","ytTitle":"광고비 날리는 사장님 3가지 특징｜광고 켜기 전 필수 점검 #shorts opic":"브랜딩","format":"링크드인 포스트","channels":["linkedin"],"scheduledFor":"2026-07-08T09:00:00.000Z","kicker":"Branding","headline":"팔리는 브랜드는\u003cbr>*‘왜’*를 판다","sub":"기능이 아니라 이유로 기억된다.","dayLabel":"링크드인 · 비즈니스","cardImage":"cards/pslab/linkedin-07-15-1.png","captionNote":"기능이 아니라 이유로 기억된다.","captionBody":"경쟁사와 똑같은 기능을 말하고 있다면, 고객 입장에선 고를 이유가 없습니다.\n\n사람은 '무엇'이 아니라 '왜'로 브랜드를 기억합니다.\n\n스펙은 경쟁사도 똑같이 말합니다. 차별은 거기서 안 생깁니다.\n\"이 사람들은 왜 이걸 만들까\"에 답이 있을 때, 비로소 선택받습니다.\n\n특히 작은 브랜드일수록 그렇습니다. 자원이 적을수록 메시지가 유일한 무기니까요.\n\n오늘 한 가지만 해보세요.\n우리 브랜드의 '왜'를 한 문장으로 써보는 것.\n안 써진다면 — 그게 지금 가장 시급한 과제입니다.\n\n#브랜딩 #마케팅 #스타트업","variant":"C","slideImages":["cards/pslab/linkedin-07-15-1.png"],"status":"planned"},{"id":"linkedin-07-22","topic":"사업이야기","format":"링크드인 포스트","channels":["linkedin"],"scheduledFor":"2026-07-11T09:00:00.000Z","kicker":"Growth","headline":"매출이 정체됐을 때\u003cbr>먼저 보는 *지표*","sub":"광고가 아니라 병목부터.","dayLabel":"링크드인 · 비즈니스","cardImage":"cards/pslab/linkedin-07-22-1.png","captionNote":"광고가 아니라 병목부터.","captionBody":"매출이 정체되면 대부분 \"광고를 더 돌려야 하나\"부터 생각합니다.\n저는 광고를 마지막에 봅니다. 먼저 '어디가 막혔는지'를 봅니다.\n\n매출 = 신규획득 × 전환 × 재구매. 셋 중 어디가 막혔는지에 따라 처방이 완전히 다릅니다.\n\n· 신규는 오는데 안 산다 → 전환 문제 (상세·가격·신뢰)\n· 사는데 더 안 는다 → 획득 문제 (채널·타겟)\n· 한 번 사고 안 온다 → 재구매 문제 (경험·CRM)\n\n광고비를 붓는 건 '획득'에만 듣습니다.\n전환이 막혔는데 광고를 늘리면, 비싼 클릭으로 빈 그릇을 채우는 셈입니다.\n\n정체는 '광고 부족'이 아니라 '진단 부족'인 경우가 훨씬 많습니다.\n\n#그로스 #마케팅 #사업","variant":"A","slideImages":["cards/pslab/linkedin-07-22-1.png"],"status":"planned"}],"stats":{"publishedCount":0,"pendingCount":4,"avgEngagement":0,"trend":"n/a","totalViews":0,"totalLikes":0},"series":[]}],"channelLinks":[{"key":"instagram","label":"인스타그램","icon":"📸","url":"https://www.instagram.com/_pslab","sub":"@_pslab"},{"key":"threads","label":"스레드","icon":"🧵","url":"https://www.threads.net/@_pslab","sub":"@_pslab"},{"key":"naver-blog","label":"네이버 블로그","icon":"📝","url":"https://admin.blog.naver.com/","sub":"관리 열기"},{"key":"blogger","label":"구글 블로그","icon":"🅱️","url":"https://pslab2026.blogspot.com","sub":" let period = { key:'all', from:null, to:null };
function periodRange(){
  if(period.key==='all') return null;
  const now=new Date(); let from,to;
  if(period.key==='7d'){ to=now; from=new Date(now.getTime()-6*864e5); }
  else if(period.key==='14d'){ to=now; from=new Date(now.getTime()-13*864e5); }
  else if(period.key==='30d'){ to=now; from=new Date(now.getTime()-29*864e5); }
  else if(period.key==='month'){ from=new Date(now.getFullYear(),now.getMonth(),1); to=now; }
  else if(period.key==='prev'){ from=new Date(now.getFullYear(),now.getMonth()-1,1); to=new Date(now.getFullYear(),now.getMonth(),0); }
  else if(period.key==='custom'){
    if(!period.from&&!period.to) return null;
    from=period.from?new Date(period.from):new Date(0);
    to=period.to?new Date(period.to):now;
  } else return null;
  const f=new Date(from); f.setHours(0,0,0,0);
  const t=new Date(to); t.setHours(23,59,59,999);
  return [f.getTime(), t.getTime()];
}
function inPeriod(s){ const r=periodRange(); if(!r) return true; if(!s) return false; const t=new Date(s).getTime(); return t>=r[0]&&t<=r[1]; }
function periodLabel(){
  const names={all:'전체 기간','7d':'최근 7일','14d':'최근 14일','30d':'최근 30일',month:'이번 달',prev:'지난 달',custom:'직접 선택'};
  const r=periodRange();
  const d=x=>new Date(x).toISOString().slice(0,10);
  return names[period.key]+(r?' ('+d(r[0])+' ~ '+d(r[1])+')':'');
}

const tIcon = t => ({up:'📈',down:'📉','n/a':'·'}[t]||'·');
function issue(title, body){
  return 'https://github.com/'+REPO+'/issues/new?labels=feedback&title='+encodeURIComponent(title)+'&body='+encodeURIComponent(body);
}
function sparkline(arr){
  if(!arr||arr.length<2) return '';
  const w=160,h=34,mx=Math.max(...arr,1),mn=Math.min(...arr,0);
  const dx=w/(arr.length-1);
  const pts=arr.map((v,i)=>[i*dx,h-((v-mn)/(mx-mn||1))*(h-6)-3]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  return '<svg class="spark" width="'+w+'" height="'+h+'"><path d="'+d+'" fill="none" stroke="#2b6fff" stroke-width="2"/></svg>';
}
function publishedCard(p, badge){
  const img=p.imageUrl?'<img class="thumb" src="'+esc(p.imageUrl)+'" loading="lazy" alt=""/>':'<div class="thumb noimg">이미지 없음</div>';
  const link=p.url?'<a href="'+esc(p.url)+'" target="_blank">열기 ↗</a>':'';
  return '<div class="card">'+img+'<div class="cbody"><div class="ctop"><strong>'+esc(p.topic)+'</strong>'+badge+'</div>'+
    '<div class="muted">'+ftime(p.time)+'</div>'+
    '<div class="cap">'+esc(p.caption||'')+'</div>'+
    '<div class="met"><span>👁 '+p.views+'</span><span>❤ '+p.likes+'</span><span>💬 '+p.comments+'</span><span>'+pct(p.engagementRate)+'</span></div>'+
    '<div>'+link+'</div></div></div>';
}
function plainHead(it){ return it.headline?it.headline.replace(/<br>/g,' ').replace(/\*/g,''):it.topic; }
function vBadge(v){ return v?'<span class="badge b-var v-'+esc(v)+'">디자인 '+esc(v)+'</span>':''; }
function slideCount(it){ return (it.slideImages&&it.slideImages.length)||1; }
function planCard(client, chLabel, it){
  const img=it.cardImage?'<img class="thumb" src="'+esc(imgv(it.cardImage))+'" loading="lazy" alt=""/>':'<div class="thumb noimg">카드 준비중</div>';

// 네이버 붙여넣기용 평문(마크다운 기호 제거, 이미지 위치는 마커로)
function plainPostText(it){
  let n=0;
  return String(it.captionBody||'').split('\n').map(line=>{
    const t=line.trim();
    const img=t.match(/^!\[([^\]]*)\]\(([^)]+)\)$/);
    if(img){ n++; return '\n[📷 이미지'+n+' 삽입]\n'; }
    if(t.startsWith('## ')) return '\n■ '+t.slice(3);
    if(t.startsWith('# ')) return t.slice(2);
    if(t==='>'||t.startsWith('> ')) return t.replace(/^>\s?/,'');
    return line.replace(/\*\*([^*]+)\*\*/g,'$1');
  }).join('\n').replace(/\n{3,}/g,'\n\n').trim();
}
function flash(id,msg){ const b=document.getElementById(id); if(b){const o=b.textContent;b.textContent=msg;setTimeout(()=>b.textContent=o,1500);} }
function copyPost(id){
  const it=(DATA.clients[ci].planCards||[]).find(x=>x.id===id); if(!it) return;
  navigator.clipboard.writeText(plainPostText(it)).then(()=>flash('copybtn-'+id,'✅ 복사됨!')).catch(()=>alert('복사 실패 — 본문을 길게 눌러 직접 복사하세요.'));
}
function copyTitle(id){
  const it=(DATA.clients[ci].planCards||[]).find(x=>x.id===id); if(!it) return;
  navigator.clipboard.writeText(plainHead(it)).then(()=>flash('titlebtn-'+id,'✅ 복사됨!')).catch(()=>{});
}
function copyField(id,field,btnId){
  const it=(DATA.clients[ci].planCards||[]).find(x=>x.id===id); if(!it||!it[field]) return;
  navigator.clipboard.writeText(it[field]).then(()=>flash(btnId,'✅ 복사됨!')).catch(()=>alert('복사 실패 — 직접 복사하세요.'));
}
function copyTags(id,btnId){
  const it=(DATA.clients[ci].planCards||[]).find(x=>x.id===id); if(!it||!it.ytTags) return;
  navigator.clipboard.writeText(it.ytTags.join(', ')).then(()=>flash(btnId,'✅ 복사됨!')).catch(()=>{});
}
// 블로그/대본 등 본문의 가벼운 마크다운(## 소제목, [HOOK] 등)을 보기 좋게
function mdInline(x){ return esc(x).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>'); }
function fmtCaption(s){
  return String(s||'').split('\n').map(line=>{
    const t=line.trim();
    const img=t.match(/^!\[([^\]]*)\]\(([^)]+)\)$/);
    if(img) return '<img class="md-img" src="'+esc(img[2])+'" alt="'+esc(img[1])+'" loading="lazy"/>';
    if(t.startsWith('## ')) return '<h4 class="md-h">'+mdInline(t.slice(3))+'</h4>';
    if(t.startsWith('# ')) return '<h3 class="md-h1">'+mdInline(t.slice(2))+'</h3>';
    if(t==='>'||t.startsWith('> ')) return '<div class="md-quote">'+mdInline(t.replace(/^>\s?/,''))+'</div>';
    if(t.indexOf('🔖')===0) return '<div class="md-tags">'+esc(t)+'</div>';
    if(/^\[.+\]$/.test(t)) return '<div class="md-tag">'+esc(t)+'</div>';
    if(t==='---'||t==='') return '<div class="md-sp"></div>';
    return '<div>'+mdInline(line)+'</div>';
  }).join('');
}

  h+='<div class="panel"><div class="sect-h" style="margin:0 0 8px"><h3>📋 기획안</h3><a class="btn fb" href="'+issue(planTitle,planBody)+'" target="_blank">✏️ 기획안 피드백</a></div>'+
     '<div>'+client.keywords.map(k=>'<span class="tag">#'+esc(k)+'</span>').join('')+'</div>'+

     '<div class="muted">디자인 스타일: '+esc(client.designStyle.mood)+' / '+esc(client.designStyle.palette)+' / '+esc(client.designStyle.composition)+'</div></div>';

  const avgF=mAll.length?mAll.reduce((a,x)=>a+x.e,0)/mAll.length:0;
  h+='<div class="kpis">'+
