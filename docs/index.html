png"],"status":"published","publishedUrl":"https://www.threads.com/@_pslab/post/Dbk0LEbIKlF","metrics":{"views":21,"likes":1,"comments":1,"shares":0,"engagementRate":0.09523809523809523},"insightComment":"참여율 9.5%로 평균(40.4%)을 밑돌았어요. 첫 슬라이드 후킹과 결론 한 줄을 더 세게, 저장 유도 문구를 명확히 해보세요.","publishedAt":"2026-08-03T10:51:01.021Z"},{"id":"naver-08-04","topic":"ALWAYS ON · 문제 공감(이탈 원인)","format":"naver-blog","channels":["naver-blog"],"scheduledFor":"2026-08-04T02:00:00.000Z","kicker":"Why","headline":"소상공인 SNS 운영, 3개월을 못 넘기는 5가지 이유","sub":"16년간 수백 개 브랜드를 지켜보며 정리한 이탈 패턴과, 각각을 어떻게 풀 수 있는지 정리했습니다.","dayLabel":"화요일 · 네이버 블로그","cardImage":"cards/pslab/naver-08-04-1.png","captionNote":"이탈 원인 5가지 → 각 해법 → 공통 전제 전환으로 솔루션 연결","captionBody":"# 소상공인 SNS 운영, 3개월을 못 넘기는 5가지 이유\n\n> [핵심 요약] 대부분 의지 부족으로 자책하지만, 실제 원인은 구조에 있습니다. 16년간 관찰한 다섯 가지 이탈 패턴과 해법을 정리했습니다.\n\nSNS 마케팅을 시작한 소상공인 열 분 중 일곱 분이 3개월 안에 멈춥니다. 광고대행사를 16년 운영하면서 이 장면을 수없이 봤습니다. 원인은 대체로 다섯 가지입니다.\n\n![영업이 끝난 늦은 밤 가게에 혼자 앉아 휴대폰을 보는 지친 사장님](blog/naver-08-04/photo-1.jpg)\n\n## 1. 소재가 떨어진다\n\n처음 2주는 할 말이 많습니다. 문제는 3주차부터입니다. \"오늘 뭐 올리지\"가 매일 반복되면 그 자체가 스트레스가 됩니다.\n\n**해법**: 소재를 그때그때 떠올리지 말고, 검색 트렌드와 고객 질문에서 자동으로 뽑아내는 구조를 만드세요.\n\n## 2. 시간이 생각보다 훨씬 든다\n\n게시물 하나에 소재 20분, 카피 30분, 이미지 40분, 발행 15분 — 약 1시간 45분입니다. 주 3회면 월 20시간이 넘습니다.\n\n**해법**: 사장님 시간을 시급으로 환산해보세요. 그 금액이 자동화 비용보다 크다면 답은 정해져 있습니다.\n\n![게시물 하나에 드는 시간 — 소재 20분·카피 30분·이미지 40분·발행 15분](blog/naver-08-04/fig-1.png)\n\n## 3. 반응이 없어서 지친다\n\n한 달 올렸는데 좋아요가 5개면 그만두고 싶어집니다. 하지만 SNS는 원래 3~6개월 누적 후에 반응이 붙습니다.\n\n**해법**: 좋아요가 아니라 **누적 콘텐츠 수**를 지표로 삼으세요. 검색에 걸리기 시작하면 흐름이 바뀝니다.\n\n![따뜻한 조명 아래 모래가 흘러내리는 모래시계](blog/naver-08-04/photo-2.jpg)\n\n## 4. 채널마다 다시 만들어야 한다\n\n인스타에 올린 걸 유튜브·블로그에 맞춰 또 만들어야 합니다. 채널이 늘수록 부담이 제곱으로 늘어납니다.\n\n**해법**: 하나의 소재를 채널 특성에 맞게 변환하는 구조를 쓰세요. 예를 들어 릴스 영상은 유튜브 쇼츠로 그대로 재활용할 수 있습니다.\n\n## 5. 담당자가 바뀌면 리셋된다\n\n직원이 하던 일이면 퇴사와 함께 톤도 노하우도 사라집니다. 새 담당자는 처음부터 다시 시작합니다.\n\n**해법**: 노하우가 사람이 아니라 **시스템에 쌓이는 구조**를 선택하세요.\n\n![3개월을 못 넘기는 5가지 이유 체크리스트](blog/naver-08-04/fig-2.png)\n\n## 다섯 가지를 관통하는 한 문장\n\n모두 \"사람이 계속 해야 한다\"는 전제에서 나옵니다. 그 전제를 바꾸면 다섯 가지가 함께 풀립니다.\n\n![사람이 계속 해야 한다 vs 시스템이 계속 한다 비교표](blog/naver-08-04/fig-3.png)\n\nP.S.LAB(문제해결연구소)이 운영하는 ALWAYS ON(얼웨이즈온)은 조사·제작·발행·성과 학습을 매일 자동으로 돌립니다. 사람은 방향을 정하고 검수만 합니다.\n\n![밝은 아침 정돈된 사무실에서 여유 있게 서 있는 사장님](blog/naver-08-04/photo-3.jpg)\n\n저희 채널도 이 시스템으로 운영합니다. 이 글 역시 그 결과물입니다.\n\n![의지의 문제가 아니라 구조의 문제입니다](blog/naver-08-04/fig-4.png)\n\n▶ 홈페이지: https://pslab.ai.kr\n▶ 문의: CEO@PSLAB.AI.KR / 010-9929-5736\n\n#소상공인마케팅 #SNS운영 #SNS자동화 #pslab #문제해결연구소 #ALWAYSON #얼웨이즈온","variant":"A","slideImages":["cards/pslab/naver-08-04-1.png"],"status":"manual"},{"id":"car-08-05","topic":"ALWAYS ON · 도입 절차","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-08-05T09:00:00.000Z","kicker":"ALWAYS ON","headline":"도입하면\u003cbr>*2주 안에* 이렇게 됩니다","sub":"상담부터 첫 자동 발행까지, 실제 순서.","dayLabel":"수요일 · 캐러셀","cardImage":"cards/pslab/car-08-05-1.png","captionNote":"불확실성 해소(절차 공개) → 부담 최소화 강조 → 댓글 CTA","captionBody":"\"자동화하면 뭐부터 하나요?\" 가장 많이 받는 질문이라 순서를 그대로 공개합니다.\n\n1~2일차 상담·브랜드 정의 → 3~4일차 시장 분석 → 5~7일차 채널 방향성 기획 → 8~10일차 SNS 채널 연결 → 11~14일차 제작·발행 시작.\n\n2주를 쓰는 이유가 있습니다. 채널을 붙이기 전에 시장과 방향을 먼저 읽어야 해요. 그 단계를 건너뛰면 발행은 빨라지지만 반응이 안 옵니다.\n\n사장님이 직접 하실 일은 브랜드 정의와 기획안 검수 두 번입니다. 나머지는 저희와 시스템이 합니다.\n\n이 순서는 16년 동안 250곳이 넘는 브랜드에 적용하면서 다듬은 것입니다. 업종이 달라도 순서는 같았어요.\n\n그 이후로는 매일 자동으로 돌아가면서, 반응이 좋았던 주제와 디자인을 학습해 다음 콘텐츠에 반영합니다.\n\n💬 댓글에 \"도입\"이라고 남겨주시면 소개서를 보내드립니다.\n\n#SNS자동화 #마케팅자동화 #소상공인마케팅 #pslab #문제해결연구소 #ALWAYSON #얼웨이즈온","variant":"A","slideImages":["cards/pslab/car-08-05-1.png","cards/pslab/car-08-05-2.png","cards/pslab/car-08-05-3.png","cards/pslab/car-08-05-4.png","cards/pslab/car-08-05-5.png","cards/pslab/car-08-05-6.png","cards/pslab/car-08-05-7.png","cards/pslab/car-08-05-8.png","cards/pslab/car-08-05-9.png","cards/pslab/car-08-05-10.png"],"status":"published","publishedUrl":"https://www.instagram.com/p/Dbp9Hbokb7L/","metrics":{"views":2,"likes":1,"comments":0,"shares":0,"engagementRate":0.5},"insightComment":"참여율 50.0%로 평균(40.4%)을 웃돌았어요. 디자인 A안·결론 우선 구조가 먹힌 것으로 보입니다 — 다음에도 같은 톤을 유지하세요.","publishedAt":"2026-08-05T10:45:27.006Z"},{"id":"threads-08-05","topic":"ALWAYS ON · 도입 절차","format":"스레드(타래)","channels":["threads"],"scheduledFor":"2026-08-05T10:00:00.000Z","kicker":"Threads","headline":"사장님이 하실 일은\u003cbr>*딱 하나*","sub":"7일 세팅 중 검수 한 번.","dayLabel":"수요일 · 스레드","cardImage":"cards/pslab/threads-08-05-1.png","captionNote":"부담 최소화 각도 — 캐러셀과 같은 주제를 '검수 20분'으로 압축","captionBody":"SNS 자동화를 도입할 때 사장님이 실제로 하시는 일은 딱 하나입니다. 🧵\n\n브랜드 분석, 채널 연결, 운영 전략 수립, 콘텐츠 제작, 발행 — 다 저희와 시스템이 합니다.\n\n사장님은 5일차에 올라온 2주치 기획안을 보고 \"이건 좋고, 이건 빼주세요\"만 하시면 돼요. 보통 20분 걸립니다.\n\n자동화의 핵심은 사람을 없애는 게 아니라, 사람이 **판단만** 하게 만드는 겁니다. 만드는 일은 기계가 훨씬 잘하고, 무엇이 우리 브랜드다운지는 사람이 훨씬 잘하니까요.\n\n지금 SNS에 매주 몇 시간 쓰고 계세요?\n\n#pslab #문제해결연구소 #ALWAYSON #얼웨이즈온","variant":"C","slideImages":["cards/pslab/threads-08-05-1.png"],"status":"published","publishedUrl":"https://www.threads.com/@_pslab/post/Dbp9JgDoMv8","metrics":{"views":18,"likes":1,"comments":0,"shares":0,"engagementRate":0.05555555555555555},"insightComment":"참여율 5.6%로 평균(40.4%)을 밑돌았어요. 첫 슬라이드 후킹과 결론 한 줄을 더 세게, 저장 유도 문구를 명확히 해보세요.","publishedAt":"2026-08-05T10:45:42.441Z"},{"id":"blogger-08-06","topic":"ALWAYS ON · 콘텐츠 자산","format":"blogger","channels":["blogger"],"scheduledFor":"2026-08-06T02:00:00.000Z","kicker":"Asset","headline":"광고비는 사라지고 콘텐츠는 남는다 — AI 검색 시대의 계산법","sub":"1년에 콘텐츠 700개가 쌓이면 무엇이 달라지는지, 검색과 생성형 AI 관점에서 정리했습니다.","dayLabel":"목요일 · 구글 블로그","cardImage":"cards/pslab/blogger-08-06-1.png","captionNote":"광고 vs 콘텐츠 대비 → GEO 개념 → 인용 조건 표 → 꾸준함=자동화 연결","captionBody":"# 광고비는 사라지고 콘텐츠는 남는다 — AI 검색 시대의 계산법\n\n> [핵심 요약] 광고는 집행을 멈추면 노출이 0이 됩니다. 콘텐츠는 검색과 AI 답변에 계속 남습니다. 1년에 700개가 쌓였을 때 무엇이 달라지는지 계산해봤습니다.\n\n광고비를 쓰는 것과 콘텐츠를 쌓는 것은 회계상 둘 다 비용이지만, 성격이 완전히 다릅니다. 16년간 양쪽을 모두 집행해 본 입장에서 그 차이를 정리하겠습니다.\n\n## 광고비: 켜면 나오고 끄면 사라진다\n\n월 300만원을 광고에 쓰면 그 달은 노출이 나옵니다. 다음 달에 예산을 끊으면 노출은 그날로 0입니다. 1년을 집행해도 **남는 자산이 없습니다**.\n\n광고가 나쁘다는 뜻이 아닙니다. 즉시 매출이 필요할 때는 광고가 가장 빠릅니다. 다만 그것만으로는 자산이 쌓이지 않습니다.\n\n## 콘텐츠: 한 번 만들면 계속 일한다\n\n1년 전에 쓴 블로그 글이 지금도 검색으로 사람을 데려옵니다. 2년 전 릴스가 아직도 조회수가 올라갑니다. 한 번 만든 콘텐츠는 지워지지 않는 한 계속 노출됩니다.\n\n5채널을 매일 운영하면 1년에 약 700개가 쌓입니다. 이 700개는 세 가지 방식으로 계속 일합니다.\n\n1. **검색 노출** — 네이버·구글에서 관련 검색어에 걸립니다\n2. **채널 신뢰** — 방문자가 \"이 브랜드는 살아있구나\"를 확인합니다\n3. **AI 인용** — 생성형 AI가 브랜드를 설명할 때 근거로 씁니다\n\n## 세 번째가 지금 가장 중요합니다\n\n소비자 행동이 바뀌고 있습니다. 예전에는 검색창에 먼저 쳤지만, 지금은 AI에게 먼저 묻습니다. \"○○ 업종에서 괜찮은 업체 추천해줘\"라고요.\n\n이때 AI가 참고하는 건 **웹에 축적된 텍스트**입니다. 광고는 학습 대상이 아닙니다. 블로그 글, SNS 게시물, 소개 페이지 — 쌓아둔 콘텐츠가 근거가 됩니다.\n\n이걸 GEO(Generative Engine Optimization, 생성형 검색 최적화)라고 부릅니다. SEO가 검색엔진을 위한 최적화였다면, GEO는 AI가 인용하기 좋게 만드는 일입니다.\n\n## AI가 인용하기 좋은 콘텐츠의 조건\n\n| 조건 | 이유 |\n|---|---|\n| 명확한 소제목 구조 | AI가 문서의 논리를 파악하기 쉬움 |\n| 숫자·비교표 | 인용 가치가 높은 구체 정보 |\n| 일관된 브랜드 표기 | 여러 문서가 같은 주체로 연결됨 |\n| 꾸준한 발행 | 최신성이 확보되어 우선 참조됨 |\n\n마지막 조건이 핵심입니다. 아무리 잘 써도 3개월 만에 멈추면 최신성을 잃습니다. **꾸준함 자체가 최적화**인 셈입니다.\n\n## 그래서 자동화가 필요합니다\n\n위 조건을 사람이 매일 지키는 건 불가능에 가깝습니다. P.S.LAB(문제해결연구소)이 운영하는 ALWAYS ON(얼웨이즈온)은 이 일을 시스템으로 대신합니다.\n\n매일 5채널에 브랜드 톤으로 콘텐츠가 발행되고, 반응을 학습해 다음 콘텐츠가 더 좋아집니다. 1년이면 700개의 자산이 남습니다.\n\n지금 이 글도 그 시스템이 발행한 글입니다. 16년차 광고대행사가 자기 채널로 먼저 검증한 방식입니다.\n\n▶ 자세히 보기: https://pslab.ai.kr/always-on\n▶ 문의: CEO@PSLAB.AI.KR\n\n#콘텐츠자산 #GEO #AI검색 #SNS자동화 #pslab #문제해결연구소 #ALWAYSON #얼웨이즈온","variant":"A","slideImages":["cards/pslab/blogger-08-06-1.png"],"status":"planned"},{"id":"reels-08-07","topic":"ALWAYS ON · 신뢰 근거","format":"릴스","channels":["instagram"],"scheduledFor":"2026-08-07T09:00:00.000Z","kicker":"ALWAYS ON","headline":"16년 동안\u003cbr>*250개 넘는* 브랜드","sub":"최근 5년만 세어도 49개입니다.","dayLabel":"금요일 · 릴스","cardImage":"cards/pslab/reels-08-07-1.png","captionNote":"의심 정면 대응 → 16년 250개+ 실적(최근 5년 49개) → 업종 다양성 → 이 영상 자체가 증거 → 포트폴리오 CTA","captionBody":"SNS 자동화 솔루션이라고 하면, 대부분 이렇게 생각하십니다. \"AI가 대충 만들어주는 거 아니야?\"\n\nP.S.LAB(문제해결연구소)은 16년차 광고대행사입니다. 그동안 맡은 브랜드가 250곳이 넘습니다. 최근 5년만 따로 세어도 49개 브랜드의 브랜딩과 퍼포먼스 마케팅을 진행했어요.\n\n업종도 가리지 않았습니다. 패션·럭셔리, 뷰티·헬스, 식음료, B2B·금융, 리테일·리빙·키즈·펫까지 — 최근 5년 49개만 나눠봐도 8개 카테고리가 나옵니다.\n\nALWAYS ON(얼웨이즈온)은 그 16년치 판단 기준을 시스템으로 옮긴 것입니다. 새로 만든 AI 장난감이 아니라, 사람이 하던 일을 그대로 자동화한 거예요.\n\n그리고 지금 보고 계신 이 영상도, 이 캡션도 그 시스템이 만들었습니다. 저희 계정 자체가 데모입니다.\n\n💬 댓글에 \"실적\"이라고 남겨주시면 포트폴리오를 보내드립니다.\n\n#SNS자동화 #마케팅자동화 #광고대행사 #포트폴리오 #pslab #문제해결연구소 #ALWAYSON #얼웨이즈온","variant":"A","slideImages":["cards/pslab/reels-08-07-1.png"],"status":"planned","videoFile":"shorts/reels-08-07/reels-08-07.mp4","reelsScript":"[HOOK]\nSNS 자동화, 못 믿으시겠죠?\n\n[본론]\n16년 동안 250개가 넘는 브랜드를 맡았습니다.\n최근 5년만 세어도 49개예요.\n\n[CTA]\n지금 이 영상도 그 시스템이 만들었습니다."},{"id":"youtube-08-07","topic":"ALWAYS ON · 신뢰 근거","format":"쇼츠 대본","channels":["youtube"],"scheduledFor":"2026-08-07T09:00:00.000Z","kicker":"Shorts","headline":"16년 동안\u003cbr>*250개 넘는* 브랜드","sub":"최근 5년만 세어도 49개입니다.","dayLabel":"금요일 · 쇼츠","cardImage":"cards/pslab/youtube-08-07-1.png","captionNote":"릴스 영상 재활용(videoFrom)","captionBody":"[HOOK]\n이 영상, 사람이 안 만들었습니다.\n\n[본론]\n16년차 대행사가 자기 채널로 검증.\n\n[CTA]\n증거는 이 채널입니다.","variant":"A","slideImages":["cards/pslab/youtube-08-07-1.png"],"status":"planned","videoFile":"shorts/reels-08-07/reels-08-07.mp4","reelsScript":"[HOOK]\n이 영상, 사람이 안 만들었습니다.\n\n[본론]\n16년차 광고대행사가\n자기 채널로 먼저 검증했어요.\n\n[CTA]\n증거는 이 채널입니다.","ytTitle":"이 영상은 사람이 만들지 않았습니다｜SNS 자동화 시스템이 만든 쇼츠 #shorts","ytDescription":"이 쇼츠는 사람이 아니라 SNS 채널 자동화 시스템 ALWAYS ON(얼웨이즈온)이 만들었습니다.\n기획·대본·영상·자막·발행까지 전 과정 자동입니다.\n\n16년차 종합광고대행사 P.S.LAB(문제해결연구소)이 자기 채널로 먼저 검증하고 있습니다.\n▶ https://pslab.ai.kr/always-on\n\n#SNS자동화 #얼웨이즈온 #마케팅자동화 #shorts","ytTags":["SNS 자동화","AI 콘텐츠","마케팅 자동화","얼웨이즈온","ALWAYS ON","pslab","문제해결연구소","광고대행사","숏폼 제작","콘텐츠 자동화"]},{"id":"threads-08-07","topic":"ALWAYS ON · 신뢰 근거","format":"스레드(타래)","channels":["threads"],"scheduledFor":"2026-08-07T10:00:00.000Z","kicker":"Threads","headline":"업종을 *안 가린다는* 말","sub":"250개를 세어 보고 하는 말입니다.","dayLabel":"금요일 · 스레드","cardImage":"cards/pslab/threads-08-07-1.png","captionNote":"업계 상투어를 자기반성으로 열고 → 실제 숫자로 반박 → 업종보다 순서가 본질 → 질문형 마무리","captionBody":"\"저희는 업종 안 가립니다\" — 대행사들이 흔히 하는 말이죠. 저도 해봤습니다. 🧵\n\n그래서 한번 세어봤어요. 16년 동안 맡은 브랜드가 250곳이 넘더군요.\n\n너무 많아서 최근 5년만 다시 세어봤습니다. 49개였고, 나눠보니 이렇더군요.\n\n패션·럭셔리 16 / 뷰티·헬스 8 / 식음료 7 / B2B·금융 6 / 리테일 3 / 전자·리빙 3 / 키즈 3 / 펫 3.\n\n주얼리도 있고 조명도 있고 펀딩 플랫폼도 있습니다. 처음엔 \"이 업종은 우리가 잘 모르는데\" 싶었던 곳이 더 많았어요.\n\n결국 남은 건 업종 지식이 아니라 순서였습니다. 뭘 먼저 묻고, 뭘 먼저 만들고, 뭘 보고 고치는지. 그 순서는 업종이 달라도 같더라고요.\n\nALWAYS ON은 그 순서를 시스템으로 옮긴 겁니다.\n\n혹시 \"우리 업종은 좀 특수해서\"라고 생각하고 계신가요?\n\n#pslab #문제해결연구소 #ALWAYSON #얼웨이즈온","variant":"B","slideImages":["cards/pslab/threads-08-07-1.png"],"status":"planned"},{"id":"reels-08-10","topic":"ALWAYS ON · 문제 재정의","format":"릴스","channels":["instagram"],"scheduledFor":"2026-08-10T09:00:00.000Z","kicker":"ALWAYS ON","headline":"\"올릴 게\u003cbr>*없어서*\"","sub":"사실은 찾을 시간이 없는 겁니다.","dayLabel":"월요일 · 릴스","cardImage":"cards/pslab/reels-08-10-1.png","captionNote":"가장 흔한 변명을 인정 → 진짜 원인(시간)으로 재정의 → 소재 발굴 자동화 → 무료 소재 5개 CTA","captionBody":"\"올릴 게 없어서 못 올렸어요.\" SNS 상담에서 가장 많이 듣는 말입니다.\n\n그런데 조금 더 물어보면 거의 항상 이렇게 바뀝니다. \"생각은 나는데, 그걸 정리해서 만들 시간이 없어요.\"\n\n소재가 없는 게 아니라 소재를 찾고 다듬을 시간이 없는 겁니다. 오늘 손님이 물어본 질문, 어제 반품 사유, 지난주에 잘 나간 메뉴 — 전부 콘텐츠인데 그걸 앉아서 글로 바꿀 30분이 없는 거예요.\n\nALWAYS ON(얼웨이즈온)은 그 \"찾는 일\"부터 시작합니다. 업종 검색어와 경쟁 채널을 매일 훑어 이번 주에 말할 거리를 먼저 뽑고, 거기서 기획·제작·발행까지 이어갑니다.\n\n사장님은 \"이건 좋고 이건 빼주세요\"만 하시면 됩니다.\n\n💬 댓글에 \"소재\"라고 남겨주시면 사장님 업종에서 지금 반응 좋은 주제 5개를 뽑아 보내드립니다.\n\n#SNS소재 #소상공인마케팅 #콘텐츠기획 #pslab #문제해결연구소 #ALWAYSON #얼웨이즈온","variant":"A","slideImages":["cards/pslab/reels-08-10-1.png"],"status":"planned","videoFile":"shorts/reels-08-10/reels-08-10.mp4","reelsScript":"[HOOK]\n\"올릴 게 없어서 못 올려요\"\n\n[본론]\n소재가 없는 게 아닙니다.\n찾을 시간이 없는 겁니다.\n\n[CTA]\n찾는 일부터 자동으로 돌립니다."},{"id":"youtube-08-10","topic":"ALWAYS ON · 문제 재정의","format":"쇼츠","channels":["youtube"],"scheduledFor":"2026-08-10T09:00:00.000Z","kicker":"ALWAYS ON","headline":"\"올릴 게\u003cbr>*없어서*\"","sub":"사실은 찾을 시간이 없는 겁니다.","dayLabel":"월요일 · 쇼츠","cardImage":"cards/pslab/youtube-08-10-1.png","captionNote":"릴스 영상 재활용(videoFrom) — 유튜브 쇼츠 노출 확장","captionBody":"\"올릴 게 없어서 못 올렸어요\" — SNS 상담에서 가장 많이 듣는 말입니다.\n\n소재가 없는 게 아니라, 소재를 찾고 다듬을 시간이 없는 겁니다.\n\nALWAYS ON(얼웨이즈온)은 그 \"찾는 일\"부터 자동으로 돌립니다.\n\n#쇼츠 #SNS자동화 #소상공인 #pslab #문제해결연구소 #ALWAYSON #얼웨이즈온","variant":"A","slideImages":["cards/pslab/youtube-08-10-1.png"],"status":"planned","videoFile":"shorts/reels-08-10/reels-08-10.mp4"},{"id":"threads-08-10","topic":"ALWAYS ON · 문제 재정의","format":"스레드(타래)","channels":["threads"],"scheduledFor":"2026-08-10T10:00:00.000Z","kicker":"","headline":"소재가 없는 게\u003cbr>*아니었다*","sub":"30분이 없었을 뿐.","dayLabel":"월요일 · 스레드","cardImage":"cards/pslab/threads-08-10-1.png","captionNote":"레퍼런스 학습 적용 — 번호 타래, 한 문장 한 줄, 첫 줄 구체적 숫자(12분), 마지막은 질문형 제안","captionBody":"1. 지난달 상담한 사장님 12분에게 같은 질문을 했습니다.\n2. \"왜 SNS를 멈추셨어요?\"\n3. 11분이 똑같이 답했습니다. \"올릴 게 없어서요.\"\n4. 그래서 다시 물었습니다. \"오늘 손님이 뭐 물어보셨어요?\"\n5. 12분 전원이 5초 안에 답했습니다.\n6. 배송 언제 오냐, 이거 세탁 되냐, 주차 되냐, 재입고 언제냐.\n7. 전부 콘텐츠입니다.\n8. 소재가 없던 게 아니었습니다.\n9. 그걸 앉아서 글과 이미지로 바꿀 30분이 없었을 뿐입니다.\n10. 그리고 그 30분은 앞으로도 안 생깁니다. 본업이 있으니까요.\n\n오늘 손님이 물어본 것, 하나만 떠올려보세요. 그게 이번 주 콘텐츠입니다.\n\n#pslab #문제해결연구소 #ALWAYSON #얼웨이즈온","variant":"A","slideImages":["cards/pslab/threads-08-10-1.png"],"status":"planned"},{"id":"naver-08-11","topic":"ALWAYS ON · 가치 환산(의사결정 기준)","format":"naver-blog","channels":["naver-blog"],"scheduledFor":"2026-08-11T02:00:00.000Z","kicker":"","headline":"SNS 마케팅, 직접 할까 맡길까 — 사장님 상황별 판단 기준 5가지","sub":"매출 규모·인력·업종별로 답이 다릅니다.","dayLabel":"화요일 · 네이버 블로그","cardImage":"cards/pslab/naver-08-11-1.png","captionNote":"검색어 \"sns 마케팅 직접\" \"마케팅 대행 비용\" 정면 대응. 결론을 자동화로 몰지 않고 3분기 제시 → 신뢰 확보","captionBody":"\"SNS 직접 해야 하나요, 맡겨야 하나요.\" 상담에서 절반 이상이 이 질문으로 시작합니다.\n\n정답은 상황마다 다릅니다. 다만 16년 동안 250곳이 넘는 브랜드를 운영하면서 판단 기준은 다섯 가지로 정리됐습니다.\n\n## 1. 월 콘텐츠 개수가 12건을 넘는가\n주 3회(월 12건)가 분기점입니다. 그 아래면 사장님이 직접 하시는 게 낫습니다. 넘어가면 본업이 흔들립니다.\n\n## 2. 콘텐츠 1건에 몇 분 쓰는가\n기획·촬영·편집·업로드를 다 합쳐 재보세요. 평균 1시간 45분입니다. 월 12건이면 21시간, 사장님 시급이 3만원이면 월 63만원입니다.\n\n## 3. 3개월 이상 끊김 없이 유지한 적이 있는가\n없다면 의지 문제가 아니라 구조 문제입니다. 같은 방식으로 다시 시작하면 같은 자리에서 멈춥니다.\n\n## 4. 우리 업종이 검색으로 팔리는가\n검색 유입이 중요한 업종이면 블로그·구글 쪽 비중을 키워야 합니다. 인스타만 해서는 안 잡힙니다.\n\n## 5. 담당 직원을 뽑을 수 있는가\n마케팅 직원 1명은 4대보험 포함 연 4,000만원선입니다. 대행은 월 100~300만원, 자동화는 그 아래입니다.\n\n## 상황별 정리\n- 월 12건 미만 + 검색 비중 낮음 → **직접 운영**\n- 월 12건 이상 + 인력 없음 → **자동화(ALWAYS ON)**\n- 브랜드 캠페인 중심 + 예산 확보 → **대행사**\n\nALWAYS ON(얼웨이즈온)은 인스타그램·네이버 블로그·구글 블로그·스레드·유튜브 5개 채널을 매일 자동 발행합니다. 사장님이 하실 일은 방향 결정과 검수뿐입니다.\n\n어느 쪽이 맞는지 헷갈리시면 현재 채널 상태를 무료로 진단해드립니다.\n\n#SNS마케팅 #마케팅대행 #소상공인마케팅 #pslab #문제해결연구소 #ALWAYSON #얼웨이즈온","variant":"A","slideImages":["cards/pslab/naver-08-11-1.png"],"status":"planned"},{"id":"car-08-12","topic":"ALWAYS ON · 한계 공개","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-08-12T09:00:00.000Z","kicker":"ALWAYS ON","headline":"SNS 자동화,\u003cbr>*이건 안 됩니다*","sub":"팔기 전에 못 하는 것부터 말씀드립니다.","dayLabel":"수요일 · 카드뉴스","cardImage":"cards/pslab/car-08-12-1.png","captionNote":"한계 자백으로 신뢰 확보 → 유일한 강점(끊기지 않음)에 집중 → 저장 유도","captionBody":"SNS 자동화 솔루션을 팔면서 \"이건 안 됩니다\"부터 말씀드리는 게 이상해 보이실 수 있습니다.\n\n그런데 기대가 어긋난 채로 시작하면 3개월 안에 해지됩니다. 서로 시간만 버리는 거예요. 그래서 먼저 밝힙니다.\n\n① 오늘 찍은 매장 사진 — 실사는 사장님만 찍을 수 있습니다.\n② 즉흥 대응 — 오늘 터진 이슈에 30분 만에 반응하는 건 사람이 빠릅니다.\n③ 팔로워 즉시 증가 — 노출은 늘지만 숫자는 보통 2~3개월 뒤에 움직입니다.\n\n대신 되는 게 하나 있습니다. **끊기지 않는 것.** 매일 같은 시각에 5개 채널이 돌아갑니다.\n\n고객이 검색했을 때 최근 글이 있는 계정과 3주 멈춘 계정은 완전히 다릅니다. 그 차이를 만드는 게 ALWAYS ON(얼웨이즈온)입니다.\n\n💬 댓글에 \"한계\"라고 남겨주시면 실제 가능 범위를 정리해 보내드립니다.\n\n#SNS자동화 #마케팅자동화 #소상공인마케팅 #pslab #문제해결연구소 #ALWAYSON #얼웨이즈온","variant":"B","slideImages":["cards/pslab/car-08-12-1.png","cards/pslab/car-08-12-2.png","cards/pslab/car-08-12-3.png","cards/pslab/car-08-12-4.png","cards/pslab/car-08-12-5.png","cards/pslab/car-08-12-6.png","cards/pslab/car-08-12-7.png","cards/pslab/car-08-12-8.png","cards/pslab/car-08-12-9.png"],"status":"planned"},{"id":"threads-08-12","topic":"ALWAYS ON · 한계 공개","format":"스레드(타래)","channels":["threads"],"scheduledFor":"2026-08-12T10:00:00.000Z","kicker":"","headline":"못 한다고\u003cbr>*먼저 말하는* 쪽","sub":"해지율이 낮습니다.","dayLabel":"수요일 · 스레드","cardImage":"cards/pslab/threads-08-12-1.png","captionNote":"레퍼런스 패턴 적용 — 번호 타래, 6~7번에서 예상 뒤집기, 마지막 질문형","captionBody":"1. 자동화 솔루션 상담에서 제가 제일 먼저 하는 말이 있습니다.\n2. \"이건 안 됩니다.\"\n3. 매장 실사 사진은 못 찍습니다.\n4. 오늘 터진 이슈에 30분 만에 반응하는 것도 사람이 빠릅니다.\n5. 팔로워가 다음 달에 뛰는 일도 없습니다.\n6. 영업할 때 이런 말을 하면 계약이 줄어들 것 같죠.\n7. 실제로는 반대였습니다.\n8. 기대를 정확히 맞춘 쪽이 3개월을 넘깁니다.\n9. 부풀려서 계약한 쪽이 3개월 안에 해지합니다.\n10. 계약을 따내는 것보다 남아 있는 게 어렵더군요.\n\n혹시 마케팅 업체 상담에서 \"못 하는 것\"을 들어보신 적 있으신가요?\n\n#pslab #문제해결연구소 #ALWAYSON #얼웨이즈온","variant":"B","slideImages":["cards/pslab/threads-08-12-1.png"],"status":"planned"},{"id":"blogger-08-13","topic":"ALWAYS ON · 콘텐츠 자산(GEO)","format":"blogger","channels":["blogger"],"scheduledFor":"2026-08-13T02:00:00.000Z","kicker":"","headline":"AI 검색이 인용하는 글은 뭐가 다른가 — 우리 브랜드가 답변에 들어가는 조건","sub":"GEO(생성형 검색 최적화) 관점에서 문서 구조를 뜯어봅니다.","dayLabel":"목요일 · 구글 블로그","cardImage":"cards/pslab/blogger-08-13-1.png","captionNote":"GEO 구조 관점 롱폼. 8/6(광고비 vs 자산 계산법)과 달리 \"어떻게 써야 인용되는가\"라는 방법론으로 각도 분리","captionBody":"고객이 검색창 대신 AI에게 묻기 시작했습니다. \"○○지역에서 △△ 잘하는 곳 추천해줘.\"\n\nAI는 답변을 만들 때 웹 문서를 읽고 그중 일부를 인용합니다. 우리 브랜드가 그 인용에 들어가느냐 마느냐가 새로운 노출 싸움입니다. 이걸 GEO(Generative Engine Optimization)라고 부릅니다.\n\n## 기존 SEO와 무엇이 다른가\n기존 검색은 **순위**를 다퉜습니다. 10개 링크 중 몇 번째냐의 싸움이었죠. AI 검색은 **인용**을 다툽니다. 답변 안에 우리 문장이 들어가거나, 아예 안 들어가거나 둘 중 하나입니다.\n\n## AI가 인용하기 좋은 문서의 조건 4가지\n\n### 1. 질문 형태의 제목\n\"우리 서비스 소개\"보다 \"○○ 비용은 얼마인가요\"가 인용됩니다. AI는 질문에 답하는 중이라, 질문 모양의 문서를 먼저 집습니다.\n\n### 2. 한 문단에 하나의 사실\n긴 문단은 통째로 버려집니다. 인용 단위는 문단이라서, 한 문단에 주장 하나 + 근거 하나가 들어가야 잘려 나갑니다.\n\n### 3. 구체적인 숫자와 조건\n\"저렴합니다\"는 인용되지 않습니다. \"월 12건 기준 63만원\"은 인용됩니다. 검증 가능한 값이 있어야 AI가 근거로 씁니다.\n\n### 4. 정의 문장이 있을 것\n\"ALWAYS ON은 5개 채널을 매일 자동 발행하는 SNS 자동화 솔루션입니다\" — 이런 한 줄 정의가 문서 앞쪽에 있으면 AI가 브랜드를 설명할 때 그대로 가져다 씁니다.\n\n## 광고와 결정적으로 다른 점\n광고는 돈을 멈추면 노출도 멈춥니다. 문서는 남습니다. 한 번 잘 쓴 글이 AI 답변에 계속 인용되면, 그건 매달 비용을 내지 않는 노출입니다.\n\n다만 조건이 있습니다. **문서가 꾸준히 쌓여 있어야** 합니다. 3개월 쓰다 멈춘 블로그는 인용 후보에서 밀립니다.\n\n## 그래서 자동화가 필요한 지점\nALWAYS ON(얼웨이즈온)은 이 조건에 맞춘 글을 매일 자동으로 씁니다. 질문형 제목, 문단당 하나의 사실, 구체적 숫자, 브랜드 정의 문장 — 이 네 가지를 템플릿이 아니라 규칙으로 지킵니다.\n\n검색 방식이 바뀌는 중입니다. 광고비는 사라지고 문서는 남습니다.\n\n#GEO #생성형검색최적화 #AI검색 #콘텐츠마케팅 #pslab #문제해결연구소 #ALWAYSON #얼웨이즈온","variant":"A","slideImages":["cards/pslab/blogger-08-13-1.png"],"status":"planned"},{"id":"reels-08-14","topic":"ALWAYS ON · 신뢰 근거(학습 루프)","format":"릴스","channels":["instagram"],"scheduledFor":"2026-08-14T09:00:00.000Z","kicker":"ALWAYS ON","headline":"안 되는 콘텐츠는\u003cbr>*어떻게* 아나","sub":"매주 숫자를 읽고 스스로 고칩니다.","dayLabel":"금요일 · 릴스","cardImage":"cards/pslab/reels-08-14-1.png","captionNote":"품질 의심 정면 대응 → 실측 학습 루프 공개 → 시간이 갈수록 좋아진다는 반전 → 리포트 샘플 CTA","captionBody":"\"자동으로 올리면 품질 관리는 어떻게 하나요?\" 가장 날카로운 질문이라 정확히 답하겠습니다.\n\n발행이 끝이 아닙니다. ALWAYS ON(얼웨이즈온)은 올린 콘텐츠의 실제 숫자를 매주 다시 읽습니다. 조회수, 저장수, 댓글, 유입 검색어까지요.\n\n그리고 반응이 없던 각도는 다음 주 기획에서 빠집니다. 반응이 좋았던 주제·문장 길이·디자인은 비중이 올라갑니다. 사람이 감으로 판단하던 걸 숫자로 하는 겁니다.\n\n그래서 이 시스템은 첫 달보다 셋째 달이 낫습니다. 콘텐츠가 쌓이는 게 아니라 판단 기준이 쌓이는 거예요.\n\n광고와 반대입니다. 광고는 돈을 멈추면 처음으로 돌아가지만, 이건 멈춰도 학습한 게 남습니다.\n\n💬 댓글에 \"학습\"이라고 남겨주시면 실제 주간 리포트 샘플을 보내드립니다.\n\n#SNS자동화 #데이터마케팅 #콘텐츠전략 #pslab #문제해결연구소 #ALWAYSON #얼웨이즈온","variant":"B","slideImages":["cards/pslab/reels-08-14-1.png"],"status":"planned","videoFile":"shorts/reels-08-14/reels-08-14.mp4","reelsScript":"[HOOK]\n자동으로 올리면 품질은요?\n\n[본론]\n매주 조회수와 저장수를 읽습니다.\n반응 없던 각도는 다음 주에 빠집니다.\n\n[CTA]\n쌓일수록 좋아지는 구조입니다."},{"id":"youtube-08-14","topic":"ALWAYS ON · 신뢰 근거(학습 루프)","format":"쇼츠","channels":["youtube"],"scheduledFor":"2026-08-14T09:00:00.000Z","kicker":"ALWAYS ON","headline":"안 되는 콘텐츠는\u003cbr>*어떻게* 아나","sub":"매주 숫자를 읽고 스스로 고칩니다.","dayLabel":"금요일 · 쇼츠","cardImage":"cards/pslab/youtube-08-14-1.png","captionNote":"릴스 영상 재활용(videoFrom)","captionBody":"\"자동으로 올리면 품질 관리는 어떻게 하나요?\"\n\n매주 조회수·저장수·유입 검색어를 다시 읽고, 반응 없던 각도는 다음 주 기획에서 뺍니다.\n\n그래서 첫 달보다 셋째 달이 낫습니다. ALWAYS ON(얼웨이즈온).\n\n#쇼츠 #SNS자동화 #데이터마케팅 #pslab #문제해결연구소 #ALWAYSON #얼웨이즈온","variant":"B","slideImages":["cards/pslab/youtube-08-14-1.png"],"status":"planned","videoFile":"shorts/reels-08-14/reels-08-14.mp4"},{"id":"threads-08-14","topic":"ALWAYS ON · 신뢰 근거(학습 루프)","format":"스레드(타래)","channels":["threads"],"scheduledFor":"2026-08-14T10:00:00.000Z","kicker":"","headline":"첫 달보다\u003cbr>*셋째 달*이 낫다","sub":"쌓이는 건 콘텐츠가 아니라 기준입니다.","dayLabel":"금요일 · 스레드","cardImage":"cards/pslab/threads-08-14-1.png","captionNote":"레퍼런스 학습을 콘텐츠 소재로 그대로 쓴다 — 실제로 이번 주에 한 일이라 근거가 진짜다","captionBody":"1. 저희 계정 7월 콘텐츠 성적을 다시 읽었습니다.\n2. 조회수 상위 3건과 하위 3건을 놓고 비교했습니다.\n3. 상위 3건은 전부 첫 줄이 숫자나 구체적 상황이었습니다.\n4. 하위 3건은 전부 첫 줄이 형용사였습니다. \"효율적인\", \"강력한\".\n5. 길이도 갈렸습니다. 상위는 한 문장이 짧고 줄바꿈이 많았습니다.\n6. 그래서 8월 기획에서 형용사로 시작하는 후킹을 전부 뺐습니다.\n7. 사람이 감으로 판단하던 걸 숫자로 바꾼 겁니다.\n8. 이게 매주 돌아갑니다.\n9. 그래서 이 계정은 첫 달보다 셋째 달이 낫습니다.\n10. 쌓이는 게 콘텐츠가 아니라 판단 기준이라서요.\n\n혹시 지난달 올린 것 중에 뭐가 제일 반응 좋았는지 기억나시나요?\n\n#pslab #문제해결연구소 #ALWAYSON #얼웨이즈온","variant":"B","slideImages":["cards/pslab/threads-08-14-1.png"],"status":"planned"}],"channels":[{"key":"instagram","label":"인스타그램","icon":"📸","active":true,"published":[{"topic":"온라인마케팅","time":"2026-06-25T13:40:06.315Z","imageUrl":"https://i.ibb.co/bgFmxyCH/680c27e00a8d.jpg","caption":"온라인마케팅에 대해 이야기해 볼게요.","url":"https://www.instagram.com/p/DaAsg05kj_n/","views":0,"likes":0,"comments":0,"engagementRate":0},{"topic":"온라인마케팅","time":"2026-06-25T13:09:58.908Z","imageUrl":"https://i.ibb.co/bjxKqrC7/315aa63bb230.jpg","caption":"온라인마케팅에 대해 이야기해 볼게요.","url":"https://www.instagram.com/p/DaApEYKE6Cr/","views":0,"likes":0,"comments":0,"engagementRate":0},{"topic":"온라인마케팅","time":"2026-06-25T12:42:58.071Z","imageUrl":"https://i.ibb.co/LwMY2nq/b961780986f0.jpg","caption":"온라인마케팅에 대해 이야기해 볼게요.","url":"https://instagram.com/p/ig_hewipimt_zgvd","views":0,"likes":0,"comments":0,"engagementRate":0.11063005983808519}],"pending":[{"id":"w1-mon","topic":"광고대행","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-06-29T10:00:00.000Z","kicker":"Marketing Insight","headline":"광고비를 태우기 전에\u003cbr>반드시 점검할 *3가지*","sub":"15년간 대행하며 깨달은, 돈이 새는 지점부터 막는 법.","dayLabel":"월요일 · 인사이트","cardImage":"cards/pslab/w1-mon-1.png","captionNote":"15년간 대행하며 깨달은, 돈이 새는 지점부터 막는 법.","captionBody":"광고비, 켜기 전이 90%입니다.\n\n15년간 수백 개 계정을 만지며 깨달은 건 — 돈은 “운영”이 아니라 “준비”에서 샙니다.\n\n태우기 전 반드시 점검할 3가지\n1. 타겟 — “누구나”는 “아무도”입니다. 한 사람을 그리세요.\n2. 소재 — 첫 3초에 멈출 이유가 없으면 돈은 흐릅니다.\n3. 랜딩 — 클릭 다음 화면이 약하면 모든 클릭이 비용입니다.\n\n이 셋이 안 맞은 채 예산부터 올리는 순간, 적자는 정해집니다.\n\n#온라인마케팅 #광고대행 #퍼포먼스마케팅","variant":"A","slideImages":["cards/pslab/w1-mon-1.png","cards/pslab/w1-mon-2.png","cards/pslab/w1-mon-3.png","cards/pslab/w1-mon-4.png","cards/pslab/w1-mon-5.png","cards/pslab/w1-mon-6.png"],"status":"published","publishedUrl":"https://www.instagram.com/p/DaCerLaFY2L/","publishedAt":"2026-06-26T06:17:35.229Z"},{"id":"w1-wed","topic":"업계비하인드","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-07-01T10:00:00.000Z","kicker":"Agency Behind","headline":"대행사를 쓰면\u003cbr>매출이 오른다는 *착각*","sub":"대행이 할 수 있는 것과 없는 것, 솔직하게 말합니다.","dayLabel":"수요일 · 비하인드","cardImage":"cards/pslab/w1-wed-1.png","captionNote":"대행이 할 수 있는 것과 없는 것, 솔직하게 말합니다.","captionBody":"“대행 맡기면 알아서 매출 오르겠지” — 가장 많이 깨지는 기대입니다.\n\n대행이 잘하는 건 “실행의 효율”입니다. 같은 예산으로 더 정교하게, 더 빠르게.\n하지만 “팔리는 상품”과 “살 이유”를 만드는 건 결국 브랜드의 몫이에요.\n\n이 경계가 정렬되지 않으면, 대행도 광고주도 둘 다 지칩니다.\n맡기기 전에 “우리가 책임질 것”부터 정하세요.\n\n#마케팅인사이트 #광고대행 #사업이야기","variant":"A","slideImages":["cards/pslab/w1-wed-1.png","cards/pslab/w1-wed-2.png","cards/pslab/w1-wed-3.png","cards/pslab/w1-wed-4.png","cards/pslab/w1-wed-5.png"],"status":"published","publishedUrl":"https://www.instagram.com/p/DaK2fegjYUt/","metrics":{"views":3,"likes":2,"comments":0,"shares":0,"engagementRate":0.6666666666666666},"insightComment":"참여율 66.7%로 평균(40.4%)을 웃돌았어요. 디자인 A안·결론 우선 구조가 먹힌 것으로 보입니다 — 다음에도 같은 톤을 유지하세요.","publishedAt":"2026-06-29T12:19:41.176Z"},{"id":"w1-fri","topic":"브랜딩","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-07-01T09:00:00.000Z","kicker":"Brand Strategy","headline":"팔리는 브랜드는\u003cbr>‘무엇’이 아니라 *‘왜’*를 판다","sub":"작은 브랜드일수록 더 중요한 메시지 설계 이야기.","dayLabel":"금요일 · 브랜딩","cardImage":"cards/pslab/w1-fri-1.png","captionNote":"작은 브랜드일수록 더 중요한 메시지 설계 이야기.","captionBody":"사람들은 “무엇을 파는지”로 기억하지 않습니다. “왜 파는지”로 기억하죠.\n\n기능과 스펙은 경쟁사도 똑같이 말합니다. 차별은 “왜”에서 생깁니다.\n작은 브랜드일수록 더 그래요 — 자원이 적을수록 메시지가 무기니까.\n\n오늘 우리 브랜드의 “왜”를 한 문장으로 써보세요. 안 써지면, 그게 진짜 과제입니다.\n\n#브랜딩 #마케팅전략 #창업인사이트","variant":"A","slideImages":["cards/pslab/w1-fri-1.png","cards/pslab/w1-fri-2.png","cards/pslab/w1-fri-3.png","cards/pslab/w1-fri-4.png","cards/pslab/w1-fri-5.png"],"status":"published","publishedUrl":"https://www.instagram.com/p/DaP-NdfDv3F/","metrics":{"views":3,"likes":2,"comments":0,"shares":0,"engagementRate":0.6666666666666666},"insightComment":"참여율 66.7%로 평균(40.4%)을 웃돌았어요. 디자인 A안·결론 우선 구조가 먹힌 것으로 보입니다 — 다음에도 같은 톤을 유지하세요.","publishedAt":"2026-07-01T12:03:17.068Z"},{"id":"w2-mon","topic":"마케팅전략","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-07-04T09:00:00.000Z","kicker":"Decision","headline":"이 광고, 꺼야 할까?\u003cbr>판단하는 *숫자 하나*","sub":"감으로 끄지 마세요. 손익분기 한 줄 계산법.","dayLabel":"월요일 · 의사결정","cardImage":"cards/pslab/w2-mon-1.png","captionNote":"감으로 끄지 마세요. 손익분기 한 줄 계산법.","captionBody":"“이 광고 꺼야 하나, 더 둬야 하나” 감으로 정하지 마세요.\n\n판단은 숫자 하나로 충분합니다 — 손익분기 CPA.\n(객단가 × 마진율)이 허용 CPA입니다. 실제 CPA가 이걸 넘으면, 켤수록 적자.\n\n예) 객단가 5만 × 마진 40% = 허용 CPA 2만원. 지금 3만이면? 끄거나 고치세요.\n감이 아니라 선이 결정합니다.\n\n#퍼포먼스마케팅 #마케팅전략 #광고대행","variant":"B","slideImages":["cards/pslab/w2-mon-1.png","cards/pslab/w2-mon-2.png","cards/pslab/w2-mon-3.png","cards/pslab/w2-mon-4.png","cards/pslab/w2-mon-5.png"],"status":"published","publishedUrl":"https://www.instagram.com/p/DaXlHvkjzDc/","metrics":{"views":3,"likes":1,"comments":0,"shares":0,"engagementRate":0.3333333333333333},"insightComment":"참여율 33.3%로 평균(40.4%)을 밑돌았어요. 첫 슬라이드 후킹과 결론 한 줄을 더 세게, 저장 유도 문구를 명확히 해보세요.","publishedAt":"2026-07-04T10:57:58.853Z"},{"id":"w2-wed","topic":"퍼포먼스마케팅","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-07-07T09:00:00.000Z","kicker":"Ad Ops","headline":"클릭은 느는데\u003cbr>매출이 *안 느는 이유*","sub":"클릭은 구매가 아닙니다. 전환이 새는 지점.","dayLabel":"수요일 · 광고운영","cardImage":"cards/pslab/w2-wed-1.png","captionNote":"클릭은 구매가 아닙니다. 전환이 새는 지점.","captionBody":"클릭은 느는데 매출은 그대로. 광고가 문제일까요?\n\n대개 아닙니다. 클릭은 “관심”이고 구매는 “확신”이에요. 둘 사이에서 새는 겁니다.\n랜딩의 첫 화면, 가격을 납득시키는 근거, 후기 같은 신뢰 장치 —\n이 중 하나만 약해도 클릭은 비용으로 끝납니다.\n\n광고를 더 돌리기 전에, 클릭 다음 화면부터 점검하세요.\n\n#퍼포먼스마케팅 #온라인마케팅 #전환율","variant":"B","slideImages":["cards/pslab/w2-wed-1.png","cards/pslab/w2-wed-2.png","cards/pslab/w2-wed-3.png","cards/pslab/w2-wed-4.png","cards/pslab/w2-wed-5.png"],"status":"published","publishedUrl":"https://www.instagram.com/p/DafckBAmnn9/","metrics":{"views":4,"likes":1,"comments":0,"shares":0,"engagementRate":0.25},"insightComment":"참여율 25.0%로 평균(40.4%)을 밑돌았어요. 첫 슬라이드 후킹과 결론 한 줄을 더 세게, 저장 유도 문구를 명확히 해보세요.","publishedAt":"2026-07-07T12:17:07.179Z"},{"id":"w2-fri","topic":"창업인사이트","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-07-10T09:00:00.000Z","kicker":"Startup","headline":"돈 없이 시작하는 마케팅,\u003cbr>*진짜 가능한가*","sub":"예산 0원부터 검증. 돈 쓰기 전에 할 것.","dayLabel":"금요일 · 창업","cardImage":"cards/pslab/w2-fri-1.png","captionNote":"예산 0원부터 검증. 돈 쓰기 전에 할 것.","captionBody":"“돈 없으면 마케팅 못 하죠” — 절반만 맞습니다.\n\n돈이 필요한 건 “확장”이고, “검증”은 거의 공짜로 가능합니다.\n콘텐츠 몇 개, DM 몇 통, 작은 설문으로 “살 사람이 있는지”부터 확인하세요.\n수요를 확인하기 전에 광고비부터 태우면, 빠르게 망하는 길입니다.\n\n돈은 검증된 다음에 붓는 겁니다.\n\n#창업인사이트 #사업이야기 #온라인마케팅","variant":"B","slideImages":["cards/pslab/w2-fri-1.png","cards/pslab/w2-fri-2.png","cards/pslab/w2-fri-3.png","cards/pslab/w2-fri-4.png","cards/pslab/w2-fri-5.png"],"status":"published","publishedUrl":"https://www.instagram.com/p/DanJLwVknio/","metrics":{"views":3,"likes":2,"comments":0,"shares":0,"engagementRate":0.6666666666666666},"insightComment":"참여율 66.7%로 평균(40.4%)을 웃돌았어요. 디자인 B안·결론 우선 구조가 먹힌 것으로 보입니다 — 다음에도 같은 톤을 유지하세요.","publishedAt":"2026-07-10T12:01:46.886Z"},{"id":"w3-mon","topic":"업계비하인드","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-07-12T09:00:00.000Z","kicker":"Agency Behind","headline":"대행사가 절대\u003cbr>먼저 *말 안 해주는 것*","sub":"수수료 구조와 계약 전 꼭 물어야 할 질문.","dayLabel":"월요일 · 비하인드","cardImage":"cards/pslab/w3-mon-1.png","captionNote":"수수료 구조와 계약 전 꼭 물어야 할 질문.","captionBody":"대행사가 먼저 말 안 해주는 것들이 있습니다.\n\n- 수수료가 “매체비의 %”인지 “고정”인지에 따라 이해관계가 달라집니다.\n- 리포트의 “좋아 보이는 지표”와 “매출 지표”는 다릅니다.\n- 계약 전, 누가 무엇을 책임지는지 문서로 남기세요.\n\n나쁜 대행이라서가 아니라, 안 물으면 굳이 말 안 하는 구조라서예요.\n질문이 당신을 지킵니다.\n\n#광고대행 #마케팅인사이트 #업계비하인드","variant":"C","slideImages":["cards/pslab/w3-mon-1.png","cards/pslab/w3-mon-2.png","cards/pslab/w3-mon-3.png","cards/pslab/w3-mon-4.png","cards/pslab/w3-mon-5.png","cards/pslab/w3-mon-6.png"],"status":"published","publishedUrl":"https://www.instagram.com/p/DasJZPlnywV/","metrics":{"views":3,"likes":1,"comments":0,"shares":0,"engagementRate":0.3333333333333333},"insightComment":"참여율 33.3%로 평균(40.4%)을 밑돌았어요. 첫 슬라이드 후킹과 결론 한 줄을 더 세게, 저장 유도 문구를 명확히 해보세요.","publishedAt":"2026-07-12T10:39:51.681Z"},{"id":"reels-07-27","topic":"ALWAYS ON · 문제 제기","format":"릴스","channels":["instagram"],"scheduledFor":"2026-07-27T09:00:00.000Z","kicker":"ALWAYS ON","headline":"마지막 게시물,\u003cbr>*언제 올리셨어요?*","sub":"3주 멈춘 SNS, 손님 눈엔 닫힌 가게입니다.","dayLabel":"월요일 · 릴스","cardImage":"cards/pslab/reels-07-27-1.png","captionNote":"문제 공감 훅 — 멈춘 계정의 신호 → ALWAYS ON 소개, 댓글 인터랙션 유도","captionBody":"사장님, 마지막 SNS 게시물 언제 올리셨어요?\n\n3주 멈춘 SNS는 손님 눈에 \"닫힌 가게\"로 보입니다. 그렇다고 매일 5개 채널을 혼자 올리는 건 애초에 무리예요. 의지가 아니라 구조의 문제거든요.\n\nALWAYS ON은 조사→제작→발행→성과 학습을 매일 자동으로 돌리는 SNS 채널 자동화 솔루션입니다. 사장님이 주무시는 동안에도 인스타·블로그·스레드·유튜브가 올라갑니다.\n\n장사에 집중하세요. 채널은 시스템이 지킵니다.\n\n💬 댓글에 \"온\"이라고 남기면 솔루션 소개서를 보내드려요.\n\n#ALWAYSON #얼웨이즈온 #SNS자동화 #SNS마케팅 #소상공인마케팅 #사장님","variant":"A","slideImages":["cards/pslab/reels-07-27-1.png"],"status":"published","publishedUrl":"https://www.instagram.com/reel/DbS9GeMDPVL/","metrics":{"views":98,"likes":2,"comments":0,"shares":0,"engagementRate":0.02040816326530612},"insightComment":"참여율 2.0%로 평균(40.4%)을 밑돌았어요. 첫 슬라이드 후킹과 결론 한 줄을 더 세게, 저장 유도 문구를 명확히 해보세요.","publishedAt":"2026-07-27T12:23:12.537Z","videoFile":"shorts/reels-07-27/reels-07-27.mp4","reelsScript":"[HOOK]\n마지막 게시물, 언제 올리셨어요?\n\n[본론]\n3주 멈춘 계정은 손님 눈엔 닫힌 가게.\n이제 5채널이 매일 자동으로.\n\n[CTA]\n댓글에 \"온\" — 소개서 보내드려요."},{"id":"car-07-29","topic":"ALWAYS ON · 솔루션 설명","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-07-29T09:00:00.000Z","kicker":"ALWAYS ON","headline":"오늘도 SNS,\u003cbr>*못 올리셨죠?*","sub":"괜찮습니다 — 안 올려도 올라가게 만들면 됩니다.","dayLabel":"수요일 · 캐러셀","cardImage":"cards/pslab/car-07-29-1.png","captionNote":"훅(공감 질문) → 솔루션 설명 → 가치 환산 → 저장·프로필 링크 CTA","captionBody":"오늘도 SNS 못 올리셨죠? 괜찮습니다. \"안 올려도 올라가게\" 만들면 되니까요.\n\nALWAYS ON은 16년차 광고대행사 P.S.LAB이 만든 SNS 채널 자동화 솔루션입니다.\n\n✔ 조사·기획부터 제작·발행·성과 학습까지 매일 자동\n✔ 인스타·네이버 블로그·구글 블로그·스레드·유튜브 5채널 동시 발행\n✔ 시장·경쟁사·키워드 조사로 반응 나올 주제부터 공략\n✔ 대시보드 링크 하나로 전 채널 관제 + 텔레그램 알림\n\n사람을 쓰면 월 300만원, 대행에 맡기면 월 500만원+. 그 일을 시스템이 대신합니다.\n\n💾 저장해두고, 프로필 링크에서 솔루션 소개서를 받아보세요.\n\n#ALWAYSON #얼웨이즈온 #SNS자동화 #SNS마케팅 #콘텐츠마케팅 #소상공인 #자영업","variant":"B","slideImages":["cards/pslab/car-07-29-1.png","cards/pslab/car-07-29-2.png","cards/pslab/car-07-29-3.png","cards/pslab/car-07-29-4.png","cards/pslab/car-07-29-5.png","cards/pslab/car-07-29-6.png","cards/pslab/car-07-29-7.png"],"status":"published","publishedUrl":"https://www.instagram.com/p/DbYCEecjfWg/","metrics":{"views":1,"likes":1,"comments":0,"shares":0,"engagementRate":1},"insightComment":"참여율 100.0%로 평균(40.4%)을 웃돌았어요. 디자인 B안·결론 우선 구조가 먹힌 것으로 보입니다 — 다음에도 같은 톤을 유지하세요.","publishedAt":"2026-07-29T11:42:20.787Z"},{"id":"reels-07-31","topic":"ALWAYS ON · 가치 설득","format":"릴스","channels":["instagram"],"scheduledFor":"2026-07-31T09:00:00.000Z","kicker":"ALWAYS ON","headline":"SNS 대행 견적,\u003cbr>*받아보셨어요?*","sub":"5채널 대행 월 500만원+ — 시스템은 다르게 풉니다.","dayLabel":"금요일 · 릴스","cardImage":"cards/pslab/reels-07-31-1.png","captionNote":"비용 비교 훅 → 자동화 가치 환산 → 댓글 \"견적\" 인터랙션","captionBody":"SNS 5채널 대행 견적, 받아보면 월 500만원부터 시작합니다. 직원을 뽑으면 월 300만원, 직접 하면 내 시간이 월 40시간씩 들어가요.\n\nALWAYS ON은 이 일을 자동화 시스템으로 대신합니다.\n\n조사·제작·발행·성과 학습이 매일 자동으로 돌고, 1년이면 콘텐츠 700개가 쌓입니다. 검색과 AI 추천에 남는 브랜드 자산이라, 광고비처럼 사라지지 않아요.\n\n월 고정비는 상담을 통해 브랜드에 맞게 산정됩니다.\n\n💬 댓글에 \"견적\"이라고 남기거나, 프로필 링크에서 소개서를 받아보세요.\n\n#ALWAYSON #얼웨이즈온 #SNS자동화 #SNS대행 #마케팅비용 #소상공인마케팅","variant":"C","slideImages":["cards/pslab/reels-07-31-1.png"],"status":"published","publishedUrl":"https://www.instagram.com/reel/DbdKmO_FW4p/","metrics":{"views":0,"likes":0,"comments":0,"shares":0,"engagementRate":0},"insightComment":"조회 0·좋아요 0. 노출 대비 반응을 키우려면 첫 3초 후킹을 강화하세요.","publishedAt":"2026-07-31T11:33:24.085Z","videoFile":"shorts/reels-07-31/reels-07-31.mp4","reelsScript":"[HOOK]\nSNS 대행 견적, 받아보셨어요?\n\n[본론]\n5채널이면 월 500만원부터.\n시스템은 1년에 콘텐츠 700개.\n\n[CTA]\n댓글에 \"견적\" — 소개서 보내드려요."},{"id":"reels-08-03","topic":"ALWAYS ON · 문제 재정의","format":"릴스","channels":["instagram"],"scheduledFor":"2026-08-03T09:00:00.000Z","kicker":"ALWAYS ON","headline":"SNS,\u003cbr>*3개월*을 못 넘겼다면","sub":"의지 문제가 아니라 구조 문제입니다.","dayLabel":"월요일 · 릴스","cardImage":"cards/pslab/reels-08-03-1.png","captionNote":"자책 해제(의지→물리적 불가능) → 하루를 다 써도 모자란다는 구체성 → 시스템 대안 → 무료 진단 CTA","captionBody":"SNS를 시작했다가 3개월을 못 넘긴 사장님, 정말 많습니다.\n\n그런데 이건 의지 문제가 아니에요. 채널 5개를 매일 기획하고, 만들고, 올리는 일을 다 하려면 하루 일과를 통째로 써도 시간이 모자랍니다. 본업은 언제 하나요.\n\n의지가 부족한 게 아니라 물리적으로 불가능한 겁니다. 구조가 안 되는 거예요.\n\nALWAYS ON은 이 일을 사람 대신 시스템이 합니다. 소재 조사부터 제작·발행·성과 학습까지 매일 자동으로 돌아가요.\n\n사장님이 하실 일은 방향을 정하고 검수하는 것뿐입니다.\n\n💬 댓글에 \"진단\"이라고 남겨주시면 현재 채널 상태를 무료로 봐드립니다.\n\n#SNS자동화 #소상공인마케팅 #마케팅고민 #pslab #문제해결연구소 #ALWAYSON #얼웨이즈온","variant":"A","slideImages":["cards/pslab/reels-08-03-1.png"],"status":"published","publishedUrl":"https://www.instagram.com/reel/Dbk0GhMjRqV/","metrics":{"views":105,"likes":1,"comments":0,"shares":0,"engagementRate":0.009523809523809525},"insightComment":"참여율 1.0%로 평균(40.4%)을 밑돌았어요. 첫 슬라이드 후킹과 결론 한 줄을 더 세게, 저장 유도 문구를 명확히 해보세요.","publishedAt":"2026-08-03T10:50:50.216Z","videoFile":"shorts/reels-08-03/reels-08-03.mp4","reelsScript":"[HOOK]\nSNS, 3개월을 못 넘기셨죠?\n\n[본론]\n의지 문제가 아닙니다.\n5채널을 매일 기획·제작·업로드하면\n하루를 통째로 써도 시간이 모자랍니다.\n\n[CTA]\n사람이 아니라 시스템이 하면 됩니다."},{"id":"car-08-05","topic":"ALWAYS ON · 도입 절차","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-08-05T09:00:00.000Z","kicker":"ALWAYS ON","headline":"도입하면\u003cbr>*2주 안에* 이렇게 됩니다","sub":"상담부터 첫 자동 발행까지, 실제 순서.","dayLabel":"수요일 · 캐러셀","cardImage":"cards/pslab/car-08-05-1.png","captionNote":"불확실성 해소(절차 공개) → 부담 최소화 강조 → 댓글 CTA","captionBody":"\"자동화하면 뭐부터 하나요?\" 가장 많이 받는 질문이라 순서를 그대로 공개합니다.\n\n1~2일차 상담·브랜드 정의 → 3~4일차 시장 분석 → 5~7일차 채널 방향성 기획 → 8~10일차 SNS 채널 연결 → 11~14일차 제작·발행 시작.\n\n2주를 쓰는 이유가 있습니다. 채널을 붙이기 전에 시장과 방향을 먼저 읽어야 해요. 그 단계를 건너뛰면 발행은 빨라지지만 반응이 안 옵니다.\n\n사장님이 직접 하실 일은 브랜드 정의와 기획안 검수 두 번입니다. 나머지는 저희와 시스템이 합니다.\n\n이 순서는 16년 동안 250곳이 넘는 브랜드에 적용하면서 다듬은 것입니다. 업종이 달라도 순서는 같았어요.\n\n그 이후로는 매일 자동으로 돌아가면서, 반응이 좋았던 주제와 디자인을 학습해 다음 콘텐츠에 반영합니다.\n\n💬 댓글에 \"도입\"이라고 남겨주시면 소개서를 보내드립니다.\n\n#SNS자동화 #마케팅자동화 #소상공인마케팅 #pslab #문제해결연구소 #ALWAYSON #얼웨이즈온","variant":"A","slideImages":["cards/pslab/car-08-05-1.png","cards/pslab/car-08-05-2.png","cards/pslab/car-08-05-3.png","cards/pslab/car-08-05-4.png","cards/pslab/car-08-05-5.png","cards/pslab/car-08-05-6.png","cards/pslab/car-08-05-7.png","cards/pslab/car-08-05-8.png","cards/pslab/car-08-05-9.png","cards/pslab/car-08-05-10.png"],"status":"published","publishedUrl":"https://www.instagram.com/p/Dbp9Hbokb7L/","metrics":{"views":2,"likes":1,"comments":0,"shares":0,"engagementRate":0.5},"insightComment":"참여율 50.0%로 평균(40.4%)을 웃돌았어요. 디자인 A안·결론 우선 구조가 먹힌 것으로 보입니다 — 다음에도 같은 톤을 유지하세요.","publishedAt":"2026-08-05T10:45:27.006Z"},{"id":"reels-08-07","topic":"ALWAYS ON · 신뢰 근거","format":"릴스","channels":["instagram"],"scheduledFor":"2026-08-07T09:00:00.000Z","kicker":"ALWAYS ON","headline":"16년 동안\u003cbr>*250개 넘는* 브랜드","sub":"최근 5년만 세어도 49개입니다.","dayLabel":"금요일 · 릴스","cardImage":"cards/pslab/reels-08-07-1.png","captionNote":"의심 정면 대응 → 16년 250개+ 실적(최근 5년 49개) → 업종 다양성 → 이 영상 자체가 증거 → 포트폴리오 CTA","captionBody":"SNS 자동화 솔루션이라고 하면, 대부분 이렇게 생각하십니다. \"AI가 대충 만들어주는 거 아니야?\"\n\nP.S.LAB(문제해결연구소)은 16년차 광고대행사입니다. 그동안 맡은 브랜드가 250곳이 넘습니다. 최근 5년만 따로 세어도 49개 브랜드의 브랜딩과 퍼포먼스 마케팅을 진행했어요.\n\n업종도 가리지 않았습니다. 패션·럭셔리, 뷰티·헬스, 식음료, B2B·금융, 리테일·리빙·키즈·펫까지 — 최근 5년 49개만 나눠봐도 8개 카테고리가 나옵니다.\n\nALWAYS ON(얼웨이즈온)은 그 16년치 판단 기준을 시스템으로 옮긴 것입니다. 새로 만든 AI 장난감이 아니라, 사람이 하던 일을 그대로 자동화한 거예요.\n\n그리고 지금 보고 계신 이 영상도, 이 캡션도 그 시스템이 만들었습니다. 저희 계정 자체가 데모입니다.\n\n💬 댓글에 \"실적\"이라고 남겨주시면 포트폴리오를 보내드립니다.\n\n#SNS자동화 #마케팅자동화 #광고대행사 #포트폴리오 #pslab #문제해결연구소 #ALWAYSON #얼웨이즈온","variant":"A","slideImages":["cards/pslab/reels-08-07-1.png"],"status":"planned","videoFile":"shorts/reels-08-07/reels-08-07.mp4","reelsScript":"[HOOK]\nSNS 자동화, 못 믿으시겠죠?\n\n[본론]\n16년 동안 250개가 넘는 브랜드를 맡았습니다.\n최근 5년만 세어도 49개예요.\n\n[CTA]\n지금 이 영상도 그 시스템이 만들었습니다."},{"id":"reels-08-10","topic":"ALWAYS ON · 문제 재정의","format":"릴스","channels":["instagram"],"scheduledFor":"2026-08-10T09:00:00.000Z","kicker":"ALWAYS ON","headline":"\"올릴 게\u003cbr>*없어서*\"","sub":"사실은 찾을 시간이 없는 겁니다.","dayLabel":"월요일 · 릴스","cardImage":"cards/pslab/reels-08-10-1.png","captionNote":"가장 흔한 변명을 인정 → 진짜 원인(시간)으로 재정의 → 소재 발굴 자동화 → 무료 소재 5개 CTA","captionBody":"\"올릴 게 없어서 못 올렸어요.\" SNS 상담에서 가장 많이 듣는 말입니다.\n\n그런데 조금 더 물어보면 거의 항상 이렇게 바뀝니다. \"생각은 나는데, 그걸 정리해서 만들 시간이 없어요.\"\n\n소재가 없는 게 아니라 소재를 찾고 다듬을 시간이 없는 겁니다. 오늘 손님이 물어본 질문, 어제 반품 사유, 지난주에 잘 나간 메뉴 — 전부 콘텐츠인데 그걸 앉아서 글로 바꿀 30분이 없는 거예요.\n\nALWAYS ON(얼웨이즈온)은 그 \"찾는 일\"부터 시작합니다. 업종 검색어와 경쟁 채널을 매일 훑어 이번 주에 말할 거리를 먼저 뽑고, 거기서 기획·제작·발행까지 이어갑니다.\n\n사장님은 \"이건 좋고 이건 빼주세요\"만 하시면 됩니다.\n\n💬 댓글에 \"소재\"라고 남겨주시면 사장님 업종에서 지금 반응 좋은 주제 5개를 뽑아 보내드립니다.\n\n#SNS소재 #소상공인마케팅 #콘텐츠기획 #pslab #문제해결연구소 #ALWAYSON #얼웨이즈온","variant":"A","slideImages":["cards/pslab/reels-08-10-1.png"],"status":"planned","videoFile":"shorts/reels-08-10/reels-08-10.mp4","reelsScript":"[HOOK]\n\"올릴 게 없어서 못 올려요\"\n\n[본론]\n소재가 없는 게 아닙니다.\n찾을 시간이 없는 겁니다.\n\n[CTA]\n찾는 일부터 자동으로 돌립니다."},{"id":"car-08-12","topic":"ALWAYS ON · 한계 공개","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-08-12T09:00:00.000Z","kicker":"ALWAYS ON","headline":"SNS 자동화,\u003cbr>*이건 안 됩니다*","sub":"팔기 전에 못 하는 것부터 말씀드립니다.","dayLabel":"수요일 · 카드뉴스","cardImage":"cards/pslab/car-08-12-1.png","captionNote":"한계 자백으로 신뢰 확보 → 유일한 강점(끊기지 않음)에 집중 → 저장 유도","captionBody":"SNS 자동화 솔루션을 팔면서 \"이건 안 됩니다\"부터 말씀드리는 게 이상해 보이실 수 있습니다.\n\n그런데 기대가 어긋난 채로 시작하면 3개월 안에 해지됩니다. 서로 시간만 버리는 거예요. 그래서 먼저 밝힙니다.\n\n① 오늘 찍은 매장 사진 — 실사는 사장님만 찍을 수 있습니다.\n② 즉흥 대응 — 오늘 터진 이슈에 30분 만에 반응하는 건 사람이 빠릅니다.\n③ 팔로워 즉시 증가 — 노출은 늘지만 숫자는 보통 2~3개월 뒤에 움직입니다.\n\n대신 되는 게 하나 있습니다. **끊기지 않는 것.** 매일 같은 시각에 5개 채널이 돌아갑니다.\n\n고객이 검색했을 때 최근 글이 있는 계정과 3주 멈춘 계정은 완전히 다릅니다. 그 차이를 만드는 게 ALWAYS ON(얼웨이즈온)입니다.\n\n💬 댓글에 \"한계\"라고 남겨주시면 실제 가능 범위를 정리해 보내드립니다.\n\n#SNS자동화 #마케팅자동화 #소상공인마케팅 #pslab #문제해결연구소 #ALWAYSON #얼웨이즈온","variant":"B","slideImages":["cards/pslab/car-08-12-1.png","cards/pslab/car-08-12-2.png","cards/pslab/car-08-12-3.png","cards/pslab/car-08-12-4.png","cards/pslab/car-08-12-5.png","cards/pslab/car-08-12-6.png","cards/pslab/car-08-12-7.png","cards/pslab/car-08-12-8.png","cards/pslab/car-08-12-9.png"],"status":"planned"},{"id":"reels-08-14","topic":"ALWAYS ON · 신뢰 근거(학습 루프)","format":"릴스","channels":["instagram"],"scheduledFor":"2026-08-14T09:00:00.000Z","kicker":"ALWAYS ON","headline":"안 되는 콘텐츠는\u003cbr>*어떻게* 아나","sub":"매주 숫자를 읽고 스스로 고칩니다.","dayLabel":"금요일 · 릴스","cardImage":"cards/pslab/reels-08-14-1.png","captionNote":"품질 의심 정면 대응 → 실측 학습 루프 공개 → 시간이 갈수록 좋아진다는 반전 → 리포트 샘플 CTA","captionBody":"\"자동으로 올리면 품질 관리는 어떻게 하나요?\" 가장 날카로운 질문이라 정확히 답하겠습니다.\n\n발행이 끝이 아닙니다. ALWAYS ON(얼웨이즈온)은 올린 콘텐츠의 실제 숫자를 매주 다시 읽습니다. 조회수, 저장수, 댓글, 유입 검색어까지요.\n\n그리고 반응이 없던 각도는 다음 주 기획에서 빠집니다. 반응이 좋았던 주제·문장 길이·디자인은 비중이 올라갑니다. 사람이 감으로 판단하던 걸 숫자로 하는 겁니다.\n\n그래서 이 시스템은 첫 달보다 셋째 달이 낫습니다. 콘텐츠가 쌓이는 게 아니라 판단 기준이 쌓이는 거예요.\n\n광고와 반대입니다. 광고는 돈을 멈추면 처음으로 돌아가지만, 이건 멈춰도 학습한 게 남습니다.\n\n💬 댓글에 \"학습\"이라고 남겨주시면 실제 주간 리포트 샘플을 보내드립니다.\n\n#SNS자동화 #데이터마케팅 #콘텐츠전략 #pslab #문제해결연구소 #ALWAYSON #얼웨이즈온","variant":"B","slideImages":["cards/pslab/reels-08-14-1.png"],"status":"planned","videoFile":"shorts/reels-08-14/reels-08-14.mp4","reelsScript":"[HOOK]\n자동으로 올리면 품질은요?\n\n[본론]\n매주 조회수와 저장수를 읽습니다.\n반응 없던 각도는 다음 주에 빠집니다.\n\n[CTA]\n쌓일수록 좋아지는 구조입니다."}],"stats":{"publishedCount":3,"pendingCount":16,"avgEngagement":0.03687668661269506,"trend":"up","totalViews":0,"totalLikes":0},"series":[11.06300598380852,0,0]},{"key":"threads","label":"스레드","icon":"🧵","active":true,"published":[],"pending":[{"id":"threads-07-04","topic":"온라인마케팅","format":"스레드(타래)","channels":["threads"],"scheduledFor":"2026-07-04T10:00:00.000Z","kicker":"Threads","headline":"광고비 태우기 전\u003cbr>점검 *3가지*","sub":"짧게 핵심만.","dayLabel":"스레드 · 타래","cardImage":"cards/pslab/threads-07-04-1.png","captionNote":"짧게 핵심만.","captionBody":"광고비, 켜기 전이 90%입니다. 🧵\n\n1) 타겟 — \"누구나\"는 \"아무도\"예요. 한 사람을 그리세요.\n\n2) 소재 — 첫 3초에 멈출 이유가 없으면 돈만 흐릅니다.\n\n3) 랜딩 — 클릭 다음 화면이 약하면 모든 클릭이 비용이에요.\n\n이 셋 맞추기 전에 예산부터 올리면? 적자는 정해진 결과입니다.","variant":"A","slideImages":["cards/pslab/threads-07-04-1.png"],"status":"published","publishedUrl":"https://www.threads.com/@_pslab/post/DaIUz7QGpp_","publishedAt":"2026-06-28T12:46:54.616Z"},{"id":"threads-07-07","topic":"업계비하인드","format":"스레드(타래)","channels":["threads"],"scheduledFor":"2026-07-02T09:00:00.000Z","kicker":"Threads","headline":"대행사가 *안 해주는* 말","sub":"솔직한 비하인드.","dayLabel":"스레드 · 타래","cardImage":"cards/pslab/threads-07-07-1.png","captionNote":"솔직한 비하인드.","captionBody":"대행사가 먼저 안 해주는 것들. 🧵\n\n· 수수료가 매체비의 %인지 고정인지에 따라 이해관계가 달라져요.\n\n· 리포트의 '좋아 보이는 지표'와 '매출 지표'는 다릅니다.\n\n· 계약 전, 누가 뭘 책임지는지 글로 남기세요.\n\n나쁜 대행이라서가 아니라, 안 물으면 굳이 말 안 하는 구조라서요.","variant":"B","slideImages":["cards/pslab/threads-07-07-1.png"],"status":"published","publishedUrl":"https://www.threads.com/@_pslab/post/DaSgRE-IAw4","metrics":{"views":15,"likes":0,"comments":0,"shares":0,"engagementRate":0},"insightComment":"조회 15·좋아요 0. 노출 대비 반응을 키우려면 첫 3초 후킹을 강화하세요.","publishedAt":"2026-07-02T11:39:25.721Z"},{"id":"threads-07-11","topic":"창업인사이트","format":"스레드(타래)","channels":["threads"],"scheduledFor":"2026-07-05T09:00:00.000Z","kicker":"Threads","headline":"돈 없이 마케팅\u003cbr>*가능한가*","sub":"검증부터.","dayLabel":"스레드 · 타래","cardImage":"cards/pslab/threads-07-11-1.png","captionNote":"검증부터.","captionBody":"\"돈 없으면 마케팅 못 하죠\" — 절반만 맞아요. 🧵\n\n돈이 필요한 건 '확장'이고, '검증'은 거의 공짜입니다.\n\n콘텐츠 몇 개, DM 몇 통, 작은 설문으로 \"살 사람이 있는지\"부터 확인하세요.\n\n수요 확인 전에 광고비부터 태우면, 가장 빠르게 망하는 길입니다.\n\n돈은 검증된 다음에 붓는 겁니다.","variant":"C","slideImages":["cards/pslab/threads-07-11-1.png"],"status":"published","publishedUrl":"https://www.threads.com/@_pslab/post/DaaLHIOGybk","metrics":{"views":77,"likes":0,"comments":0,"shares":0,"engagementRate":0},"insightComment":"조회 77·좋아요 0. 노출 대비 반응을 키우려면 첫 3초 후킹을 강화하세요.","publishedAt":"2026-07-05T11:08:27.476Z"},{"id":"threads-07-14","topic":"퍼포먼스마케팅","format":"스레드(타래)","channels":["threads"],"scheduledFor":"2026-07-08T09:00:00.000Z","kicker":"Threads","headline":"클릭은 느는데\u003cbr>매출이 *그대로*","sub":"전환을 보라.","dayLabel":"스레드 · 타래","cardImage":"cards/pslab/threads-07-14-1.png","captionNote":"전환을 보라.","captionBody":"클릭은 느는데 매출은 그대로. 광고 탓일까요? 🧵\n\n대개 아니에요. 클릭은 '관심', 구매는 '확신'.\n\n랜딩 첫 화면 · 가격의 근거 · 후기.\n이 중 하나만 약해도 전환이 무너집니다.\n\n광고를 더 돌리기 전에, 클릭 다음 화면부터 보세요.","variant":"A","slideImages":["cards/pslab/threads-07-14-1.png"],"status":"published","publishedUrl":"https://www.threads.com/@_pslab/post/Dah5rq9nBc_","metrics":{"views":21,"likes":0,"comments":0,"shares":0,"engagementRate":0},"insightComment":"조회 21·좋아요 0. 노출 대비 반응을 키우려면 첫 3초 후킹을 강화하세요.","publishedAt":"2026-07-08T11:10:04.327Z"},{"id":"threads-07-18","topic":"브랜딩","format":"스레드(타래)","channels":["threads"],"scheduledFor":"2026-07-11T09:00:00.000Z","kicker":"Threads","headline":"*‘왜’*를 팔아라","sub":"기억되는 법.","dayLabel":"스레드 · 타래","cardImage":"cards/pslab/threads-07-18-1.png","captionNote":"기억되는 법.","captionBody":"사람은 '무엇'이 아니라 '왜'로 브랜드를 기억해요. 🧵\n\n기능은 경쟁사도 똑같이 말합니다. 차별은 '왜'에서 생겨요.\n\n작은 브랜드일수록 더 그렇습니다 — 자원이 적을수록 메시지가 무기니까.\n\n오늘 우리 브랜드의 '왜'를 한 문장으로 써보세요. 안 써지면, 그게 과제예요.","variant":"B","slideImages":["cards/pslab/threads-07-18-1.png"],"status":"published","publishedUrl":"https://www.threads.com/@_pslab/post/DapiY57GylK","metrics":{"views":48,"likes":1,"comments":0,"shares":0,"engagementRate":0.020833333333333332},"insightComment":"참여율 2.1%로 평균(40.4%)을 밑돌았어요. 첫 슬라이드 후킹과 결론 한 줄을 더 세게, 저장 유도 문구를 명확히 해보세요.","publishedAt":"2026-07-11T10:20:29.407Z"},{"id":"threads-07-31","topic":"ALWAYS ON · 문제 공감(시간 환산)","format":"스레드(타래)","channels":["threads"],"scheduledFor":"2026-07-31T10:00:00.000Z","kicker":"Threads","headline":"채널 5개를\u003cbr>*매일* 돌린다는 것","sub":"월 40시간. 사장님 시간의 값입니다.","dayLabel":"금요일 · 스레드","cardImage":"cards/pslab/threads-07-31-1.png","captionNote":"시간 환산으로 공감 → 구조 문제로 재정의 → 자체 채널이 증거 → 질문 CTA","captionBody":"채널 5개를 매일 돌린다는 게 어떤 일인지, 숫자로 세어봤습니다. 🧵\n\n소재 찾기 20분, 카피 30분, 이미지 40분, 발행·해시태그 15분. 하나 올리는 데 1시간 45분이에요.\n\n주 3회만 잡아도 월 20시간이 넘고, 5채널을 제대로 돌리면 월 40시간입니다. 사장님 시간을 시급으로 환산해보면, 이게 공짜가 아니라는 게 보여요.\n\n그래서 대부분 3개월을 못 넘깁니다. 의지가 부족해서가 아니라, 본업을 하면서 유지할 수 있는 구조가 아니라서요.\n\n저희가 ALWAYS ON(얼웨이즈온)을 만든 이유가 여기 있습니다. 조사·제작·발행·성과 학습을 매일 자동으로 돌려서, 사장님 시간은 본업에 남겨두는 것.\n\n지금 이 글도 그 시스템이 올리고 있어요.\n\n사장님 채널, 마지막 게시물이 언제였나요?\n\n#pslab #문제해결연구소 #ALWAYSON #얼웨이즈온","variant":"B","slideImages":["cards/pslab/threads-07-31-1.png"],"status":"published","publishedUrl":"https://www.threads.com/@_pslab/post/DbdKqnHIO_h","metrics":{"views":22,"likes":1,"comments":0,"shares":0,"engagementRate":0.045454545454545456},"insightComment":"참여율 4.5%로 평균(40.4%)을 밑돌았어요. 첫 슬라이드 후킹과 결론 한 줄을 더 세게, 저장 유도 문구를 명확히 해보세요.","publishedAt":"2026-07-31T11:33:37.893Z"},{"id":"threads-08-03","topic":"ALWAYS ON · 문제 재정의","format":"스레드(타래)","channels":["threads"],"scheduledFor":"2026-08-03T10:00:00.000Z","kicker":"Threads","headline":"작심삼일이\u003cbr>*아니라* 구조","sub":"3개월에서 멈추는 진짜 이유.","dayLabel":"월요일 · 스레드","cardImage":"cards/pslab/threads-08-03-1.png","captionNote":"자책 해제 → 구조론 → 자체 채널 증거 → 질문 CTA","captionBody":"SNS를 3개월 만에 접은 사장님들께 공통점이 하나 있습니다. 🧵\n\n다들 자기 탓을 하세요. \"내가 게을러서\", \"꾸준함이 없어서\".\n\n그런데 16년간 지켜본 결과는 다릅니다. 부지런한 분들도 똑같이 멈춰요. 매일 소재를 찾고 만들고 올리는 일은, 본업이 있는 사람이 감당할 수 있는 총량을 넘습니다.\n\n의지로 버티는 구조는 반드시 무너집니다. 사람이 안 해도 굴러가는 구조여야 오래 갑니다.\n\n저희가 ALWAYS ON(얼웨이즈온)을 만든 이유고, 이 글도 그 시스템이 올리고 있습니다.\n\n혹시 지금 멈춰 있는 채널이 있으신가요?\n\n#pslab #문제해결연구소 #ALWAYSON #얼웨이즈온","variant":"B","slideImages":["cards/pslab/threads-08-03-1.png"],"status":"published","publishedUrl":"https://www.threads.com/@_pslab/post/Dbk0LEbIKlF","metrics":{"views":21,"likes":1,"comments":1,"shares":0,"engagementRate":0.09523809523809523},"insightComment":"참여율 9.5%로 평균(40.4%)을 밑돌았어요. 첫 슬라이드 후킹과 결론 한 줄을 더 세게, 저장 유도 문구를 명확히 해보세요.","publishedAt":"2026-08-03T10:51:01.021Z"},{"id":"threads-08-05","topic":"ALWAYS ON · 도입 절차","format":"스레드(타래)","channels":["threads"],"scheduledFor":"2026-08-05T10:00:00.000Z","kicker":"Threads","headline":"사장님이 하실 일은\u003cbr>*딱 하나*","sub":"7일 세팅 중 검수 한 번.","dayLabel":"수요일 · 스레드","cardImage":"cards/pslab/threads-08-05-1.png","captionNote":"부담 최소화 각도 — 캐러셀과 같은 주제를 '검수 20분'으로 압축","captionBody":"SNS 자동화를 도입할 때 사장님이 실제로 하시는 일은 딱 하나입니다. 🧵\n\n브랜드 분석, 채널 연결, 운영 전략 수립, 콘텐츠 제작, 발행 — 다 저희와 시스템이 합니다.\n\n사장님은 5일차에 올라온 2주치 기획안을 보고 \"이건 좋고, 이건 빼주세요\"만 하시면 돼요. 보통 20분 걸립니다.\n\n자동화의 핵심은 사람을 없애는 게 아니라, 사람이 **판단만** 하게 만드는 겁니다. 만드는 일은 기계가 훨씬 잘하고, 무엇이 우리 브랜드다운지는 사람이 훨씬 잘하니까요.\n\n지금 SNS에 매주 몇 시간 쓰고 계세요?\n\n#pslab #문제해결연구소 #ALWAYSON #얼웨이즈온","variant":"C","slideImages":["cards/pslab/threads-08-05-1.png"],"status":"published","publishedUrl":"https://www.threads.com/@_pslab/post/Dbp9JgDoMv8","metrics":{"views":18,"likes":1,"comments":0,"shares":0,"engagementRate":0.05555555555555555},"insightComment":"참여율 5.6%로 평균(40.4%)을 밑돌았어요. 첫 슬라이드 후킹과 결론 한 줄을 더 세게, 저장 유도 문구를 명확히 해보세요.","publishedAt":"2026-08-05T10:45:42.441Z"},{"id":"threads-08-07","topic":"ALWAYS ON · 신뢰 근거","format":"스레드(타래)","channels":["threads"],"scheduledFor":"2026-08-07T10:00:00.000Z","kicker":"Threads","headline":"업종을 *안 가린다는* 말","sub":"250개를 세어 보고 하는 말입니다.","dayLabel":"금요일 · 스레드","cardImage":"cards/pslab/threads-08-07-1.png","captionNote":"업계 상투어를 자기반성으로 열고 → 실제 숫자로 반박 → 업종보다 순서가 본질 → 질문형 마무리","captionBody":"\"저희는 업종 안 가립니다\" — 대행사들이 흔히 하는 말이죠. 저도 해봤습니다. 🧵\n\n그래서 한번 세어봤어요. 16년 동안 맡은 브랜드가 250곳이 넘더군요.\n\n너무 많아서 최근 5년만 다시 세어봤습니다. 49개였고, 나눠보니 이렇더군요.\n\n패션·럭셔리 16 / 뷰티·헬스 8 / 식음료 7 / B2B·금융 6 / 리테일 3 / 전자·리빙 3 / 키즈 3 / 펫 3.\n\n주얼리도 있고 조명도 있고 펀딩 플랫폼도 있습니다. 처음엔 \"이 업종은 우리가 잘 모르는데\" 싶었던 곳이 더 많았어요.\n\n결국 남은 건 업종 지식이 아니라 순서였습니다. 뭘 먼저 묻고, 뭘 먼저 만들고, 뭘 보고 고치는지. 그 순서는 업종이 달라도 같더라고요.\n\nALWAYS ON은 그 순서를 시스템으로 옮긴 겁니다.\n\n혹시 \"우리 업종은 좀 특수해서\"라고 생각하고 계신가요?\n\n#pslab #문제해결연구소 #ALWAYSON #얼웨이즈온","variant":"B","slideImages":["cards/pslab/threads-08-07-1.png"],"status":"planned"},{"id":"threads-08-10","topic":"ALWAYS ON · 문제 재정의","format":"스레드(타래)","channels":["threads"],"scheduledFor":"2026-08-10T10:00:00.000Z","kicker":"","headline":"소재가 없는 게\u003cbr>*아니었다*","sub":"30분이 없었을 뿐.","dayLabel":"월요일 · 스레드","cardImage":"cards/pslab/threads-08-10-1.png","captionNote":"레퍼런스 학습 적용 — 번호 타래, 한 문장 한 줄, 첫 줄 구체적 숫자(12분), 마지막은 질문형 제안","captionBody":"1. 지난달 상담한 사장님 12분에게 같은 질문을 했습니다.\n2. \"왜 SNS를 멈추셨어요?\"\n3. 11분이 똑같이 답했습니다. \"올릴 게 없어서요.\"\n4. 그래서 다시 물었습니다. \"오늘 손님이 뭐 물어보셨어요?\"\n5. 12분 전원이 5초 안에 답했습니다.\n6. 배송 언제 오냐, 이거 세탁 되냐, 주차 되냐, 재입고 언제냐.\n7. 전부 콘텐츠입니다.\n8. 소재가 없던 게 아니었습니다.\n9. 그걸 앉아서 글과 이미지로 바꿀 30분이 없었을 뿐입니다.\n10. 그리고 그 30분은 앞으로도 안 생깁니다. 본업이 있으니까요.\n\n오늘 손님이 물어본 것, 하나만 떠올려보세요. 그게 이번 주 콘텐츠입니다.\n\n#pslab #문제해결연구소 #ALWAYSON #얼웨이즈온","variant":"A","slideImages":["cards/pslab/threads-08-10-1.png"],"status":"planned"},{"id":"threads-08-12","topic":"ALWAYS ON · 한계 공개","format":"스레드(타래)","channels":["threads"],"scheduledFor":"2026-08-12T10:00:00.000Z","kicker":"","headline":"못 한다고\u003cbr>*먼저 말하는* 쪽","sub":"해지율이 낮습니다.","dayLabel":"수요일 · 스레드","cardImage":"cards/pslab/threads-08-12-1.png","captionNote":"레퍼런스 패턴 적용 — 번호 타래, 6~7번에서 예상 뒤집기, 마지막 질문형","captionBody":"1. 자동화 솔루션 상담에서 제가 제일 먼저 하는 말이 있습니다.\n2. \"이건 안 됩니다.\"\n3. 매장 실사 사진은 못 찍습니다.\n4. 오늘 터진 이슈에 30분 만에 반응하는 것도 사람이 빠릅니다.\n5. 팔로워가 다음 달에 뛰는 일도 없습니다.\n6. 영업할 때 이런 말을 하면 계약이 줄어들 것 같죠.\n7. 실제로는 반대였습니다.\n8. 기대를 정확히 맞춘 쪽이 3개월을 넘깁니다.\n9. 부풀려서 계약한 쪽이 3개월 안에 해지합니다.\n10. 계약을 따내는 것보다 남아 있는 게 어렵더군요.\n\n혹시 마케팅 업체 상담에서 \"못 하는 것\"을 들어보신 적 있으신가요?\n\n#pslab #문제해결연구소 #ALWAYSON #얼웨이즈온","variant":"B","slideImages":["cards/pslab/threads-08-12-1.png"],"status":"planned"},{"id":"threads-08-14","topic":"ALWAYS ON · 신뢰 근거(학습 루프)","format":"스레드(타래)","channels":["threads"],"scheduledFor":"2026-08-14T10:00:00.000Z","kicker":"","headline":"첫 달보다\u003cbr>*셋째 달*이 낫다","sub":"쌓이는 건 콘텐츠가 아니라 기준입니다.","dayLabel":"금요일 · 스레드","cardImage":"cards/pslab/threads-08-14-1.png","captionNote":"레퍼런스 학습을 콘텐츠 소재로 그대로 쓴다 — 실제로 이번 주에 한 일이라 근거가 진짜다","captionBody":"1. 저희 계정 7월 콘텐츠 성적을 다시 읽었습니다.\n2. 조회수 상위 3건과 하위 3건을 놓고 비교했습니다.\n3. 상위 3건은 전부 첫 줄이 숫자나 구체적 상황이었습니다.\n4. 하위 3건은 전부 첫 줄이 형용사였습니다. \"효율적인\", \"강력한\".\n5. 길이도 갈렸습니다. 상위는 한 문장이 짧고 줄바꿈이 많았습니다.\n6. 그래서 8월 기획에서 형용사로 시작하는 후킹을 전부 뺐습니다.\n7. 사람이 감으로 판단하던 걸 숫자로 바꾼 겁니다.\n8. 이게 매주 돌아갑니다.\n9. 그래서 이 계정은 첫 달보다 셋째 달이 낫습니다.\n10. 쌓이는 게 콘텐츠가 아니라 판단 기준이라서요.\n\n혹시 지난달 올린 것 중에 뭐가 제일 반응 좋았는지 기억나시나요?\n\n#pslab #문제해결연구소 #ALWAYSON #얼웨이즈온","variant":"B","slideImages":["cards/pslab/threads-08-14-1.png"],"status":"planned"}],"stats":{"publishedCount":0,"pendingCount":12,"avgEngagement":0,"trend":"n/a","totalViews":0,"totalLikes":0},"series":[]},{"key":"naver-blog","label":"네이버 블로그","icon":"📝","active":true,"published":[],"pending":[{"id":"naver-08-01","topic":"ALWAYS ON · 가치 환산(비용 비교)","format":"naver-blog","channels":["naver-blog"],"scheduledFor":"2026-08-01T02:00:00.000Z","kicker":"Cost","headline":"SNS 대행 비용, 직원 채용, 자동화 시스템 — 1년 기준으로 비교했습니다","sub":"월 얼마가 아니라 1년에 콘텐츠 몇 개가 남는지로 비교해야 합니다. 세 방식의 비용과 산출물을 숫자 그대로 정리했습니다.","dayLabel":"토요일 · 네이버 블로그","cardImage":"cards/pslab/naver-08-01-1.png","captionNote":"검색어(SNS 대행 비용) 정면 대응 + 비교표로 근거 → 무료 진단 CTA","captionBody":"# SNS 대행 비용, 직원 채용, 자동화 시스템 — 1년 기준으로 비교했습니다\n\n> [핵심 요약] 월 비용만 보면 판단이 틀립니다. 1년에 콘텐츠가 몇 개 남고, 그게 검색에 남는 자산인지로 봐야 합니다. 세 가지 방식을 실제 숫자로 비교했습니다.\n\n16년간 광고대행사를 운영하면서 가장 많이 받은 질문이 \"SNS는 대행을 맡기는 게 나을까요, 직원을 뽑는 게 나을까요\"입니다. 답을 드리기 전에, 세 가지 선택지를 같은 기준으로 세워보겠습니다.\n\n## 1. 대행사에 맡기는 경우\n\n채널 하나당 월 80~150만원이 일반적입니다. 인스타그램·유튜브·블로그까지 5채널이면 월 400~500만원 선에서 견적이 나옵니다. 1년이면 5천만원 이상입니다.\n\n산출물은 보통 채널당 월 8~12개. 5채널 기준 1년에 500개 안팎입니다. 문제는 계약이 끝나면 운영이 멈춘다는 점입니다.\n\n## 2. 직원을 채용하는 경우\n\n마케팅 담당자 1명 월 300만원(4대보험·퇴직금 포함 시 약 350만원), 1년이면 4천만원 이상입니다.\n\n여기에 숨은 비용이 붙습니다. 채용에 1~2개월, 교육에 2~3개월. 그리고 퇴사하면 노하우가 함께 나갑니다. 실제로 SNS 담당자의 평균 재직 기간은 2년이 채 안 됩니다.\n\n## 3. 자동화 시스템으로 운영하는 경우\n\nP.S.LAB(문제해결연구소)이 운영하는 ALWAYS ON(얼웨이즈온)은 이 일을 시스템으로 대신합니다.\n\n- **조사**: 검색 트렌드·경쟁사 반응을 매일 수집\n- **제작**: 브랜드 톤에 맞춘 카피·카드뉴스·숏폼 영상 자동 생성\n- **발행**: 5채널에 정해진 시각 자동 게시\n- **학습**: 반응이 좋았던 디자인·주제·시간대를 다음 콘텐츠에 반영\n\n사람이 하는 일은 방향을 정하고 검수하는 것뿐입니다. 월 고정비는 브랜드 상황에 맞게 상담으로 산정합니다.\n\n## 1년 뒤에 무엇이 남는가\n\n| 구분 | 대행사 | 직원 채용 | 자동화 시스템 |\n|---|---|---|---|\n| 1년 비용 | 5,000만원+ | 4,000만원+ | 상담 산정 |\n| 연간 콘텐츠 | 약 500개 | 담당자 역량에 따라 | 약 700개 |\n| 중단 리스크 | 계약 종료 시 정지 | 퇴사 시 공백 | 없음(24시간 가동) |\n| 노하우 축적 | 대행사에 남음 | 담당자와 함께 이동 | 시스템에 축적 |\n\n## 광고비와 콘텐츠 자산의 결정적 차이\n\n광고비는 집행을 멈추는 순간 노출이 0이 됩니다. 반면 쌓인 콘텐츠는 검색과 AI 추천에 계속 남습니다. 요즘은 소비자가 검색창보다 AI에게 먼저 묻습니다. 그때 인용되는 건 광고가 아니라 축적된 콘텐츠입니다.\n\n저희가 이 얘기를 자신 있게 하는 이유는, P.S.LAB 자체 채널을 이 시스템으로 운영하고 있기 때문입니다. 지금 읽고 계신 이 글도 ALWAYS ON이 발행한 글입니다.\n\n## 정리\n\n1. 월 비용이 아니라 **1년 뒤 남는 자산**으로 비교하세요.\n2. 중단 리스크를 반드시 계산에 넣으세요 — 계약 종료, 퇴사, 번아웃.\n3. 노하우가 **우리 쪽에 쌓이는 구조**인지 확인하세요.\n\n어떤 방식이 맞는지는 브랜드 상황에 따라 다릅니다. 판단이 어려우시면 현재 채널 상태를 무료로 진단해 드립니다.\n\n▶ 홈페이지: https://pslab.ai.kr\n▶ 문의: CEO@PSLAB.AI.KR / 010-9929-5736\n\n#SNS대행비용 #SNS마케팅대행 #SNS자동화 #pslab #문제해결연구소 #ALWAYSON #얼웨이즈온 #소상공인마케팅","variant":"A","slideImages":["cards/pslab/naver-08-01-1.png"],"status":"manual"},{"id":"naver-08-04","topic":"ALWAYS ON · 문제 공감(이탈 원인)","format":"naver-blog","channels":["naver-blog"],"scheduledFor":"2026-08-04T02:00:00.000Z","kicker":"Why","headline":"소상공인 SNS 운영, 3개월을 못 넘기는 5가지 이유","sub":"16년간 수백 개 브랜드를 지켜보며 정리한 이탈 패턴과, 각각을 어떻게 풀 수 있는지 정리했습니다.","dayLabel":"화요일 · 네이버 블로그","cardImage":"cards/pslab/naver-08-04-1.png","captionNote":"이탈 원인 5가지 → 각 해법 → 공통 전제 전환으로 솔루션 연결","captionBody":"# 소상공인 SNS 운영, 3개월을 못 넘기는 5가지 이유\n\n> [핵심 요약] 대부분 의지 부족으로 자책하지만, 실제 원인은 구조에 있습니다. 16년간 관찰한 다섯 가지 이탈 패턴과 해법을 정리했습니다.\n\nSNS 마케팅을 시작한 소상공인 열 분 중 일곱 분이 3개월 안에 멈춥니다. 광고대행사를 16년 운영하면서 이 장면을 수없이 봤습니다. 원인은 대체로 다섯 가지입니다.\n\n![영업이 끝난 늦은 밤 가게에 혼자 앉아 휴대폰을 보는 지친 사장님](blog/naver-08-04/photo-1.jpg)\n\n## 1. 소재가 떨어진다\n\n처음 2주는 할 말이 많습니다. 문제는 3주차부터입니다. \"오늘 뭐 올리지\"가 매일 반복되면 그 자체가 스트레스가 됩니다.\n\n**해법**: 소재를 그때그때 떠올리지 말고, 검색 트렌드와 고객 질문에서 자동으로 뽑아내는 구조를 만드세요.\n\n## 2. 시간이 생각보다 훨씬 든다\n\n게시물 하나에 소재 20분, 카피 30분, 이미지 40분, 발행 15분 — 약 1시간 45분입니다. 주 3회면 월 20시간이 넘습니다.\n\n**해법**: 사장님 시간을 시급으로 환산해보세요. 그 금액이 자동화 비용보다 크다면 답은 정해져 있습니다.\n\n![게시물 하나에 드는 시간 — 소재 20분·카피 30분·이미지 40분·발행 15분](blog/naver-08-04/fig-1.png)\n\n## 3. 반응이 없어서 지친다\n\n한 달 올렸는데 좋아요가 5개면 그만두고 싶어집니다. 하지만 SNS는 원래 3~6개월 누적 후에 반응이 붙습니다.\n\n**해법**: 좋아요가 아니라 **누적 콘텐츠 수**를 지표로 삼으세요. 검색에 걸리기 시작하면 흐름이 바뀝니다.\n\n![따뜻한 조명 아래 모래가 흘러내리는 모래시계](blog/naver-08-04/photo-2.jpg)\n\n## 4. 채널마다 다시 만들어야 한다\n\n인스타에 올린 걸 유튜브·블로그에 맞춰 또 만들어야 합니다. 채널이 늘수록 부담이 제곱으로 늘어납니다.\n\n**해법**: 하나의 소재를 채널 특성에 맞게 변환하는 구조를 쓰세요. 예를 들어 릴스 영상은 유튜브 쇼츠로 그대로 재활용할 수 있습니다.\n\n## 5. 담당자가 바뀌면 리셋된다\n\n직원이 하던 일이면 퇴사와 함께 톤도 노하우도 사라집니다. 새 담당자는 처음부터 다시 시작합니다.\n\n**해법**: 노하우가 사람이 아니라 **시스템에 쌓이는 구조**를 선택하세요.\n\n![3개월을 못 넘기는 5가지 이유 체크리스트](blog/naver-08-04/fig-2.png)\n\n## 다섯 가지를 관통하는 한 문장\n\n모두 \"사람이 계속 해야 한다\"는 전제에서 나옵니다. 그 전제를 바꾸면 다섯 가지가 함께 풀립니다.\n\n![사람이 계속 해야 한다 vs 시스템이 계속 한다 비교표](blog/naver-08-04/fig-3.png)\n\nP.S.LAB(문제해결연구소)이 운영하는 ALWAYS ON(얼웨이즈온)은 조사·제작·발행·성과 학습을 매일 자동으로 돌립니다. 사람은 방향을 정하고 검수만 합니다.\n\n![밝은 아침 정돈된 사무실에서 여유 있게 서 있는 사장님](blog/naver-08-04/photo-3.jpg)\n\n저희 채널도 이 시스템으로 운영합니다. 이 글 역시 그 결과물입니다.\n\n![의지의 문제가 아니라 구조의 문제입니다](blog/naver-08-04/fig-4.png)\n\n▶ 홈페이지: https://pslab.ai.kr\n▶ 문의: CEO@PSLAB.AI.KR / 010-9929-5736\n\n#소상공인마케팅 #SNS운영 #SNS자동화 #pslab #문제해결연구소 #ALWAYSON #얼웨이즈온","variant":"A","slideImages":["cards/pslab/naver-08-04-1.png"],"status":"manual"},{"id":"naver-08-11","topic":"ALWAYS ON · 가치 환산(의사결정 기준)","format":"naver-blog","channels":["naver-blog"],"scheduledFor":"2026-08-11T02:00:00.000Z","kicker":"","headline":"SNS 마케팅, 직접 할까 맡길까 — 사장님 상황별 판단 기준 5가지","sub":"매출 규모·인력·업종별로 답이 다릅니다.","dayLabel":"화요일 · 네이버 블로그","cardImage":"cards/pslab/naver-08-11-1.png","captionNote":"검색어 \"sns 마케팅 직접\" \"마케팅 대행 비용\" 정면 대응. 결론을 자동화로 몰지 않고 3분기 제시 → 신뢰 확보","captionBody":"\"SNS 직접 해야 하나요, 맡겨야 하나요.\" 상담에서 절반 이상이 이 질문으로 시작합니다.\n\n정답은 상황마다 다릅니다. 다만 16년 동안 250곳이 넘는 브랜드를 운영하면서 판단 기준은 다섯 가지로 정리됐습니다.\n\n## 1. 월 콘텐츠 개수가 12건을 넘는가\n주 3회(월 12건)가 분기점입니다. 그 아래면 사장님이 직접 하시는 게 낫습니다. 넘어가면 본업이 흔들립니다.\n\n## 2. 콘텐츠 1건에 몇 분 쓰는가\n기획·촬영·편집·업로드를 다 합쳐 재보세요. 평균 1시간 45분입니다. 월 12건이면 21시간, 사장님 시급이 3만원이면 월 63만원입니다.\n\n## 3. 3개월 이상 끊김 없이 유지한 적이 있는가\n없다면 의지 문제가 아니라 구조 문제입니다. 같은 방식으로 다시 시작하면 같은 자리에서 멈춥니다.\n\n## 4. 우리 업종이 검색으로 팔리는가\n검색 유입이 중요한 업종이면 블로그·구글 쪽 비중을 키워야 합니다. 인스타만 해서는 안 잡힙니다.\n\n## 5. 담당 직원을 뽑을 수 있는가\n마케팅 직원 1명은 4대보험 포함 연 4,000만원선입니다. 대행은 월 100~300만원, 자동화는 그 아래입니다.\n\n## 상황별 정리\n- 월 12건 미만 + 검색 비중 낮음 → **직접 운영**\n- 월 12건 이상 + 인력 없음 → **자동화(ALWAYS ON)**\n- 브랜드 캠페인 중심 + 예산 확보 → **대행사**\n\nALWAYS ON(얼웨이즈온)은 인스타그램·네이버 블로그·구글 블로그·스레드·유튜브 5개 채널을 매일 자동 발행합니다. 사장님이 하실 일은 방향 결정과 검수뿐입니다.\n\n어느 쪽이 맞는지 헷갈리시면 현재 채널 상태를 무료로 진단해드립니다.\n\n#SNS마케팅 #마케팅대행 #소상공인마케팅 #pslab #문제해결연구소 #ALWAYSON #얼웨이즈온","variant":"A","slideImages":["cards/pslab/naver-08-11-1.png"],"status":"planned"}],"stats":{"publishedCount":0,"pendingCount":3,"avgEngagement":0,"trend":"n/a","totalViews":0,"totalLikes":0},"series":[]},{"key":"blogger","label":"구글 블로그","icon":"🅱️","active":true,"published":[],"pending":[{"id":"blogger-07-02","topic":"대행사와 3년 일하며 후회한 것, 잘한 것","format":"blogger","channels":["blogger"],"scheduledFor":"2026-07-03T09:00:00.000Z","kicker":"Agency","headline":"대행사와 3년 일하며 후회한 것, 잘한 것","sub":"결론부터: 대행사는 \"맡기는 것\"이 아니라 \"같이 운영하는 것\"입니다. 통째로 맡기면 반드시 후회합니다.","dayLabel":"구글 블로그","cardImage":"cards/pslab/blogger-07-02-1.png","captionNote":"결론부터: 대행사는 \"맡기는 것\"이 아니라 \"같이 운영하는 것\"입니다. 통째로 맡기면 반드시 후회합니다.","captionBody":"# 대행사와 3년 일하며 후회한 것, 잘한 것\n> [핵심 요약] 결론부터: 대행사는 \"맡기는 것\"이 아니라 \"같이 운영하는 것\"입니다. 통째로 맡기면 반드시 후회합니다.\n\n제안서 비교만 하던 시절엔 늘 실패했습니다. 방식을 바꾸고 나서야 대행이 일하기 시작했죠. 직접 겪은 후회 둘, 잘한 셋을 풉니다.\n\n## 후회 1 — \"알아서 해주세요\"라고 맡긴 것\n브랜드를 가장 잘 아는 건 결국 우리입니다. 방향을 안 주면 대행사는 무난한 평균값으로 갑니다. 결과는 \"나쁘진 않은데 아무것도 아닌\" 광고였습니다.\n![후회 1 — \"알아서 해주세요\"라고 맡긴 것](https://leejiho-pslab.github.io/pslab/blog/blogger-07-02/fig-1.png)\n\n## 후회 2 — 매주 숫자를 안 본 것\n한 달에 한 번 보고만 받으니, 안 되는 소재에 3주를 버렸습니다. 대시보드를 같이 보기 시작한 뒤로 낭비가 절반으로 줄었습니다.\n![후회 2 — 매주 숫자를 안 본 것](https://leejiho-pslab.github.io/pslab/blog/blogger-07-02/fig-2.png)\n\n## 잘한 1 — 소재 아이디어를 우리가 던진 것\n현장의 고객 질문, 후기, 반품 사유 — 이게 최고의 광고 소재입니다. 대행사는 이걸 모릅니다. 우리가 소재를 던지고 대행사가 다듬자 반응이 올랐습니다.\n![잘한 1 — 소재 아이디어를 우리가 던진 것](https://leejiho-pslab.github.io/pslab/blog/blogger-07-02/fig-3.png)\n\n## 잘한 2 — 역할을 문서로 나눈 것\n\"누가 무엇을, 언제까지\"를 한 장으로 정리했습니다. 책임이 분명해지자 핑퐁이 사라졌죠.\n![잘한 2 — 역할을 문서로 나눈 것](https://leejiho-pslab.github.io/pslab/blog/blogger-07-02/fig-4.png)\n\n## 자주 묻는 질문\n**Q. 대행사를 바꿔야 할 신호는?**\n3개월 연속 같은 변명, 매출 언어 부재, 담당자 잦은 교체 — 셋 중 둘이면 교체를 검토하세요.\n\n**Q. 소액인데 같이 운영이 가능한가요?**\n오히려 소액일수록 우리가 소재를 주도해야 효율이 납니다.\n\n대행을 통째로 맡기지 마세요. 방향은 우리가, 실행은 대행사가 — 이 경계가 성과를 만듭니다.\n\n🔖 태그: #광고대행사 #마케팅 #협업 #성과관리","variant":"A","slideImages":["cards/pslab/blogger-07-02-1.png"],"status":"published","publishedUrl":"https://pslab2026.blogspot.com/2026/06/3.html","metrics":{"views":0,"likes":0,"comments":0,"shares":0,"engagementRate":0},"insightComment":"조회 0·좋아요 0. 노출 대비 반응을 키우려면 첫 3초 후킹을 강화하세요.","publishedAt":"2026-06-30T02:24:22.852Z"},{"id":"blogger-07-09","topic":"전환율을 두 배로 올린 랜딩페이지 점검표","format":"blogger","channels":["blogger"],"scheduledFor":"2026-07-03T09:00:00.000Z","kicker":"Landing","headline":"전환율을 두 배로 올린 랜딩페이지 점검표","sub":"광고를 안 바꾸고 페이지만 고쳐 전환율을 2배로 올린 적이 있습니다. 그때 쓴 점검표를 공개합니다.","dayLabel":"구글 블로그","cardImage":"cards/pslab/blogger-07-09-1.png","captionNote":"광고를 안 바꾸고 페이지만 고쳐 전환율을 2배로 올린 적이 있습니다. 그때 쓴 점검표를 공개합니다.","captionBody":"# 전환율을 두 배로 올린 랜딩페이지 점검표\n> [핵심 요약] 광고를 안 바꾸고 페이지만 고쳐 전환율을 2배로 올린 적이 있습니다. 그때 쓴 점검표를 공개합니다.\n\n소재를 아무리 바꿔도 매출이 안 늘던 브랜드가 있었습니다. 광고는 그대로 두고 페이지만 9곳 고쳤더니 전환율이 두 배가 됐죠.\n\n## 히어로 영역: 한 문장으로 끝내라\n맨 위 한 문장이 \"무엇을, 누구에게, 왜 좋은지\"를 못 담으면 아래는 안 읽힙니다. 형용사 말고 숫자와 결과로 쓰세요.\n![히어로 영역: 한 문장으로 끝내라](https://leejiho-pslab.github.io/pslab/blog/blogger-07-09/fig-1.png)\n\n## 증거를 위로 올려라\n후기·인증·수상·판매수를 페이지 하단에 묻어두지 마세요. 첫 화면 바로 아래로 올리면 신뢰가 빨라집니다.\n![증거를 위로 올려라](https://leejiho-pslab.github.io/pslab/blog/blogger-07-09/fig-2.png)\n\n## CTA는 한 가지만\n\"구매·상담·뉴스레터\" 세 개를 동시에 권하면 아무것도 안 누릅니다. 페이지마다 행동 하나로 좁히세요.\n![CTA는 한 가지만](https://leejiho-pslab.github.io/pslab/blog/blogger-07-09/fig-3.png)\n\n## 모바일에서 다시 보라\n트래픽의 80%는 모바일입니다. 데스크톱에서 멀쩡해도 모바일에서 버튼이 접히거나 글자가 작으면 거기서 매출이 샙니다.\n![모바일에서 다시 보라](https://leejiho-pslab.github.io/pslab/blog/blogger-07-09/fig-4.png)\n\n## 자주 묻는 질문\n**Q. 몇 개를 한 번에 바꿔야 하나요?**\n한 번에 하나씩 바꿔 A/B로 검증하는 게 정석이지만, 트래픽이 적으면 묶어서 크게 바꾸고 추세를 보세요.\n\n**Q. 전환율은 어디서 보나요?**\nGA4·네이버 애널리틱스의 구매전환 이벤트로 단계별 이탈을 봅니다.\n\n광고를 더 만지기 전에 이 점검표로 페이지부터 고치세요. 가장 싸게 매출을 올리는 방법입니다.\n\n🔖 태그: #랜딩페이지 #전환율 #CRO #상세페이지","variant":"B","slideImages":["cards/pslab/blogger-07-09-1.png"],"status":"published","publishedUrl":"https://pslab2026.blogspot.com/2026/07/blog-post.html","metrics":{"views":0,"likes":0,"comments":0,"shares":0,"engagementRate":0},"insightComment":"조회 0·좋아요 0. 노출 대비 반응을 키우려면 첫 3초 후킹을 강화하세요.","publishedAt":"2026-07-03T11:37:58.921Z"},{"id":"blogger-07-16","topic":"작은 브랜드가 대기업과 '다르게' 싸우는 4가지 방법","format":"blogger","channels":["blogger"],"scheduledFor":"2026-07-06T09:00:00.000Z","kicker":"Strategy","headline":"작은 브랜드가 대기업과 '다르게' 싸우는 4가지 방법","sub":"대기업과 같은 방식으로 싸우면 집니다. 작을 때만 쓸 수 있는 무기 네 가지로 판을 바꾸세요.","dayLabel":"구글 블로그","cardImage":"cards/pslab/blogger-07-16-1.png","captionNote":"대기업과 같은 방식으로 싸우면 집니다. 작을 때만 쓸 수 있는 무기 네 가지로 판을 바꾸세요.","captionBody":"# 작은 브랜드가 대기업과 '다르게' 싸우는 4가지 방법\n> [핵심 요약] 대기업과 같은 방식으로 싸우면 집니다. 작을 때만 쓸 수 있는 무기 네 가지로 판을 바꾸세요.\n\n예산도 인력도 밀리는데 같은 운동장에서 싸우면 당연히 집니다. 작을 때만 가능한 방식이 따로 있습니다.\n\n## 1. 속도로 싸운다\n대기업은 의사결정이 느립니다. 우리는 오늘 본 트렌드를 내일 콘텐츠로 만들 수 있죠. 시의성은 작은 브랜드의 가장 큰 무기입니다.\n![1. 속도로 싸운다](https://leejiho-pslab.github.io/pslab/blog/blogger-07-16/fig-1.png)\n\n## 2. 좁은 시장 1등을 노린다\n전체 시장 10등보다, 좁은 카테고리 1등이 훨씬 강합니다. \"○○ 하면 이 브랜드\"가 되는 한 칸을 먼저 차지하세요.\n![2. 좁은 시장 1등을 노린다](https://leejiho-pslab.github.io/pslab/blog/blogger-07-16/fig-2.png)\n\n## 3. 얼굴을 보여준다\n대기업은 브랜드 뒤에 숨지만, 작은 브랜드는 사람이 앞에 설 수 있습니다. 창업자·직원의 얼굴과 과정이 곧 차별화입니다.\n![3. 얼굴을 보여준다](https://leejiho-pslab.github.io/pslab/blog/blogger-07-16/fig-3.png)\n\n## 4. 팬을 만든다\n100만 명에게 한 번 보이는 것보다, 1,000명이 매번 사주고 소문내는 게 강합니다. 작은 브랜드는 도달이 아니라 관계로 큽니다.\n![4. 팬을 만든다](https://leejiho-pslab.github.io/pslab/blog/blogger-07-16/fig-4.png)\n\n## 자주 묻는 질문\n**Q. 좁히면 시장이 너무 작지 않나요?**\n처음엔 좁게 1등 → 인접 카테고리로 확장이 정석입니다. 넓게 시작해 망하는 경우가 더 많습니다.\n\n**Q. 얼굴 노출이 부담스러워요.**\n꼭 대표가 아니어도 됩니다. 과정·손·작업 현장만 보여도 사람 냄새가 납니다.\n\n대기업의 방식을 따라 하지 마세요. 속도·집중·사람·관계 — 작을 때만 쓸 수 있는 무기로 싸우세요.\n\n🔖 태그: #스몰브랜드 #마케팅전략 #포지셔닝 #차별화","variant":"C","slideImages":["cards/pslab/blogger-07-16-1.png"],"status":"published","publishedUrl":"https://pslab2026.blogspot.com/2026/07/4.html","metrics":{"views":0,"likes":0,"comments":0,"shares":0,"engagementRate":0},"insightComment":"조회 0·좋아요 0. 노출 대비 반응을 키우려면 첫 3초 후킹을 강화하세요.","publishedAt":"2026-07-06T12:54:54.333Z"},{"id":"blogger-07-23","topic":"월 100만원으로 시작하는 광고, 이렇게 나눴습니다","format":"blogger","channels":["blogger"],"scheduledFor":"2026-07-09T09:00:00.000Z","kicker":"Budget","headline":"월 100만원으로 시작하는 광고, 이렇게 나눴습니다","sub":"예산이 적을수록 분산은 독입니다. 월 100만원을 실제로 어떻게 쪼갰는지, 숫자 그대로 공개합니다.","dayLabel":"구글 블로그","cardImage":"cards/pslab/blogger-07-23-1.png","captionNote":"예산이 적을수록 분산은 독입니다. 월 100만원을 실제로 어떻게 쪼갰는지, 숫자 그대로 공개합니다.","captionBody":"# 월 100만원으로 시작하는 광고, 이렇게 나눴습니다\n> [핵심 요약] 예산이 적을수록 분산은 독입니다. 월 100만원을 실제로 어떻게 쪼갰는지, 숫자 그대로 공개합니다.\n\n\"예산이 적은데 어디에 써야 하나요?\"—가장 많이 받는 질문입니다. 월 100만원 기준, 제가 실제로 굴리는 방식입니다.\n\n## 먼저 70만원: 한 채널만 판다\n소액일수록 채널을 늘리면 안 됩니다. 우리 고객이 가장 많은 한 곳에 70만원을 몰아 데이터를 빨리 모으세요.\n![먼저 70만원: 한 채널만 판다](https://leejiho-pslab.github.io/pslab/blog/blogger-07-23/fig-1.png)\n\n## 20만원: 소재 실험에만 쓴다\n같은 채널 안에서 소재 3~4종을 20만원으로 돌립니다. 승자 소재를 찾으면 70만원이 더 잘 돕니다.\n![20만원: 소재 실험에만 쓴다](https://leejiho-pslab.github.io/pslab/blog/blogger-07-23/fig-2.png)\n\n## 10만원: 콘텐츠/후기 자산에 쓴다\n광고만으론 한계가 있습니다. 10만원은 후기 확보, 콘텐츠 제작 같은 \"쌓이는 자산\"에 투자하세요. 광고가 꺼져도 남습니다.\n![10만원: 콘텐츠/후기 자산에 쓴다](https://leejiho-pslab.github.io/pslab/blog/blogger-07-23/fig-3.png)\n\n## 석 달 뒤 숫자로 다시 정한다\n100만원을 3개월 돌리면 어디가 효율적인지 보입니다. 그때 비율을 키우거나 채널을 바꾸세요. 처음 배분은 가설일 뿐입니다.\n![석 달 뒤 숫자로 다시 정한다](https://leejiho-pslab.github.io/pslab/blog/blogger-07-23/fig-4.png)\n\n## 자주 묻는 질문\n**Q. 100만원도 안 되면요?**\n50만원이면 채널 하나 + 소재 실험만 하세요. 자산 투자는 매출이 나면 시작해도 늦지 않습니다.\n\n**Q. 어느 채널부터 시작할까요?**\n고객이 검색으로 오면 검색광고, 발견으로 오면 인스타·메타부터 테스트하세요.\n\n적은 예산일수록 \"나누지 말고 몰아주세요.\" 한 채널에서 이기는 공식을 먼저 찾는 게 순서입니다.\n\n🔖 태그: #소액광고 #광고예산 #스타트업마케팅 #예산배분","variant":"A","slideImages":["cards/pslab/blogger-07-23-1.png"],"status":"published","publishedUrl":"https://pslab2026.blogspot.com/2026/07/100.html","metrics":{"views":0,"likes":0,"comments":0,"shares":0,"engagementRate":0},"insightComment":"조회 0·좋아요 0. 노출 대비 반응을 키우려면 첫 3초 후킹을 강화하세요.","publishedAt":"2026-07-09T12:21:59.335Z"},{"id":"blogger-08-02","topic":"ALWAYS ON · 작동 원리","format":"blogger","channels":["blogger"],"scheduledFor":"2026-08-02T02:00:00.000Z","kicker":"System","headline":"매일 자동으로 콘텐츠가 올라간다는 게 실제로 어떻게 가능한가","sub":"ALWAYS ON의 네 단계 루프 — 조사, 제작, 발행, 학습. 사람이 개입하는 지점까지 그대로 공개합니다.","dayLabel":"일요일 · 구글 블로그","cardImage":"cards/pslab/blogger-08-02-1.png","captionNote":"4단계 구조를 표·목록으로 정리해 AI 인용 가능성 확보 → 자체 채널이 증거","captionBody":"# 매일 자동으로 콘텐츠가 올라간다는 게 실제로 어떻게 가능한가\n\n> [핵심 요약] ALWAYS ON은 조사 → 제작 → 발행 → 학습의 네 단계가 매일 자동으로 도는 시스템입니다. 사람은 방향 설정과 검수만 합니다. 이 글은 그 구조를 그대로 공개합니다.\n\n\"자동으로 올라간다\"는 말은 흔합니다. 문제는 대부분 예약 발행을 자동화라고 부른다는 점입니다. 미리 만들어둔 걸 정해진 시각에 올리는 건 타이머지 시스템이 아닙니다.\n\nP.S.LAB(문제해결연구소)이 운영하는 ALWAYS ON(얼웨이즈온)은 **만드는 일부터** 자동입니다. 어떻게 도는지 단계별로 설명하겠습니다.\n\n## 1단계 — 조사: 오늘 무엇을 말할지 정한다\n\n매일 검색 트렌드, 업종 키워드, 경쟁 계정의 반응 데이터를 수집합니다. 여기서 \"지금 이 브랜드가 말했을 때 가장 반응이 좋을 소재\"에 점수를 매겨 순위를 만듭니다.\n\n브랜드가 미리 등록해 둔 우선 주제가 있으면 그것이 먼저 올라갑니다. 시스템이 마음대로 소재를 고르는 게 아니라, 방향은 사람이 정합니다.\n\n## 2단계 — 제작: 브랜드 톤으로 만든다\n\n선정된 소재를 채널 특성에 맞게 변환합니다.\n\n- **인스타그램**: 후킹 카피 + 카드뉴스 이미지 또는 15초 릴스\n- **유튜브**: 같은 영상을 쇼츠로 재활용 (제작비 추가 없이 노출만 확장)\n- **스레드**: 대화형 짧은 글\n- **블로그**: 검색 유입을 노린 롱폼\n\n여기서 중요한 건 **브랜드 톤**입니다. 시스템은 브랜드 분석·방향성·감도를 기록한 브랜드 노트를 매번 참조합니다. 담당자가 \"이런 톤은 피해달라\"고 적으면 그 지시가 AI의 학습 메모보다 우선 적용됩니다.\n\n이미지의 한글 텍스트는 AI 이미지 생성이 아니라 웹 렌더링으로 만듭니다. AI로 한글을 그리면 글자가 깨지기 때문입니다. 이런 디테일이 완성도를 가릅니다.\n\n## 3단계 — 발행: 정해진 시각에 다섯 채널로\n\n인스타그램, 유튜브, 스레드, 구글 블로그는 API로 자동 게시됩니다. 네이버 블로그는 공식 발행 API가 없어 본문과 이미지를 준비해두고 담당자가 붙여넣는 방식입니다. 안 되는 걸 된다고 하지 않습니다.\n\n발행에 실패하면 즉시 알림이 갑니다. 조용히 멈춰 있는 상황을 막기 위해서입니다.\n\n## 4단계 — 학습: 다음 콘텐츠가 더 나아진다\n\n발행된 게시물의 실제 반응(조회·좋아요·댓글)을 수집해 집계합니다.\n\n- 어떤 **디자인**이 반응이 좋았는가\n- 어떤 **주제**가 멀리 갔는가\n- 어떤 **시간대**가 유리한가\n\n이 결과가 다음 기획에 반영됩니다. 반응이 떨어지면 구도와 톤을 바꿔 새로운 방향을 탐색합니다. 쌓일수록 그 브랜드에 맞게 정교해지는 구조입니다.\n\n여기서 원칙이 하나 있습니다. **추정치를 쓰지 않습니다.** 실제 API로 측정된 값만 학습에 넣습니다. 가짜 숫자가 섞이면 시스템은 엉뚱한 방향으로 학습합니다.\n\n## 사람이 하는 일은 무엇인가\n\n자동화가 사람을 없애는 게 아닙니다. 사람이 할 일이 바뀝니다.\n\n| 사람이 하는 일 | 시스템이 하는 일 |\n|---|---|\n| 브랜드 방향 정의 | 매일 소재 조사 |\n| 기획안 검수 | 카피·이미지·영상 제작 |\n| 디자인 피드백 | 5채널 발행 |\n| 최종 판단 | 성과 수집·학습 |\n\n사장님은 한 달에 몇 번 대시보드를 열어 \"이건 좋고 이건 바꿔주세요\"만 하시면 됩니다.\n\n## 왜 1년에 700개가 중요한가\n\n5채널을 매일 돌리면 1년에 약 700개의 콘텐츠가 쌓입니다. 광고비는 멈추면 노출이 사라지지만, 이 700개는 검색 결과와 AI 답변에 계속 남습니다.\n\n생성형 AI가 브랜드에 대해 답할 때 인용하는 건 광고가 아니라 축적된 콘텐츠입니다. 지금 쌓는 콘텐츠가 앞으로 AI가 우리 브랜드를 설명하는 근거가 됩니다.\n\n## 이 글도 시스템이 썼습니다\n\n가장 확실한 증거는 저희 채널입니다. P.S.LAB의 인스타그램·유튜브·스레드·블로그는 모두 ALWAYS ON이 운영합니다. 지금 읽고 계신 이 글도 그 결과물입니다.\n\n16년차 광고대행사가 자기 채널로 먼저 검증한 시스템을 제공합니다.\n\n▶ 자세히 보기: https://pslab.ai.kr/always-on\n▶ 문의: CEO@PSLAB.AI.KR\n\n#pslab #문제해결연구소 #ALWAYSON #얼웨이즈온 #SNS자동화 #콘텐츠마케팅","variant":"A","slideImages":["cards/pslab/blogger-08-02-1.png"],"status":"published","publishedUrl":"https://pslab2026.blogspot.com/2026/08/blog-post.html","metrics":{"views":0,"likes":0,"comments":0,"shares":0,"engagementRate":0},"insightComment":"조회 0·좋아요 0. 노출 대비 반응을 키우려면 첫 3초 후킹을 강화하세요.","publishedAt":"2026-08-02T10:45:09.394Z"},{"id":"blogger-08-06","topic":"ALWAYS ON · 콘텐츠 자산","format":"blogger","channels":["blogger"],"scheduledFor":"2026-08-06T02:00:00.000Z","kicker":"Asset","headline":"광고비는 사라지고 콘텐츠는 남는다 — AI 검색 시대의 계산법","sub":"1년에 콘텐츠 700개가 쌓이면 무엇이 달라지는지, 검색과 생성형 AI 관점에서 정리했습니다.","dayLabel":"목요일 · 구글 블로그","cardImage":"cards/pslab/blogger-08-06-1.png","captionNote":"광고 vs 콘텐츠 대비 → GEO 개념 → 인용 조건 표 → 꾸준함=자동화 연결","captionBody":"# 광고비는 사라지고 콘텐츠는 남는다 — AI 검색 시대의 계산법\n\n> [핵심 요약] 광고는 집행을 멈추면 노출이 0이 됩니다. 콘텐츠는 검색과 AI 답변에 계속 남습니다. 1년에 700개가 쌓였을 때 무엇이 달라지는지 계산해봤습니다.\n\n광고비를 쓰는 것과 콘텐츠를 쌓는 것은 회계상 둘 다 비용이지만, 성격이 완전히 다릅니다. 16년간 양쪽을 모두 집행해 본 입장에서 그 차이를 정리하겠습니다.\n\n## 광고비: 켜면 나오고 끄면 사라진다\n\n월 300만원을 광고에 쓰면 그 달은 노출이 나옵니다. 다음 달에 예산을 끊으면 노출은 그날로 0입니다. 1년을 집행해도 **남는 자산이 없습니다**.\n\n광고가 나쁘다는 뜻이 아닙니다. 즉시 매출이 필요할 때는 광고가 가장 빠릅니다. 다만 그것만으로는 자산이 쌓이지 않습니다.\n\n## 콘텐츠: 한 번 만들면 계속 일한다\n\n1년 전에 쓴 블로그 글이 지금도 검색으로 사람을 데려옵니다. 2년 전 릴스가 아직도 조회수가 올라갑니다. 한 번 만든 콘텐츠는 지워지지 않는 한 계속 노출됩니다.\n\n5채널을 매일 운영하면 1년에 약 700개가 쌓입니다. 이 700개는 세 가지 방식으로 계속 일합니다.\n\n1. **검색 노출** — 네이버·구글에서 관련 검색어에 걸립니다\n2. **채널 신뢰** — 방문자가 \"이 브랜드는 살아있구나\"를 확인합니다\n3. **AI 인용** — 생성형 AI가 브랜드를 설명할 때 근거로 씁니다\n\n## 세 번째가 지금 가장 중요합니다\n\n소비자 행동이 바뀌고 있습니다. 예전에는 검색창에 먼저 쳤지만, 지금은 AI에게 먼저 묻습니다. \"○○ 업종에서 괜찮은 업체 추천해줘\"라고요.\n\n이때 AI가 참고하는 건 **웹에 축적된 텍스트**입니다. 광고는 학습 대상이 아닙니다. 블로그 글, SNS 게시물, 소개 페이지 — 쌓아둔 콘텐츠가 근거가 됩니다.\n\n이걸 GEO(Generative Engine Optimization, 생성형 검색 최적화)라고 부릅니다. SEO가 검색엔진을 위한 최적화였다면, GEO는 AI가 인용하기 좋게 만드는 일입니다.\n\n## AI가 인용하기 좋은 콘텐츠의 조건\n\n| 조건 | 이유 |\n|---|---|\n| 명확한 소제목 구조 | AI가 문서의 논리를 파악하기 쉬움 |\n| 숫자·비교표 | 인용 가치가 높은 구체 정보 |\n| 일관된 브랜드 표기 | 여러 문서가 같은 주체로 연결됨 |\n| 꾸준한 발행 | 최신성이 확보되어 우선 참조됨 |\n\n마지막 조건이 핵심입니다. 아무리 잘 써도 3개월 만에 멈추면 최신성을 잃습니다. **꾸준함 자체가 최적화**인 셈입니다.\n\n## 그래서 자동화가 필요합니다\n\n위 조건을 사람이 매일 지키는 건 불가능에 가깝습니다. P.S.LAB(문제해결연구소)이 운영하는 ALWAYS ON(얼웨이즈온)은 이 일을 시스템으로 대신합니다.\n\n매일 5채널에 브랜드 톤으로 콘텐츠가 발행되고, 반응을 학습해 다음 콘텐츠가 더 좋아집니다. 1년이면 700개의 자산이 남습니다.\n\n지금 이 글도 그 시스템이 발행한 글입니다. 16년차 광고대행사가 자기 채널로 먼저 검증한 방식입니다.\n\n▶ 자세히 보기: https://pslab.ai.kr/always-on\n▶ 문의: CEO@PSLAB.AI.KR\n\n#콘텐츠자산 #GEO #AI검색 #SNS자동화 #pslab #문제해결연구소 #ALWAYSON #얼웨이즈온","variant":"A","slideImages":["cards/pslab/blogger-08-06-1.png"],"status":"planned"},{"id":"blogger-08-13","topic":"ALWAYS ON · 콘텐츠 자산(GEO)","format":"blogger","channels":["blogger"],"scheduledFor":"2026-08-13T02:00:00.000Z","kicker":"","headline":"AI 검색이 인용하는 글은 뭐가 다른가 — 우리 브랜드가 답변에 들어가는 조건","sub":"GEO(생성형 검색 최적화) 관점에서 문서 구조를 뜯어봅니다.","dayLabel":"목요일 · 구글 블로그","cardImage":"cards/pslab/blogger-08-13-1.png","captionNote":"GEO 구조 관점 롱폼. 8/6(광고비 vs 자산 계산법)과 달리 \"어떻게 써야 인용되는가\"라는 방법론으로 각도 분리","captionBody":"고객이 검색창 대신 AI에게 묻기 시작했습니다. \"○○지역에서 △△ 잘하는 곳 추천해줘.\"\n\nAI는 답변을 만들 때 웹 문서를 읽고 그중 일부를 인용합니다. 우리 브랜드가 그 인용에 들어가느냐 마느냐가 새로운 노출 싸움입니다. 이걸 GEO(Generative Engine Optimization)라고 부릅니다.\n\n## 기존 SEO와 무엇이 다른가\n기존 검색은 **순위**를 다퉜습니다. 10개 링크 중 몇 번째냐의 싸움이었죠. AI 검색은 **인용**을 다툽니다. 답변 안에 우리 문장이 들어가거나, 아예 안 들어가거나 둘 중 하나입니다.\n\n## AI가 인용하기 좋은 문서의 조건 4가지\n\n### 1. 질문 형태의 제목\n\"우리 서비스 소개\"보다 \"○○ 비용은 얼마인가요\"가 인용됩니다. AI는 질문에 답하는 중이라, 질문 모양의 문서를 먼저 집습니다.\n\n### 2. 한 문단에 하나의 사실\n긴 문단은 통째로 버려집니다. 인용 단위는 문단이라서, 한 문단에 주장 하나 + 근거 하나가 들어가야 잘려 나갑니다.\n\n### 3. 구체적인 숫자와 조건\n\"저렴합니다\"는 인용되지 않습니다. \"월 12건 기준 63만원\"은 인용됩니다. 검증 가능한 값이 있어야 AI가 근거로 씁니다.\n\n### 4. 정의 문장이 있을 것\n\"ALWAYS ON은 5개 채널을 매일 자동 발행하는 SNS 자동화 솔루션입니다\" — 이런 한 줄 정의가 문서 앞쪽에 있으면 AI가 브랜드를 설명할 때 그대로 가져다 씁니다.\n\n## 광고와 결정적으로 다른 점\n광고는 돈을 멈추면 노출도 멈춥니다. 문서는 남습니다. 한 번 잘 쓴 글이 AI 답변에 계속 인용되면, 그건 매달 비용을 내지 않는 노출입니다.\n\n다만 조건이 있습니다. **문서가 꾸준히 쌓여 있어야** 합니다. 3개월 쓰다 멈춘 블로그는 인용 후보에서 밀립니다.\n\n## 그래서 자동화가 필요한 지점\nALWAYS ON(얼웨이즈온)은 이 조건에 맞춘 글을 매일 자동으로 씁니다. 질문형 제목, 문단당 하나의 사실, 구체적 숫자, 브랜드 정의 문장 — 이 네 가지를 템플릿이 아니라 규칙으로 지킵니다.\n\n검색 방식이 바뀌는 중입니다. 광고비는 사라지고 문서는 남습니다.\n\n#GEO #생성형검색최적화 #AI검색 #콘텐츠마케팅 #pslab #문제해결연구소 #ALWAYSON #얼웨이즈온","variant":"A","slideImages":["cards/pslab/blogger-08-13-1.png"],"status":"planned"}],"stats":{"publishedCount":0,"pendingCount":7,"avgEngagement":0,"trend":"n/a","totalViews":0,"totalLikes":0},"series":[]},{"key":"youtube","label":"유튜브","icon":"▶️","active":true,"published":[],"pending":[{"id":"youtube-07-05","topic":"광고대행","format":"쇼츠 대본","channels":["youtube"],"scheduledFor":"2026-07-03T09:00:00.000Z","kicker":"Shorts","headline":"광고비 *날리는* 사장님 특징","sub":"30초 쇼츠.","dayLabel":"유튜브 · 쇼츠","cardImage":"cards/pslab/youtube-07-05-1.png","captionNote":"30초 쇼츠.","captionBody":"[HOOK · 0~3초]\n광고비 날리는 사장님들, 공통점이 있어요.\n\n[본론 · 3~25초]\n켜기 전 준비를 안 합니다.\n- 타겟이 \"누구나\" — 그럼 아무에게도 안 닿아요.\n- 소재가 평 d":"sensibility","excerpt":"차분한 전문가 톤, 딥네이비+오렌지 포인트"},{"at":"2026-07-26T09:40:16.563Z","field":"direction","excerpt":"새 홈페이지(pslab.ai.kr)·ALWAYS ON 소개서 반영 — 콘텐츠 자산·고객여정·GEO·지속발행·시스템 축으로 전면 개편"},{"at":"2026-07-26T10:15:24.811Z","field":"direction","excerpt":"주3회(월수금) 인스타 체제 전환 — ALWAYS ON 설명·설득 중심, 릴스2+캐러셀1, 첫 장 강한 훅"}]},"channelGuides":{"instagram":{"topics":["광고비 점검","랜딩페이지 전환"],"guide":"당신은 인스타그램 바이럴 콘텐츠 기획 전문가로 기획&제작할 것\n사용자가 입력한 키워드를 기반으로 조회수 100만 회 이상을 목표로 하는 캐러셀 콘텐츠를 기획할 것\n\n아래 조건을 반드시 준수할 것\n\n기본 구성\n\n- 캐러셀은 총 6~10장으로 구성합니다.\n- 첫 장 좁은 타겟을 위한 강력한 후킹 문구\n- 첫장은 표지로 구성 (중앙에 큰 제목)\n- 중간 장표는 깔끔한 설명글이 메인으로 하되 핵심 정리,전달이 잘 되어야 함\n- 마지막 장은 중앙에 cta문구\n- 조회수 100만 회 이상을 기대할 수 있는 이유가 반영되어야 함\n- 저장·공유·댓글을 유도하는 포인트\n\n공통 조건\n\n- 첫 번째 슬라이드에는 3초 안에 시선을 사로잡는 강력한 후킹 문구를 포함하세요.\n- 한 장에는 하나의 메세지만 담고 중요 메세지는 강조해주세요. 가독성이 좋아야 합니다.\n- 서체는 TDTD롱고딕서체를 사용해 주세요\n- 저장, 공유, 댓글을 자연스럽게 유도하는 요소를 반드시 넣으세요.\n- 실제 인스타그램에서 반응이 좋은 콘텐츠 구조를 활용하세요.\n- 추상적인 표현은 사용하지 말고, 구체적인 상황과 메시지를 제시하세요.\n- 사람들의 감정(불안, 욕망, 공감, 충격, 호기심)을 자극하는 방향으로 설계하세요.\n- 최신 인스타그램 콘텐츠 트렌드를 반영하세요.\n- 흔하거나 식상한 아이디어는 제외하고, 실제로 높은 반응을 기대할 수 있는 기획만 제안하세요.\n- 카드뉴스 사이즈: 1080 X 1350\n\n언어 작성 규칙\n\n캐러셀 내부에 표시되는 모든 텍스트는 자연스럽고 읽기 쉬운 한국어로 작성하세요.\n다음과 같은 표현은 사용하지 마세요.\n\n- 영어 제목 또는 영어 소제목\n- 영어 라벨 및 UI 문구\n- 자리 표시용 문구(예: Lorem Ipsum)\n- 의미 없는 문자나 기호의 나열\n- 읽기 어려운 가짜 텍스트\n- 한국어와 영어가 혼합된 표현\n\n단, 사용자가 직접 입력한 브랜드명, 제품명, 서비스명, 프로그램명, 도구명 또는 번역이 적절하지 않은 고유명사에 한해서만 원문 표기를 사용할 수 있습니다.\n그 외의 모든 제목, 본문, 버튼 문구, 캡션 및 설명은 자연스러운 한국어로 작성하세요.\n목표는 사용자가 별도의 수정 없이 바로 게시할 수 있을 정도의 완성도 높은 한국어와 디자인능력으로 캐러셀을 제작하는 것입니다.\n\n── 캡션 톤 (운영자 지시, 2026-07-16 · 이슈 #57) ──────────────────────────\n캡션·멘션은 전체적으로 더 고급스럽게. 싸구려로 읽히는 표현을 걷어낸다.\n\n- 과장 감탄사·낚시 금지: \"대박\", \"충격\", \"미쳤다\", \"???\", 느낌표 연발\n- 이모지는 의미가 있을 때만 1~2개. 줄마다 붙이지 않는다\n- 단정적 평서문으로 짧게 끊는다. 형용사보다 숫자·상황을 앞에 둔다\n- 해시태그는 본문과 한 줄 띄우고 끝에 모아 붙인다. 본문 중간 삽입 금지\n- 상투어 금지: \"지금 바로\", \"놓치지 마세요\", \"필수템\"\n- 존댓말이되 군더더기 없이. 사장님을 설득하는 자리이지 광고 카피가 아니다","updatedAt":"2026-08-03T06:25:21.319Z"},"youtube":{"topics":["ALWAYS ON 작
