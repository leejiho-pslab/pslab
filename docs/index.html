"shares":0,"engagementRate":0.6666666666666666},"insightComment":"참여율 66.7%로 평균(40.4%)을 웃돌았어요. 디자인 A안·결론 우선 구조가 먹힌 것으로 보입니다 — 다음에도 같은 톤을 유지하세요.","publishedAt":"2026-06-29T12:19:41.176Z"},{"id":"threads-07-07","topic":"업계비하인드","format":"스레드(타래)","channels":["threads"],"scheduledFor":"2026-07-02T09:00:00.000Z","kicker":"Threads","headline":"대행사가 *안 해주는* 말","sub":"솔직한 비하인드.","dayLabel":"스레드 · 타래","cardImage":"cards/pslab/threads-07-07-1.png","captionNote":"솔직한 비하인드.","captionBody":"대행사가 먼저 안 해주는 것들. 🧵\n\n· 수수료가 매체비의 %인지 고정인지에 따라 이해관계가 달라져요.\n\n· 리포트의 '좋아 보이는 지표'와 '매출 지표'는 다릅니다.\n\n· 계약 전, 누가 뭘 책임지는지 글로 남기세요.\n\n나쁜 대행이라서가 아니라, 안 물으면 굳이 말 안 하는 구조라서요.","variant":"B","slideImages":["cards/pslab/threads-07-07-1.png"],"status":"published","publishedUrl":"https://www.threads.com/@_pslab/post/DaSgRE-IAw4","metrics":{"views":15,"likes":0,"comments":0,"shares":0,"engagementRate":0},"insightComment":"조회 15·좋아요 0. 노출 대비 반응을 키우려면 첫 3초 후킹을 강화하세요.","publishedAt":"2026-07-02T11:39:25.721Z"},{"id":"youtube-07-05","topic":"광고대행","format":"쇼츠 대본","channels":["youtube"],"scheduledFor":"2026-07-03T09:00:00.000Z","kicker":"Shorts","headline":"광고비 *날리는* 사장님 특징","sub":"30초 쇼츠.","dayLabel":"유튜브 · 쇼츠","cardImage":"cards/pslab/youtube-07-05-1.png","captionNote":"30초 쇼츠.","captionBody":"[HOOK · 0~3초]\n광고비 날리는 사장님들, 공통점이 있어요.\n\n[본론 · 3~25초]\n켜기 전 준비를 안 합니다.\n- 타겟이 \"누구나\" — 그럼 아무에게도 안 닿아요.\n- 소재가 평범 — 첫 3초에 멈출 이유가 없죠.\n- 랜딩이 부실 — 클릭해도 안 삽니다.\n이 셋 안 맞으면, 예산 올릴수록 적자예요.\n\n[CTA · 25~30초]\n켜기 전 이 3개부터. 저장해두세요.","variant":"A","slideImages":["cards/pslab/youtube-07-05-1.png"],"status":"published","publishedUrl":"https://youtu.be/ulDu8KIb_0Y","metrics":{"views":146,"likes":0,"comments":0,"shares":0,"engagementRate":0},"insightComment":"조회 146·좋아요 0. 노출 대비 반응을 키우려면 첫 3초 후킹을 강화하세요.","publishedAt":"2026-07-03T11:37:56.889Z","videoFile":"shorts/youtube-07-05/youtube-07-05.mp4","ytTitle":"광고비 날리는 사장님 3가지 특징｜광고 켜기 전 필수 점검 #shorts","ytDescription":"광고비를 태우기 전에 이 3가지부터 점검하세요. 타겟·소재·랜딩페이지가 안 맞으면 예산을 올릴수록 적자입니다.\n\n✅ 이 영상에서 다루는 것\n· 광고 타겟을 \"누구나\"로 잡으면 안 되는 이유\n· 첫 3초에 멈추게 하는 광고 소재\n· 클릭 후 전환을 막는 랜딩페이지 문제\n\n소상공인·자영업 사장님, 광고대행을 맡기기 전 직접 점검하고 싶은 분께 추천합니다.\n\n📌 더 많은 실전 마케팅 인사이트 → @_pslab\n👍 도움이 됐다면 구독과 저장!\n\n#광고비 #소상공인마케팅 #퍼포먼스마케팅 #광고대행 #온라인마케팅 #마케팅전략 #자영업 #창업 #shorts","ytTags":["광고비 절약","소상공인 마케팅","퍼포먼스 마케팅","광고 타겟팅","상세페이지","광고대행사","온라인마케팅","마케팅 전략","자영업 광고","창업 마케팅"]},{"id":"blogger-07-02","topic":"대행사와 3년 일하며 후회한 것, 잘한 것","format":"blogger","channels":["blogger"],"scheduledFor":"2026-07-03T09:00:00.000Z","kicker":"Agency","headline":"대행사와 3년 일하며 후회한 것, 잘한 것","sub":"결론부터: 대행사는 \"맡기는 것\"이 아니라 \"같이 운영하는 것\"입니다. 통째로 맡기면 반드시 후회합니다.","dayLabel":"구글 블로그","cardImage":"cards/pslab/blogger-07-02-1.png","captionNote":"결론부터: 대행사는 \"맡기는 것\"이 아니라 \"같이 운영하는 것\"입니다. 통째로 맡기면 반드시 후회합니다.","captionBody":"# 대행사와 3년 일하며 후회한 것, 잘한 것\n> [핵심 요약] 결론부터: 대행사는 \"맡기는 것\"이 아니라 \"같이 운영하는 것\"입니다. 통째로 맡기면 반드시 후회합니다.\n\n제안서 비교만 하던 시절엔 늘 실패했습니다. 방식을 바꾸고 나서야 대행이 일하기 시작했죠. 직접 겪은 후회 둘, 잘한 셋을 풉니다.\n\n## 후회 1 — \"알아서 해주세요\"라고 맡긴 것\n브랜드를 가장 잘 아는 건 결국 우리입니다. 방향을 안 주면 대행사는 무난한 평균값으로 갑니다. 결과는 \"나쁘진 않은데 아무것도 아닌\" 광고였습니다.\n![후회 1 — \"알아서 해주세요\"라고 맡긴 것](https://leejiho-pslab.github.io/pslab/blog/blogger-07-02/fig-1.png)\n\n## 후회 2 — 매주 숫자를 안 본 것\n한 달에 한 번 보고만 받으니, 안 되는 소재에 3주를 버렸습니다. 대시보드를 같이 보기 시작한 뒤로 낭비가 절반으로 줄었습니다.\n![후회 2 — 매주 숫자를 안 본 것](https://leejiho-pslab.github.io/pslab/blog/blogger-07-02/fig-2.png)\n\n## 잘한 1 — 소재 아이디어를 우리가 던진 것\n현장의 고객 질문, 후기, 반품 사유 — 이게 최고의 광고 소재입니다. 대행사는 이걸 모릅니다. 우리가 소재를 던지고 대행사가 다듬자 반응이 올랐습니다.\n![잘한 1 — 소재 아이디어를 우리가 던진 것](https://leejiho-pslab.github.io/pslab/blog/blogger-07-02/fig-3.png)\n\n## 잘한 2 — 역할을 문서로 나눈 것\n\"누가 무엇을, 언제까지\"를 한 장으로 정리했습니다. 책임이 분명해지자 핑퐁이 사라졌죠.\n![잘한 2 — 역할을 문서로 나눈 것](https://leejiho-pslab.github.io/pslab/blog/blogger-07-02/fig-4.png)\n\n## 자주 묻는 질문\n**Q. 대행사를 바꿔야 할 신호는?**\n3개월 연속 같은 변명, 매출 언어 부재, 담당자 잦은 교체 — 셋 중 둘이면 교체를 검토하세요.\n\n**Q. 소액인데 같이 운영이 가능한가요?**\n오히려 소액일수록 우리가 소재를 주도해야 효율이 납니다.\n\n대행을 통째로 맡기지 마세요. 방향은 우리가, 실행은 대행사가 — 이 경계가 성과를 만듭니다.\n\n🔖 태그: #광고대행사 #마케팅 #협업 #성과관리","variant":"A","slideImages":["cards/pslab/blogger-07-02-1.png"],"status":"published","publishedUrl":"https://pslab2026.blogspot.com/2026/06/3.html","metrics":{"views":0,"likes":0,"comments":0,"shares":0,"engagementRate":0},"insightComment":"조회 0·좋아요 0. 노출 대비 반응을 키우려면 첫 3초 후킹을 강화하세요.","publishedAt":"2026-06-30T02:24:22.852Z"},{"id":"blogger-07-09","topic":"전환율을 두 배로 올린 랜딩페이지 점검표","format":"blogger","channels":["blogger"],"scheduledFor":"2026-07-03T09:00:00.000Z","kicker":"Landing","headline":"전환율을 두 배로 올린 랜딩페이지 점검표","sub":"광고를 안 바꾸고 페이지만 고쳐 전환율을 2배로 올린 적이 있습니다. 그때 쓴 점검표를 공개합니다.","dayLabel":"구글 블로그","cardImage":"cards/pslab/blogger-07-09-1.png","captionNote":"광고를 안 바꾸고 페이지만 고쳐 전환율을 2배로 올린 적이 있습니다. 그때 쓴 점검표를 공개합니다.","captionBody":"# 전환율을 두 배로 올린 랜딩페이지 점검표\n> [핵심 요약] 광고를 안 바꾸고 페이지만 고쳐 전환율을 2배로 올린 적이 있습니다. 그때 쓴 점검표를 공개합니다.\n\n소재를 아무리 바꿔도 매출이 안 늘던 브랜드가 있었습니다. 광고는 그대로 두고 페이지만 9곳 고쳤더니 전환율이 두 배가 됐죠.\n\n## 히어로 영역: 한 문장으로 끝내라\n맨 위 한 문장이 \"무엇을, 누구에게, 왜 좋은지\"를 못 담으면 아래는 안 읽힙니다. 형용사 말고 숫자와 결과로 쓰세요.\n![히어로 영역: 한 문장으로 끝내라](https://leejiho-pslab.github.io/pslab/blog/blogger-07-09/fig-1.png)\n\n## 증거를 위로 올려라\n후기·인증·수상·판매수를 페이지 하단에 묻어두지 마세요. 첫 화면 바로 아래로 올리면 신뢰가 빨라집니다.\n![증거를 위로 올려라](https://leejiho-pslab.github.io/pslab/blog/blogger-07-09/fig-2.png)\n\n## CTA는 한 가지만\n\"구매·상담·뉴스레터\" 세 개를 동시에 권하면 아무것도 안 누릅니다. 페이지마다 행동 하나로 좁히세요.\n![CTA는 한 가지만](https://leejiho-pslab.github.io/pslab/blog/blogger-07-09/fig-3.png)\n\n## 모바일에서 다시 보라\n트래픽의 80%는 모바일입니다. 데스크톱에서 멀쩡해도 모바일에서 버튼이 접히거나 글자가 작으면 거기서 매출이 샙니다.\n![모바일에서 다시 보라](https://leejiho-pslab.github.io/pslab/blog/blogger-07-09/fig-4.png)\n\n## 자주 묻는 질문\n**Q. 몇 개를 한 번에 바꿔야 하나요?**\n한 번에 하나씩 바꿔 A/B로 검증하는 게 정석이지만, 트래픽이 적으면 묶어서 크게 바꾸고 추세를 보세요.\n\n**Q. 전환율은 어디서 보나요?**\nGA4·네이버 애널리틱스의 구매전환 이벤트로 단계별 이탈을 봅니다.\n\n광고를 더 만지기 전에 이 점검표로 페이지부터 고치세요. 가장 싸게 매출을 올리는 방법입니다.\n\n🔖 태그: #랜딩페이지 #전환율 #CRO #상세페이지","variant":"B","slideImages":["cards/pslab/blogger-07-09-1.png"],"status":"published","publishedUrl":"https://pslab2026.blogspot.com/2026/07/blog-post.html","metrics":{"views":0,"likes":0,"comments":0,"shares":0,"engagementRate":0},"insightComment":"조회 0·좋아요 0. 노출 대비 반응을 키우려면 첫 3초 후킹을 강화하세요.","publishedAt":"2026-07-03T11:37:58.921Z"},{"id":"w2-mon","topic":"마케팅전략","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-07-04T09:00:00.000Z","kicker":"Decision","headline":"이 광고, 꺼야 할까?\u003cbr>판단하는 *숫자 하나*","sub":"감으로 끄지 마세요. 손익분기 한 줄 계산법.","dayLabel":"월요일 · 의사결정","cardImage":"cards/pslab/w2-mon-1.png","captionNote":"감으로 끄지 마세요. 손익분기 한 줄 계산법.","captionBody":"“이 광고 꺼야 하나, 더 둬야 하나” 감으로 정하지 마세요.\n\n판단은 숫자 하나로 충분합니다 — 손익분기 CPA.\n(객단가 × 마진율)이 허용 CPA입니다. 실제 CPA가 이걸 넘으면, 켤수록 적자.\n\n예) 객단가 5만 × 마진 40% = 허용 CPA 2만원. 지금 3만이면? 끄거나 고치세요.\n감이 아니라 선이 결정합니다.\n\n#퍼포먼스마케팅 #마케팅전략 #광고대행","variant":"B","slideImages":["cards/pslab/w2-mon-1.png","cards/pslab/w2-mon-2.png","cards/pslab/w2-mon-3.png","cards/pslab/w2-mon-4.png","cards/pslab/w2-mon-5.png"],"status":"published","publishedUrl":"https://www.instagram.com/p/DaXlHvkjzDc/","metrics":{"views":3,"likes":1,"comments":0,"shares":0,"engagementRate":0.3333333333333333},"insightComment":"참여율 33.3%로 평균(40.4%)을 밑돌았어요. 첫 슬라이드 후킹과 결론 한 줄을 더 세게, 저장 유도 문구를 명확히 해보세요.","publishedAt":"2026-07-04T10:57:58.853Z"},{"id":"threads-07-04","topic":"온라인마케팅","format":"스레드(타래)","channels":["threads"],"scheduledFor":"2026-07-04T10:00:00.000Z","kicker":"Threads","headline":"광고비 태우기 전\u003cbr>점검 *3가지*","sub":"짧게 핵심만.","dayLabel":"스레드 · 타래","cardImage":"cards/pslab/threads-07-04-1.png","captionNote":"짧게 핵심만.","captionBody":"광고비, 켜기 전이 90%입니다. 🧵\n\n1) 타겟 — \"누구나\"는 \"아무도\"예요. 한 사람을 그리세요.\n\n2) 소재 — 첫 3초에 멈출 이유가 없으면 돈만 흐릅니다.\n\n3) 랜딩 — 클릭 다음 화면이 약하면 모든 클릭이 비용이에요.\n\n이 셋 맞추기 전에 예산부터 올리면? 적자는 정해진 결과입니다.","variant":"A","slideImages":["cards/pslab/threads-07-04-1.png"],"status":"published","publishedUrl":"https://www.threads.com/@_pslab/post/DaIUz7QGpp_","publishedAt":"2026-06-28T12:46:54.616Z"},{"id":"threads-07-11","topic":"창업인사이트","format":"스레드(타래)","channels":["threads"],"scheduledFor":"2026-07-05T09:00:00.000Z","kicker":"Threads","headline":"돈 없이 마케팅\u003cbr>*가능한가*","sub":"검증부터.","dayLabel":"스레드 · 타래","cardImage":"cards/pslab/threads-07-11-1.png","captionNote":"검증부터.","captionBody":"\"돈 없으면 마케팅 못 하죠\" — 절반만 맞아요. 🧵\n\n돈이 필요한 건 '확장'이고, '검증'은 거의 공짜입니다.\n\n콘텐츠 몇 개, DM 몇 통, 작은 설문으로 \"살 사람이 있는지\"부터 확인하세요.\n\n수요 확인 전에 광고비부터 태우면, 가장 빠르게 망하는 길입니다.\n\n돈은 검증된 다음에 붓는 겁니다.","variant":"C","slideImages":["cards/pslab/threads-07-11-1.png"],"status":"published","publishedUrl":"https://www.threads.com/@_pslab/post/DaaLHIOGybk","metrics":{"views":77,"likes":0,"comments":0,"shares":0,"engagementRate":0},"insightComment":"조회 77·좋아요 0. 노출 대비 반응을 키우려면 첫 3초 후킹을 강화하세요.","publishedAt":"2026-07-05T11:08:27.476Z"},{"id":"youtube-07-12","topic":"마케팅전략","format":"쇼츠 대본","channels":["youtube"],"scheduledFor":"2026-07-06T09:00:00.000Z","kicker":"Shorts","headline":"이 광고 *꺼야 할까*?","sub":"숫자 하나로 판단.","dayLabel":"유튜브 · 쇼츠","cardImage":"cards/pslab/youtube-07-12-1.png","captionNote":"숫자 하나로 판단.","captionBody":"[HOOK]\n\"이 광고 꺼야 하나, 더 둬야 하나?\" 감으로 정하지 마세요.\n\n[본론]\n숫자 하나면 됩니다. 손익분기 CPA.\n객단가 곱하기 마진율. 그게 허용 CPA예요.\n객단가 5만, 마진 40%면 → 2만원.\n지금 전환당 3만원? 끄거나 고치세요.\n\n[CTA]\n감이 아니라 산수입니다. 계산해 보세요.","variant":"B","slideImages":["cards/pslab/youtube-07-12-1.png"],"status":"published","publishedUrl":"https://youtu.be/43G-r4KHvUs","metrics":{"views":8,"likes":1,"comments":1,"shares":0,"engagementRate":0.25},"insightComment":"참여율 25.0%로 평균(40.4%)을 밑돌았어요. 첫 슬라이드 후킹과 결론 한 줄을 더 세게, 저장 유도 문구를 명확히 해보세요.","publishedAt":"2026-07-06T12:54:52.581Z","videoFile":"shorts/youtube-07-12/youtube-07-12.mp4","ytTitle":"광고 끌까 말까? 숫자 하나로 정하세요｜손익분기 CPA 계산법 #shorts","ytDescription":"\"이 광고 꺼야 하나, 더 둬야 하나?\" 감으로 정하지 마세요. 손익분기 CPA 하나면 됩니다.\n\n✅ 허용 CPA = 객단가 × 마진율\n예) 객단가 5만원 × 마진 40% = 2만원\n전환당 3만원이면? 끄거나 고치세요.\n\n광고 효율(ROAS)이 헷갈리는 사장님, 광고를 감이 아니라 숫자로 판단하고 싶은 분께.\n\n📌 실전 광고 운영 노하우 → @_pslab\n👍 도움이 됐다면 구독!\n\n#CPA #ROAS #광고효율 #퍼포먼스마케팅 #광고비 #손익분기 #온라인마케팅 #마케팅전략 #shorts","ytTags":["손익분기 CPA","ROAS","광고 효율","퍼포먼스 마케팅","광고비 계산","객단가 마진율","광고 끄는 기준","온라인마케팅","광고 최적화","마케팅 전략"]},{"id":"blogger-07-16","topic":"작은 브랜드가 대기업과 '다르게' 싸우는 4가지 방법","format":"blogger","channels":["blogger"],"scheduledFor":"2026-07-06T09:00:00.000Z","kicker":"Strategy","headline":"작은 브랜드가 대기업과 '다르게' 싸우는 4가지 방법","sub":"대기업과 같은 방식으로 싸우면 집니다. 작을 때만 쓸 수 있는 무기 네 가지로 판을 바꾸세요.","dayLabel":"구글 블로그","cardImage":"cards/pslab/blogger-07-16-1.png","captionNote":"대기업과 같은 방식으로 싸우면 집니다. 작을 때만 쓸 수 있는 무기 네 가지로 판을 바꾸세요.","captionBody":"# 작은 브랜드가 대기업과 '다르게' 싸우는 4가지 방법\n> [핵심 요약] 대기업과 같은 방식으로 싸우면 집니다. 작을 때만 쓸 수 있는 무기 네 가지로 판을 바꾸세요.\n\n예산도 인력도 밀리는데 같은 운동장에서 싸우면 당연히 집니다. 작을 때만 가능한 방식이 따로 있습니다.\n\n## 1. 속도로 싸운다\n대기업은 의사결정이 느립니다. 우리는 오늘 본 트렌드를 내일 콘텐츠로 만들 수 있죠. 시의성은 작은 브랜드의 가장 큰 무기입니다.\n![1. 속도로 싸운다](https://leejiho-pslab.github.io/pslab/blog/blogger-07-16/fig-1.png)\n\n## 2. 좁은 시장 1등을 노린다\n전체 시장 10등보다, 좁은 카테고리 1등이 훨씬 강합니다. \"○○ 하면 이 브랜드\"가 되는 한 칸을 먼저 차지하세요.\n![2. 좁은 시장 1등을 노린다](https://leejiho-pslab.github.io/pslab/blog/blogger-07-16/fig-2.png)\n\n## 3. 얼굴을 보여준다\n대기업은 브랜드 뒤에 숨지만, 작은 브랜드는 사람이 앞에 설 수 있습니다. 창업자·직원의 얼굴과 과정이 곧 차별화입니다.\n![3. 얼굴을 보여준다](https://leejiho-pslab.github.io/pslab/blog/blogger-07-16/fig-3.png)\n\n## 4. 팬을 만든다\n100만 명에게 한 번 보이는 것보다, 1,000명이 매번 사주고 소문내는 게 강합니다. 작은 브랜드는 도달이 아니라 관계로 큽니다.\n![4. 팬을 만든다](https://leejiho-pslab.github.io/pslab/blog/blogger-07-16/fig-4.png)\n\n## 자주 묻는 질문\n**Q. 좁히면 시장이 너무 작지 않나요?**\n처음엔 좁게 1등 → 인접 카테고리로 확장이 정석입니다. 넓게 시작해 망하는 경우가 더 많습니다.\n\n**Q. 얼굴 노출이 부담스러워요.**\n꼭 대표가 아니어도 됩니다. 과정·손·작업 현장만 보여도 사람 냄새가 납니다.\n\n대기업의 방식을 따라 하지 마세요. 속도·집중·사람·관계 — 작을 때만 쓸 수 있는 무기로 싸우세요.\n\n🔖 태그: #스몰브랜드 #마케팅전략 #포지셔닝 #차별화","variant":"C","slideImages":["cards/pslab/blogger-07-16-1.png"],"status":"published","publishedUrl":"https://pslab2026.blogspot.com/2026/07/4.html","metrics":{"views":0,"likes":0,"comments":0,"shares":0,"engagementRate":0},"insightComment":"조회 0·좋아요 0. 노출 대비 반응을 키우려면 첫 3초 후킹을 강화하세요.","publishedAt":"2026-07-06T12:54:54.333Z"},{"id":"w2-wed","topic":"퍼포먼스마케팅","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-07-07T09:00:00.000Z","kicker":"Ad Ops","headline":"클릭은 느는데\u003cbr>매출이 *안 느는 이유*","sub":"클릭은 구매가 아닙니다. 전환이 새는 지점.","dayLabel":"수요일 · 광고운영","cardImage":"cards/pslab/w2-wed-1.png","captionNote":"클릭은 구매가 아닙니다. 전환이 새는 지점.","captionBody":"클릭은 느는데 매출은 그대로. 광고가 문제일까요?\n\n대개 아닙니다. 클릭은 “관심”이고 구매는 “확신”이에요. 둘 사이에서 새는 겁니다.\n랜딩의 첫 화면, 가격을 납득시키는 근거, 후기 같은 신뢰 장치 —\n이 중 하나만 약해도 클릭은 비용으로 끝납니다.\n\n광고를 더 돌리기 전에, 클릭 다음 화면부터 점검하세요.\n\n#퍼포먼스마케팅 #온라인마케팅 #전환율","variant":"B","slideImages":["cards/pslab/w2-wed-1.png","cards/pslab/w2-wed-2.png","cards/pslab/w2-wed-3.png","cards/pslab/w2-wed-4.png","cards/pslab/w2-wed-5.png"],"status":"published","publishedUrl":"https://www.instagram.com/p/DafckBAmnn9/","metrics":{"views":4,"likes":1,"comments":0,"shares":0,"engagementRate":0.25},"insightComment":"참여율 25.0%로 평균(40.4%)을 밑돌았어요. 첫 슬라이드 후킹과 결론 한 줄을 더 세게, 저장 유도 문구를 명확히 해보세요.","publishedAt":"2026-07-07T12:17:07.179Z"},{"id":"threads-07-14","topic":"퍼포먼스마케팅","format":"스레드(타래)","channels":["threads"],"scheduledFor":"2026-07-08T09:00:00.000Z","kicker":"Threads","headline":"클릭은 느는데\u003cbr>매출이 *그대로*","sub":"전환을 보라.","dayLabel":"스레드 · 타래","cardImage":"cards/pslab/threads-07-14-1.png","captionNote":"전환을 보라.","captionBody":"클릭은 느는데 매출은 그대로. 광고 탓일까요? 🧵\n\n대개 아니에요. 클릭은 '관심', 구매는 '확신'.\n\n랜딩 첫 화면 · 가격의 근거 · 후기.\n이 중 하나만 약해도 전환이 무너집니다.\n\n광고를 더 돌리기 전에, 클릭 다음 화면부터 보세요.","variant":"A","slideImages":["cards/pslab/threads-07-14-1.png"],"status":"published","publishedUrl":"https://www.threads.com/@_pslab/post/Dah5rq9nBc_","metrics":{"views":21,"likes":0,"comments":0,"shares":0,"engagementRate":0},"insightComment":"조회 21·좋아요 0. 노출 대비 반응을 키우려면 첫 3초 후킹을 강화하세요.","publishedAt":"2026-07-08T11:10:04.327Z"},{"id":"youtube-07-19","topic":"브랜딩","format":"쇼츠 대본","channels":["youtube"],"scheduledFor":"2026-07-09T09:00:00.000Z","kicker":"Shorts","headline":"작은 브랜드가 *이기는* 법","sub":"왜를 팔아라.","dayLabel":"유튜브 · 쇼츠","cardImage":"cards/pslab/youtube-07-19-1.png","captionNote":"왜를 팔아라.","captionBody":"[HOOK]\n작은 브랜드가 대기업을 이기는 유일한 방법.\n\n[본론]\n'무엇'으로 싸우지 마세요. 더 싸게, 더 많이는 못 이겨요.\n'왜'를 파세요.\n사람은 기능이 아니라 이유를 기억합니다.\n\"이 사람들은 왜 이걸 만들까\" — 거기에 답이 있으면 선택받아요.\n\n[CTA]\n우리 브랜드의 '왜', 한 문장으로 적어보세요.","variant":"C","slideImages":["cards/pslab/youtube-07-19-1.png"],"status":"published","publishedUrl":"https://youtu.be/rTEmo9xwl0o","metrics":{"views":218,"likes":1,"comments":0,"shares":0,"engagementRate":0.0045871559633027525},"insightComment":"참여율 0.5%로 평균(40.4%)을 밑돌았어요. 첫 슬라이드 후킹과 결론 한 줄을 더 세게, 저장 유도 문구를 명확히 해보세요.","publishedAt":"2026-07-09T12:21:57.879Z","videoFile":"shorts/youtube-07-19/youtube-07-19.mp4","ytTitle":"작은 브랜드가 대기업을 이기는 유일한 방법｜브랜딩의 핵심 #shorts","ytDescription":"작은 브랜드가 대기업을 이기는 방법은 '무엇'이 아니라 '왜'를 파는 것입니다.\n\n✅ 기능·가격으로 싸우면 집니다\n✅ 사람은 기능이 아니라 '이유'를 기억합니다\n✅ \"왜 이걸 만드는가\"에 답이 있으면 선택받습니다\n\n스몰브랜드·1인 창업·자영업 브랜딩을 고민하는 분께.\n\n📌 브랜딩·성장 인사이트 → @_pslab\n👍 도움이 됐다면 구독!\n\n#브랜딩 #스몰브랜드 #포지셔닝 #마케팅전략 #창업 #브랜드차별화 #온라인마케팅 #shorts","ytTags":["브랜딩","스몰브랜드","포지셔닝","브랜드 차별화","작은 브랜드 마케팅","창업 브랜딩","마케팅 전략","why 마케팅","온라인마케팅","브랜드 스토리"]},{"id":"blogger-07-23","topic":"월 100만원으로 시작하는 광고, 이렇게 나눴습니다","format":"blogger","channels":["blogger"],"scheduledFor":"2026-07-09T09:00:00.000Z","kicker":"Budget","headline":"월 100만원으로 시작하는 광고, 이렇게 나눴습니다","sub":"예산이 적을수록 분산은 독입니다. 월 100만원을 실제로 어떻게 쪼갰는지, 숫자 그대로 공개합니다.","dayLabel":"구글 블로그","cardImage":"cards/pslab/blogger-07-23-1.png","captionNote":"예산이 적을수록 분산은 독입니다. 월 100만원을 실제로 어떻게 쪼갰는지, 숫자 그대로 공개합니다.","captionBody":"# 월 100만원으로 시작하는 광고, 이렇게 나눴습니다\n> [핵심 요약] 예산이 적을수록 분산은 독입니다. 월 100만원을 실제로 어떻게 쪼갰는지, 숫자 그대로 공개합니다.\n\n\"예산이 적은데 어디에 써야 하나요?\"—가장 많이 받는 질문입니다. 월 100만원 기준, 제가 실제로 굴리는 방식입니다.\n\n## 먼저 70만원: 한 채널만 판다\n소액일수록 채널을 늘리면 안 됩니다. 우리 고객이 가장 많은 한 곳에 70만원을 몰아 데이터를 빨리 모으세요.\n![먼저 70만원: 한 채널만 판다](https://leejiho-pslab.github.io/pslab/blog/blogger-07-23/fig-1.png)\n\n## 20만원: 소재 실험에만 쓴다\n같은 채널 안에서 소재 3~4종을 20만원으로 돌립니다. 승자 소재를 찾으면 70만원이 더 잘 돕니다.\n![20만원: 소재 실험에만 쓴다](https://leejiho-pslab.github.io/pslab/blog/blogger-07-23/fig-2.png)\n\n## 10만원: 콘텐츠/후기 자산에 쓴다\n광고만으론 한계가 있습니다. 10만원은 후기 확보, 콘텐츠 제작 같은 \"쌓이는 자산\"에 투자하세요. 광고가 꺼져도 남습니다.\n![10만원: 콘텐츠/후기 자산에 쓴다](https://leejiho-pslab.github.io/pslab/blog/blogger-07-23/fig-3.png)\n\n## 석 달 뒤 숫자로 다시 정한다\n100만원을 3개월 돌리면 어디가 효율적인지 보입니다. 그때 비율을 키우거나 채널을 바꾸세요. 처음 배분은 가설일 뿐입니다.\n![석 달 뒤 숫자로 다시 정한다](https://leejiho-pslab.github.io/pslab/blog/blogger-07-23/fig-4.png)\n\n## 자주 묻는 질문\n**Q. 100만원도 안 되면요?**\n50만원이면 채널 하나 + 소재 실험만 하세요. 자산 투자는 매출이 나면 시작해도 늦지 않습니다.\n\n**Q. 어느 채널부터 시작할까요?**\n고객이 검색으로 오면 검색광고, 발견으로 오면 인스타·메타부터 테스트하세요.\n\n적은 예산일수록 \"나누지 말고 몰아주세요.\" 한 채널에서 이기는 공식을 먼저 찾는 게 순서입니다.\n\n🔖 태그: #소액광고 #광고예산 #스타트업마케팅 #예산배분","variant":"A","slideImages":["cards/pslab/blogger-07-23-1.png"],"status":"published","publishedUrl":"https://pslab2026.blogspot.com/2026/07/100.html","metrics":{"views":0,"likes":0,"comments":0,"shares":0,"engagementRate":0},"insightComment":"조회 0·좋아요 0. 노출 대비 반응을 키우려면 첫 3초 후킹을 강화하세요.","publishedAt":"2026-07-09T12:21:59.335Z"},{"id":"w2-fri","topic":"창업인사이트","format":"카드뉴스","channels":["instagram"],"scheduledFor":"2026-07-10T09:00:00.000Z","kicker":"Startup","headline":"돈 없이 시작하는 마케팅,\u003cbr>*진짜 가능한가*","sub":"예산 0원부터 검증. 돈 쓰기 전에 할 것.","dayLabel":"금요일 · 창업","cardImage":"cards/pslab/w2-fri-1.png","captionNote":"예산 0원부터 검증. 돈 쓰기 전에 할 것.","captionBody":"“돈 없으면 마케팅 못 하죠” — 절반만 맞습니다.\n\n돈이 필요한 건 “확장”이고, “검증”은 거의 공짜로 가능합니다.\n콘텐츠 몇 개, DM 몇 통, 작은 설문으로 “살 사람이 있는지”부터 확인하세요.\n수요를 확인하기 전에 광고비부터 태우면, 빠르게 망하는 길입니다.\n\n돈은 검증된 다음에 붓는 겁니다.\n\n#창업인사이트 #사업이야기 #온라인마케팅","variant":"B","slideImages":["cards/pslab/w2-fri-1.png","cards/pslab/w2-fri-2.png","cards/pslab/w2-fri-3.png","cards/pslab/w2-fri-4.png","cards/pslab/w2-fri-5.png"],"status":"published","publishedUrl":"https://www.instagram.com/p/DanJLwVknio/","metrics":{"views":3,"likes":2,"comments":0,"shares":0,"engagementRate":0.6666666666666666},"insightComment":"참여율 66.7%로 평균(40.4%)을 웃돌았어요. 디자인 B안·결론 우선 구조가 먹힌 것으로 보입니다 — 다음에도 같은 톤을 유지하세요.","publishedAt":"2026-07-10T12:01:46.886Z"},{"id":"threads-07-18","topic":"브랜딩","format":"스레드(타래)","channels":["threads"],"scheduledFo 07-31","topic":"ALWAYS ON · 문제 공감(시간 환산)","format":"스레드(타래)","channels":["threads"],"scheduledFor":"2026-07-31T10:00:00.000Z","kicker":"Threads","headline":"채널 5개를\u003cbr>*매일* 돌린다는 것","sub":"월 40시간. 사장님 시간의 값입니다.","dayLabel":"금요일 · 스레드","cardImage":"cards/pslab/threads-07-31-1.png","captionNote":"시간 환산으로 공감 → 구조 문제로 재정의 → 자체 채널이 증거 → 질문 CTA","captionBody":"채널 5개를 매일 돌린다는 게 어떤 일인지, 숫자로 세어봤습니다. 🧵\n\n소재 찾기 20분, 카피 30분, 이미지 40분, 발행·해시태그 15분. 하나 올리는 데 1시간 45분이에요.\n\n주 3회만 잡아도 월 20시간이 넘고, 5채널을 제대로 돌리면 월 40시간입니다. 사장님 시간을 시급으로 환산해보면, 이게 공짜가 아니라는 게 보여요.\n\n그래서 대부분 3개월을 못 넘깁니다. 의지가 부족해서가 아니라, 본업을 하면서 유지할 수 있는 구조가 아니라서요.\n\n저희가 ALWAYS ON(얼웨이즈온)을 만든 이유가 여기 있습니다. 조사·제작·발행·성과 학습을 매일 자동으로 돌려서, 사장님 시간은 본업에 남겨두는 것.\n\n지금 이 글도 그 시스템이 올리고 있어요.\n\n사장님 채널, 마지막 게시물이 언제였나요?\n\n#pslab #문제해결연구소 #ALWAYSON #얼웨이즈온","variant":"B","slideImages":["cards/pslab/threads-07-31-1.png"],"status":"published","publishedUrl":"https://www.threads.com/@_pslab/post/DbdKqnHIO_h","metrics":{"views":22,"likes":1,"comments":0,"shares":0,"engagementRate":0.045454545454545456},"insightComment":"참여율 4.5%로 평균(40.4%)을 밑돌았어요. 첫 슬라이드 후킹과 결론 한 줄을 더 세게, 저장 유도 문구를 명확히 해보세요.","publishedAt":"2026-07-31T11:33:37.893Z"},{"id":"naver-08-01","topic":"ALWAYS ON · 가치 환산(비용 비교)","format":"naver-blog","channels":["naver-blog"],"scheduledFor":"2026-08-01T02:00:00.000Z","kicker":"Cost","headline":"SNS 대행 비용, 직원 채용, 자동화 시스템 — 1년 기준으로 비교했습니다","sub":"월 얼마가 아니라 1년에 콘텐츠 몇 개가 남는지로 비교해야 합니다. 세 방식의 비용과 산출물을 숫자 그대로 정리했습니다.","dayLabel":"토요일 · 네이버 블로그","cardImage":"cards/pslab/naver-08-01-1.png","captionNote":"검색어(SNS 대행 비용) 정면 대응 + 비교표로 근거 → 무료 진단 CTA","captionBody":"# SNS 대행 비용, 직원 채용, 자동화 시스템 — 1년 기준으로 비교했습니다\n\n> [핵심 요약] 월 비용만 보면 판단이 틀립니다. 1년에 콘텐츠가 몇 개 남고, 그게 검색에 남는 자산인지로 봐야 합니다. 세 가지 방식을 실제 숫자로 비교했습니다.\n\n16년간 광고대행사를 운영하면서 가장 많이 받은 질문이 \"SNS는 대행을 맡기는 게 나을까요, 직원을 뽑는 게 나을까요\"입니다. 답을 드리기 전에, 세 가지 선택지를 같은 기준으로 세워보겠습니다.\n\n## 1. 대행사에 맡기는 경우\n\n채널 하나당 월 80~150만원이 일반적입니다. 인스타그램·유튜브·블로그까지 5채널이면 월 400~500만원 선에서 견적이 나옵니다. 1년이면 5천만원 이상입니다.\n\n산출물은 보통 채널당 월 8~12개. 5채널 기준 1년에 500개 안팎입니다. 문제는 계약이 끝나면 운영이 멈춘다는 점입니다.\n\n## 2. 직원을 채용하는 경우\n\n마케팅 담당자 1명 월 300만원(4대보험·퇴직금 포함 시 약 350만원), 1년이면 4천만원 이상입니다.\n\n여기에 숨은 비용이 붙습니다. 채용에 1~2개월, 교육에 2~3개월. 그리고 퇴사하면 노하우가 함께 나갑니다. 실제로 SNS 담당자의 평균 재직 기간은 2년이 채 안 됩니다.\n\n## 3. 자동화 시스템으로 운영하는 경우\n\nP.S.LAB(문제해결연구소)이 운영하는 ALWAYS ON(얼웨이즈온)은 이 일을 시스템으로 대신합니다.\n\n- **조사**: 검색 트렌드·경쟁사 반응을 매일 수집\n- **제작**: 브랜드 톤에 맞춘 카피·카드뉴스·숏폼 영상 자동 생성\n- **발행**: 5채널에 정해진 시각 자동 게시\n- **학습**: 반응이 좋았던 디자인·주제·시간대를 다음 콘텐츠에 반영\n\n사람이 하는 일은 방향을 정하고 검수하는 것뿐입니다. 월 고정비는 브랜드 상황에 맞게 상담으로 산정합니다.\n\n## 1년 뒤에 무엇이 남는가\n\n| 구분 | 대행사 | 직원 채용 | 자동화 시스템 |\n|---|---|---|---|\n| 1년 비용 | 5,000만원+ | 4,000만원+ | 상담 산정 |\n| 연간 콘텐츠 | 약 500개 | 담당자 역량에 따라 | 약 700개 |\n| 중단 리스크 | 계약 종료 시 정지 | 퇴사 시 공백 | 없음(24시간 가동) |\n| 노하우 축적 | 대행사에 남음 | 담당자와 함께 이동 | 시스템에 축적 |\n\n## 광고비와 콘텐츠 자산의 결정적 차이\n\n광고비는 집행을 멈추는 순간 노출이 0이 됩니다. 반면 쌓인 콘텐츠는 검색과 AI 추천에 계속 남습니다. 요즘은 소비자가 검색창보다 AI에게 먼저 묻습니다. 그때 인용되는 건 광고가 아니라 축적된 콘텐츠입니다.\n\n저희가 이 얘기를 자신 있게 하는 이유는, P.S.LAB 자체 채널을 이 시스템으로 운영하고 있기 때문입니다. 지금 읽고 계신 이 글도 ALWAYS ON이 발행한 글입니다.\n\n## 정리\n\n1. 월 비용이 아니라 **1년 뒤 남는 자산**으로 비교하세요.\n2. 중단 리스크를 반드시 계산에 넣으세요 — 계약 종료, 퇴사, 번아웃.\n3. 노하우가 **우리 쪽에 쌓이는 구조**인지 확인하세요.\n\n어떤 방식이 맞는지는 브랜드 상황에 따라 다릅니다. 판단이 어려우시면 현재 채널 상태를 무료로 진단해 드립니다.\n\n▶ 홈페이지: https://pslab.ai.kr\n▶ 문의: CEO@PSLAB.AI.KR / 010-9929-5736\n\n#SNS대행비용 #SNS마케팅대행 #SNS자동화 #pslab #문제해결연구소 #ALWAYSON #얼웨이즈온 #소상공인마케팅","variant":"A","slideImages":["cards/pslab/naver-08-01-1.png"],"status":"manual"},{"id":"blogger-08-02","topic":"ALWAYS ON · 작동 원리","format":"blogger","channels":["blogger"],"scheduledFor":"2026-08-02T02:00:00.000Z","kicker":"System","headline":"매일 자동으로 콘텐츠가 올라간다는 게 실제로 어떻게 가능한가","sub":"ALWAYS ON의 네 단계 루프 — 조사, 제작, 발행, 학습. 사람이 개입하는 지점까지 그대로 공개합니다.","dayLabel":"일요일 · 구글 블로그","cardImage":"cards/pslab/blogger-08-02-1.png","captionNote":"4단계 구조를 표·목록으로 정리해 AI 인용 가능성 확보 → 자체 채널이 증거","captionBody":"# 매일 자동으로 콘텐츠가 올라간다는 게 실제로 어떻게 가능한가\n\n> [핵심 요약] ALWAYS ON은 조사 → 제작 → 발행 → 학습의 네 단계가 매일 자동으로 도는 시스템입니다. 사람은 방향 설정과 검수만 합니다. 이 글은 그 구조를 그대로 공개합니다.\n\n\"자동으로 올라간다\"는 말은 흔합니다. 문제는 대부분 예약 발행을 자동화라고 부른다는 점입니다. 미리 만들어둔 걸 정해진 시각에 올리는 건 타이머지 시스템이 아닙니다.\n\nP.S.LAB(문제해결연구소)이 운영하는 ALWAYS ON(얼웨이즈온)은 **만드는 일부터** 자동입니다. 어떻게 도는지 단계별로 설명하겠습니다.\n\n## 1단계 — 조사: 오늘 무엇을 말할지 정한다\n\n매일 검색 트렌드, 업종 키워드, 경쟁 계정의 반응 데이터를 수집합니다. 여기서 \"지금 이 브랜드가 말했을 때 가장 반응이 좋을 소재\"에 점수를 매겨 순위를 만듭니다.\n\n브랜드가 미리 등록해 둔 우선 주제가 있으면 그것이 먼저 올라갑니다. 시스템이 마음대로 소재를 고르는 게 아니라, 방향은 사람이 정합니다.\n\n## 2단계 — 제작: 브랜드 톤으로 만든다\n\n선정된 소재를 채널 특성에 맞게 변환합니다.\n\n- **인스타그램**: 후킹 카피 + 카드뉴스 이미지 또는 15초 릴스\n- **유튜브**: 같은 영상을 쇼츠로 재활용 (제작비 추가 없이 노출만 확장)\n- **스레드**: 대화형 짧은 글\n- **블로그**: 검색 유입을 노린 롱폼\n\n여기서 중요한 건 **브랜드 톤**입니다. 시스템은 브랜드 분석·방향성·감도를 기록한 브랜드 노트를 매번 참조합니다. 담당자가 \"이런 톤은 피해달라\"고 적으면 그 지시가 AI의 학습 메모보다 우선 적용됩니다.\n\n이미지의 한글 텍스트는 AI 이미지 생성이 아니라 웹 렌더링으로 만듭니다. AI로 한글을 그리면 글자가 깨지기 때문입니다. 이런 디테일이 완성도를 가릅니다.\n\n## 3단계 — 발행: 정해진 시각에 다섯 채널로\n\n인스타그램, 유튜브, 스레드, 구글 블로그는 API로 자동 게시됩니다. 네이버 블로그는 공식 발행 API가 없어 본문과 이미지를 준비해두고 담당자가 붙여넣는 방식입니다. 안 되는 걸 된다고 하지 않습니다.\n\n발행에 실패하면 즉시 알림이 갑니다. 조용히 멈춰 있는 상황을 막기 위해서입니다.\n\n## 4단계 — 학습: 다음 콘텐츠가 더 나아진다\n\n발행된 게시물의 실제 반응(조회·좋아요·댓글)을 수집해 집계합니다.\n\n- 어떤 **디자인**이 반응이 좋았는가\n- 어떤 **주제**가 멀리 갔는가\n- 어떤 **시간대**가 유리한가\n\n이 결과가 다음 기획에 반영됩니다. 반응이 떨어지면 구도와 톤을 바꿔 새로운 방향을 탐색합니다. 쌓일수록 그 브랜드에 맞게 정교해지는 구조입니다.\n\n여기서 원칙이 하나 있습니다. **추정치를 쓰지 않습니다.** 실제 API로 측정된 값만 학습에 넣습니다. 가짜 숫자가 섞이면 시스템은 엉뚱한 방향으로 학습합니다.\n\n## 사람이 하는 일은 무엇인가\n\n자동화가 사람을 없애는 게 아닙니다. 사람이 할 일이 바뀝니다.\n\n| 사람이 하는 일 | 시스템이 하는 일 |\n|---|---|\n| 브랜드 방향 정의 | 매일 소재 조사 |\n| 기획안 검수 | 카피·이미지·영상 제작 |\n| 디자인 피드백 | 5채널 발행 |\n| 최종 판단 | 성과 수집·학습 |\n\n사장님은 한 달에 몇 번 대시보드를 열어 \"이건 좋고 이건 바꿔주세요\"만 하시면 됩니다.\n\n## 왜 1년에 700개가 중요한가\n\n5채널을 매일 돌리면 1년에 약 700개의 콘텐츠가 쌓입니다. 광고비는 멈추면 노출이 사라지지만, 이 700개는 검색 결과와 AI 답변에 계속 남습니다.\n\n생성형 AI가 브랜드에 대해 답할 때 인용하는 건 광고가 아니라 축적된 콘텐츠입니다. 지금 쌓는 콘텐츠가 앞으로 AI가 우리 브랜드를 설명하는 근거가 됩니다.\n\n## 이 글도 시스템이 썼습니다\n\n가장 확실한 증거는 저희 채널입니다. P.S.LAB의 인스타그램·유튜브·스레드·블로그는 모두 ALWAYS ON이 운영합니다. 지금 읽고 계신 이 글도 그 결과물입니다.\n\n16년차 광고대행사가 자기 채널로 먼저 검증한 시스템을 제공합니다.\n\n▶ 자세히 보기: https://pslab.ai.kr/always-on\n▶ 문의: CEO@PSLAB.AI.KR\n\n#pslab #문제해결연구소 #ALWAYSON #얼웨이즈온 #SNS자동화 #콘텐츠마케팅","variant":"A","slideImages":["cards/pslab/blogger-08-02-1.png"],"status":"published","publishedUrl":"https://pslab2026.blogspot.com/2026/08/blog-post.html","metrics":{"views":0,"likes":0,"comments":0,"shares":0,"engagementRate":0},"insightComment":"조회 0·좋아요 0. 노출 대비 반응을 키우려면 첫 3초 후킹을 강화하세요.","publishedAt":"2026-08-02T10:45:09.394Z"},{"id":"reels-08-03","topic":"ALWAYS ON · 문제 재정의","format":"릴스","channels":["instagram"],"scheduledFor":"2026-08-03T09:00:00.000Z","kicker":"ALWAYS ON","headline":"SNS,\u003cbr>*3개월*을 못 넘겼다면","sub":"의지 문제가 아니라 구조 문제입니다.","dayLabel":"월요일 · 릴스","cardImage":"cards/pslab/reels-08-03-1.png","captionNote":"자책 해제(의지→물리적 불가능) → 하루를 다 써도 모자란다는 구체성 → 시스템 대안 → 무료 진단 CTA","captionBody":"SNS를 시작했다가 3개월을 못 넘긴 사장님, 정말 많습니다.\n\n그런데 이건 의지 문제가 아니에요. 채널 5개를 매일 기획하고, 만들고, 올리는 일을 다 하려면 하루 일과를 통째로 써도 시간이 모자랍니다. 본업은 언제 하나요.\n\n의지가 부족한 게 아니라 물리적으로 불가능한 겁니다. 구조가 안 되는 거예요.\n\nALWAYS ON은 이 일을 사람 대신 시스템이 합니다. 소재 조사부터 제작·발행·성과 학습까지 매일 자동으로 돌아가요.\n\n사장님이 하실 일은 방향을 정하고 검수하는 것뿐입니다.\n\n💬 댓글에 \"진단\"이라고 남겨주시면 현재 채널 상태를 무료로 봐드립니다.\n\n#SNS자동화 #소상공인마케팅 #마케팅고민 #pslab #문제해결연구소 #ALWAYSON #얼웨이즈온","variant":"A","slideImages":["cards/pslab/reels-08-03-1.png"],"status":"published","publishedUrl":"https://www.instagram.com/reel/Dbk0GhMjRqV/","metrics":{"views":105,"likes":1,"comments":0,"shares":0,"engagementRate":0.009523809523809525},"insightComment":"참여율 1.0%로 평균(40.4%)을 밑돌았어요. 첫 슬라이드 후킹과 결론 한 줄을 더 세게, 저장 유도 문구를 명확히 해보세요.","publishedAt":"2026-08-03T10:50:50.216Z","videoFile":"shorts/reels-08-03/reels-08-03.mp4","reelsScript":"[HOOK]\nSNS, 3개월을 못 넘기셨죠?\n\n[본론]\n의지 문제가 아닙니다.\n5채널을 매일 기획·제작·업로드하면\n하루를 통째로 써도 시간이 모자랍니다.\n\n[CTA]\n사람이 아니라 시스템이 하면 됩니다."},{"id":"youtube-08-03","topic":"ALWAYS ON · 문제 재정의","format":"쇼츠 대본","channels":["youtube"],"scheduledFor":"2026-08-03T09:00:00.000Z","kicker":"Shorts","headline":"SNS,\u003cbr>*3개월*을 못 넘겼다면","sub":"의지 문제가 아니라 구조 문제입니다.","dayLabel":"월요일 · 쇼츠","cardImage":"cards/psl
